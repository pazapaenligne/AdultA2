/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(tag,attrs,text){var e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(function(k){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});}if(text!==undefined)e.textContent=text;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function say(msg){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=msg;},30);}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normEnd(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function words(s){var m=norm(s).match(/[\p{L}\p{N}']+/gu);return m?m.length:0;}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n):s;}
function img(key,alt,cls,cap){
  var f=el('figure',{class:'shot '+(cls||'')});
  var i=el('img',{alt:alt});i.src=IMAGES[key];f.appendChild(i);
  if(cap)f.appendChild(el('figcaption',null,cap));
  return f;
}
function setFb(node,ok,text){
  node.textContent='';node.className='fb';
  if(!text)return;
  node.className='fb '+(ok?'ok':'try');
  node.appendChild(el('span',ok?{class:'tick','aria-hidden':'true'}:{class:'dot','aria-hidden':'true'},ok?'✓':''));
  node.appendChild(document.createTextNode(text));
}

/* ===== gates ===== */
function gate(n){
  var s=state;
  switch(n){
    case 0:return !!s.goal;
    case 1:return s.rec.every(function(r){return r.shown;});
    case 2:return s.read.shown&&!!s.read.how;
    case 3:return (s.rep.ok1||s.rep.shown)&&words(s.rep.t2)>=4;
    case 4:return improveValid();
    case 5:return s.clearer.length>=1;
    case 6:return words(s.tr.t)>=3;
    case 7:return !!s.next;
  }

}

function pieces(t){
  var n=norm(t),o=[];
  if(/told me to \w+/.test(n))o.push('told me to + action');
  if(/said i (need|should)/.test(n))o.push('said I need / said I should');
  if(/(thursday|10[:.]30|ten thirty|half past ten)/.test(n))o.push('the follow-up day or time');
  if(/(bring|insurance card|appointment details)/.test(n))o.push('what to bring');
  return o;
}

/* ===== LMS bridge (silent; SCORM 1.2 and 2004) ===== */
var lms={api:null,ver:null,ready:false,ended:false,tries:0};
function findApi(name){
  var wins=[window];try{if(window.opener)wins.push(window.opener);}catch(e){}
  for(var k=0;k<wins.length;k++){
    var w=wins[k],d=0;
    while(w&&d<12){
      try{if(w[name])return w[name];}catch(e){}
      try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
      d++;
    }
  }
  return null;
}
function lmsConnect(){
  if(lms.ready||lms.tries>6)return lms.ready;
  lms.tries++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{a=findApi('API');if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}}
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{var v=(lms.ver==='2004')?lms.api.GetValue(k):lms.api.LMSGetValue(k);return String(v==null?'':v);}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004')?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004')?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsStatus(){
  if(!lms.ready)return '';
  if(lms.ver==='2004'){var c=lmsGet('cmi.completion_status');var s=lmsGet('cmi.success_status');return (c==='completed'||s==='passed')?'completed':c;}
  var v=lmsGet('cmi.core.lesson_status');return (v==='completed'||v==='passed')?'completed':v;
}
function lmsFinish(){
  if(!lms.ready||lms.ended)return;
  lms.ended=true;
  try{lmsCommit();if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}catch(e){}
}
window.addEventListener('pagehide',lmsFinish);

/* ===== completion ===== */
function commitCompletion(){
  /* returns true only when the commit is confirmed, or when no bridge exists (local completion) */
  if(!lmsConnect())return true;
  if(lmsStatus()==='completed')return true;
  var set,okSet;
  if(lms.ver==='2004'){okSet=lmsSet('cmi.completion_status','completed');lmsSet('cmi.progress_measure','1');lmsSet('cmi.exit','');}
  else{okSet=lmsSet('cmi.core.lesson_status','completed');lmsSet('cmi.core.exit','');}
  var okCommit=lmsCommit();
  return !!(okSet&&okCommit);
}
function onDone(){
  if(completionSent||completionInFlight)return;
  if(maxScreen()<7||!gate(7))return;
  completionInFlight=true;refresh();
  var ok=false;
  try{ok=commitCompletion();}catch(e){ok=false;}
  completionInFlight=false;
  if(ok){
    completionSent=true;
    try{localStorage.setItem(CONFIG.doneKey,'1');}catch(e){}
    try{if(CONFIG.hostOrigin&&window.parent&&window.parent!==window)window.parent.postMessage({type:'pazapa-activity-completed',activity:CONFIG.activityId},CONFIG.hostOrigin);}catch(e){}
    try{console.log(CONFIG.logLabel);}catch(e){}
    var b=$('#btnDone');if(b){b.textContent='Done ✓';}
    say('Your review is finished.');
  }else{
    say('Press Done to try again.');
  }
  refresh();
}

/* ===== start ===== */
(function init(){
  try{if(lmsConnect()&&lmsStatus()==='completed')completionSent=true;}catch(e){}
  show(0);
})();
