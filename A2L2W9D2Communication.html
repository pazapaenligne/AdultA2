  LESSON: Week 9, Lesson 2 - "At the clinic and the pharmacy" - Step 6: Communication Mission

  SOURCE CONTENT KEYS (from the lesson brief and workbook)
  - Vocabulary: appointment, walk-in, insurance approval, co-payment, network, specialist, referral, prescription, dosage
  - Course model phrases: "Do you accept my insurance?" / "Is this clinic in my network?" / "Is there a co-payment?"
  - Anchor turn: Other speaker: "What would you like to check?"
    Model learner response: "Do I need to bring my prescription? Could you explain the insurance process?"
  - Source facts: afternoon appointment at three on Thursday; ask reception about the insurance process before the visit;
    bring the prescription if you want to discuss it; coverage cannot be confirmed in the practice message.
  - Free communication is never marked wrong for wording; only a self-check is offered.

  CONFIGURABLE ASSETS
  - No listening exercises: Hana's lines are read as text. Learner voice recording is optional (record/play back own voice only).
  - FEEDBACK_ENDPOINT : optional text feedback service. Empty = not offered. If set, it is called only after the learner
    presses the feedback button, and the reply is validated and rendered with textContent only.
  - Images are embedded from the Week 9 workbook.

  HOST REQUIREMENTS
  - Recording needs HTTPS and, inside an iframe, allow="microphone" on the iframe plus a Permissions-Policy that allows microphone.
  - The microphone is requested only when the learner presses "Start recording".

  COMPLETION INTEGRATION
  - SCORM 1.2 / 2004 adapter below. Completion is sent only on the learner's "Done" action after the participation criteria

  /* ================= SCORM adapter ================= */
  var SCORM = (function(){
    var api = null;
    var version = null;      /* "1.2" | "2004" -- locked once found */
    var initialized = false;
    var terminated = false;
    var redetectTimer = null;
    var redetectAttempts = 0;
    var MAX_REDETECT_ATTEMPTS = 8;
    var REDETECT_INTERVAL_MS = 4000;

    function isSuccess(r){
      return r === true || r === "true";
    }

    /* Search this window and accessible parent windows for a SCORM API,
       bounded to avoid infinite loops through same-origin parent chains. */
    function findAPI(win){
      var w = win;
      var attempts = 0;
      while (w && attempts < 10) {
        try {
          if (w.API_1484_11) { return { api: w.API_1484_11, version: "2004" }; }
        } catch(e){ /* cross-origin access denied: keep searching upward */ }
        try {
          if (w.API) { return { api: w.API, version: "1.2" }; }
        } catch(e){}
        var parentWin = null;
        try { parentWin = w.parent; } catch(e){ parentWin = null; }
        if (parentWin && parentWin !== w) {
          w = parentWin;
          attempts++;
        } else {
          break;
        }
      }
      return null;
    }

    function locateAPI(){
      var found = null;
      try { found = findAPI(window); } catch(e){}
      if (!found) {
        try { if (window.opener) found = findAPI(window.opener); } catch(e){}
      }
      return found;
    }

    /* One-time initialisation. A later unsuccessful search must never
       erase an already-working connection. */
    function initializeSCORM(){
      if (initialized) return true;
      if (terminated) return false;
      var found = locateAPI();
      if (!found) return false;
      try {
        var ok = (found.version === "1.2") ? found.api.LMSInitialize("") : found.api.Initialize("");
        if (isSuccess(ok)) {
          api = found.api;
          version = found.version;
          initialized = true;
          return true;
        }
        return false;
      } catch(e){ return false; }
    }

    function ensureSCORMConnection(){
      if (initialized) return true;
      return initializeSCORM();
    }

    /* Bounded background re-detection: used when no API is present on
       initial load. Stops after MAX_REDETECT_ATTEMPTS so it never runs
       forever. Calls onReconnect() once, the first time it succeeds. */
    function scheduleSCORMRedetection(onReconnect){
      if (initialized || terminated || redetectTimer) return;
      if (redetectAttempts >= MAX_REDETECT_ATTEMPTS) return;
      redetectTimer = window.setTimeout(function(){
        redetectTimer = null;
        redetectAttempts++;
        if (ensureSCORMConnection()) {
          if (typeof onReconnect === "function") {
            try { onReconnect(); } catch(e){}
          }
        } else {
          scheduleSCORMRedetection(onReconnect);
        }
      }, REDETECT_INTERVAL_MS);
    }

    function apiGetValue(key){
      if (!initialized || terminated || !api) return "";
      try {
        return (version === "1.2") ? api.LMSGetValue(key) : api.GetValue(key);
      } catch(e){ return ""; }
    }

    function apiSetValue(key, val){
      if (!initialized || terminated || !api) return false;
      try {
        var r = (version === "1.2") ? api.LMSSetValue(key, val) : api.SetValue(key, val);
        return isSuccess(r);
      } catch(e){ return false; }
    }

    function apiCommit(){
      if (!initialized || terminated || !api) return false;
      try {
        var r = (version === "1.2") ? api.LMSCommit("") : api.Commit("");
        return isSuccess(r);
      } catch(e){ return false; }
    }

    function apiTerminate(){
      if (!initialized || !api || terminated) return false;
      try {
        var r = (version === "1.2") ? api.LMSFinish("") : api.Terminate("");
        if (isSuccess(r)) { terminated = true; return true; }
        return false;
      } catch(e){ return false; }
    }

    /* Reads current LMS completion so we never downgrade an existing
       completed/passed attempt. */
    function readExistingCompletion(){
      if (!initialized) return { completed:false, passed:false, status:"" };
      if (version === "1.2") {
        var status12 = apiGetValue("cmi.core.lesson_status");
        var completed12 = (status12 === "completed" || status12 === "passed");
        return { completed: completed12, passed: (status12 === "passed"), status: status12 };
      }
      var completionStatus = apiGetValue("cmi.completion_status");
      var successStatus = apiGetValue("cmi.success_status");
      var completed2004 = (completionStatus === "completed") || (successStatus === "passed");
      return { completed: completed2004, passed: (successStatus === "passed"), status: completionStatus };
    }

    function writeIncompleteStatus(){
      if (version === "1.2") return apiSetValue("cmi.core.lesson_status", "incomplete");
      return apiSetValue("cmi.completion_status", "incomplete");
    }

    function writeCompletedStatus(){
      if (version === "1.2") {
        return apiSetValue("cmi.core.lesson_status", "completed");
      }
      var a = apiSetValue("cmi.completion_status", "completed");
      var b = apiSetValue("cmi.success_status", "passed");
      return a && b;
    }

    return {
      findAPI: findAPI,
      locateAPI: locateAPI,
      initializeSCORM: initializeSCORM,
      ensureSCORMConnection: ensureSCORMConnection,
      scheduleSCORMRedetection: scheduleSCORMRedetection,
      apiGetValue: apiGetValue,
      apiSetValue: apiSetValue,
      apiCommit: apiCommit,
      apiTerminate: apiTerminate,
      readExistingCompletion: readExistingCompletion,
      writeIncompleteStatus: writeIncompleteStatus,
      writeCompletedStatus: writeCompletedStatus,
      isAvailable: function(){ return initialized; },
      isTerminated: function(){ return terminated; },
      getVersion: function(){ return version; }
    };
  })();

    g.appendChild(left);

    var right = h("div", { class: "card dlg" });
    right.appendChild(h("span", { class: "badge", text: "Worked example" }));
    right.appendChild(h("h3", { style: "margin-top:8px", text: "One possible conversation" }));
    right.appendChild(h("p", { class: "muted", text: "This is an example written for practice. It is not a recording. Your own answer can be different." }));
    [["Hana", "Hello, this is Hana at CityCare. An afternoon appointment is available on Thursday at three. What would you like to check?"],
     ["You", "Do I need to bring my prescription? Could you explain the insurance process?"],
     ["Hana", "Yes, please bring your prescription. The reception team can explain the insurance process before the visit. Can you come on Thursday at three?"],
     ["You", "Yes, I can. Thank you. I will come on Thursday at three."]].forEach(function(t){
      right.appendChild(h("p", null, h("span", { class: "s", text: t[0] + ": " }), t[1]));
    });
    g.appendChild(right);
    wrap.appendChild(g);

    if (FEEDBACK_ENDPOINT && S.a1.text.trim()){
      var fb = h("div", { class: "card" }, h("h3", { text: "Optional text feedback" }),
        h("p", { text: "If you press the button, your typed answer is sent to a feedback service." }));
      var out = h("p", { "aria-live": "polite" });
      fb.appendChild(h("button", { class: "btn sec", type: "button", text: "Send my text for feedback", onclick: function(){ requestFeedback(out); } }));
      fb.appendChild(out); wrap.appendChild(fb);
    }
    wrap.appendChild(navBar("Choose one thing to improve"));
    return wrap;
  }

  function requestFeedback(out){
    out.textContent = "Sending...";
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var to = window.setTimeout(function(){ if (ctl) ctl.abort(); }, 15000);
    fetch(FEEDBACK_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ activity: ACTIVITY_ID, text: S.a1.text }), signal: ctl ? ctl.signal : undefined })
      .then(function(r){ if (!r.ok) throw new Error("bad"); return r.json(); })
      .then(function(j){
        window.clearTimeout(to);
        if (!j || typeof j.feedback !== "string" || !j.feedback.trim()) throw new Error("invalid");
        out.textContent = "Feedback: " + j.feedback.slice(0, 600);
      })
      .catch(function(){ window.clearTimeout(to); out.textContent = "Feedback is not available right now. You can try again, or continue with your own checklist."; });
  }

  function viewImprove(){
    var wrap = h("section", { "aria-labelledby": "ttl" });
    wrap.appendChild(h("h2", { id: "ttl", tabindex: "-1", text: "Improve one thing and try again" }));
    var pick = h("fieldset", { class: "q" }, h("legend", { text: "Choose one thing to improve" }));
    var tipBox = h("div", { "aria-live": "polite" });
    CRITERIA.forEach(function(c){
      var id = "imp-" + c.id;
      pick.appendChild(h("label", { for: id, class: "chk" },
        h("input", { type: "radio", id: id, name: "imp", value: c.id, checked: S.improve === c.id, onchange: function(){
          S.improve = c.id; save(); render(false); } }),
        h("span", null, h("strong", { text: c.name }), " - " + c.q + (S.checks[c.id] === "not-yet" ? " (you said: not yet)" : ""))));
    });
    var c = CRITERIA.filter(function(x){ return x.id === S.improve; })[0];
    if (c){
      tipBox.appendChild(h("div", { class: "hint" }, h("strong", { text: c.tip }), h("br"), "You can borrow a phrase and make it your own:"));
      c.phrases.forEach(function(p){
        var row = h("div", { class: "row", style: "margin:6px 0" }, h("span", { text: p }));
        if (S.route === "type"){
          row.appendChild(h("button", { class: "btn sec", type: "button", text: "Add to my message", onclick: function(){
            var ta = document.getElementById("t-a2"); if (!ta) return;
            ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + " " : "") + p;
            S.a2.text = ta.value; recompute("a2"); save(); refreshNav(); announce("Phrase added."); ta.focus(); } }));
        }
        tipBox.appendChild(row);
      });
    }
    pick.appendChild(tipBox);
    wrap.appendChild(h("div", { class: "card" }, pick));
    wrap.appendChild(attemptUI("a2", { title: "Your second try", lead: "Keep your own meaning. Change only what you chose to improve." }));

    var cmp = h("div", { class: "card cmp", style: "margin-top:16px" }, h("h3", { text: "Compare your two tries" }));
    var g = h("div", { class: "grid2" });
    g.appendChild(attemptView("a1", "First try"));
    var second = attemptView("a2", "Second try"); second.classList.add("b");
    g.appendChild(second);
    cmp.appendChild(g);
    cmp.appendChild(h("p", { class: "muted", style: "margin-top:8px", text: "Your first try stays as it was." }));
    wrap.appendChild(cmp);
    wrap.appendChild(navBar("Finish"));
    return wrap;
  }

  function viewFinish(){
    var wrap = h("section", { "aria-labelledby": "ttl" });
    wrap.appendChild(h("h2", { id: "ttl", tabindex: "-1", text: "Mission finished" }));
    var card = h("div", { class: "card" });
    var imp = CRITERIA.filter(function(c){ return c.id === S.improve; })[0];
    card.appendChild(h("p", { text: "You made two tries and answered Hana's question." }));
    if (imp) card.appendChild(h("p", null, "You worked on: ", h("strong", { text: imp.name }), "."));
    var g = h("div", { class: "grid2 cmp" });
    g.appendChild(attemptView("a1", "First try"));
    var sec = attemptView("a2", "Second try"); sec.classList.add("b");
    g.appendChild(sec);
    card.appendChild(g);
    wrap.appendChild(card);

    var msg = h("div", { id: "done-msg", role: "status", "aria-live": "polite" });
    paintDone(msg);
    wrap.appendChild(msg);
    if (!canFinish()) wrap.appendChild(h("div", { class: "notice", id: "need", text: "Finish the earlier steps first, then press Done." }));

    var bar = h("div", { class: "nav" });
    bar.appendChild(h("button", { class: "btn sec", type: "button", text: "Back", onclick: function(){ go(5); } }));
    var fin = h("div", { class: "final-actions" });
    fin.appendChild(h("button", { class: "btn sec", type: "button", text: "Improve my message", onclick: function(){ go(5); } }));
    fin.appendChild(h("button", { class: "btn sec", type: "button", id: "again-btn", text: "Try again", onclick: tryAgain }));
    var done = h("button", { class: "btn go", type: "button", id: "done-btn", text: "Done", onclick: completeActivity });
    done.disabled = !canFinish();
    fin.appendChild(done);
    bar.appendChild(fin);
    wrap.appendChild(bar);
    nextBtn = null;
    return wrap;
  }
  function paintDone(msg){
    msg = msg || document.getElementById("done-msg"); if (!msg) return;
    msg.textContent = "";
    if (completionSent || localDone) msg.appendChild(h("div", { class: "ok", text: "Well done. This activity is complete." }));
    else if (completionError) msg.appendChild(h("div", { class: "err", text: "Completion could not be confirmed. Please press Done again." }));
  }

  function tryAgain(){
    stopActive(true);
    Object.keys(recs).forEach(freeRec);
    var keepStep = 0;
    S = freshState();
    S.step = keepStep;
    save(); render(true);
    announce("Starting again. Your earlier answers have been cleared.");
  }

  /* ================= Render ================= */
  function renderSteps(){
    stepsEl.textContent = "";
    STEPS.forEach(function(name, i){
      var li = h("li", { class: i < S.step ? "done" : "", "aria-current": i === S.step ? "step" : null },
        h("span", { class: "n", "aria-hidden": "true", text: String(i + 1) }), name);
      stepsEl.appendChild(li);
    });
  }
  function render(focus){
    var y = window.pageYOffset;
    renderSteps();
    stage.textContent = "";
    nextBtn = null;
    var views = [viewPrepare, viewRehearse, viewFirst, viewFollow, viewReview, viewImprove, viewFinish];
    stage.appendChild(views[S.step]());
    if (focus){
      var t = document.getElementById("ttl");
      if (t){ t.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
      announce("Step " + (S.step + 1) + " of " + STEPS.length + ": " + STEPS[S.step]);
    } else { window.scrollTo(0, y); }
  }

  /* ================= Completion ================= */
  function completeActivity(){
    if (!canFinish()) return;
    if (completionSent || localDone){ paintDone(); announce("This activity is already complete."); return; }
    if (completionInFlight) return;
    completionInFlight = true;
    var btn = document.getElementById("done-btn"); if (btn) btn.disabled = true;
    try {
      if (!SCORM.ensureSCORMConnection()){
        localDone = true; S.completed = true; completionError = false; save();
        announce("Activity complete.");
      } else {
        var ex = SCORM.readExistingCompletion();
        if (ex.completed){ completionSent = true; S.completed = true; completionError = false; }
        else {
          save();
          var w = SCORM.writeCompletedStatus();
          var c = w && SCORM.apiCommit();
          var rb = c && SCORM.readExistingCompletion().completed;
          if (w && c && rb){ completionSent = true; S.completed = true; completionError = false; announce("Activity complete."); }
          else { completionError = true; announce("Completion could not be confirmed. Please press Done again."); }
        }
      }
    } catch(e){
      completionError = true;
    } finally {
      completionInFlight = false;
      paintDone();
      refreshNav();
    }
  }

  function handleExit(){
    if (exitHandled) return;
    stopActive(true);
    if (!SCORM.isAvailable() || SCORM.isTerminated()) return;
    exitHandled = true;
    try {
      save();
      if (!completionSent && !SCORM.readExistingCompletion().completed) SCORM.writeIncompleteStatus();
      SCORM.apiCommit();
      SCORM.apiTerminate();
    } catch(e){}
  }

  /* ================= Boot ================= */
  function onScormReady(){
    var ex = SCORM.readExistingCompletion();
    if (ex.completed){ completionSent = true; S.completed = true; }
    else { SCORM.writeIncompleteStatus(); SCORM.apiCommit(); }
    var sd = SCORM.apiGetValue("cmi.suspend_data");
    if (sd && !hasLocal) { if (restore(sd)) { render(false); } }
    paintDone();
  }
  var hasLocal = false;
  try {
    var raw = window.sessionStorage.getItem(STORAGE_KEY);
    if (raw && restore(raw)) hasLocal = true;
  } catch(e){}
  if (SCORM.initializeSCORM()) onScormReady();
  else SCORM.scheduleSCORMRedetection(onScormReady);
  render(false);

  window.addEventListener("pagehide", handleExit);
  window.addEventListener("beforeunload", handleExit);
})();
</script>
</body>
</html>
