<style>
  :root{
    --blue:#36BBD6; --blue-tint:#D7F1F7;
    --green:#C9D646; --green-tint:#F4F7DA;
    --yellow:#FCC104; --yellow-tint:#FEF3CD;
    --red:#E6352B; --grey:#EBEBEB; --dark:#2E2E2D; --white:#FFFFFF;
    --warm:#FFFDF8;
    --focus-ring:3px solid #2E2E2D;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"Open Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--dark);background:var(--warm);max-width:100%;overflow-x:hidden;}
  h1,h2,h3{font-weight:800;margin:0 0 8px 0;line-height:1.25;}
  p{line-height:1.5;margin:0 0 10px 0;}
  img{max-width:100%;}
  .app{max-width:820px;margin:0 auto;padding:18px 18px 40px 18px;overflow-x:hidden;}
  .brand-logo{display:block;width:132px;height:auto;margin:0 0 14px 0;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:10px 0 6px 0;border-bottom:4px solid var(--blue);margin-bottom:18px;}
  .eyebrow{font-size:13px;font-weight:700;overflow-wrap:break-word;}
  .top-bar h1{font-size:20px;margin:2px 0 0 0;overflow-wrap:break-word;}
  .progress-wrap{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;flex:1 1 150px;}
  .progress-track{flex:1 1 60px;min-width:0;height:10px;background:var(--grey);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);width:11%;transition:width .3s ease;}
  .progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
  button,.tile,.chip{touch-action:manipulation;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .goal-box{background:var(--blue-tint);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;}
  .goal-box .label{font-size:13px;font-weight:700;margin-bottom:4px;}
  .goal-box .goal-text{font-size:18px;font-weight:800;}
  .card{border:1px solid var(--grey);border-radius:var(--radius);padding:18px;margin-bottom:16px;background:var(--white);}
  .two-col{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .two-col .col{flex:1 1 260px;min-width:0;}
  .fit-img{display:block;width:100%;height:auto;object-fit:contain;}
  .pic{background:var(--warm);border:1px solid var(--grey);border-radius:var(--radius);padding:8px;display:flex;align-items:center;justify-content:center;}
  .pic img{width:auto;height:auto;max-width:100%;max-height:230px;object-fit:contain;}
  .pic.small img{max-height:150px;}

  /* screen 1: conversation + picture strip */
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .bubble{padding:12px 16px;border-radius:14px;font-weight:700;font-size:16px;max-width:92%;}
  .bubble .who{display:block;font-size:12px;font-weight:800;opacity:.65;margin-bottom:2px;}
  .bubble.a{background:var(--blue-tint);align-self:flex-start;}
  .bubble.b{background:var(--green-tint);align-self:flex-end;}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:8px 0 14px 0;}
  .strip figure{margin:0;text-align:center;}
  .strip .pic{padding:4px;}
  .strip .pic img{max-height:120px;}
  .strip figcaption{margin-top:6px;font-weight:800;font-size:14px;border-radius:10px;padding:5px 6px;}
  .cap0{background:var(--blue);}.cap1{background:var(--yellow);}.cap2{background:var(--blue-tint);}
  .cap3{background:var(--yellow-tint);}.cap4{background:var(--green);}.cap5{background:var(--green-tint);}

  /* screen 2: recall desk */
  .recall-tag{display:inline-block;font-size:12px;font-weight:800;background:var(--yellow-tint);border-radius:999px;padding:3px 12px;margin-bottom:8px;}
  textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--grey);border-radius:10px;background:var(--white);color:var(--dark);}
  textarea{min-height:76px;resize:vertical;}
  textarea:focus-visible,input[type=text]:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  label.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px;}
  .model-box{background:var(--green-tint);border-radius:10px;padding:10px 14px;margin-top:10px;font-weight:700;}
  .model-box small{display:block;font-weight:400;opacity:.8;margin-top:2px;}

  /* screen 3: timeline */
  .timeline{display:flex;gap:0;margin:6px 0 14px 0;flex-wrap:wrap;}
  .stage{flex:1 1 150px;min-width:140px;padding:10px 12px;border-top:6px solid var(--grey);}
  .stage.s1{border-color:var(--blue);} .stage.s2{border-color:var(--yellow);} .stage.s3{border-color:var(--green);}
  .stage .w{font-weight:800;font-size:15px;} .stage .t{font-size:14px;}
  .msg-pair{display:flex;gap:12px;flex-wrap:wrap;}
  .msg-pair .choice{flex:1 1 240px;}
  button.choice{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border-radius:12px;min-height:48px;padding:12px 16px;border:2px solid var(--blue);background:var(--white);color:var(--dark);text-align:left;}
  button.choice:hover{background:var(--blue-tint);}
  button.choice:focus-visible{outline:var(--focus-ring);outline-offset:3px;}
  button.choice.right{background:var(--green);border-color:var(--green);}
  button.choice.wrong{background:var(--yellow-tint);border-color:var(--yellow);}
  button.choice:disabled{cursor:default;}
  mark{background:var(--yellow);color:var(--dark);padding:0 3px;border-radius:4px;font-weight:800;}
  .explain{background:var(--yellow-tint);border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:700;}

  /* screen 4: sentence rail */
  .rail-card{border-left:8px solid var(--blue);}
  .rail-card.b{border-left-color:var(--yellow);}
  .answer-strip,.tile-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:10px;margin-bottom:10px;}
  .tile-bank{background:var(--grey);}
  .answer-strip{background:var(--blue-tint);border:2px dashed var(--blue);}
  .tile{font-family:inherit;font-size:16px;font-weight:700;padding:10px 16px;min-height:44px;border-radius:10px;border:2px solid var(--blue);background:var(--white);color:var(--dark);cursor:pointer;}
  .tile:hover{background:var(--blue-tint);}
  .tile:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .tile.placed{background:var(--blue);}
  .tile:disabled{cursor:default;}
  .rail-grid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .rail-grid .pics{flex:0 1 190px;display:flex;gap:8px;}
  .rail-grid .body{flex:1 1 280px;min-width:0;}

  /* screen 5: story card with chips */
  .story-card{background:var(--white);border:2px solid var(--blue);border-radius:var(--radius);padding:16px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  button.chip{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;min-height:44px;padding:8px 18px;border:2px solid var(--blue);background:var(--white);color:var(--dark);}
  button.chip:hover{background:var(--blue-tint);}
  button.chip[aria-pressed="true"]{background:var(--blue);}
  button.chip:focus-visible{outline:var(--focus-ring);outline-offset:3px;}
  .sentence-preview{font-size:19px;font-weight:800;padding:14px 16px;background:var(--blue-tint);border-radius:10px;margin:12px 0;overflow-wrap:break-word;}
  .side{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
  .side>div{flex:1 1 220px;border-radius:10px;padding:12px 14px;font-weight:700;}
  .side .before{background:var(--grey);} .side .after{background:var(--green-tint);}
  .side small{display:block;font-size:12px;font-weight:800;opacity:.7;margin-bottom:3px;}

  /* screen 6: editing desk */
  .desk{background:var(--white);border:2px solid var(--grey);border-radius:var(--radius);padding:16px;}
  .desk .letterhead{font-size:12px;font-weight:800;opacity:.7;margin-bottom:8px;}

  /* screen 7/8 */
  .check-list{list-style:none;padding:0;margin:8px 0;}
  .check-list li{margin-bottom:8px;}
  .check-list label{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer;min-height:32px;}
  .check-list input{width:22px;height:22px;margin-top:1px;flex:0 0 auto;}
  .phrase-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px 0;}
  .self-label{display:inline-block;font-size:12px;font-weight:800;background:var(--grey);border-radius:999px;padding:3px 12px;margin-bottom:6px;}

  .feedback{margin-top:10px;font-weight:700;min-height:24px;font-size:15px;}
  .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:6px;}
  .status-dot.ok{background:var(--green);}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;min-height:44px;min-width:44px;padding:10px 22px;border:2px solid var(--dark);background:var(--white);color:var(--dark);}
  button:focus-visible{outline:var(--focus-ring);outline-offset:3px;}
  button.primary{background:var(--blue);border-color:var(--dark);}
  button.primary:disabled{background:var(--grey);color:#8a8a8a;border-color:var(--grey);cursor:not-allowed;}
  button.ghost{border-color:var(--grey);}
  button.ghost:hover{background:var(--grey);}
  button:disabled{cursor:not-allowed;}
  footer.nav-bar{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .confirm-panel{background:var(--yellow-tint);border-radius:var(--radius);padding:16px 18px;margin-top:14px;}
  .confirm-panel p{font-weight:700;}
  .recap{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
</style>
</head>

/* ---------------- helpers ---------------- */
function norm(s){ return String(s||"").toLowerCase().replace(/[“”]/g,'"').replace(/[’]/g,"'").replace(/\s+/g," ").trim().replace(/[.?!]+$/,"").trim(); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function el(tag, attrs, kids){
  var e=document.createElement(tag);
  if(attrs){ Object.keys(attrs).forEach(function(k){
    if(k==="class") e.className=attrs[k]; else if(k==="text") e.textContent=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k]; else e.setAttribute(k,attrs[k]); }); }
  (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function pic(name, small){ var d=el("div",{class:"pic"+(small?" small":"")}); d.appendChild(el("img",{src:IMG[name],alt:ALT[name]})); return d; }
var ALT = {

  studied:"A woman in a headscarf writing at a desk with books.",
  moved:"A woman in a headscarf at an open door with a suitcase and a box.",
  started:"A woman in a headscarf working at a laptop.",
  now:"A woman in a headscarf standing in front of a city skyline."
};
function announce(msg){ var a=document.getElementById("srAnnounce"); a.textContent=""; setTimeout(function(){ a.textContent=msg; },30); }

/* ---------------- state ---------------- */
var STORE_KEY = "pazapa_a2_w01_l3_s4_v1";
function fresh(){ return {
  v:1, screen:1, completed:false,
  s2:{a1:"",a2:"",r1:false,r2:false},
  s3:{tries:0,solved:false,picked:""},
  s4:{A:[],B:[],cA:false,cB:false},
  s5:{place:"",custom:"",month:"",shown:false},
  s6:{text:CONTENT.draft,first:"",tries:0,solved:false,modelShown:false,retryOpen:false,retryText:"",retryDone:false},
  s7:{text:"",submitted:false,first:"",improved:"",checks:[false,false,false]},
  s8:{text:"",submitted:false,checks:[false,false,false]}
}; }
function merge(def, raw){
  if(!raw || typeof raw!=="object") return def;
  Object.keys(def).forEach(function(k){
    var d=def[k], r=raw[k];
    if(Array.isArray(d)){ if(Array.isArray(r)) def[k]=r.slice(0,20); }
    else if(d && typeof d==="object"){ def[k]=merge(d,r); }
    else if(typeof r===typeof d){ def[k]=r; }
  });
  return def;
}
var state = fresh();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function clearSaved(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function load(){
  var raw=null; try{ raw=JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  if(!raw || raw.v!==1) return;
  state = merge(fresh(), raw);
  // sanitise
  ["A","B"].forEach(function(k){
    var n=CONTENT["item"+k].chunks.length, seen={};
    state.s4[k]=state.s4[k].filter(function(i){ var ok=typeof i==="number"&&i>=0&&i<n&&Math.floor(i)===i&&!seen[i]; if(ok) seen[i]=true; return ok; });
  });
  state.s3.tries=Math.max(0,Math.min(2,Math.floor(state.s3.tries)||0));
  if(["","draft","fix"].indexOf(state.s3.picked)<0) state.s3.picked="";
  if(!state.s3.solved) state.s3.picked = state.s3.picked==="fix" ? "" : state.s3.picked;
  state.s6.tries=Math.max(0,Math.min(2,Math.floor(state.s6.tries)||0));
  var m=Math.floor(state.screen)||1; state.screen=Math.max(1,Math.min(TOTAL,m));
  // never trust the stored screen beyond what the stored work earns
  var max=1; for(var n=1;n<TOTAL;n++){ if(isDone(n)) max=n+1; else break; }
  if(state.completed && max<TOTAL) state.completed=false;
  state.screen=Math.min(state.screen,max);
}

/* ---------------- checks ---------------- */
function s4Sentence(k){ var c=CONTENT["item"+k].chunks; return state.s4[k].map(function(i){return c[i];}).join(" "); }
function s4Ok(k){ return norm(s4Sentence(k))===norm(CONTENT["item"+k].target); }
function s5Place(){ var p=state.s5.custom.trim(); return p || state.s5.place; }
function s5CustomValid(){ var p=state.s5.custom.trim(); return /^[A-Za-z][A-Za-z '\-]{1,28}$/.test(p); }
function s5Valid(){ var p=s5Place(); if(!p||!state.s5.month) return false; if(state.s5.custom.trim() && !s5CustomValid()) return false; return true; }
function s5Sentence(){ return "I moved to "+s5Place()+" in "+state.s5.month+"."; }
function s5Changed(){ return norm(s5Sentence())!==norm(CONTENT.modelMoved); }
function repairOk(text){
  var t=norm(text);
  return /\b(started|began)\b/.test(t) && /\bwork\b/.test(t) && /last month/.test(t) && !/\b(start|starts|begin|begins)\b/.test(t);
}
function wordCount(s){ var t=s.trim(); return t? t.split(/\s+/).length : 0; }

function isDone(n){
  switch(n){
    case 1: return true;
    case 2: return state.s2.r1 && state.s2.r2;
    case 3: return state.s3.solved || state.s3.tries>=2;
    case 4: return s4Ok("A") && s4Ok("B") && state.s4.cA && state.s4.cB;
    case 5: return state.s5.shown && s5Valid() && s5Changed();
    case 6: return state.s6.solved || state.s6.modelShown;
    case 7: return state.s7.submitted && wordCount(state.s7.first)>=3;
    case 8: return state.s8.submitted && wordCount(state.s8.text)>=3;
    default: return true;
  }
}

/* ---------------- runtime ---------------- */
var stage=document.getElementById("stage");
var carryBtn=null;
var sh={};
var fb={};
function newShuffles(){
  sh.s3=shuffle(["draft","fix"]);
  sh.A=shuffle(CONTENT.itemA.chunks.map(function(c,i){return i;}));
  sh.B=shuffle(CONTENT.itemB.chunks.map(function(c,i){return i;}));
  // avoid showing the chunks already in the right order
  if(sh.A.join()===CONTENT.itemA.chunks.map(function(c,i){return i;}).join()) sh.A.reverse();
  if(sh.B.join()===CONTENT.itemB.chunks.map(function(c,i){return i;}).join()) sh.B.reverse();
}
function refreshCarry(){ if(carryBtn) carryBtn.disabled=!isDone(state.screen); }
function goTo(n){
  if(n<1||n>TOTAL) return;
  state.screen=n; save(); render();
  var wrap=document.getElementById("progressWrap");
  document.getElementById("progressFill").style.width=(n/TOTAL*100)+"%";
  document.getElementById("progressLabel").textContent="Screen "+n+" of "+TOTAL;
  wrap.setAttribute("aria-valuenow",String(n)); wrap.setAttribute("aria-valuetext","Screen "+n+" of "+TOTAL);
  var h=stage.querySelector("h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus(); announce("Screen "+n+" of "+TOTAL+". "+h.textContent); }
  window.scrollTo(0,0);
}
function rerender(focusKey){
  render();
  if(focusKey){ var f=stage.querySelector('[data-key="'+focusKey+'"]'); if(f && !f.disabled) f.focus(); }
}
function nav(n, opts){
  opts=opts||{};
  var f=el("footer",{class:"nav-bar"});
  if(n>=2 && n<=8){
    var ta=el("button",{type:"button",class:"ghost","data-key":"tryagain",text:"Try again"});
    ta.addEventListener("click",function(){ resetScreen(n); });
    f.appendChild(ta);
  }
  carryBtn=el("button",{type:"button",class:"primary","data-key":"carry",text:opts.label||"Carry on"});
  carryBtn.disabled=!isDone(n);
  carryBtn.addEventListener("click",function(){ goTo(n+1); });
  f.appendChild(carryBtn);
  return f;
}
function resetScreen(n){
  var d=fresh();
  if(n===2) state.s2=d.s2; if(n===3) state.s3=d.s3; if(n===4) state.s4=d.s4;
  if(n===5) state.s5=d.s5; if(n===6) state.s6=d.s6; if(n===7) state.s7=d.s7; if(n===8) state.s8=d.s8;
  fb={}; newShuffles(); save(); render();
  var h=stage.querySelector("h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
  announce("This screen has been reset.");
}
function feedback(id,text,ok){
  var p=el("p",{class:"feedback",role:"status","aria-live":"polite",id:id});
  if(text){ var dot=el("span",{class:"status-dot"+(ok?" ok":""),"aria-hidden":"true"}); p.appendChild(dot); p.appendChild(document.createTextNode(text)); }
  return p;
}

  stage.innerHTML="";

  fn(s);
  stage.appendChild(s);
}

/* 3 — Notice the change */
function screen3(r){

  var tl=el("div",{class:"timeline"});

  tl.appendChild(el("div",{class:"stage s2",html:'<div class="w">Then</div><div class="t">…</div>'}));
  tl.appendChild(el("div",{class:"stage s3",html:'<div class="w">Now</div><div class="t">I feel more comfortable.</div>'}));
  r.appendChild(tl);
  var two=el("div",{class:"two-col"});
  var left=el("div",{class:"col"}); var right=el("div",{class:"col"});
  right.appendChild(pic("started",true));

  var done=isDone(3);
  sh.s3.forEach(function(k){
    var txt = k==="fix" ? CONTENT.repair : CONTENT.draft;
    var b=el("button",{type:"button",class:"choice","data-key":"c3"+k,"aria-pressed":"false"});
    b.textContent=txt;

    b.disabled=done;
    b.addEventListener("click",function(){
      if(isDone(3)) return;
      state.s3.picked=k;
      if(k==="fix"){ state.s3.solved=true; fb.s3="Yes. “Last month” is finished, so use “started”."; }
      else { state.s3.tries++; fb.s3 = state.s3.tries>=2 ? "Here is the reply that fits." : "Not yet. Look at “last month”. Is the action finished? Try the other reply."; }
      save(); rerender(state.s3.solved||state.s3.tries>=2 ? "carry":"c3"+(k==="fix"?"draft":"fix"));
    });

  });

/* 4 — Build with support */
function screen4(r){
  r.appendChild(el("h2",{text:"Build my sentence"}));
  r.appendChild(el("p",{text:"Tap the phrases in order to build each sentence. Tap a placed phrase to send it back. Then check the whole sentence."}));
  [["A","Sentence 1",""],["B","Sentence 2"," b"]].forEach(function(it){
    var k=it[0], item=CONTENT["item"+k], ok=s4Ok(k) && state.s4["c"+k];
    var card=el("div",{class:"card rail-card"+it[2]});
    card.appendChild(el("h3",{text:it[1]}));
    var g=el("div",{class:"rail-grid"});
    var pics=el("div",{class:"pics"}); item.pics.forEach(function(p){ pics.appendChild(pic(p,true)); });
    var body=el("div",{class:"body"});
    var ans=el("div",{class:"answer-strip","aria-label":"Your sentence, in order"});
    state.s4[k].forEach(function(ci,pos){
      var b=el("button",{type:"button",class:"tile placed","aria-label":"Remove: "+item.chunks[ci],"data-key":"ans"+k+ci});
      b.textContent=item.chunks[ci]; b.disabled=ok;
      b.addEventListener("click",function(){ state.s4[k].splice(pos,1); fb["s4"+k]=""; save(); rerender("chk"+k); });
      ans.appendChild(b);
    });

    sh[k].filter(function(ci){ return state.s4[k].indexOf(ci)<0; }).forEach(function(ci){
      var b=el("button",{type:"button",class:"tile","aria-label":"Add: "+item.chunks[ci],"data-key":"bank"+k+ci});
      b.textContent=item.chunks[ci]; b.disabled=ok;
      b.addEventListener("click",function(){ state.s4[k].push(ci); fb["s4"+k]=""; save(); rerender("chk"+k); });

    var chk=el("button",{type:"button",class:"primary","data-key":"chk"+k,text:"Check"});

      else if(state.s4[k].length<item.chunks.length){ fb["s4"+k]="Not yet. Use every phrase. Hint: "+item.hint; }
      else { fb["s4"+k]="Not yet. Check the order of the phrases. Hint: "+item.hint; }
      save(); rerender(isDone(4)?"carry":"chk"+k);
    });
    var clr=el("button",{type:"button",class:"ghost","data-key":"clr"+k,text:"Clear"});
    clr.disabled=ok||!state.s4[k].length;
    clr.addEventListener("click",function(){ state.s4[k]=[]; fb["s4"+k]=""; save(); rerender("chk"+k); });
    body.appendChild(el("div",{class:"btn-row"},[chk,clr]));

  });
  r.appendChild(nav(4));
}

/* 6 — Repair the message */
function screen6(r){
  r.appendChild(el("h2",{text:"Repair the message"}));
  r.appendChild(el("p",{text:"This message about your first job has one form mistake. Edit the sentence to repair it."}));
  var desk=el("div",{class:"desk"});
  desk.appendChild(el("div",{class:"letterhead",text:"Your message to Hana"}));
  var s=state.s6;
  var finished = s.solved || s.modelShown;
  var retrying = s.retryOpen && !s.retryDone;
  desk.appendChild(el("label",{class:"lbl","for":"repairBox",text: retrying ? "Write the repaired sentence again. The model is hidden." : "Edit the draft"}));
  var ta=el("textarea",{id:"repairBox",rows:"2","data-key":"repairBox"});
  ta.value = retrying ? s.retryText : s.text;
  ta.disabled = finished && !retrying;
  ta.addEventListener("input",function(){ if(retrying) s.retryText=ta.value; else s.text=ta.value; save(); });
  desk.appendChild(ta);
  var row=el("div",{class:"btn-row"});
  if(!finished || retrying){
    var chk=el("button",{type:"button",class:"primary","data-key":"chk6",text:retrying?"Check my sentence":"Check"});
    chk.addEventListener("click",function(){
      if(retrying){
        if(repairOk(s.retryText)){ s.retryDone=true; fb.s6="Well done. You repaired it without the model."; }
        else { fb.s6="Not yet. Remember: “last month” is finished. Change one word."; }
        save(); rerender("chk6"); return;
      }
      if(repairOk(s.text)){ if(!s.first) s.first=s.text; s.solved=true; fb.s6="Yes. “Last month” is finished, so use “started”."; }
      else {
        if(!s.first) s.first=s.text;
        s.tries++;
        if(s.tries>=2){ s.modelShown=true; fb.s6="Here is a model. Look at the change, then try again without it."; }
        else fb.s6="Not yet. “Last month” is finished. Which word shows that? Change one word.";
      }
      save(); rerender(isDone(6)?"carry":"chk6");
    });
    row.appendChild(chk);
  }
  desk.appendChild(row);
  desk.appendChild(feedback("fb6",fb.s6||"",s.solved||s.retryDone));
  if(finished && !retrying){
    var side=el("div",{class:"side"});
    side.appendChild(el("div",{class:"before",html:"<small>Before</small>Then I <mark>start</mark> work last month."}));
    side.appendChild(el("div",{class:"after",html:"<small>After</small>Then I <mark>started</mark> work last month."}));
    desk.appendChild(side);
    desk.appendChild(el("div",{class:"explain",text:"One change: start → started. “Last month” is finished, so use the past form."}));
    if(s.first && norm(s.first)!==norm(CONTENT.draft)){
      desk.appendChild(el("p",{style:"margin-top:10px",html:"<strong>Your first try:</strong> "}) );
      desk.lastChild.appendChild(document.createTextNode(s.first));
    }
    if(!s.retryDone){
      var rt=el("button",{type:"button","data-key":"retry6",text:"Try it without the model"});
      rt.addEventListener("click",function(){ s.retryOpen=true; s.retryText=""; fb.s6=""; save(); rerender("repairBox"); });
      desk.appendChild(el("div",{class:"btn-row"},[rt]));
    }
  }
  r.appendChild(desk);
  r.appendChild(nav(6));
}

/* 9 — Finish */
var completionInFlight=false, completionSent=false;
function findBridge(){
  try{
    if(window.PazapaBridge && typeof window.PazapaBridge.complete==="function") return {type:"pazapa",api:window.PazapaBridge};
    var w=window, n=0;
    while(w && n<8){
      if(w.API && typeof w.API.LMSSetValue==="function") return {type:"scorm12",api:w.API};
      if(w===w.parent) break; w=w.parent; n++;
    }
  }catch(e){}
  return null;
}
function commitCompletion(){
  var b=findBridge();
  if(!b) return true; // local-only: nothing to send
  try{
    if(b.type==="pazapa"){ var res=b.api.complete("A2-W01-L3-S4"); return res!==false; }
    var a=b.api; a.LMSInitialize("");
    a.LMSSetValue("cmi.core.lesson_status","completed");
    var ok=String(a.LMSCommit(""))!=="false";
    return ok;
  }catch(e){ return false; }
}
function screen9(r){
  r.appendChild(el("h2",{text:"Well done!"}));
  var two=el("div",{class:"two-col"});
  var c1=el("div",{class:"col"}); c1.appendChild(pic("now"));
  var c2=el("div",{class:"col"});
  c2.appendChild(el("div",{class:"recap",html:
    '<p><strong>You built and used your story language:</strong></p>'+
    '<p>I was born in Morocco and grew up in Lyon.<br>I studied nursing.<br>I moved to the Gulf in March.<br>Then I started work last month.</p>'}));
  two.appendChild(c1); two.appendChild(c2); r.appendChild(two);
  r.appendChild(el("p",{html:"You can now tell a short story with <strong>At first, Then and Now</strong>. Next, you will meet this language again in <strong>Read for Real Life</strong>."}));
  var panel=el("div",{class:"confirm-panel",id:"confirm9",style:"display:none",role:"group","aria-label":"Start over"});
  panel.appendChild(el("p",{text:"Start this activity over? Your work on this activity will be cleared."}));
  var yes=el("button",{type:"button",class:"primary","data-key":"yes9",text:"Yes, start over"});
  var no=el("button",{type:"button",class:"ghost","data-key":"no9",text:"Cancel"});
  panel.appendChild(el("div",{class:"btn-row"},[yes,no]));
  r.appendChild(panel);
  var f=el("footer",{class:"nav-bar"});
  var ta=el("button",{type:"button",class:"ghost","data-key":"ta9",text:"Try again"});
  var done=el("button",{type:"button",class:"primary","data-key":"done9",text:state.completed?"Done ✓":"Done"});
  done.disabled=state.completed;
  ta.addEventListener("click",function(){ panel.style.display="block"; yes.focus(); });
  no.addEventListener("click",function(){ panel.style.display="none"; ta.focus(); });
  yes.addEventListener("click",function(){
    state=fresh(); completionSent=false; completionInFlight=false; fb={}; newShuffles(); clearSaved(); goTo(1);
  });
  done.addEventListener("click",function(){
    if(completionSent||completionInFlight) return;
    for(var n=1;n<=8;n++){ if(!isDone(n)) return; }
    completionInFlight=true;
    var ok=commitCompletion();
    completionInFlight=false;
    if(ok){ completionSent=true; state.completed=true; save(); done.textContent="Done ✓"; done.disabled=true; announce("Activity completed."); }
    // on failure the button stays active so the learner can press Done again
  });
  f.appendChild(ta); f.appendChild(done); r.appendChild(f);
}

/* ---------------- boot ---------------- */
load();
if(state.completed) completionSent=true;
newShuffles();
goTo(state.screen);
})();
