  // ------------------------------------------------------------------
  // HELPERS

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function norm(s){ return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim(); }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function sentenceOf(parts){ return cap(parts.join(' '))+'.'; }
  function shuffle(a, avoid){
    var b, tries=0;
    do{
      b=a.slice();
      for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
      tries++;
    }while(avoid && avoid(b) && tries<30);
    return b;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var live = $('#live');
  function announce(msg){ live.textContent=''; setTimeout(function(){ live.textContent=msg; },30); }
  function feedback(el, ok, text){
    el.className='feedback';
    el.innerHTML='<span class="dot'+(ok?' ok':'')+'" aria-hidden="true"></span><span></span>';
    el.lastChild.textContent=text;
    announce(text);
  }
  function clearFeedback(el){ el.className='feedback'; el.innerHTML=''; }

    $$('.screen').forEach(function(s){ s.classList.remove('active'); s.setAttribute('aria-hidden','true'); });
    var sc=$('#screen'+n); sc.classList.add('active'); sc.removeAttribute('aria-hidden');
    var p=Math.min(n,TOTAL);
    $('#progFill').style.width=(n>TOTAL?100:Math.round((p-1)/TOTAL*100+ (100/TOTAL)*0.5))+'%';
    $('#progLabel').textContent=n>TOTAL?'Finished':'Part '+p+' of '+TOTAL;
    window.scrollTo(0,0);
    var h=$('h2',sc); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  }

  function buildRail(it,host,sc){
    var st=s3[it.id]={ order:[], solved:false, wrong:0, locked:false, bankOrder:null };
    var byId={}; it.chunks.forEach(function(c){ byId[c.id]=c; });
    function textOf(order){ return order.map(function(id){ return byId[id].t; }); }
    function isAuthored(order){ return it.keys.indexOf(norm(textOf(order).join(' ')))>-1; }
    st.bankOrder=shuffle(it.chunks.map(function(c){return c.id;}),function(b){
      var t=norm(textOf(b).join(' ')); return it.keys.indexOf(t)>-1 || b[0]===it.chunks[0].id; });

    var card=document.createElement('div'); card.className='rail-card';
    card.innerHTML=
      '<div class="rail-head"><figure><img src="'+IMG[it.img]+'" alt="'+esc(it.imgAlt)+'"></figure><div><h3>'+esc(it.title)+'</h3><p>'+esc(it.say)+'</p></div></div>'+
      '<div class="bank" role="group" aria-label="Chunks to use"></div>'+
      '<div class="rail" role="group" aria-label="Your sentence"></div>'+
      '<p class="preview" aria-live="off"></p>'+
      '<div class="btn-row"><button type="button" class="primary check">Check my sentence</button>'+
        '<button type="button" class="ghost hintb">Hint</button>'+
        '<button type="button" class="ghost modelb" hidden>Show the model</button></div>'+
      '<div class="hint-line" hidden></div>'+
      '<div class="feedback" role="status"></div>';
    host.appendChild(card);
    var bank=$('.bank',card), rail=$('.rail',card), prev=$('.preview',card), fb=$('.feedback',card), hintLine=$('.hint-line',card);
    var dragId=null;

    function draw(){
      bank.innerHTML=''; rail.innerHTML='';
      st.bankOrder.forEach(function(id){
        if(st.order.indexOf(id)>-1) return;
        var b=document.createElement('button'); b.type='button'; b.className='chunk'; b.textContent=byId[id].t;
        b.setAttribute('aria-label',byId[id].t+', add to sentence'); b.disabled=st.locked;
        if(!st.locked){ b.draggable=true;
          b.addEventListener('dragstart',function(e){ dragId='b:'+id; try{ e.dataTransfer.setData('text/plain',id); }catch(x){} });
        }
        b.addEventListener('click',function(){ st.order.push(id); draw(); announce(byId[id].t+' added.'); });
        bank.appendChild(b);
      });
      if(!st.order.length){ var e=document.createElement('span'); e.className='empty'; e.textContent='Tap a chunk to start your message.'; rail.appendChild(e); }
      st.order.forEach(function(id,pos){
        var b=document.createElement('button'); b.type='button'; b.className='chunk placed'; b.textContent=byId[id].t;
        b.setAttribute('aria-label',byId[id].t+', position '+(pos+1)+'. Press to take it out.'); b.disabled=st.locked; b.setAttribute('data-id',id);
        if(!st.locked){ b.draggable=true;
          b.addEventListener('dragstart',function(e){ dragId='r:'+id; try{ e.dataTransfer.setData('text/plain',id); }catch(x){} }); }
        b.addEventListener('click',function(){ st.order.splice(st.order.indexOf(id),1); draw(); announce(byId[id].t+' taken out.'); });
        rail.appendChild(b);
      });
      prev.textContent=st.order.length?sentenceOf(textOf(st.order)):'';
      if(bank.children.length===0 && !st.locked){ var done=document.createElement('span'); done.className='empty'; done.textContent='All chunks are in the message.'; bank.appendChild(done); }
    }
    rail.addEventListener('dragover',function(e){ if(!st.locked){ e.preventDefault(); rail.classList.add('over'); } });
    rail.addEventListener('dragleave',function(){ rail.classList.remove('over'); });
    rail.addEventListener('drop',function(e){
      e.preventDefault(); rail.classList.remove('over'); if(st.locked||!dragId) return;
      var id=dragId.slice(2), from=dragId.charAt(0); dragId=null;
      var target=e.target.closest?e.target.closest('.chunk.placed'):null;
      if(from==='r'){ st.order.splice(st.order.indexOf(id),1); }
      var at=st.order.length;
      if(target){ var ti=st.order.indexOf(target.getAttribute('data-id')); if(ti>-1) at=ti; }
      st.order.splice(at,0,id); draw();
    });

    function lock(){ st.locked=true; card.classList.add('solved'); $('.check',card).disabled=true; $('.hintb',card).hidden=true; $('.modelb',card).hidden=true; hintLine.hidden=true; draw(); updateNext(); }
    $('.check',card).addEventListener('click',function(){
      attempted.build=true;
      if(st.order.length<it.chunks.length){ feedback(fb,false,'Use every chunk to build the whole message.'); return; }
      if(isAuthored(st.order)){ st.solved=true; feedback(fb,true,'Yes. This message says what you did and when.'); lock(); }
      else{
        st.wrong++;
        feedback(fb,false,'Not yet. Say it aloud: does it tell Hana what you did and when?');
        if(st.wrong>=2){ $('.modelb',card).hidden=false; }
      }
    });
    $('.hintb',card).addEventListener('click',function(){ hintLine.hidden=false; hintLine.textContent='Start with the time phrase.'; announce('Hint. Start with the time phrase.'); });
    $('.modelb',card).addEventListener('click',function(){
      attempted.build=true; st.order=it.model.slice(); st.solved=true;
      feedback(fb,true,'Here is the model: '+sentenceOf(textOf(st.order))+' Try the other word order next time if you like.');
      lock();

    draw();

    function updateNext(){
      var all=CONTENT.build.every(function(c){ return s3[c.id] && s3[c.id].solved; });
      $('#to4',sc).disabled=!all;

    }
  }

        if(win.API) return {v:'1.2', api:win.API};
      }catch(e){}
      try{ if(win.parent===win) break; win=win.parent; }catch(e){ break; }
      n++;
    }
    return null;
  }

      }
      var f=findApi(window);

      if(!f) return true; // no LMS API: local completed state
      if(f.v==='2004'){
        try{ f.api.Initialize(''); }catch(e){}

    }catch(e){ return false; }

    var fl=$('#finalLines',sc);
    reply.forEach(function(t){ var p=document.createElement('p'); p.style.margin='0 0 4px'; p.textContent=t; fl.appendChild(p); });
    var doneBtn=$('#doneBtn',sc), note=$('#doneNote',sc);
    function showDone(){ doneBtn.textContent='Done ✓'; doneBtn.disabled=true; note.textContent='Well done. You have completed this activity.'; announce('Activity completed.'); doneShown=true; }
    doneBtn.addEventListener('click',function(){
      if(!(attempted.build && attempted.repair && attempted.reply)) return;
      if(completionSent){ showDone(); return; }
      if(completionInFlight) return;
      completionInFlight=true;
      var ok=sendCompletion();
      completionInFlight=false;
      if(ok){ completionSent=true; showDone(); }
      else{ note.textContent='Well done. You have completed this activity.'; } // button stays active so Done can be pressed again
    });
    $('#again7',sc).addEventListener('click',startOver);
    $('#improve7',sc).addEventListener('click',function(){
      goTo(6);
      var s=$('#screen6'); var b=$('#improveBtn',s); if(b && !$('#after6',s).hidden){ b.click(); }
    });
  }

  function startOver(){
    attempted={ build:false, repair:false, reply:false };
    renderS1(); renderS2(); renderS3(); renderS4(); renderS5(); renderS6(); renderS7();
    goTo(1);
  }

  // ------------------------------------------------------------------
  // BOOT
  // ------------------------------------------------------------------
  renderS1(); renderS2(); renderS3(); renderS4(); renderS5(); renderS6(); renderS7();
  goTo(1);
  // Exposed for automated tests only.
  window.__pazapaTest={ norm:norm, content:CONTENT };
})();
</script>
