<!--
=====================================================================
SOURCE NOTES (developer only – not shown to learners)
Activity id ........ A2-W06-L3-S6  (Pazapa A2, Week 6, Lesson 3, Step 6)
Lesson title ....... Changing or cancelling a service

CONTENT KEYS (edit in CONTENT below)
  - Anchor turn ........ "What will you do if there is a fee?"
  - Model answer ....... "If there is a fee, I'll ask for a written explanation."
  - Source facts ....... Hana checks plan details before confirming; enquiry reference C42
  - Course models ...... I'd like to cancel my internet contract. / Is there a cancellation fee? /
                         If I cancel now, will I get a refund?
  - Weekly phrases ..... one per lesson (L1 installation, L2 bill, L3 change/cancel)
  - Open answers are never marked wrong for wording; the four-criteria check is self-assessment.

CONFIGURABLE ASSETS
  - AUDIO_ASSETS: map of cue id -> verified audio URL (normal speed only). null = shows an
    "Audio not available" state next to the transcript. No autoplay. No slow-speed buttons.
  - Images are embedded (extracted from the Week 6 Lesson 3 workbook).

OPTIONAL FEEDBACK ENDPOINT
  - None configured. No responses or recordings are sent anywhere. If a service is added later it
    must be triggered only by an explicit learner action and its output labelled honestly.

HOST MICROPHONE REQUIREMENTS
  - Recording is optional and uses getUserMedia + MediaRecorder, requested only on "Start recording".
  - Needs HTTPS. If embedded in an iframe the host must allow it:
      <iframe allow="microphone"> and Permissions-Policy: microphone=(self)
  - Without it the page falls back to "speak aloud" or typing. Audio is never stored in localStorage.

COMPLETION INTEGRATION
  - SCORM 1.2 (API) and 2004 (API_1484_11) found by walking window.parent/opener.
  - Completion is written only when the learner presses "Finish the mission" after participation
    criteria are met. completionInFlight / completionSent guards; sent is set only after the commit
    is read back. Failure allows retry. Confirmed completion is restored on reload. No score is set.
  - With no LMS API the page completes locally without any error.
=====================================================================
-->

var STEPLABEL = {brief:'Mission',prepare:'Prepare',talk:'Talk',check:'Check',improve:'Improve',compare:'Compare',done:'Finish'};

/* ================= SCORM / completion bridge ================= */
var LMS = (function(){
  var api=null, ver=null, inited=false, finished=false;
  var completionInFlight=false, completionSent=false, localDone=false, tries=0;
  function find(win){
    var n=0;
    while(win && n++<12){
      try{
        if(win.API_1484_11) return {a:win.API_1484_11,v:'2004'};
        if(win.API) return {a:win.API,v:'1.2'};
      }catch(e){}
      try{ if(win.parent && win.parent!==win){ win=win.parent; continue; } }catch(e){}
      break;
    }
    return null;
  }
  function detect(){
    if(api || tries>=4) return !!api; tries++;
    var f=find(window);
    if(!f){ try{ if(window.opener) f=find(window.opener); }catch(e){} }
    if(f){ api=f.a; ver=f.v; }
    return !!api;
  }
  function ok(r){ return r===true || r==='true' || r===1; }
  function init(){
    if(!detect()) return false;
    if(inited) return true;
    try{ var r= ver==='2004'? api.Initialize(''):api.LMSInitialize(''); inited= ok(r) || true; }catch(e){ inited=false; }
    return inited;
  }
  function get(k){ try{ return ver==='2004'? api.GetValue(k):api.LMSGetValue(k);}catch(e){return '';} }
  function set(k,v){ try{ return ok(ver==='2004'? api.SetValue(k,v):api.LMSSetValue(k,v)); }catch(e){return false;} }
  function commit(){ try{ return ok(ver==='2004'? api.Commit(''):api.LMSCommit('')); }catch(e){return false;} }
  var K = function(){ return ver==='2004'? {status:'cmi.completion_status',sd:'cmi.suspend_data'} : {status:'cmi.core.lesson_status',sd:'cmi.suspend_data'}; };
  function isComplete(){ var s=String(get(K().status)||'').toLowerCase(); return s==='completed' || (ver==='1.2' && s==='passed'); }
  function readSuspend(){ if(!init()) return ''; return String(get(K().sd)||''); }
  function saveSuspend(str){
    if(!init()) return false;
    if(ver==='1.2' && str.length>4000) return false;
    set(K().sd,str); return true;
  }
  function start(){
    if(!init()) return;
    var s=String(get(K().status)||'').toLowerCase();
    if(isComplete()){ completionSent=true; }
    else if(s==='not attempted' || s==='' || s==='unknown'){ set(K().status,'incomplete'); commit(); }
  }
  function complete(done){
    if(completionSent){ done(true); return; }
    if(completionInFlight){ done(false); return; }
    if(!init()){ localDone=true; done(true); return; }   // no bridge: local completion, no error
    completionInFlight=true;
    var okw=set(K().status,'completed');
    var okc= okw && commit();
    var verified= okc && isComplete();
    completionInFlight=false;
    if(verified){ completionSent=true; done(true); } else { done(false); }
  }
  function end(){
    if(finished || !api || !inited) return; finished=true;
    try{ commit(); ver==='2004'? api.Terminate(''):api.LMSFinish(''); }catch(e){}
  }
  return {start:start,readSuspend:readSuspend,saveSuspend:saveSuspend,complete:complete,end:end,
          isComplete:isComplete,hasApi:function(){return init();},sent:function(){return completionSent;}};
})();

/* ================= persistence (text only – never audio) ================= */
var LSKEY='pazapa-'+CONTENT.activityId;
function pack(lim){
  var s={v:1,g:st.goal,p:st.plan,r:st.route,i:st.revealed,f:st.focus,w:st.weekly,c:st.check,a:st.a2check,x:st.gain,pn:st.pinned,s:{}};
  Object.keys(st.slots).forEach(function(k){
    var o=st.slots[k]; s.s[k]={t:(o.text||'').slice(0,lim),k:o.spoken?1:0,m:o.mic?1:0};
  });
  return JSON.stringify(s);
}
function save(){
  var out='';
  [600,300,120,40].some(function(l){ out=pack(l); return out.length<3900; });
  try{ LMS.saveSuspend(out); }catch(e){}
  try{ localStorage.setItem(LKEY(),out); }catch(e){}
}
function LKEY(){ return LSKEY; }
function restore(){
  var raw=''; try{ raw=LMS.readSuspend(); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(LKEY())||''; }catch(e){} }
  if(!raw) return;
  try{
    var s=JSON.parse(raw); if(!s||s.v!==1) return;
    if(CONTENT.goals[s.g]) st.goal=s.g;
    st.plan=s.p||st.plan; st.route=(['type','record','speak'].indexOf(s.r)>-1)?s.r:'type';
    st.revealed=Math.max(1,Math.min(CONTENT.cues.length,s.i|0||1));
    st.focus=s.f||''; st.weekly=Array.isArray(s.w)?s.w.slice(0,3):st.weekly;
    st.check=s.c||{}; st.a2check=s.a||''; st.gain=s.x||''; st.pinned=Array.isArray(s.pn)?s.pn:[];
    Object.keys(s.s||{}).forEach(function(k){ var o=s.s[k]; st.slots[k]={text:String(o.t||''),spoken:!!o.k,mic:false}; });
  }catch(e){}
}

/* ================= helpers ================= */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v===false||v==null) return;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i]; if(c==null||c===false) continue;
    if(Array.isArray(c)){ c.forEach(function(x){ if(x) el.appendChild(typeof x==='string'? document.createTextNode(x):x); }); continue; }
    el.appendChild(typeof c==='string'? document.createTextNode(c):c);
  }
  return el;
}
function say(msg){ var l=document.getElementById('live'); l.textContent=''; setTimeout(function(){l.textContent=msg;},30); }
function slotDone(k){ var o=st.slots[k]; return !!(o && ((o.text||'').trim() || o.spoken || o.mic)); }
function slotOf(k){ return st.slots[k]||(st.slots[k]={text:'',spoken:false,mic:false}); }
var micSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function discardRec(k){
  var r=recs[k]; if(!r) return;
  try{ if(r.rec && r.rec.state!=='inactive') r.rec.stop(); }catch(e){}
  try{ if(r.stream) r.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  if(r.url){ try{URL.revokeObjectURL(r.url);}catch(e){} }
  delete recs[k];
  if(st.slots[k]) st.slots[k].mic=false;
}
function discardAll(){ Object.keys(recs).forEach(discardRec); }

/* ================= answer slot (type / record / speak) ================= */
function buildSlot(key,label,placeholder,onChange){
  var wrap=h('div',{class:'slot'});
  var o=slotOf(key);
  var route=st.route;
  if(route==='record' && !micSupported) route='type-fallback';
  wrap.appendChild(h('strong',{text:label}));
  if(route==='type' || route==='type-fallback'){
    if(route==='type-fallback') wrap.appendChild(h('p',{class:'note',text:'Recording is not available in this browser. Type your answer instead, or say it aloud.'}));
    var id='ta-'+key;
    wrap.appendChild(h('label',{class:'f',for:id,text:'Type your answer'}));
    var ta=h('textarea',{id:id,placeholder:placeholder||'',maxlength:'600',autocomplete:'off'});
    ta.value=o.text||'';
    ta.addEventListener('input',function(){ o.text=ta.value; save(); onChange&&onChange(); });
    wrap.appendChild(ta);
    wrap._ta=ta;
  } else if(route==='speak'){
    wrap.appendChild(h('p',{class:'note',text:'Say your answer aloud. When you have finished, press the button.'}));
    var b=h('button',{type:'button',class:'btn sec small','aria-pressed':String(!!o.spoken),text:o.spoken?'I have said it (tap to undo)':'I have said it',
      onclick:function(){ o.spoken=!o.spoken; b.setAttribute('aria-pressed',String(o.spoken)); b.textContent=o.spoken?'I have said it (tap to undo)':'I have said it'; save(); say(o.spoken?'Marked as said.':'Marked as not said yet.'); onChange&&onChange(); }});
    wrap.appendChild(b);
  } else {
    wrap.appendChild(recorder(key,o,onChange));
  }
  return wrap;
}

function recorder(key,o,onChange){
  var box=h('div');
  var status=h('div',{class:'status',role:'status'});
  var controls=h('div',{class:'rec'});
  var player=h('div');
  box.appendChild(h('p',{class:'note',text:'Press Start recording, say your answer (up to 60 seconds), then press Stop.'}));
  box.appendChild(controls); box.appendChild(status); box.appendChild(player);
  var timer=null;
  function paint(){
    controls.innerHTML=''; player.innerHTML='';
    var r=recs[key];
    if(r && r.recording){
      controls.appendChild(h('button',{type:'button',class:'btn small',text:'Stop recording',onclick:stop}));
      return;
    }
    if(r && r.url){
      player.appendChild(h('audio',{controls:true,src:r.url,'aria-label':'Hear my recording'}));
      controls.appendChild(h('button',{type:'button',class:'btn sec small',text:'Record again',onclick:start}));
      controls.appendChild(h('button',{type:'button',class:'btn sec small',text:'Delete recording',onclick:function(){discardRec(key);status.textContent='Recording deleted.';say('Recording deleted.');save();paint();onChange&&onChange();}}));
    } else {
      controls.appendChild(h('button',{type:'button',class:'btn small',text:'Start recording',onclick:start}));
    }
  }
  function start(){
    discardRec(key);
    status.textContent='Asking for the microphone…';
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var chunks=[], rec;
      try{ rec=new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){t.stop();}); status.textContent='Recording is not available here. Say your answer aloud or type it.'; return; }
      recs[key]={rec:rec,stream:stream,recording:true};
      rec.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop=function(){
        clearTimeout(timer);
        stream.getTracks().forEach(function(t){t.stop();});
        var cur=recs[key]; if(!cur || cur.rec!==rec){ return; }
        cur.recording=false;
        var blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
        if(!blob.size){ delete recs[key]; o.mic=false; status.textContent='Nothing was recorded. Please try again.'; }
        else { cur.url=URL.createObjectURL(blob); o.mic=true; status.textContent='Recording saved for this session. Press play to listen.'; }
        save(); paint(); onChange&&onChange(); say(status.textContent);
      };
      rec.start();
      status.textContent='Recording… speak now.'; say('Recording started.');
      timer=setTimeout(function(){ try{ if(rec.state!=='inactive') rec.stop(); }catch(e){} },60000);
      paint();
    }).catch(function(){
      status.textContent='The microphone is not available. Choose “Speak aloud” or type your answer instead.';
      say(status.textContent);
    });
  }
  function stop(){ var r=recs[key]; try{ if(r&&r.rec&&r.rec.state!=='inactive') r.rec.stop(); }catch(e){} }
  paint();
  return box;
}

/* ================= views ================= */
var viewEl=document.getElementById('view');
function go(v,noFocus){
  st.view=v; save(); render(); window.scrollTo(0,0);
  if(!noFocus){ var t=document.getElementById('mainTitle'); if(t){ t.setAttribute('tabindex','-1'); t.focus(); } }
}
function renderProgress(){
  var p=document.getElementById('progress'); p.innerHTML='';
  var idx=VIEWS.indexOf(st.view);
  VIEWS.forEach(function(v,i){
    var li=h('li',{class:i<idx?'done':'',text:(i+1)+'. '+STEPLABEL[v]});
    if(i===idx) li.setAttribute('aria-current','step');
    p.appendChild(li);
  });
}
function title(t){ return h('h2',{id:'mainTitle',text:t}); }
function nav(backTo,backLabel,next){
  var row=h('div',{class:'btnrow'});
  if(backTo) row.appendChild(h('button',{type:'button',class:'btn sec',text:backLabel||'Back',onclick:function(){go(backTo);}}));
  if(next) row.appendChild(next);
  return row;
}

function attemptText(i){
  var o=st.slots['t'+i]||{};
  if((o.text||'').trim()) return o.text.trim();
  if(o.mic) return '(Recorded – listen back in this session)';
  if(o.spoken) return '(Said aloud)';
  return '(No answer)';
}
function attemptAll(){ return CONTENT.cues.map(function(c,i){return attemptText(i);}).join('\n'); }

function tryAgain(){
  discardAll();
  var keepPin=st.pinned;
  st=freshState(); st.pinned=keepPin;
  save(); go('brief'); say('Starting again.');
}
function doneClick(){
  function after(){ LMS.end(); var n=document.getElementById('closeNote'); if(n) n.classList.remove('hidden'); var b=document.getElementById('doneBtn'); if(b) b.disabled=true; say('Done.'); }
  if(LMS.sent()||!LMS.hasApi()){ after(); }
  else { LMS.complete(function(ok){ if(ok) after(); }); }
}

function render(){
  discardRenderGuard();
  renderProgress();
  viewEl.innerHTML='';
  var v={brief:viewBrief,prepare:viewPrepare,talk:viewTalk,check:viewCheck,improve:viewImprove,compare:viewCompare,done:viewDone}[st.view]||viewBrief;
  viewEl.appendChild(v());
}
function discardRenderGuard(){}

/* ================= unload ================= */
var unloaded=false;
function onUnload(){ if(unloaded) return; unloaded=true; try{save();}catch(e){} discardAll(); LMS.end(); }
window.addEventListener('pagehide',onUnload);
window.addEventListener('beforeunload',onUnload);

/* ================= start ================= */
LMS.start();
restore();
if(LMS.sent()){ st.view = 'done'; }
else if(st.view==='done'){ st.view='brief'; }
render();
})();
