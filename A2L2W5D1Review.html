  Pazapa English Programme for Adults | A2 | Activity A2-W05-L1-S7
  Week 5, Lesson 1 | Villa, apartment or compound? | Step 7: Review, Improve and Retry

  ANSWER KEYS AND EVIDENCE (kept in source data below, never shown before an attempt)
    Recall lines (open, self-checked)
      W03 L1 .... "I have to do a medical test first."
      W04 L3 .... "I get paid on the 28th."
      W05 L1 .... "The compound is quieter but further from work."
      Equivalent familiar language that does the same job is fine; nothing is auto-marked wrong.
    Reading recall: "Which apartment is cheaper?"  Key: Apartment B (850 units, against 900 for Apartment A).
      Accepted: "B", "Apartment B", "the apartment B" (case, spaces and final punctuation ignored).
      Evidence shown after the attempt: "Apartment A costs 900 units a month." / "Apartment B costs 850 units."
    Repair: draft "This apartment is more quieter."  Key: "This apartment is quieter."
      Accepted alternatives: "The apartment is quieter." / "It is quieter." / "This apartment is much quieter."
      / "This apartment is quieter than that one."  Anything with "more quieter" is not accepted.
    Communication cue: "Which apartment would you choose?"
      Possible answer (example only, never an exact match): "I'd choose Apartment B because it is quieter and cheaper."
    Transfer (new fictional case, the listings are not changed): "I'd choose Apartment A because it is nearer the metro."

  OPEN REPLIES are self-checked by the learner. Nothing is ticked automatically and no score is created.
  The short word check on the compare screen only looks for plain words (apartment name, because, a comparative).

  AUDIO: no verified audio is supplied. To add one, set AUDIO.src (and AUDIO.transcript) below.
         Audio never autoplays. Without it the activity shows a clear "not available" note and uses the written text.
  PRIOR ATTEMPTS: no earlier-step data is supplied, so nothing is restored. Learners make a fresh first try.
  EXTERNAL FEEDBACK: none is configured. All feedback here is local and rule-based.

<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-20:#D7F1F7;
  --green-20:#F4F7DA;
  --yellow-20:#FEF3CD;
  --cream:#FFF7E8;
  --line:#6B6B6A;
  --heading-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --body-font:"Open Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--pazapa-grey-dark);font-family:var(--body-font);font-size:1.0625rem;line-height:1.55;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--pazapa-grey-dark);color:#fff;padding:12px 16px;z-index:10;border-radius:6px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px #fff}

.top{border-top:8px solid var(--pazapa-blue);padding:12px clamp(16px,4vw,48px) 0;border-bottom:2px solid var(--pazapa-grey-light)}
.top-row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{margin:0;font-family:var(--heading-font);font-weight:800;font-size:1.05rem}
.brand small{display:block;font-family:var(--body-font);font-weight:400;font-size:.9rem}
.logo{height:34px;width:auto;display:block}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:10px 0 0;padding:0 0 10px}
.steps button{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:.92rem;font-weight:600}
.steps button[disabled]{opacity:.55;cursor:not-allowed}
.steps button.done{border-color:var(--pazapa-blue-dark)}
.steps button[aria-current="step"]{background:var(--pazapa-yellow);border:3px solid var(--pazapa-grey-dark);padding:5px 11px}

main{max-width:1180px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 64px}
.screen{display:none}
.screen.on{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:880px){.screen.on{grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}}
.panel{background:var(--blue-20);border-radius:6px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
@media (min-width:880px){.panel{position:sticky;top:16px;padding:24px}}
.panel img{display:block;width:100%;max-width:380px;height:auto;object-fit:contain;border-radius:4px}
@media (max-width:879px){.panel img{max-width:260px}}
.panel p{margin:0;text-align:center;font-weight:600}
h1,h2,h3{font-family:var(--heading-font);font-weight:800;line-height:1.2;margin:0 0 12px}
h1,h2{font-size:clamp(1.6rem,4vw,2.2rem)}
h3{font-size:1.15rem}
h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:4px}
p{margin:0 0 12px}
.lead{font-size:1.15rem}
.small{font-size:.95rem}

.task{border-left:8px solid var(--pazapa-blue);background:#fff;border-top:2px solid var(--pazapa-grey-light);border-right:2px solid var(--pazapa-grey-light);border-bottom:2px solid var(--pazapa-grey-light);padding:16px 18px;margin:0 0 20px;border-radius:0 6px 6px 0;min-width:0}
.task.green{border-left-color:var(--pazapa-green)}
.task.yellow{border-left-color:var(--pazapa-yellow)}
fieldset.task{margin-inline:0}
legend{font-weight:700;padding:0 6px;font-size:1.05rem}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;accent-color:var(--pazapa-blue-dark);margin:0}
.opt:has(input:checked){background:var(--blue-20);border-color:var(--pazapa-blue-dark);border-width:3px;padding:9px 13px}
.opt:has(input:focus-visible){outline:3px solid var(--pazapa-grey-dark);outline-offset:2px}
.opt.ok{background:var(--pazapa-green);border-color:var(--pazapa-grey-dark)}
.opt.try{background:var(--yellow-20);border-color:var(--pazapa-grey-dark)}
.opt em{display:block;font-style:normal;font-size:.95rem;margin-top:2px}
label.lbl{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}
textarea[readonly]{background:var(--pazapa-grey-light)}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:.98rem}
.fb:empty{display:none}
.fb.ok{background:var(--green-20);border:2px solid var(--pazapa-green)}
.fb.try{background:var(--yellow-20);border:2px solid var(--pazapa-yellow)}
.fb .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);margin-right:8px;vertical-align:-1px}
.fb .tick{font-weight:800;margin-right:6px}
.hint{background:var(--yellow-20);border:2px solid var(--pazapa-yellow);border-radius:6px;padding:8px 12px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0 0 4px}
.hint p:last-child{margin:0}
.model{background:var(--green-20);border:2px solid var(--pazapa-green);padding:10px 14px;border-radius:6px;font-weight:600;margin:10px 0 0}
.model .tag{display:block;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.speech{background:var(--blue-20);border-radius:6px;padding:12px 16px;margin:0 0 16px;font-size:1.1rem;font-weight:600}
.callout{background:var(--yellow-20);border-left:8px solid var(--pazapa-yellow);padding:12px 16px;border-radius:0 6px 6px 0;margin:0 0 18px}
.callout p:last-child{margin-bottom:0}
.note{background:var(--pazapa-grey-light);border-radius:6px;padding:8px 12px;font-size:.95rem;margin:0 0 14px}

.btn{min-height:52px;min-width:52px;padding:12px 22px;border-radius:6px;border:3px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:#fff;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{background:#166B7C;border-color:#166B7C}
.btn.two{background:#fff;color:var(--pazapa-grey-dark);border-color:var(--pazapa-grey-dark)}
.btn.two:hover{background:var(--pazapa-grey-light)}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-grey-dark);color:var(--pazapa-grey-dark)}
.btn.help:hover{background:#E8B200}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:#8C8C8B;color:#595958;cursor:not-allowed}
.btn.small{min-height:48px;padding:8px 16px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.status{margin:10px 0 0;font-size:.95rem}
.nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}

/* composition: switchboard rail */
.rail{display:grid;gap:8px;margin:0 0 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.rail button{min-height:56px;text-align:left;padding:8px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:600}
.rail button small{display:block;font-weight:400;font-size:.88rem}
.rail button[aria-pressed="true"]{background:var(--blue-20);border:3px solid var(--pazapa-blue-dark);padding:7px 11px}
.rail button.did::after{content:" - tried";font-weight:400;font-size:.88rem}
/* composition: document */
.doc{display:grid;gap:14px;margin:12px 0}
@media (min-width:700px){.doc{grid-template-columns:1fr 1fr}}
.listing{border:2px solid var(--pazapa-grey-dark);border-radius:6px;padding:12px;background:var(--cream)}
.listing img{width:100%;max-height:150px;object-fit:contain;display:block;margin-bottom:8px}
.listing h3{margin-bottom:4px}
mark{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);padding:0 3px;border-bottom:3px solid var(--pazapa-grey-dark)}
/* composition: editor */
.draft{display:inline-block;background:var(--yellow-20);border:2px dashed var(--pazapa-grey-dark);border-radius:6px;padding:8px 14px;font-weight:700}
.draft s{text-decoration-thickness:3px}
.edit{border:3px solid var(--pazapa-blue-dark);border-radius:8px;padding:14px;background:var(--blue-20);margin:0 0 16px}
/* composition: studio */
.studio{display:grid;gap:14px;margin:12px 0}
@media (min-width:700px){.studio{grid-template-columns:1fr 1fr}}
.card{border:2px solid var(--pazapa-grey-dark);border-radius:6px;padding:14px 16px;background:#fff}
.card.two{background:var(--green-20)}
.card p{white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-blue-dark)}
.big{background:var(--pazapa-green);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.big h2{margin:0 0 8px}
.big p{margin:0;font-size:1.15rem}
.facts{margin:0 0 12px;padding-left:1.2em}
.facts li{margin-bottom:6px}
details{margin:12px 0}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700}
summary::before{content:'\25B8';margin-right:8px}
details[open]>summary::before{content:'\25BE'}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.opt:has(input:checked){outline:3px solid Highlight}}
</style>
</head>

/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(tag,attrs,text){var e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(function(k){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});}if(text!==undefined&&text!==null)e.textContent=text;return e;}
function add(p){for(var i=1;i<arguments.length;i++){if(arguments[i])p.appendChild(arguments[i]);}return p;}
function say(msg){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=msg;},30);}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normEnd(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function words(s){var m=norm(s).match(/[\p{L}']+/gu);return m?m.length:0;}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n):s;}
function setFb(node,ok,text){
  node.textContent='';node.className='fb';
  if(!text)return;
  node.className='fb '+(ok?'ok':'try');
  node.appendChild(el('span',ok?{class:'tick','aria-hidden':'true'}:{class:'dot','aria-hidden':'true'},ok?'✓':''));
  node.appendChild(document.createTextNode(text));
}
function img(key,alt){var i=el('img',{alt:alt||''});i.src=IMG[key];return i;}
function textarea(id,val,rows,ro){
  var t=el('textarea',{id:id,maxlength:'300',autocomplete:'off',spellcheck:'false',rows:String(rows||3)});
  t.value=val||'';if(ro){t.readOnly=true;t.setAttribute('aria-readonly','true');}
  return t;
}
function radioOpt(name,value,html,checked,onChange){
  var lb=el('label',{class:'opt'});
  var inp=el('input',{type:'radio',name:name,value:value});
  inp.checked=!!checked;
  inp.addEventListener('change',function(){onChange(value);});
  var sp=el('span');
  if(typeof html==='string')sp.textContent=html;
  else{sp.appendChild(el('strong',null,html[0]));sp.appendChild(el('em',null,html[1]));}
  lb.appendChild(inp);lb.appendChild(sp);return lb;
}
function checkOpt(label,checked,onChange){
  var lb=el('label',{class:'chk'});
  var inp=el('input',{type:'checkbox'});inp.checked=!!checked;
  inp.addEventListener('change',function(){onChange(inp.checked);});
  lb.appendChild(inp);lb.appendChild(el('span',null,label));return lb;
}

/* ===== state ===== */
function freshState(){
  return {
    stage:1,max:1,
    scene:'',line:'a',
    lines:{a:{t:'',said:false,h:0,model:false,self:''},b:{t:'',said:false,h:0,model:false,self:''},c:{t:'',said:false,h:0,model:false,self:''}},
    read:{t:'',h:0,checked:false,how:''},
    rep:{t:DRAFT,h:0,tried:false,fixed:false,shown:false,re:'',reOk:false},
    st:{first:'',firstSp:false,saved:false,focus:'',second:'',secondSp:false,compared:false,clearer:[]},
    tr:{t:'',sp:false,h:0,model:false},
    next:''
  };
}
var state=freshState();

/* ===== checks ===== */
function attempted(L){return words(L.t)>=2||L.said;}
function recallOK(){return ['a','b','c'].some(function(k){return attempted(state.lines[k]);});}
function readCorrect(t){var n=normEnd(t);return (/^(the )?(apartment )?b$/.test(n)||/\bapartment b\b/.test(n))&&!/\bapartment a\b/.test(n);}
function fixOK(t){
  var n=normEnd(t);
  if(/more quieter/.test(n))return false;
  return /^(this apartment|the apartment|it|this one) is (much |a lot |a bit )?quieter( than .+)?$/.test(n);
}
function repairGate(){return state.rep.fixed||state.rep.shown;}
function secondDiffers(){return normEnd(state.st.second)!==normEnd(state.st.first);}
function secondOK(){return state.st.saved&&((words(state.st.second)>=3&&secondDiffers())||(state.st.secondSp&&state.st.firstSp));}
function trOK(){return words(state.tr.t)>=3||state.tr.sp;}
function gate(n){
  if(n===1)return recallOK();
  if(n===2)return state.read.checked;
  if(n===3)return repairGate();
  if(n===4)return state.st.compared;
  if(n===5)return trOK();
  return false;
}

/* ===== navigation ===== */
function drawSteps(){
  var ol=$('#steps');ol.textContent='';
  STAGES.forEach(function(name,i){
    var n=i+1,li=el('li');
    var b=el('button',{type:'button'},name);
    if(n===state.stage)b.setAttribute('aria-current','step');
    if(n<state.stage)b.className='done';
    if(n>state.max)b.disabled=true;
    b.addEventListener('click',function(){go(n);});
    li.appendChild(b);ol.appendChild(li);
  });
}
function go(n,silent){
  n=Math.max(1,Math.min(6,n));
  if(n>state.max)return;
  state.stage=n;
  render();
  var h=$('#stage h1, #stage h2');
  if(h){try{h.focus({preventScroll:true});}catch(e){h.focus();}}
  window.scrollTo(0,0);
  if(!silent)say(STAGES[n-1]+'.');
}
function unlock(n){if(n>state.max){state.max=n;}}
function navRow(n,nextLabel){
  var row=el('div',{class:'nav'});
  if(n>1){var b=el('button',{class:'btn two',type:'button'},'Back');b.addEventListener('click',function(){go(n-1);});row.appendChild(b);}
  var c=el('button',{class:'btn',type:'button',id:'btnNext'},nextLabel||'Continue');
  c.disabled=!gate(n);
  c.addEventListener('click',function(){if(!gate(n))return;unlock(n+1);go(n+1);});
  row.appendChild(c);
  return row;
}
function syncNext(n){var b=$('#btnNext');if(b)b.disabled=!gate(n);var s=$('#nextNote');if(s)s.textContent=gate(n)?'You can continue.':s.getAttribute('data-wait');drawSteps();}
function noteFor(n,wait){var p=el('p',{class:'status',id:'nextNote','data-wait':wait},gate(n)?'You can continue.':wait);return p;}

function render(){
  drawSteps();
  var st=$('#stage');st.textContent='';
  var sc=el('section',{class:'screen on'});
  st.appendChild(sc);
  [null,r1,r2,r3,r4,r5,r6][state.stage](sc);
}

  var fs=el('fieldset',{class:'task'});

  var opts=el('div',{class:'opts'});

  SCENE_OPTS.forEach(function(o){
    opts.appendChild(radioOpt('scene',o.id,o.t,state.scene===o.id,function(){state.scene=o.id;setFb(fb0,!!o.ok,o.fb);}));
  });
  fs.appendChild(opts);fs.appendChild(fb0);
  var cur=SCENE_OPTS.filter(function(o){return o.id===state.scene;})[0];if(cur)setFb(fb0,!!cur.ok,cur.fb);
  main.appendChild(fs);

  var board=el('section',{class:'task green','aria-labelledby':'sbh'});
  board.appendChild(el('h3',{id:'sbh'},'Service switchboard'));
  board.appendChild(el('p',{class:'small'},'Choose a line. Say what you would say in that situation. Try at least one line.'));
  var rail=el('div',{class:'rail',role:'group','aria-label':'Choose a line'});
  var body=el('div');
  function drawRail(){
    rail.textContent='';
    LINES.forEach(function(L,i){

      b.appendChild(document.createTextNode('Line '+(i+1)));
      b.appendChild(el('small',null,L.tag));
      if(attempted(state.lines[L.id]))b.className='did';
      b.addEventListener('click',function(){state.line=L.id;drawRail();drawLine();});
      rail.appendChild(b);
    });
  }
  function drawLine(){
    body.textContent='';
    var L=LINES.filter(function(x){return x.id===state.line;})[0],S=state.lines[L.id];

  var ul=el('ul',{class:'facts'});
  ul.appendChild(el('li',null,'You tried '+tried+' of 3 recall lines.'));
  ul.appendChild(el('li',null,state.read.checked?'You checked a detail in the text.':'You looked at the text.'));
  ul.appendChild(el('li',null,state.rep.fixed?'You repaired: “This apartment is quieter.”':'You looked at the repair: “This apartment is quieter.”'));
  ul.appendChild(el('li',null,'You wrote a first try and a second try, and one reply for a new case.'));
  main.appendChild(ul);
  var fs=el('fieldset',{class:'task green'});
  fs.appendChild(el('legend',null,'What will you do next?'));
  var o=el('div',{class:'opts'});
  NEXT.forEach(function(x){o.appendChild(radioOpt('next',x.id,x.t,state.next===x.id,function(v){state.next=v;}));});
  fs.appendChild(o);main.appendChild(fs);
  var row=el('div',{class:'row'});
  var done=el('button',{class:'btn',type:'button',id:'doneBtn'},completionSent?'Done ✓':'Done');
  done.disabled=completionSent;
  var again=el('button',{class:'btn two',type:'button',id:'againBtn'},'Try again');
  row.appendChild(done);row.appendChild(again);
  main.appendChild(row);
  var stt=el('p',{class:'status',id:'doneNote'});main.appendChild(stt);
  var back=el('div',{class:'nav'});var bb=el('button',{class:'btn two small',type:'button'},'Back');bb.addEventListener('click',function(){go(5);});back.appendChild(bb);main.appendChild(back);
  done.addEventListener('click',function(){finishReview(done,stt);});
  again.addEventListener('click',function(){
    state=freshState();render();
    var h=$('#stage h1, #stage h2');if(h){try{h.focus({preventScroll:true});}catch(e){h.focus();}}
    window.scrollTo(0,0);say('The review is ready to start again.');
  });
  sc.appendChild(panel);sc.appendChild(main);
}

/* ===== completion (SCORM 1.2 / 2004 when available) ===== */
var lms={api:null,ver:null,ready:false,tries:0};
var completionInFlight=false,completionSent=false;
function findApi(name){
  var wins=[window];try{if(window.opener)wins.push(window.opener);}catch(e){}
  for(var k=0;k<wins.length;k++){
    var w=wins[k],d=0;
    while(w&&d<12){
      try{if(w[name])return w[name];}catch(e){}
      try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
      d++;
    }
  }
  return null;
}
function lmsConnect(){
  if(lms.ready)return true;
  if(lms.tries>6)return false;
  lms.tries++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{a=findApi('API');if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}}
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{var v=(lms.ver==='2004')?lms.api.GetValue(k):lms.api.LMSGetValue(k);return String(v==null?'':v);}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004')?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004')?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsCompleted(){
  if(!lms.ready)return false;
  if(lms.ver==='2004')return lmsGet('cmi.completion_status')==='completed';
  var v=lmsGet('cmi.core.lesson_status');return v==='completed'||v==='passed';
}
function finishReview(btn,note){
  if(completionSent||completionInFlight)return;
  if(state.stage!==6)return;
  completionInFlight=true;btn.disabled=true;
  var confirmed=true;
  try{
    if(lmsConnect()){
      var s1=(lms.ver==='2004')?(lmsSet('cmi.completion_status','completed')&&lmsSet('cmi.progress_measure','1')):lmsSet('cmi.core.lesson_status','completed');
      var c=lmsCommit();
      confirmed=!!(s1&&c);
    }
  }catch(e){confirmed=false;}
  completionInFlight=false;
  if(confirmed){
    completionSent=true;btn.textContent='Done ✓';btn.disabled=true;
    note.textContent='';say('Your review is finished.');
    try{console.log(CONFIG.logLabel);}catch(e){}
  }else{
    btn.disabled=false;note.textContent='Press Done again.';
  }
}
window.addEventListener('pagehide',function(){
  if(lms.ready){try{if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}catch(e){}}
});

/* ===== start ===== */
if(lmsConnect()&&lmsCompleted())completionSent=true;
render();
})();
</script>
