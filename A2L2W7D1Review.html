<title>Metro, taxi and ride apps - Review, improve and retry</title>
<!--
  Pazapa English Programme for Adults | A2
  Activity id: A2-W07-L1-S7   Week 7, Lesson 1, Step 7: Review, Improve and Retry
  Lesson: Metro, taxi and ride apps   Language focus: going to for a practical transport plan.

  CONTENT KEYS (all in the CUES / READ_* / REPAIR_* / TRANSFER_* constants in the script)
    Recall models (hidden until the learner tries):
      W05 L1  "The compound is quieter but further from work."
      W06 L3  "I'd like to cancel my internet contract."
      W07 L1  "I'm going to take the metro to work."
    Reading recall question: "Where will they meet?"  Key: Central Station (any answer containing "central" is accepted).
      Evidence (revealed after the attempt, answer line highlighted): Sara is going to take the metro on Monday. ...
    Repair: draft "I'm going take the metro."  Key: "I'm going to take the metro." (also "I am going to take the metro").
    Communication cue: "How are you going to get there?"
      Possible answer revealed after the first reply: "I'm going to take the metro and meet you at Central Station."
      Changed fictional case (labelled as new): Airport at 11:00, ride app, pick-up point at gate 3.
  Open replies are never graded. Self-check boxes are ticked by the learner only.

  ASSETS: images are embedded from the Week 7 workbook PDF (IMG object). Model audio is optional: put a verified
    audio file URL in AUDIO.model. With no URL, a clear "not available" message is shown. Audio never autoplays.
  OPTIONAL FEEDBACK ENDPOINT: none is configured and none is called. Review is fully local.
  MICROPHONE: recording is optional and starts only on the Record button (MediaRecorder, feature-detected).
    It needs HTTPS. If this page sits in an iframe the host needs allow="microphone" and a compatible Permissions-Policy.
    Audio is never stored.
  COMPLETION: uses a supplied SCORM 1.2 / 2004 bridge if one is found (otherwise completes locally).
    Guards: completionInFlight and completionSent. Sent is set only after a confirmed commit; a failed commit can be retried.
    No score is ever sent. HOST_ORIGIN (optional) enables a postMessage to the parent page.
-->
<style>
:root{
  --blue:#36BBD6;--blue-dark:#1B7E92;--green:#C9D646;--yellow:#FCC104;--red:#E6352B;
  --grey-l:#EBEBEB;--ink:#2E2E2D;--blue-20:#D7F1F7;--green-20:#F4F7DA;--yellow-20:#FEF3CD;--line:#6B6B6A;
  --head:"Filson Soft","Open Sans",Arial,sans-serif;--body:"Open Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:#fff;padding:12px 16px;z-index:10;border-radius:6px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px #fff}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.2;margin:0 0 12px}
h2{font-size:clamp(1.55rem,4vw,2.1rem)}
h3{font-size:1.15rem}
h2:focus{outline:none}
h2:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
p{margin:0 0 12px}
.small{font-size:.95rem}
.lead{font-size:1.15rem}

.top{border-top:8px solid var(--blue);padding:14px clamp(16px,4vw,48px) 10px;border-bottom:2px solid var(--grey-l)}
.brand{margin:0 0 8px;font-family:var(--head);font-weight:800;font-size:1.05rem}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.9rem}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.steps button{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:.92rem;font-weight:600}
.steps button[aria-current="step"]{background:var(--yellow);border-color:var(--ink);font-weight:800}
.steps button.done{background:var(--blue-20);border-color:var(--blue-dark)}
.steps button[disabled]{opacity:.55;cursor:not-allowed}

main{max-width:1120px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 64px}
.screen{display:none}
.screen.on{display:block}
.btn{min-height:52px;min-width:52px;padding:12px 22px;border-radius:6px;border:3px solid var(--blue-dark);background:var(--blue-dark);color:#fff;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{background:#166B7C;border-color:#166B7C}
.btn.two{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.two:hover{background:var(--grey-l)}
.btn.help{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.btn.help:hover{background:#E8B200}
.btn.small{min-height:48px;padding:8px 16px;font-size:.95rem}
.btn[disabled]{background:var(--grey-l);border-color:#8C8C8B;color:#595958;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.status{margin:10px 0 0;font-size:.95rem}
.foot{margin-top:28px;padding-top:16px;border-top:2px solid var(--grey-l)}
textarea,input[type=text]{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:92px;resize:vertical}
textarea[readonly]{background:var(--grey-l)}
label.lbl{display:block;font-weight:700;margin-bottom:4px}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:.98rem}
.fb:empty{display:none}
.fb.ok{background:var(--green-20);border:2px solid var(--green)}
.fb.try{background:var(--yellow-20);border:2px solid var(--yellow)}
.fb .mk{font-weight:800;margin-right:6px}
.hint{background:var(--yellow-20);border:2px solid var(--yellow);border-radius:6px;padding:8px 12px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0 0 4px}.hint p:last-child{margin:0}
.model{background:var(--green-20);border-left:8px solid var(--green);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0 0}
.model p:last-child{margin-bottom:0}
mark{background:var(--yellow);color:var(--ink);padding:0 3px;border-radius:3px;font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--blue-dark)}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;margin:2px 0 0;accent-color:var(--blue-dark)}
.opt:has(input:checked){background:var(--blue-20);border-color:var(--blue-dark);border-width:3px;padding:9px 13px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:6px}
details{margin:12px 0}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700}
img{max-width:100%;height:auto}

/* 1 recall: picture rail + memory lines */
.c1{display:grid;gap:24px}
@media(min-width:880px){.c1{grid-template-columns:minmax(220px,.6fr) minmax(0,1.4fr);gap:40px;align-items:start}}
.rail{background:var(--blue-20);border-radius:6px;padding:20px;text-align:center}
@media(min-width:880px){.rail{position:sticky;top:16px}}
.rail img{width:100%;max-width:300px;max-height:300px;object-fit:contain}
@media(max-width:879px){.rail img{max-height:150px;max-width:180px}}
.rail p{margin:8px 0 0;font-weight:600}
.cue{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:2px solid var(--grey-l)}
.cue:first-of-type{border-top:0}
.num{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.cue h3{margin-bottom:4px}
.cue .sit{margin:0 0 8px}
@media(max-width:520px){.cue{grid-template-columns:1fr}}

/* 2 reading: wide paper */
.c2 .q{background:var(--ink);color:#fff;border-radius:6px;padding:16px 20px;font-size:1.25rem;font-weight:700;margin:0 0 16px}
.c2 .ans{display:grid;gap:12px}
@media(min-width:760px){.c2 .ans{grid-template-columns:1fr auto;align-items:end}}
.paper{background:#fff;border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--grey-l);padding:22px 26px;margin:18px 0;font-size:1.12rem;line-height:1.8;max-width:760px}
.paper .tag{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--blue-dark);margin:0 0 8px}
.c2 .scene{float:right;width:120px;margin:0 0 8px 16px;border-radius:6px;background:var(--yellow-20)}

/* 3 repair: before and after */
.c3 .ba{display:grid;gap:14px;align-items:stretch}
@media(min-width:800px){.c3 .ba{grid-template-columns:1fr 54px 1fr}}
.c3 .arrow{display:none;align-items:center;justify-content:center;font-size:2rem;font-weight:800}
@media(min-width:800px){.c3 .arrow{display:flex}}
.msg{border-radius:6px;padding:14px 16px;border:2px solid var(--ink);background:#fff}
.msg.before{background:var(--yellow-20)}
.msg.after{background:var(--green-20)}
.msg h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.msg .big{font-size:1.4rem;font-weight:700;margin:0}
.c3 .thumb{width:88px;float:right;margin:0 0 6px 10px}

/* 4 thread */
.thread{max-width:820px}
.bub{max-width:min(100%,620px);padding:12px 16px;border-radius:14px;margin:0 0 14px}
.bub.hana{background:var(--blue-20);border:2px solid var(--blue);border-bottom-left-radius:2px}
.bub.you{background:var(--yellow-20);border:2px solid var(--yellow);margin-left:auto;border-bottom-right-radius:2px;width:100%}
.bub .who{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.bub.hana .say{font-size:1.2rem;font-weight:700;margin:0}
.scene4{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.scene4 img{width:110px;border-radius:6px;background:var(--blue-20);flex:none}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:8px}
.words div{background:var(--green-20);border-radius:6px;padding:6px;text-align:center;font-size:.88rem;font-weight:600}
.words img{width:100%;height:76px;object-fit:contain;display:block}
.focus{border:2px solid var(--ink);border-radius:6px;padding:12px 14px;margin:0 0 16px;background:#fff}

/* 5 compare */
.cmp{display:grid;gap:0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:20px}
@media(min-width:760px){.cmp{grid-template-columns:1fr 1fr}.cmp>div+div{border-left:2px solid var(--ink)}}
.cmp>div{padding:16px 18px}
.cmp>div+div{background:var(--green-20);border-top:2px solid var(--ink)}
@media(min-width:760px){.cmp>div+div{border-top:0}}
.cmp p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.08rem}
.cmp .t{font-weight:800;margin:0 0 6px}

/* 6 finish */
.c6{max-width:760px;margin:0 auto;text-align:center}
.c6 img{width:200px;max-width:60%;border-radius:6px;background:var(--yellow-20)}
.c6 .banner{background:var(--green);border-radius:6px;padding:18px 20px;margin:16px 0}
.c6 .banner h2{margin:0}
.c6 .goal{text-align:left;margin:18px 0}
.c6 .row{justify-content:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.opt:has(input:checked){outline:3px solid Highlight}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the activity</a>
<header class="top">
  <p class="brand">Pazapa English Programme for Adults<small>A2 &bull; Week 7 &bull; Lesson 1 &bull; Metro, taxi and ride apps: review</small></p>
  <nav aria-label="Review steps"><ol class="steps" id="steps"></ol></nav>
</header>
<main id="app"></main>
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<template id="tpl">

<!-- 1 RECALL A PHRASE -->
<section class="screen" id="s1" aria-labelledby="h1">
  <div class="c1">
    <div class="rail"><img data-img="metro" alt="A woman in a blue hijab sits by a metro window."><p>Think about real situations. Use your memory first.</p></div>
    <div>
      <h2 id="h1" tabindex="-1">Recall a phrase</h2>
      <p class="lead">What would you say? Write your own words. Try at least one. Try all three if you can.</p>
      <div id="cues"></div>
      <details id="sayBox">
        <summary>Say one phrase aloud (optional)</summary>
        <p class="small" id="sayLock">This opens after you try the third situation.</p>
        <div id="sayBody" hidden>
          <p>Say this phrase: <strong>I'm going to take the metro to work.</strong></p>
          <p class="small" id="audioNote"></p>
          <div id="rec"></div>
          <label class="chk"><input type="checkbox" id="saidAloud"><span>I said it aloud and compared it with the model.</span></label>
        </div>
      </details>
      <div class="foot row"><button class="btn" id="n1" type="button" disabled>Check the detail</button></div>
      <p class="status" id="note1">Try at least one situation to continue.</p>
    </div>
  </div>
</section>

<!-- 2 CHECK THE DETAIL -->
<section class="screen c2" id="s2" aria-labelledby="h2a">
  <h2 id="h2a" tabindex="-1">Check the detail</h2>
  <p>Answer from memory. Then check the text.</p>
  <p class="q" id="rq">Where will they meet?</p>
  <div class="ans">
    <div><label class="lbl" for="readIn">Your answer</label><input type="text" id="readIn" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80"></div>
    <div class="row" style="margin:0"><button class="btn" id="readCheck" type="button" disabled>Check in the text</button></div>
  </div>
  <div class="row"><button class="btn help small" id="readHint" type="button">Need a hint?</button><button class="btn two small" id="readSkip" type="button">I am not sure. Show the text.</button></div>
  <div class="hint" id="readHints" aria-live="polite"></div>
  <div id="readBox" hidden>
    <div class="paper">
      <img class="scene" data-img="route" alt="A woman holds a phone with a route map near a metro line and a taxi.">
      <p class="tag">Sara and Hana: the plan</p>
      <p id="readText"></p>
    </div>
    <p class="fb" id="readFb" aria-live="polite"></p>
    <fieldset>
      <legend>Which is true for you? (optional)</legend>
      <div class="opts" style="max-width:520px">
        <label class="opt"><input type="radio" name="how" value="remembered"><span>I remembered it.</span></label>
        <label class="opt"><input type="radio" name="how" value="found"><span>I found it again in the text.</span></label>
      </div>
    </fieldset>
    <p class="small">All maps, fares, times and bookings are fictional examples for English practice.</p>
  </div>
  <div class="foot row"><button class="btn two" id="b2" type="button">Back</button><button class="btn" id="n2" type="button" disabled>Repair one point</button></div>
  <p class="status" id="note2">Answer the question, then check the text.</p>
</section>

<!-- 3 REPAIR ONE POINT -->
<section class="screen c3" id="s3" aria-labelledby="h3a">
  <h2 id="h3a" tabindex="-1">Repair one point</h2>
  <p>One small word is missing in this message. Can you repair it?</p>
  <div class="ba">
    <div class="msg before"><img class="thumb" data-img="metrocard" alt="A hand holding a blue metro card."><h3>Before</h3><p class="big">I'm going take the metro.</p></div>
    <div class="arrow" aria-hidden="true">&rarr;</div>
    <div class="msg after">
      <h3><label for="rep1">After: write the repair</label></h3>
      <textarea id="rep1" maxlength="120" autocomplete="off" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="row"><button class="btn" id="repCheck" type="button" disabled>Check my repair</button><button class="btn help small" id="repHint" type="button">Need a hint?</button><button class="btn two small" id="repShow" type="button" disabled>Show the model</button></div>
  <div class="hint" id="repHints" aria-live="polite"></div>
  <div id="repModel" class="model" hidden>
    <p><strong>Model:</strong> I'm going <mark>to</mark> take the metro.</p>
    <p class="small">For a plan, use <strong>going to</strong> + the action.</p>
    <p class="fb" id="repFb" aria-live="polite" style="margin-top:0"></p>
    <button class="btn two small" id="repHide" type="button">Hide the model and write it again</button>
  </div>
  <div id="repAgain" hidden style="margin-top:18px">
    <label class="lbl" for="rep2">Write the corrected sentence again, without looking</label>
    <textarea id="rep2" maxlength="120" autocomplete="off" spellcheck="false" style="min-height:70px"></textarea>
    <p class="fb" id="repFb2" aria-live="polite"></p>
    <button class="btn two small" id="repPeek" type="button">Show the model again</button>
  </div>
  <div class="foot row"><button class="btn two" id="b3" type="button">Back</button><button class="btn" id="n3" type="button" disabled>Try a new detail</button></div>
  <p class="status" id="note3">Repair the message to continue.</p>
</section>

<!-- 4 TRY A NEW DETAIL -->
<section class="screen" id="s4" aria-labelledby="h4a">
  <h2 id="h4a" tabindex="-1">Try a new detail</h2>
  <div class="thread">
    <div class="scene4"><img data-img="taxitalk" alt="Two women talk in a taxi."><p style="margin:0">Hana asks about your plan. Reply in your own words.</p></div>
    <div class="bub hana"><p class="who">Hana</p><p class="say">How are you going to get there?</p></div>
    <div class="bub you">
      <p class="who"><label for="t1">Your first reply</label></p>
      <textarea id="t1" maxlength="300" autocomplete="off" spellcheck="false"></textarea>
      <div class="row"><button class="btn" id="t1save" type="button" disabled>Save my first reply</button><button class="btn help small" id="t1hint" type="button">Need a hint?</button></div>
      <div class="hint" id="t1hints" aria-live="polite"></div>
    </div>

    <div id="after1" hidden>
      <div class="model"><p><strong>A possible reply to compare:</strong> I'm going to take the metro and meet you at Central Station.</p><p class="small">Your own words are fine if they answer the question.</p></div>
      <details>
        <summary>Need words? Open the picture words</summary>
        <div class="words" id="words"></div>
      </details>
      <fieldset class="focus" style="margin-top:14px">
        <legend>Choose one part to improve</legend>
        <div class="opts" id="focusOpts"></div>
      </fieldset>
      <div class="bub hana"><p class="who">New fictional case</p><p class="say">Now it is the Airport at 11:00. You prefer a ride app. Hana asks again: How are you going to get there?</p></div>
      <div class="bub you">
        <p class="who"><label for="t2">Your improved reply</label></p>
        <textarea id="t2" maxlength="300" autocomplete="off" spellcheck="false"></textarea>
        <div class="row"><button class="btn two small" id="t2copy" type="button">Start from my first reply</button><button class="btn two small" id="t2ex" type="button" disabled>Show an example</button></div>
        <div id="t2model" class="model" hidden><p><strong>An example:</strong> I'm going to use a ride app. The pick-up point is at gate 3.</p></div>
      </div>
    </div>
  </div>
  <div class="foot row"><button class="btn two" id="b4" type="button">Back</button><button class="btn" id="n4" type="button" disabled>Compare my replies</button></div>
  <p class="status" id="note4">Write a first reply to continue.</p>
</section>

<!-- 5 COMPARE -->
<section class="screen" id="s5" aria-labelledby="h5a">
  <h2 id="h5a" tabindex="-1">Compare my replies</h2>
  <div class="cmp">
    <div><p class="t">First reply</p><p id="cmp1"></p></div>
    <div><p class="t">Improved reply</p><p id="cmp2"></p></div>
  </div>
  <fieldset>
    <legend>What is clearer now? Choose all that apply. This is your own self-check.</legend>
    <div class="opts" id="reflOpts" style="max-width:640px"></div>
  </fieldset>
  <div class="foot row"><button class="btn two" id="b5" type="button">Back</button><button class="btn" id="n5" type="button" disabled>Finish review</button></div>
  <p class="status" id="note5">Choose at least one thing that is clearer.</p>
</section>

<!-- 6 FINISH -->
<section class="screen" id="s6" aria-labelledby="h6a">
  <div class="c6">
    <img data-img="pickup" alt="A woman waits at a pick-up point with a yellow taxi.">
    <div class="banner"><h2 id="h6a" tabindex="-1">You recalled, improved and tried your English again.</h2></div>
    <fieldset class="goal">
      <legend>What will you practise next? (optional)</legend>
      <div class="opts" id="goalOpts"></div>
    </fieldset>
    <div class="row">
      <button class="btn" id="doneBtn" type="button">Done</button>
      <button class="btn two" id="againBtn" type="button">Try again</button>
    </div>
    <p class="status" id="doneNote" aria-live="polite"></p>
    <p class="row" style="margin-top:6px"><button class="btn two small" id="b6" type="button">Back</button></p>
  </div>
</section>

</template>

<script>
(function(){
'use strict';

/* ===== CONFIG ===== */

function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}

/* ===== gating ===== */
function recallOk(){return CUES.some(function(c){return words(state.r[c.id])>=2;});}
function transferOk(){return !!(state.t1lock&&state.focus&&words(state.t2)>=3&&normEnd(state.t2)!==normEnd(state.t1));}
function maxScreen(){
  if(!recallOk())return 1;
  if(!state.readRev)return 2;
  if(!(state.repRev&&words(state.rep2)>=3))return 3;
  if(!transferOk())return 4;
  if(state.refl.length<1)return 5;
  return 6;
}
function refresh(){
  var m=maxScreen();
  $('#n1').disabled=m<2;$('#note1').textContent=m>=2?'You can continue.':'Try at least one situation to continue.';
  $('#n2').disabled=m<3;$('#note2').textContent=m>=3?'You can continue.':'Answer the question, then check the text.';
  $('#n3').disabled=m<4;$('#note3').textContent=m>=4?'You can continue.':(state.repRev?'Write the corrected sentence again to continue.':'Repair the message to continue.');
  $('#n4').disabled=m<5;
  var n4=!state.t1lock?'Write a first reply to continue.':(!state.focus?'Choose one part to improve.':'Write your improved reply to continue.');
  $('#note4').textContent=m>=5?'You can compare your replies.':n4;
  $('#n5').disabled=m<6;$('#note5').textContent=m>=6?'You can finish your review.':'Choose at least one thing that is clearer.';
  $$('#steps button').forEach(function(b,i){var n=i+1;b.disabled=n>m;b.classList.toggle('done',n<state.s&&n<=m);if(n===state.s)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
}
function show(n){
  n=Math.max(1,Math.min(n,maxScreen()));
  if(recorder)recorder.cancel();
  state.s=n;
  $$('.screen').forEach(function(s){s.classList.remove('on');});
  var sc=$('#s'+n);sc.classList.add('on');
  if(n===5)renderCompare();
  if(n===6)renderFinish();
  refresh();
  window.scrollTo(0,0);
  var h=$('h2',sc);if(h){try{h.focus({preventScroll:true});}catch(e){h.focus();}}
}

/* ===== build ===== */
function buildSteps(){
  var ol=$('#steps');ol.textContent='';
  STEPS.forEach(function(t,i){var li=el('li');var b=el('button',{type:'button'},(i+1)+'. '+t);b.addEventListener('click',function(){show(i+1);});li.appendChild(b);ol.appendChild(li);});
}
function buildCues(){
  var box=$('#cues');
  CUES.forEach(function(c,i){
    var s=el('section',{class:'cue','aria-labelledby':'cl_'+c.id});
    s.appendChild(el('div',{class:'num','aria-hidden':'true'},String(i+1)));
    var b=el('div');
    b.appendChild(el('h3',{id:'cl_'+c.id},c.title));
    b.appendChild(el('p',{class:'sit'},c.sit));
    b.appendChild(el('label',{class:'sr-only','for':'r_'+c.id},'Your words for situation '+(i+1)));
    var ta=el('textarea',{id:'r_'+c.id,maxlength:'200',autocomplete:'off',spellcheck:'false',style:'min-height:70px'});
    b.appendChild(ta);
    var row=el('div',{class:'row'});
    var hb=el('button',{class:'btn help small',type:'button'},'Need a hint?');
    var sm=el('button',{class:'btn two small',type:'button',disabled:'disabled'},'Show a model');
    row.appendChild(hb);row.appendChild(sm);b.appendChild(row);
    var hh=el('div',{class:'hint','aria-live':'polite'});b.appendChild(hh);
    var md=el('div',{class:'model',hidden:'hidden'});
    var p1=el('p');p1.appendChild(el('strong',null,'A model: '));p1.appendChild(document.createTextNode(c.model));
    md.appendChild(p1);
    md.appendChild(el('p',{class:'small'},'Different words are fine if they do the same job.'));
    b.appendChild(md);
    s.appendChild(b);box.appendChild(s);
    function upd(){sm.disabled=!(words(state.r[c.id])>=2||state.rh[c.id]>=2);}
    ta.addEventListener('input',function(){state.r[c.id]=ta.value;upd();unlockSay();refresh();});
    hb.addEventListener('click',function(){
      if(state.rh[c.id]<2)state.rh[c.id]++;
      showHints(hh,[c.h1,c.h2],state.rh[c.id]);
      if(state.rh[c.id]>=2){hb.disabled=true;hb.textContent='No more hints';}else hb.textContent='Another hint';
      upd();
    });
    sm.addEventListener('click',function(){state.rrev[c.id]=1;md.hidden=false;sm.disabled=true;unlockSay();say('Model shown.');});
  });
}
function unlockSay(){
  var open=words(state.r.c)>=2||state.rrev.c;
  $('#sayBody').hidden=!open;$('#sayLock').hidden=open;
}
function buildSay(){
  var an=$('#audioNote');
  if(AUDIO.model){
    an.textContent='';var a=el('audio',{controls:'controls',preload:'none'});a.src=AUDIO.model;an.appendChild(a);
  }else an.textContent='Model audio is not available in this version. Read the written model aloud.';
  recorder=makeRecorder($('#rec'));
  $('#saidAloud').addEventListener('change',function(){state.said=this.checked;});
}
function buildRead(){
  var p=$('#readText');p.appendChild(document.createTextNode(READ_PRE));p.appendChild(el('mark',null,READ_MARK));p.appendChild(document.createTextNode(READ_POST));
  var inp=$('#readIn');
  inp.addEventListener('input',function(){state.read=inp.value;$('#readCheck').disabled=!inp.value.trim();});
  $('#readHint').addEventListener('click',function(){
    if(state.readHint<2)state.readHint++;showHints($('#readHints'),READ_HINTS,state.readHint);
    if(state.readHint>=2){this.disabled=true;this.textContent='No more hints';}else this.textContent='Another hint';
  });
  function reveal(){
    state.readRev=1;$('#readBox').hidden=false;
    var v=normEnd(state.read);
    if(!v)setFb($('#readFb'),false,'Read the highlighted line. They will meet at Central Station.');
    else if(/central/.test(v))setFb($('#readFb'),true,'Yes. They will meet at Central Station.');
    else setFb($('#readFb'),false,'Look at the highlighted line. They will meet at Central Station.');
    $('#readCheck').disabled=true;$('#readSkip').disabled=true;
    refresh();say('The text is shown. The answer line is highlighted.');
  }
  $('#readCheck').addEventListener('click',reveal);
  $('#readSkip').addEventListener('click',reveal);
}
function buildRepair(){
  var ta=$('#rep1');
  ta.addEventListener('input',function(){state.rep1=ta.value;$('#repCheck').disabled=!ta.value.trim();});
  $('#repHint').addEventListener('click',function(){
    if(state.repHint<2)state.repHint++;showHints($('#repHints'),REP_HINTS,state.repHint);
    if(state.repHint>=2){this.disabled=true;this.textContent='No more hints';}else this.textContent='Another hint';
    $('#repShow').disabled=false;
  });
  function okRep(s){return /\b(i'm|i am) going to take the metro\b/.test(normEnd(s));}
  function reveal(){
    state.repRev=1;$('#repModel').hidden=false;
    var v=state.rep1.trim();
    if(!v)setFb($('#repFb'),false,'');
    else if(okRep(v))setFb($('#repFb'),true,'Yes. You repaired it.');
    else setFb($('#repFb'),false,'Compare your repair with the model. Look at the highlighted word.');
    $('#repCheck').disabled=true;$('#repShow').disabled=true;
    say('Model shown.');refresh();
  }
  $('#repCheck').addEventListener('click',reveal);
  $('#repShow').addEventListener('click',reveal);
  $('#repHide').addEventListener('click',function(){$('#repModel').hidden=true;$('#repAgain').hidden=false;$('#rep2').focus();});
  $('#repPeek').addEventListener('click',function(){var m=$('#repModel');m.hidden=!m.hidden;this.textContent=m.hidden?'Show the model again':'Hide the model';});
  var t2=$('#rep2');
  t2.addEventListener('input',function(){
    state.rep2=t2.value;
    var v=t2.value.trim();
    if(!v)setFb($('#repFb2'),false,'');
    else if(okRep(v))setFb($('#repFb2'),true,'Yes. "I\'m going to take the metro."');
    else if(words(v)>=3)setFb($('#repFb2'),false,'Not yet the same. Show the model again and compare.');
    else setFb($('#repFb2'),false,'');
    refresh();
  });
}
function buildTransfer(){
  var t1=$('#t1');
  t1.addEventListener('input',function(){state.t1=t1.value;$('#t1save').disabled=words(t1.value)<3;});
  $('#t1hint').addEventListener('click',function(){
    if(state.t1hint<2)state.t1hint++;showHints($('#t1hints'),T1_HINTS,state.t1hint);
    if(state.t1hint>=2){this.disabled=true;this.textContent='No more hints';}else this.textContent='Another hint';
  });
  $('#t1save').addEventListener('click',function(){
    state.t1lock=1;t1.readOnly=true;this.disabled=true;$('#t1hint').disabled=true;
    $('#after1').hidden=false;refresh();say('First reply saved. A possible reply is shown. Choose one part to improve.');
  });
  var w=$('#words');
  WORDS.forEach(function(x){var d=el('div');var i=el('img',{alt:ALT[x[0]]});i.src=IMG[x[0]];d.appendChild(i);d.appendChild(el('span',null,x[1]));w.appendChild(d);});
  var fo=$('#focusOpts');
  FOCUS.forEach(function(f){
    var lb=el('label',{class:'opt'});var inp=el('input',{type:'radio',name:'focus',value:f.id});
    inp.addEventListener('change',function(){state.focus=f.id;refresh();});
    var sp=el('span');sp.appendChild(el('strong',null,f.t));sp.appendChild(document.createElement('br'));sp.appendChild(document.createTextNode(f.ex));
    lb.appendChild(inp);lb.appendChild(sp);fo.appendChild(lb);
  });
  var t2=$('#t2');
  t2.addEventListener('input',function(){state.t2=t2.value;$('#t2ex').disabled=words(t2.value)<3;refresh();});
  $('#t2copy').addEventListener('click',function(){
    if(t2.value.trim()){say('Your reply already has text. Change it or add to it.');t2.focus();return;}
    t2.value=state.t1;state.t2=t2.value;$('#t2ex').disabled=words(t2.value)<3;t2.focus();say('Your first reply is copied. Change or add something.');refresh();
  });
  $('#t2ex').addEventListener('click',function(){state.t2ex=1;$('#t2model').hidden=false;this.disabled=true;});
}
function renderCompare(){
  $('#cmp1').textContent=state.t1;$('#cmp2').textContent=state.t2;
  var box=$('#reflOpts');
  if(box.childNodes.length)return;
  REFL.forEach(function(r){
    var lb=el('label',{class:'opt'});var inp=el('input',{type:'checkbox',value:r.id});
    inp.addEventListener('change',function(){state.refl=$$('input',box).filter(function(x){return x.checked;}).map(function(x){return x.value;});refresh();});
    lb.appendChild(inp);lb.appendChild(el('span',null,r.t));box.appendChild(lb);
  });
}
function renderFinish(){
  var box=$('#goalOpts');
  if(!box.childNodes.length){
    GOALS.forEach(function(g){
      var lb=el('label',{class:'opt'});var inp=el('input',{type:'radio',name:'goal',value:g.id});
      inp.addEventListener('change',function(){state.goal=g.id;});
      lb.appendChild(inp);lb.appendChild(el('span',null,g.t));box.appendChild(lb);
    });
  }
  $('#doneBtn').textContent=completionSent?'Done ✓':'Done';
}

/* ===== optional recording ===== */
function makeRecorder(root){
  var stream=null,mr=null,chunks=[],url=null,audio=null,mode='idle',ended=false;
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  root.textContent='';
  var st=el('p',{class:'status',role:'status','aria-live':'polite'});
  var bRec=el('button',{class:'btn small',type:'button'},'Record');
  var bStop=el('button',{class:'btn two small',type:'button'},'Stop');
  var bPlay=el('button',{class:'btn two small',type:'button'},'Hear my recording');
  var bAgain=el('button',{class:'btn two small',type:'button'},'Record again');
  var bDel=el('button',{class:'btn two small',type:'button'},'Delete');
  var rw=el('div',{class:'row'});[bRec,bStop,bPlay,bAgain,bDel].forEach(function(b){rw.appendChild(b);});
  root.appendChild(rw);root.appendChild(st);
  function ui(){bRec.disabled=!supported||mode==='recording'||mode==='ready';bStop.disabled=mode!=='recording';bPlay.disabled=mode!=='ready';bAgain.disabled=mode!=='ready';bDel.disabled=mode!=='ready';}
  function msg(t){st.textContent=t;}
  function release(){if(stream){stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});stream=null;}}
  function drop(){if(url){try{URL.revokeObjectURL(url);}catch(e){}url=null;}if(audio){try{audio.pause();}catch(e){}audio=null;}}
  msg(supported?'Press Record when you are ready.':'Recording is not available in this browser. You can say the phrase aloud and tick the box.');ui();
  function fail(e){release();mode='idle';ui();var n=e&&e.name;
    if(n==='NotAllowedError'||n==='SecurityError')msg('The microphone is blocked. You can say the phrase aloud and tick the box instead.');
    else if(n==='NotFoundError'||n==='OverconstrainedError')msg('No microphone was found. You can say the phrase aloud instead.');
    else if(n==='NotReadableError')msg('The microphone is busy in another app. Close it and try again, or say the phrase aloud.');
    else msg('Recording did not work this time. You can try again or say the phrase aloud.');}
  bRec.addEventListener('click',function(){
    if(!supported||mode==='recording')return;drop();chunks=[];
    var p;try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){fail(e);return;}
    p.then(function(s){
      if(ended){s.getTracks().forEach(function(t){t.stop();});return;}
      stream=s;
      try{var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'],mt='';
        if(MediaRecorder.isTypeSupported)types.some(function(t){if(MediaRecorder.isTypeSupported(t)){mt=t;return true;}return false;});
        mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);}catch(e){fail(e);return;}
      mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data);};
      mr.onerror=function(ev){fail(ev&&ev.error);};
      mr.onstop=function(){release();if(ended){chunks=[];return;}
        var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||'audio/webm'});chunks=[];
        if(!blob.size){mode='idle';ui();msg('The recording was empty. Press Record and try again.');return;}
        url=URL.createObjectURL(blob);audio=new Audio(url);mode='ready';ui();msg('Recording stopped. You can hear it now.');};
      mr.start();mode='recording';ui();msg('Recording now. Press Stop when you finish.');
    }).catch(fail);
  });
  bStop.addEventListener('click',function(){if(mr&&mr.state==='recording'){try{mr.stop();}catch(e){fail(e);}}});
  bPlay.addEventListener('click',function(){if(!audio)return;audio.currentTime=0;var pr=audio.play();if(pr&&pr.catch)pr.catch(function(){msg('Your browser could not play the recording. Record again.');});audio.onended=function(){msg('Finished.');};});
  bAgain.addEventListener('click',function(){drop();mode='idle';ui();msg('Ready. Press Record when you are ready.');});
  bDel.addEventListener('click',function(){drop();mode='idle';ui();msg('Recording deleted.');});
  var api={cancel:function(){try{if(mr&&mr.state==='recording'){mr.onstop=null;mr.stop();}}catch(e){}release();chunks=[];drop();if(mode!=='idle'){mode='idle';ui();msg(supported?'Press Record when you are ready.':'Recording is not available in this browser.');}},
    destroy:function(){ended=true;api.cancel();}};
  return api;
}
window.addEventListener('pagehide',function(){if(recorder)recorder.destroy();lmsFinish();});

/* ===== completion bridge (SCORM 1.2 / 2004 if supplied) ===== */
var lms={api:null,ver:null,ready:false,ended:false,tries:0};
function findApi(name){
  var w=window,d=0;
  while(w&&d<12){try{if(w[name])return w[name];}catch(e){}try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}d++;}
  try{if(window.opener&&window.opener[name])return window.opener[name];}catch(e){}
  return null;
}
function lmsConnect(){
  if(lms.ready||lms.tries>6)return lms.ready;lms.tries++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{a=findApi('API');if(a){var o2=a.LMSInitialize('');if(o2===true||o2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}}
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{return String((lms.ver==='2004'?lms.api.GetValue(k):lms.api.LMSGetValue(k))||'');}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004')?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004')?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsStatus(){if(!lms.ready)return '';var v=lms.ver==='2004'?lmsGet('cmi.completion_status'):lmsGet('cmi.core.lesson_status');return (v==='completed'||v==='passed')?'completed':v;}
function lmsFinish(){if(!lms.ready||lms.ended)return;lms.ended=true;try{lmsCommit();if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}catch(e){}}

function complete(){
  if(completionSent){$('#doneBtn').textContent='Done ✓';$('#doneNote').textContent='';return;}
  if(completionInFlight)return;
  if(maxScreen()<6)return;
  completionInFlight=true;$('#doneBtn').disabled=true;
  var ok=true;
  if(lmsConnect()){
    if(lmsStatus()!=='completed'){
      if(lms.ver==='2004'){lmsSet('cmi.completion_status','completed');lmsSet('cmi.progress_measure','1');lmsSet('cmi.exit','');}
      else{lmsSet('cmi.core.lesson_status','completed');lmsSet('cmi.core.exit','');}
      ok=lmsCommit();
    }
  }
  completionInFlight=false;
  if(ok){
    completionSent=true;
    try{if(CONFIG.hostOrigin&&window.parent&&window.parent!==window)window.parent.postMessage({type:'pazapa-activity-completed',activity:CONFIG.activityId},CONFIG.hostOrigin);}catch(e){}
    try{console.log(CONFIG.logLabel);}catch(e){}
    $('#doneBtn').textContent='Done ✓';$('#doneNote').textContent='';say('Your review is finished.');
  }else{
    $('#doneBtn').disabled=false;$('#doneNote').textContent='Your progress could not be saved. Please press Done again.';say('Your progress could not be saved. Press Done again.');
  }
}

/* ===== start / restart ===== */
function init(){
  if(recorder){recorder.destroy();recorder=null;}
  state=fresh();
  var app=$('#app');app.textContent='';
  app.appendChild(document.getElementById('tpl').content.cloneNode(true));
  $$('img[data-img]').forEach(function(i){i.src=IMG[i.getAttribute('data-img')];});
  buildSteps();buildCues();buildSay();buildRead();buildRepair();buildTransfer();
  [['n1',2],['n2',3],['n3',4],['n4',5],['n5',6]].forEach(function(p){$('#'+p[0]).addEventListener('click',function(){show(p[1]);});});
  [['b2',1],['b3',2],['b4',3],['b5',4],['b6',5]].forEach(function(p){$('#'+p[0]).addEventListener('click',function(){show(p[1]);});});
  $('#doneBtn').addEventListener('click',complete);
  $('#againBtn').addEventListener('click',function(){init();show(1);say('The review is ready to start again.');});
  $$('input[name="how"]').forEach(function(r){r.addEventListener('change',function(){state.how=r.value;});});
  show(1);
}
if(lmsConnect()&&lmsStatus()==='completed')completionSent=true;
init();
})();
</script>
