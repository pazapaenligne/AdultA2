<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-20:#D7F1F7;
  --green-20:#F4F7DA;
  --yellow-20:#FEF3CD;
  --yellow-40:#FEE69B;
  --line:#6B6B6A;
  --heading-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --body-font:"Open Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--pazapa-grey-dark);font-family:var(--body-font);font-size:1.0625rem;line-height:1.55;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--pazapa-grey-dark);color:#fff;padding:12px 16px;z-index:10;border-radius:6px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px #fff}

.top{border-top:8px solid var(--pazapa-blue);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,48px);border-bottom:2px solid var(--pazapa-grey-light)}
.brand{margin:0;font-family:var(--heading-font);font-weight:800;font-size:1.05rem}
.brand small{display:block;font-family:var(--body-font);font-weight:400;font-size:.9rem}
.pixels{display:flex;gap:8px;align-items:center;margin:0;padding:0;list-style:none}
.pixels li{width:18px;height:18px;background:#fff;border:2px solid var(--line);border-radius:3px}
.pixels li.done{background:var(--pazapa-blue);border-color:var(--pazapa-grey-dark)}
.pixels li.now{width:24px;height:24px;background:var(--pazapa-yellow);border:3px solid var(--pazapa-grey-dark)}

main{max-width:1120px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 64px}
.screen{display:none}
.screen.on{display:block}
h1,h2,h3{font-family:var(--heading-font);font-weight:800;line-height:1.2;margin:0 0 12px}
h1,h2{font-size:clamp(1.6rem,4.2vw,2.3rem)}
h3{font-size:1.15rem}
h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:4px}
p{margin:0 0 12px}
.lead{font-size:1.15rem}
.small{font-size:.95rem}
img{display:block;max-width:100%;height:auto}

.task{border-left:8px solid var(--pazapa-blue);background:#fff;border-top:2px solid var(--pazapa-grey-light);border-right:2px solid var(--pazapa-grey-light);border-bottom:2px solid var(--pazapa-grey-light);padding:16px 18px;margin:0 0 20px;border-radius:0 6px 6px 0;min-width:0}
.task.green{border-left-color:var(--pazapa-green)}
.task.yellow{border-left-color:var(--pazapa-yellow)}
fieldset{margin:0;min-width:0}
fieldset.task{margin:0 0 20px}
legend{font-weight:700;padding:0 6px;font-size:1.05rem}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;accent-color:var(--pazapa-grey-dark);margin:0}
.opt:has(input:checked){background:var(--blue-20);border-color:var(--pazapa-grey-dark);border-width:3px;padding:9px 13px}
.opt.ok{background:var(--pazapa-green);border-color:var(--pazapa-grey-dark)}
.opt.try{background:var(--yellow-20);border-color:var(--pazapa-grey-dark)}
.opt.off{opacity:.6;cursor:not-allowed}
.inline{display:flex;flex-wrap:wrap;gap:10px}
.inline .opt{min-width:120px}
label.lbl{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:110px;resize:vertical}
textarea[readonly]{background:var(--pazapa-grey-light)}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:.98rem}
.fb:empty{display:none}
.fb.ok{background:var(--green-20);border:2px solid var(--pazapa-green)}
.fb.try{background:var(--yellow-20);border:2px solid var(--pazapa-yellow)}
.fb .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);margin-right:8px;vertical-align:-1px}
.fb .tick{font-weight:800;margin-right:6px}
.hint{background:var(--yellow-20);border:2px solid var(--pazapa-yellow);border-radius:6px;padding:8px 12px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0}
.callout{background:var(--yellow-20);border-left:8px solid var(--pazapa-yellow);padding:12px 16px;border-radius:0 6px 6px 0;margin:0 0 18px}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.speech{background:var(--blue-20);border-radius:6px;padding:12px 16px;margin:0 0 14px;font-size:1.1rem;font-weight:600}
.model{background:var(--green-20);border:2px solid var(--pazapa-green);padding:10px 14px;border-radius:6px;font-weight:600;margin:10px 0 0}
.model span.k{font-weight:400;display:block;font-size:.9rem}

.btn{min-height:52px;min-width:52px;padding:12px 22px;border-radius:6px;border:3px solid var(--pazapa-grey-dark);background:var(--pazapa-blue);color:var(--pazapa-grey-dark);font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{box-shadow:inset 0 0 0 3px var(--blue-20)}
.btn.two{background:#fff}
.btn.two:hover{background:var(--pazapa-grey-light);box-shadow:none}
.btn.help{background:var(--pazapa-yellow)}
.btn.help:hover{box-shadow:inset 0 0 0 3px var(--yellow-20)}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:#8C8C8B;color:#595958;cursor:not-allowed;box-shadow:none}
.btn.small{min-height:48px;padding:8px 16px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.status{margin:10px 0 0;font-size:.95rem}
.nice{margin:0 0 12px;padding-left:1.2em}
.nice li{margin-bottom:6px}
details{margin:12px 0}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;padding:4px 0}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-grey-dark)}

/* screen 1: wide scene banner */
.banner{background:var(--blue-20);border-radius:6px;padding:16px;display:flex;justify-content:center;margin:0 0 18px}
.banner img{max-height:300px;width:auto;object-fit:contain}
.week3{display:grid;gap:10px;margin:0 0 20px;padding:0;list-style:none}
@media (min-width:700px){.week3{grid-template-columns:repeat(3,1fr)}}
.week3 li{background:var(--green-20);border-radius:6px;padding:10px 14px;font-size:.98rem}
.week3 strong{display:block}

/* screen 2: recall stations */
.stations{display:grid;gap:16px}
@media (min-width:900px){.stations{grid-template-columns:1fr 1fr}}
.station{border:2px solid var(--pazapa-grey-dark);border-radius:6px;background:#fff;display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;min-width:0}
.station .pic{background:var(--blue-20);border-radius:6px;padding:6px;align-self:start}
.station .pic img{width:100%;height:100px;object-fit:contain}
@media (max-width:520px){.station{grid-template-columns:1fr}.station .pic img{height:110px}}
.station .tag{display:inline-block;font-size:.85rem;background:var(--yellow-20);border:1px solid var(--pazapa-yellow);border-radius:4px;padding:1px 8px;margin-bottom:6px}
.station.done{background:var(--green-20)}

/* screen 3: document composition */
.doc{display:grid;gap:20px}
@media (min-width:880px){.doc{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.paper{border:2px solid var(--pazapa-grey-dark);border-radius:6px;background:#fff;padding:18px 20px;min-height:200px}
.paper.empty{border-style:dashed;background:var(--pazapa-grey-light);color:#595958;display:flex;align-items:center;justify-content:center;text-align:center}
.paper img{width:120px;height:110px;object-fit:contain;float:right;margin:0 0 8px 12px;background:var(--blue-20);border-radius:6px;padding:4px}
mark{background:var(--yellow-40);padding:1px 3px;border-bottom:3px solid var(--pazapa-grey-dark);color:inherit}
.paper .src{font-size:.85rem;font-weight:600;margin-bottom:8px}

/* screen 4: say and compare */
.sayrow{display:grid;gap:20px}
@media (min-width:880px){.sayrow{grid-template-columns:1.1fr .9fr;align-items:start}}
.big{font-family:var(--heading-font);font-weight:800;font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.3;margin:0 0 10px}
.big em{font-style:normal;background:var(--yellow-40);border-bottom:3px solid var(--pazapa-grey-dark);padding:0 3px}
.rec{background:var(--pazapa-grey-light);border-radius:6px;padding:12px 14px;margin-top:12px}
.rec p{margin:0 0 6px}
.avatarline{display:flex;gap:12px;align-items:center;margin:0 0 12px}
.avatarline img{width:72px;height:80px;object-fit:contain;background:var(--blue-20);border-radius:6px;flex:none}
.avatarline p{margin:0}

/* screen 5: before and after editor */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.steps>li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.steps .n{width:40px;height:40px;border-radius:6px;background:var(--pazapa-grey-dark);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.draft{background:var(--pazapa-grey-light);border-radius:6px;padding:12px 16px;font-size:1.2rem;font-weight:600;border:2px solid var(--line);text-decoration:underline wavy var(--pazapa-yellow);text-underline-offset:5px}
.locked{opacity:.55}

/* screen 5b: pairs */
.pairs{display:grid;gap:10px}
.slot{display:grid;gap:8px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff}
@media (min-width:700px){.slot{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.slot .sit{font-weight:600}
.slot button.put{min-height:48px;text-align:left;border:2px dashed var(--line);border-radius:6px;background:#fff;padding:8px 12px;cursor:pointer}
.slot.ok{background:var(--green-20);border-color:var(--pazapa-grey-dark)}
.slot.try{background:var(--yellow-20);border-color:var(--pazapa-grey-dark)}
.slot.ok button.put,.slot.try button.put{border-style:solid;border-color:var(--pazapa-grey-dark)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.chip{min-height:48px;padding:8px 16px;border:2px solid var(--pazapa-grey-dark);border-radius:6px;background:#fff;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pazapa-blue);border-width:3px}
.chip[disabled]{opacity:.45;cursor:not-allowed}

/* screen 6: two attempts */
.twin{display:grid;gap:16px;margin:0 0 20px}
@media (min-width:880px){.twin{grid-template-columns:1fr 1fr}}
.card{border:2px solid var(--pazapa-grey-dark);border-radius:6px;padding:14px 16px;background:#fff}
.card.two{background:var(--green-20)}
.card p{white-space:pre-wrap;overflow-wrap:anywhere}
.bank{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.bank li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--green-20);padding:8px 12px;border-radius:6px}
.bank li span{flex:1 1 200px;font-weight:600}
.newcase{border:2px dashed var(--pazapa-grey-dark);border-radius:6px;padding:12px 16px;background:var(--yellow-20);margin:0 0 14px}

.final{background:var(--pazapa-green);border-radius:6px;padding:18px 20px;margin:0 0 18px;display:grid;gap:14px;align-items:center}
@media (min-width:700px){.final{grid-template-columns:110px 1fr}}
.final img{width:100px;height:100px;object-fit:contain;background:#fff;border-radius:6px;padding:4px}
.final h2{margin:0 0 6px}.final p{margin:0;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.opt:has(input:checked){outline:3px solid Highlight}}
</style>
</head>

/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(tag,attrs,text){var e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(function(k){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});}if(text!==undefined&&text!==null)e.textContent=text;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function say(msg){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=msg;},30);}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normEnd(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function words(s){var m=norm(s).match(/[\p{L}']+/gu);return m?m.length:0;}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n):s;}
function img(key,alt,extra){var i=el('img',extra||{});i.src=IMAGES[key];i.alt=alt||'';return i;}
function setFb(node,ok,text){
  node.textContent='';node.className='fb';
  if(!text)return;
  node.className='fb '+(ok?'ok':'try');
  node.appendChild(el('span',ok?{class:'tick','aria-hidden':'true'}:{class:'dot','aria-hidden':'true'},ok?'✓':''));
  node.appendChild(document.createTextNode(text));
}
function button(label,cls,fn){var b=el('button',{type:'button',class:'btn '+(cls||'')},label);if(fn)b.addEventListener('click',fn);return b;}
function field(id,label,value,multi,onInput,maxlen){
  var w=el('div');
  w.appendChild(el('label',{class:'lbl','for':id},label));
  var f=multi?el('textarea',{id:id,maxlength:maxlen||300,autocomplete:'off',spellcheck:'false'}):el('input',{type:'text',id:id,maxlength:maxlen||200,autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
  f.value=value||'';
  f.addEventListener('input',function(){onInput(f.value);});
  w.appendChild(f);
  return w;
}

function freshState(){
  return {s:1,start:'',disc:'',
    r:RECALL.map(function(){return {t:'',hint:0,model:0};}),
    rd:{t:'',shown:0,hint:0,how:''},
    sy:{done:false,ref:''},
    rep:{t:'',hint:0,checked:0,t2:'',ok:0},
    pairs:{'1':'','2':'','3':''},
    ret:{first:'',stage:0,foci:[],second:'',override:false},
    fin:{refl:[],next:'',w1:'',w2:'',w3:''}};
}

var discOrder=shuffle(DISC);
var chipOrder=shuffle(['A','B','C']);
var nextOrder=shuffle(NEXT);

/* ===== completion gates ===== */
function secondTyped(){var t=state.ret.second;return words(t)>=3&&normEnd(t)!==normEnd(state.ret.first);}
function secondApplied(){
  if(!secondTyped())return false;
  var n=norm(state.ret.second);
  return state.ret.foci.some(function(k){var f=FOCI.filter(function(x){return x.id===k;})[0];return f&&f.rx.test(n);});
}
function secondValid(){return state.ret.stage>=2&&secondTyped()&&(secondApplied()||state.ret.override);}
function recallDone(i){var r=state.r[i];return words(r.t)>=1||r.model;}
function gate(n){
  if(n===2)return state.disc==='bank';
  if(n===3)return RECALL.every(function(x,i){return recallDone(i);});
  if(n===4)return state.rd.shown&&!!state.rd.how;
  if(n===5)return state.sy.done;
  if(n===6)return state.rep.ok===1&&pairsAllOk();
  if(n===7)return secondValid();
  if(n===8)return state.fin.refl.length>=1&&!!state.fin.next;
  return true;
}
function pairsAllOk(){return PAIRS.every(function(p){return state.pairs[p.id]===p.ans;});}
function maxScreen(){
  var m=1;
  for(var n=2;n<=8;n++){if(!gate(n))return m;m=n;}
  return m;
}

/* ===== shell ===== */
var TOTAL=8;
var main=$('#main');
function drawPixels(n){
  var ol=$('#pixels');ol.textContent='';
  ol.setAttribute('aria-label','Review progress: part '+n+' of '+TOTAL);
  for(var i=1;i<=TOTAL;i++){var li=el('li');if(i<n)li.className='done';else if(i===n){li.className='now';li.setAttribute('aria-current','step');}ol.appendChild(li);}
}
function show(n){
  if(recorder){recorder.cancel();}
  n=Math.min(n,maxScreen());
  state.s=n;
  main.textContent='';
  var sc=el('section',{class:'screen on','aria-labelledby':'ttl'});
  main.appendChild(sc);
  drawPixels(n);
  [null,s1,s2,s3,s4,s5,s6,s7,s8][n](sc);
  window.scrollTo(0,0);
  var h=$('h1,h2',sc);
  if(h){h.id='ttl';h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){h.focus();}}
}
function rerender(){var y=window.scrollY;var focusId=document.activeElement&&document.activeElement.id;show(state.s);window.scrollTo(0,y);if(focusId){var f=document.getElementById(focusId);if(f)f.focus({preventScroll:true});}}
function nav(sc,n,label,extra){
  var row=el('div',{class:'row'});
  var next=button(label||'Carry on','',function(){if(!next.disabled)show(n+1);});
  next.id='nextBtn';
  var again=button('Try again','two',function(){resetScreen(n);});
  row.appendChild(next);row.appendChild(again);
  if(extra)extra.forEach(function(x){row.appendChild(x);});
  sc.appendChild(row);
  var note=el('p',{class:'status',id:'navNote'});
  sc.appendChild(note);
  updateNav(n);
}
function updateNav(n){
  var b=$('#nextBtn');if(!b)return;
  var ok=gate(n+1);
  b.disabled=!ok;
  var note=$('#navNote');

/* ===== recording (optional, in memory only) ===== */
function makeRecorder(root){
  var stream=null,mr=null,chunks=[],url=null,audio=null,mode='idle',ended=false;
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  root.textContent='';
  var st=el('p',{class:'status',role:'status','aria-live':'polite'});
  var bRec=el('button',{class:'btn small',type:'button'},'Record');
  var bStop=el('button',{class:'btn two small',type:'button'},'Stop');
  var bPlay=el('button',{class:'btn two small',type:'button'},'Hear my recording');
  var bAgain=el('button',{class:'btn two small',type:'button'},'Record again');
  var bDel=el('button',{class:'btn two small',type:'button'},'Delete');
  var rowd=el('div',{class:'row',style:'margin-top:4px'});
  [bRec,bStop,bPlay,bAgain,bDel].forEach(function(b){rowd.appendChild(b);});
  var box=el('div',{class:'rec'});box.appendChild(rowd);box.appendChild(st);root.appendChild(box);
  function ui(){
    bRec.disabled=!supported||mode==='recording'||mode==='ready';
    bStop.disabled=mode!=='recording';
    bPlay.disabled=mode!=='ready';
    bAgain.disabled=mode!=='ready';
    bDel.disabled=mode!=='ready';
  }
  function releaseStream(){if(stream){stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});stream=null;}}
  function dropUrl(){if(url){try{URL.revokeObjectURL(url);}catch(e){}url=null;}if(audio){try{audio.pause();}catch(e){}audio=null;}}
  function msg(t){st.textContent=t;}
  msg(supported?'Press Record when you are ready.':'Recording is not available in this browser. Say the phrase aloud and tick the box.');
  ui();
  function fail(e){
    releaseStream();mode='idle';ui();
    var n=e&&e.name;
    if(n==='NotAllowedError'||n==='SecurityError'||n==='PermissionDeniedError')msg('The microphone is blocked. You can allow it in your browser, or say the phrase aloud without recording.');
    else if(n==='NotFoundError'||n==='DevicesNotFoundError'||n==='OverconstrainedError')msg('No microphone was found. Say the phrase aloud without recording.');
    else if(n==='NotReadableError')msg('The microphone is being used by another app. Close it and try again.');
    else msg('Recording did not work this time. You can try again or say the phrase aloud.');
  }
  bRec.addEventListener('click',function(){
    if(!supported||mode==='recording')return;
    dropUrl();chunks=[];
    var p;
    try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){fail(e);return;}
    p.then(function(s){
      if(ended){s.getTracks().forEach(function(t){t.stop();});return;}
      stream=s;
      try{
        var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'],mt='';
        if(MediaRecorder.isTypeSupported){types.some(function(t){if(MediaRecorder.isTypeSupported(t)){mt=t;return true;}return false;});}
        mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
      }catch(e){fail(e);return;}
      mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data);};
      mr.onerror=function(ev){fail(ev&&ev.error);};
      mr.onstop=function(){
        releaseStream();
        if(ended){chunks=[];return;}
        var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||'audio/webm'});chunks=[];
        if(!blob.size){mode='idle';ui();msg('The recording was empty. Press Record and speak again.');return;}
        url=URL.createObjectURL(blob);audio=new Audio(url);
        mode='ready';ui();msg('Recording stopped. You can hear it now.');say('Recording stopped.');
      };
      mr.start();mode='recording';ui();msg('Recording now. Press Stop when you finish.');say('Recording started.');
    }).catch(fail);
  });
  bStop.addEventListener('click',function(){if(mr&&mr.state==='recording'){try{mr.stop();}catch(e){fail(e);}}});
  bPlay.addEventListener('click',function(){
    if(!audio)return;
    audio.currentTime=0;
    var pr=audio.play();
    if(pr&&pr.catch)pr.catch(function(){msg('Your browser could not play the recording. You can record again.');});
    msg('Playing your recording.');
    audio.onended=function(){msg('Finished. You can record again if you want.');};
  });
  bAgain.addEventListener('click',function(){dropUrl();mode='idle';ui();msg('Ready. Press Record when you are ready.');});
  bDel.addEventListener('click',function(){dropUrl();mode='idle';ui();msg('Recording deleted.');say('Recording deleted.');});
  var api={
    cancel:function(){
      try{if(mr&&mr.state==='recording'){mr.onstop=null;mr.stop();}}catch(e){}
      releaseStream();chunks=[];dropUrl();mode='idle';
    },
    destroy:function(){ended=true;api.cancel();}
  };
  return api;
}

  b3.appendChild(pairs);
  if(pairsAllOk()){setFb(fbp,true,'All three match. Each phrase repairs a small problem in a conversation.');}
  else if(PAIRS.some(function(p){return state.pairs[p.id]&&state.pairs[p.id]!==p.ans;})){setFb(fbp,false,'One match is not right yet. Tap a yellow situation to clear it, then try another phrase.');}
  b3.appendChild(fbp);
  li3.appendChild(b3);steps.appendChild(li3);
  sc.appendChild(steps);
  nav(sc,5);
}

/* ===== screen 6: first try, improve, retry ===== */
function s6(sc){
  var ret=state.ret;
  sc.appendChild(el('h2',null,'Try, improve and retry'));
  var cue=el('p',{class:'speech'},'Your teacher asks: “What would you like to improve next?”');
  sc.appendChild(cue);

  var twin=el('div',{class:'twin'});
  var c1=el('div',{class:'card'});
  c1.appendChild(el('h3',null,'First try'));
  if(ret.stage===0){
    c1.appendChild(field('first','Write 1 to 3 sentences',ret.first,true,function(v){ret.first=clip(v,300);var b=$('#firstBtn');if(b)b.disabled=!(words(ret.first)>=3);},300));
    var rb=button('Review my first try','',function(){ret.stage=1;rerender();say('Choose one or two things to improve.');});
    rb.id='firstBtn';rb.disabled=!(words(ret.first)>=3);
    var rr=el('div',{class:'row'});rr.appendChild(rb);c1.appendChild(rr);
  }else{
    c1.appendChild(el('p',null,ret.first));
  }
  twin.appendChild(c1);
  var c2=el('div',{class:'card two'});
  c2.appendChild(el('h3',null,'Second try'));
  if(ret.stage<2)c2.appendChild(el('p',{class:'small'},ret.stage===0?'Your second try opens after you choose what to improve.':'Choose what to improve below.'));
  twin.appendChild(c2);
  sc.appendChild(twin);

  if(ret.stage>=1){
    var po=el('div',{class:'callout'});
    po.appendChild(el('p',null,'Possible answer to compare: I want to practise account numbers and longer answers.'));
    sc.appendChild(po);
    var fs=el('fieldset',{class:'task yellow'});
    fs.appendChild(el('legend',null,'Choose one or two things to improve'));
    var fo=el('div',{class:'opts'});
    FOCI.forEach(function(f){
      var lb=el('label',{class:'opt'});
      var inp=el('input',{type:'checkbox',name:'focus',value:f.id});
      if(ret.foci.indexOf(f.id)>=0)inp.checked=true;
      if(ret.foci.length>=2&&ret.foci.indexOf(f.id)<0){inp.disabled=true;lb.classList.add('off');}
      inp.addEventListener('change',function(){
        ret.foci=$$('input[name="focus"]:checked',fs).map(function(x){return x.value;});
        if(ret.foci.length===0){ret.stage=1;}
        else if(ret.stage<2){ret.stage=2;}
        rerender();
      });
      var sp=el('span');sp.appendChild(el('strong',null,f.label));sp.appendChild(document.createElement('br'));sp.appendChild(document.createTextNode(f.help));
      lb.appendChild(inp);lb.appendChild(sp);fo.appendChild(lb);
    });
    fs.appendChild(fo);sc.appendChild(fs);
  }

  if(ret.stage>=2){
    var nc=el('div',{class:'newcase'});
    nc.appendChild(el('strong',null,'A new fictional case'));
    nc.appendChild(el('p',{style:'margin:4px 0 0'},'It is a new month. Your teacher asks: “What would you like to improve next month?” You want to practise dates and phone numbers. Write your second try.'));
    sc.appendChild(nc);
    var t2=el('div',{class:'task green'});
    t2.appendChild(field('second','Your second try',ret.second,true,function(v){
      ret.second=clip(v,300);updateSecondFb(true);updateNav(6);
    },300));
    var bank=el('ul',{class:'bank'});
    var seen={};
    ret.foci.forEach(function(k){
      var f=FOCI.filter(function(x){return x.id===k;})[0];
      f.bank.forEach(function(ph){
        if(seen[ph])return;seen[ph]=1;
        var li=el('li');li.appendChild(el('span',null,ph));
        var bt=el('button',{type:'button',class:'btn two small','aria-label':'Add: '+ph},'Add');
        bt.addEventListener('click',function(){
          var ta=$('#second');var cur=ta.value.replace(/\s+$/,'');
          ta.value=clip((cur?cur+' ':'')+ph,300);ret.second=ta.value;updateSecondFb(false);updateNav(6);ta.focus();
        });
        li.appendChild(bt);bank.appendChild(li);
      });
    });
    t2.appendChild(el('p',{class:'small',style:'margin-top:12px'},'Phrase bank. Press Add to put a phrase at the end of your second try.'));
    t2.appendChild(bank);
    var sec=el('div',{class:'row'});
    var cp=button('Start from my first try','two small',function(){
      var ta=$('#second');
      if(ta.value.trim()){say('Your second try already has text.');ta.focus();return;}
      ta.value=ret.first;ret.second=ta.value;updateSecondFb(false);updateNav(6);ta.focus();
    });
    sec.appendChild(cp);t2.appendChild(sec);
    var lb=el('label',{class:'chk'});
    var ov=el('input',{type:'checkbox',id:'override'});ov.checked=!!ret.override;
    ov.addEventListener('change',function(){ret.override=ov.checked;updateSecondFb(false);updateNav(6);});
    lb.appendChild(ov);lb.appendChild(el('span',null,'I improved it in my own words.'));
    t2.appendChild(lb);
    t2.appendChild(el('p',{class:'fb',id:'secFb','aria-live':'polite'}));
    sc.appendChild(t2);
    updateSecondFb(false);
  }
  nav(sc,6);
}
function updateSecondFb(){
  var fb=$('#secFb');if(!fb)return;
  var ret=state.ret,t=ret.second;
  if(!t.trim()){setFb(fb,false,'');return;}
  if(normEnd(t)===normEnd(ret.first)){setFb(fb,false,'Your second try is the same as your first try. Change or add one thing.');return;}
  if(words(t)<3){setFb(fb,false,'Add a little more. Try a full sentence.');return;}
  if(secondApplied()){setFb(fb,true,'You made your improvement clear. You can carry on.');return;}
  if(ret.override){setFb(fb,true,'Thank you. You can carry on.');return;}
  var f=FOCI.filter(function(x){return x.id===ret.foci[0];})[0];
  setFb(fb,false,'Try again with this phrase: '+f.bank[0]+' Or tick the box if you used your own words.');
}

/* ===== screen 7: compare ===== */
var W1=['I compared two apartments and explained my plan.','I moved here in March.'];
var W2=['I found the deposit due date.','I wrote a polite message.'];
var W3=['I asked for repetition.','I confirmed a bank appointment.'];
function s7(sc){
  var ret=state.ret,fin=state.fin;
  sc.appendChild(el('h2',null,'Compare my replies'));
  var twin=el('div',{class:'twin'});
  var a=el('div',{class:'card'});a.appendChild(el('h3',null,'First try'));a.appendChild(el('p',null,ret.first));twin.appendChild(a);
  var b=el('div',{class:'card two'});b.appendChild(el('h3',null,'Second try'));b.appendChild(el('p',null,ret.second));twin.appendChild(b);
  sc.appendChild(twin);
  var fs=el('fieldset',{class:'task'});
  fs.appendChild(el('legend',null,'What is clearer now? Choose all that apply.'));
  var box=el('div',{class:'opts'});
  REFL.forEach(function(r){
    var lb=el('label',{class:'opt'});
    var inp=el('input',{type:'checkbox',name:'refl',value:r.id});
    if(fin.refl.indexOf(r.id)>=0)inp.checked=true;
    inp.addEventListener('change',function(){fin.refl=$$('input[name="refl"]:checked',fs).map(function(x){return x.value;});updateNav(7);});
    lb.appendChild(inp);lb.appendChild(el('span',null,r.t));box.appendChild(lb);
  });
  fs.appendChild(box);sc.appendChild(fs);
  var sum=el('div',{class:'callout'});
  var n1=norm(ret.first),n2=norm(ret.second),added=[];
  FOCI.forEach(function(f){if(f.rx.test(n2)&&!f.rx.test(n1))added.push(f.label.replace(/[“”]/g,'“'));});
  sum.appendChild(el('p',null,added.length?'Word check: your second try now includes — '+added.join('; ')+'.':'Word check: you made a second try. Keep the version that feels clearest to you.'));
  sum.appendChild(el('p',{class:'small'},'This is a simple word check. It is not AI and it cannot see everything.'));
  sc.appendChild(sum);

  var fs2=el('fieldset',{class:'task yellow'});
  fs2.appendChild(el('legend',null,'What will you practise next? Choose one.'));
  var nb=el('div',{class:'opts'});
  nextOrder.forEach(function(o){
    var lb=el('label',{class:'opt'});
    var inp=el('input',{type:'radio',name:'next',value:o.id});
    if(fin.next===o.id)inp.checked=true;
    inp.addEventListener('change',function(){fin.next=o.id;updateNav(7);});
    lb.appendChild(inp);lb.appendChild(el('span',null,o.t));nb.appendChild(lb);
  });
  fs2.appendChild(nb);sc.appendChild(fs2);

  var det=el('details',{class:'task green'});
  det.appendChild(el('summary',null,'Build my week in one message (optional)'));
  [['w1','Lesson 1',W1],['w2','Lesson 2',W2],['w3','Lesson 3',W3]].forEach(function(x){
    var w=el('div',{style:'margin:0 0 10px'});
    w.appendChild(el('label',{class:'lbl','for':x[0]},x[1]));
    var s=el('select',{id:x[0]});
    s.appendChild(el('option',{value:''},'Choose a sentence'));
    x[2].forEach(function(o){var op=el('option',{value:o},o);if(fin[x[0]]===o)op.selected=true;s.appendChild(op);});
    s.addEventListener('change',function(){fin[x[0]]=s.value;renderWeek();});
    w.appendChild(s);det.appendChild(w);
  });
  det.appendChild(el('p',{class:'model',id:'weekOut'}));
  sc.appendChild(det);
  function renderWeek(){
    var o=$('#weekOut');var parts=[fin.w1,fin.w2,fin.w3].filter(Boolean);
    o.textContent=parts.length?parts.join(' ')+' Now I can check important details.':'';
    o.style.display=parts.length?'block':'none';
  }
  renderWeek();
  nav(sc,7,'Finish review');
}

/* ===== screen 8: finish ===== */
var completionInFlight=false,completionSent=false;
function s8(sc){
  var big=el('div',{class:'final'});
  big.appendChild(img('feedback','A woman reads a document.'));
  var t=el('div');t.appendChild(el('h2',null,'Review complete.'));
  t.appendChild(el('p',null,'You recalled, improved and tried your English again.'));
  big.appendChild(t);sc.appendChild(big);
  var nx=NEXT.filter(function(x){return x.id===state.fin.next;})[0];
  if(nx){
    var task=el('div',{class:'task green'});
    task.appendChild(el('h3',null,'My next action'));
    task.appendChild(el('p',null,nx.t));
    sc.appendChild(task);
  }
  var row=el('div',{class:'row'});
  var done=button(completionSent?'Done ✓':'Done','',function(){finish(done);});
  done.id='doneBtn';if(completionSent)done.disabled=true;
  var again=button('Try again','two',function(){
    completionSent=false;completionInFlight=false;
    state=freshState();discOrder=shuffle(DISC);chipOrder=shuffle(['A','B','C']);nextOrder=shuffle(NEXT);selChip='';
    show(1);say('The review is ready to start again.');
  });
  row.appendChild(done);row.appendChild(again);sc.appendChild(row);
}

/* ===== LMS (SCORM 1.2 and 2004), silent ===== */
var lms={api:null,ver:null,ready:false,ended:false,tries:0};
function findApi(name){
  var wins=[window];try{if(window.opener)wins.push(window.opener);}catch(e){}
  for(var k=0;k<wins.length;k++){
    var w=wins[k],d=0;
    while(w&&d<12){
      try{if(w[name])return w[name];}catch(e){}
      try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
      d++;
    }
  }
  return null;
}
function lmsConnect(){
  if(lms.ready||lms.tries>6)return lms.ready;
  lms.tries++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{
      a=findApi('API');
      if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}
    }
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{var v=(lms.ver==='2004')?lms.api.GetValue(k):lms.api.LMSGetValue(k);return String(v==null?'':v);}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004')?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004')?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsStatus(){
  if(!lms.ready)return '';
  if(lms.ver==='2004'){var c=lmsGet('cmi.completion_status'),s=lmsGet('cmi.success_status');return (c==='completed'||s==='passed')?'completed':c;}
  var v=lmsGet('cmi.core.lesson_status');return (v==='completed'||v==='passed')?'completed':v;
}
function lmsFinish(){
  if(!lms.ready||lms.ended)return;
  lms.ended=true;
  try{lmsCommit();if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}catch(e){}
}
window.addEventListener('pagehide',lmsFinish);
function finish(btn){
  if(completionSent||completionInFlight)return;
  if(maxScreen()<8&&!gate(8))return;
  completionInFlight=true;
  var confirmed=true;
  try{
    if(lmsConnect()){
      if(lmsStatus()!=='completed'){
        var ok1;
        if(lms.ver==='2004'){ok1=lmsSet('cmi.completion_status','completed');lmsSet('cmi.progress_measure','1');lmsSet('cmi.exit','');}
        else{ok1=lmsSet('cmi.core.lesson_status','completed');lmsSet('cmi.core.exit','');}
        var ok2=lmsCommit();
        confirmed=!!(ok1&&ok2);
      }
    }
  }catch(e){confirmed=false;}
  completionInFlight=false;
  if(!confirmed){return;}   // stays enabled so Done can be pressed again
  completionSent=true;
  try{if(CONFIG.moodleOrigin&&window.parent&&window.parent!==window){window.parent.postMessage({type:'pazapa-activity-completed',activity:CONFIG.activityId},CONFIG.moodleOrigin);}}catch(e){}
  try{console.log(CONFIG.logLabel);}catch(e){}
  btn.textContent='Done ✓';btn.disabled=true;
  say('Your review is finished.');
}

/* ===== start ===== */
show(1);

})();
