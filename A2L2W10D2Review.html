<!--
  Pazapa English Programme for Adults | A2
  Activity: A2-W10-L2-S7  |  Week 10, Lesson 2, "The interview and the offer"  |  Step 7: Review, Improve and Retry

  CONTENT KEYS (author answers)
    Recall A  "The deposit is due by..."            accepts: text containing "due by" or "deposit"
    Recall B  "I've worked as a nurse for five years."   accepts: "worked" + "for" or "since"
    Recall C  "Why do you want to work in the Gulf?"     accepts: "why" + ("gulf" or "work")
    Recall D  written repair route: "Could you repeat the monthly total, please?"  accepts: "repeat", "monthly total", "again" or "confirm"
    Say aloud E "I'm reliable and I learn fast. I'm available in one month."  (self-comparison only)
    Reading   Q: "When is the interview?"  key: "Wednesday at ten"  accepts: "wednesday" + ("ten" or "10")
    Repair    draft "I can to start on Monday." -> "I can start on Monday."  (also accepts "I can start Monday.")
    Transfer  cue "When can you start?"  possible answer: "I can start on Monday. Could you explain the working hours?"
              New fictional case: available from Monday 16 November (labelled as a new case, the letter is not changed).
  Simple word checks are labelled as such. They are not AI and are never shown as a grade.

  CONFIGURABLE ASSETS
    AUDIO.e = URL of a verified model recording for recall E. Empty = a clear "no audio" state is shown.
    IMAGES  = illustrations taken from the Week 10 Lesson 2 workbook PDF.

  COMPLETION
    Done is enabled on the last screen only after: a recall attempt, a checked repair, and a meaningful retry.
    A SCORM 1.2 / 2004 API is used if the page is launched inside one. Without it, completion is local.
    completionInFlight / completionSent guard repeated clicks; sent is set only after a confirmed commit.
-->
<style>
:root{
  --blue:#36BBD6;--blue-dark:#1B7E92;--green:#C9D646;--yellow:#FCC104;--red:#E6352B;
  --grey-l:#EBEBEB;--grey-d:#2E2E2D;--blue-20:#D7F1F7;--green-20:#F4F7DA;--yellow-20:#FEF3CD;--line:#6B6B6A;
  --hf:"Filson Soft","Open Sans",Arial,sans-serif;--bf:"Open Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--grey-d);font-family:var(--bf);font-size:1.0625rem;line-height:1.55;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--grey-d);color:#fff;padding:12px 16px;z-index:10;border-radius:6px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--grey-d);outline-offset:2px;box-shadow:0 0 0 6px #fff}
.top{border-top:8px solid var(--blue);padding:14px clamp(16px,4vw,48px) 10px;border-bottom:2px solid var(--grey-l)}
.brand{margin:0 0 8px;font-family:var(--hf);font-weight:800;font-size:1.05rem}
.brand small{display:block;font-family:var(--bf);font-weight:400;font-size:.9rem}
.steps{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none}
.steps li{font-size:.85rem;padding:4px 10px;border:2px solid var(--line);border-radius:999px;background:#fff}
.steps li.done{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.steps li.now{background:var(--yellow);border-color:var(--grey-d);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 64px}
.screen{display:none}
.screen.on{display:block}
h1,h2,h3{font-family:var(--hf);font-weight:800;line-height:1.2;margin:0 0 12px}
h1,h2{font-size:clamp(1.65rem,4.2vw,2.3rem)}
h3{font-size:1.2rem}
h1:focus,h2:focus{outline:none}
h1:focus-visible,h2:focus-visible{outline:3px solid var(--grey-d);outline-offset:4px}
p{margin:0 0 12px}
.lead{font-size:1.15rem}
.small{font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.status{margin:10px 0 0;font-size:.95rem}
img{max-width:100%;height:auto;display:block}
.pic{border-radius:6px;overflow:hidden;background:var(--green-20)}
.pic img{width:100%}
.cap{font-size:.9rem;padding:6px 10px;background:var(--green-20);margin:0}

/* composition 1: hero split */
.hero{display:grid;gap:24px}
@media(min-width:880px){.hero{grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}}
.chips{display:grid;gap:10px;margin:12px 0}

/* composition 2: rail + workspace */
.work{display:grid;gap:20px}
@media(min-width:880px){.work{grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}}
.rail{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
@media(min-width:880px){.rail{flex-direction:column;flex-wrap:nowrap}}
.rail button{width:100%;text-align:left;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.rail button[aria-current="true"]{background:var(--blue-20);border-color:var(--blue-dark);border-width:3px;padding:7px 11px;font-weight:700}
.rail .tag{display:block;font-size:.82rem;font-weight:400}
.rail li{flex:1 1 150px}
@media(min-width:880px){.rail li{flex:none}}

/* composition 3: document + question */
.doc{display:grid;gap:20px}
@media(min-width:880px){.doc{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:start}}
.paper{background:#fff;border:2px solid var(--grey-d);border-radius:6px;padding:18px 20px;box-shadow:6px 6px 0 var(--blue-20)}
.paper .hide{background:var(--grey-l);border-radius:4px;padding:18px;text-align:center;font-weight:600}
mark{background:var(--yellow);color:var(--grey-d);padding:1px 3px;border-radius:3px;font-weight:700;text-decoration:underline}

/* composition 4: before / after */
.ba{display:grid;gap:16px}
@media(min-width:760px){.ba{grid-template-columns:1fr 1fr}}
.card{border:2px solid var(--grey-d);border-radius:6px;padding:14px 16px;background:#fff;min-width:0}
.card.after{background:var(--green-20)}
.card p{white-space:pre-wrap;overflow-wrap:anywhere}

/* composition 5: chat */
.chat{display:grid;gap:14px;max-width:760px}
.bubble{padding:12px 16px;border-radius:14px;max-width:92%}
.bubble.them{background:var(--blue-20);border-bottom-left-radius:2px;font-weight:600}
.bubble.me{background:var(--yellow-20);border-bottom-right-radius:2px;margin-left:auto}
.stage{border-left:8px solid var(--blue);padding:12px 16px;margin:0 0 18px;background:#fff;border-top:2px solid var(--grey-l);border-right:2px solid var(--grey-l);border-bottom:2px solid var(--grey-l);border-radius:0 6px 6px 0}
.stage.locked{opacity:.65}

/* controls */
.btn{min-height:52px;min-width:52px;padding:12px 22px;border-radius:6px;border:3px solid var(--blue-dark);background:var(--blue-dark);color:#fff;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{background:#166B7C;border-color:#166B7C}
.btn.two{background:#fff;color:var(--grey-d);border-color:var(--grey-d)}
.btn.two:hover{background:var(--grey-l)}
.btn.help{background:var(--yellow);border-color:var(--grey-d);color:var(--grey-d)}
.btn.help:hover{background:#E8B200}
.btn[disabled]{background:var(--grey-l);border-color:#8C8C8B;color:#595958;cursor:not-allowed}
.btn.sm{min-height:48px;padding:8px 16px;font-size:.95rem}
label.lbl{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;margin:2px 0 0;accent-color:var(--blue-dark)}
.opt:has(input:checked){background:var(--blue-20);border-color:var(--blue-dark);border-width:3px;padding:9px 13px}
.opts{display:grid;gap:10px;margin:10px 0}
fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:6px}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:.98rem}
.fb:empty{display:none}
.fb.ok{background:var(--green-20);border:2px solid var(--green)}
.fb.try{background:var(--yellow-20);border:2px solid var(--yellow)}
.hint{background:var(--yellow-20);border:2px solid var(--yellow);border-radius:6px;padding:8px 12px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0 0 4px}
.model{background:var(--green-20);padding:12px 16px;border-radius:6px;font-weight:600;margin:10px 0}
.cue{background:var(--blue-20);border-radius:6px;padding:12px 16px;margin:0 0 12px;font-size:1.08rem}
.big{background:var(--green);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.big h2{margin:0 0 8px}.big p{margin:0;font-size:1.15rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* ===== helpers ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normEnd(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function wc(s){var m=norm(s).match(/[\p{L}\p{N}']+/gu);return m?m.length:0;}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function say(m){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=m;},30);}

/* ===== state ===== */
function fresh(){
  var rows={};ROWS.forEach(function(r){rows[r.id]={t:'',h:0,m:0,s:'',said:0,cmp:0};});
  return {screen:1,goal:'',row:'a',rows:rows,
    readT:'',readRev:0,readHow:'',
    repT:'I can to start on Monday.',repH:0,repShown:0,repChecked:0,reT:'',reChecked:0,
    first:'',firstShown:0,imp:'',second:'',secondChecked:0,
    clear:[],next:''};
}
var S=fresh();
var focusId='';
var completionInFlight=false,completionSent=false,doneNote='';

/* ===== gating ===== */
function rowAttempted(k){var r=S.rows[k];return ROWS.filter(function(x){return x.id===k;})[0].type==='say'?!!r.said:norm(r.t).length>0;}
function recallAny(){return ROWS.some(function(r){return rowAttempted(r.id);});}
function repairOk(){return S.reChecked===1;}
function retryOk(){
  var t=S.second;
  return wc(t)>=3&&normEnd(t)!==normEnd(S.first)&&wc(S.first)>=2;
}
function criteria(){return recallAny()&&repairOk()&&retryOk();}
function maxScreen(){
  if(!S.goal)return 1;
  if(!recallAny())return 2;
  if(!S.readRev)return 3;
  if(!S.reChecked)return 4;
  if(!retryOk())return 5;
  return 6;
}

/* ===== progress ===== */
function drawSteps(){
  var ol=$('#steps');ol.textContent='';
  STEPS.forEach(function(n,i){
    var li=document.createElement('li');li.textContent=n;
    if(i+1<S.screen)li.className='done';
    else if(i+1===S.screen){li.className='now';li.setAttribute('aria-current','step');}
    ol.appendChild(li);
  });
}

/* ===== rendering ===== */
function pic(k,alt,cap){return '<figure class="pic" style="margin:0"><img src="'+IMAGES[k]+'" alt="'+esc(alt)+'">'+(cap?'<figcaption class="cap">'+esc(cap)+'</figcaption>':'')+'</figure>';}
function fbHtml(ok,t){return t?'<p class="fb '+(ok?'ok':'try')+'" role="status">'+esc(t)+'</p>':'';}

function view1(){
  var goals=[['a','Answer interview questions clearly'],['b','Say when I am available'],['c','Ask about an offer']];
  return '<div class="hero"><div>'+
   '<h1 id="h" tabindex="-1">The interview and the offer</h1>'+
   '<p class="lead">You are preparing for a job interview and an offer call. Look back, improve one thing and try again.</p>'+
   '<p>There is no score. You can try as many times as you like.</p>'+
   '<fieldset><legend>What do you want to practise most today?</legend><div class="chips">'+
   goals.map(function(g){return '<label class="opt"><input type="radio" name="goal" value="'+g[0]+'"'+(S.goal===g[0]?' checked':'')+'><span>'+esc(g[1])+'</span></label>';}).join('')+
   '</div></fieldset>'+
   '<div class="row"><button class="btn" id="go1" type="button"'+(S.goal?'':' disabled')+'>Start my review</button></div>'+
   '<p class="status">'+(S.goal?'You are ready to start.':'Choose one goal to start.')+'</p></div>'+
   pic('strengths','Three women in hijabs talk about a schedule on a wall board.','')+'</div>';
}

function rowView(r){
  var st=S.rows[r.id],h='';
  var hints='';for(var i=0;i<st.h;i++)hints+='<p>Hint '+(i+1)+': '+esc(r.h[i])+'</p>';
  var canModel=(r.type==='say'?st.said:norm(st.t).length>0)||st.h>0;
  h+='<div class="cue"><strong>'+esc(r.label)+'</strong> <span class="small">('+esc(r.src)+')</span><br>'+esc(r.cue)+'</div>';
  if(r.img)h+='<div style="max-width:420px;margin-bottom:12px">'+pic(r.img,r.alt,'')+'</div>';
  if(r.type==='write'){
    h+='<label class="lbl" for="rt">What would you say?</label><textarea id="rt" maxlength="300" autocomplete="off" spellcheck="false">'+esc(st.t)+'</textarea>';
  }else{
    h+=AUDIO[r.id]?'<p class="small">Normal-speed model:</p><audio controls preload="none" src="'+esc(AUDIO[r.id])+'"></audio>':'<p class="small">No model audio in this version. Use the written model below after you try.</p>';
    h+='<label class="opt"><input type="checkbox" id="said"'+(st.said?' checked':'')+'><span>I said my answer aloud.</span></label>';
  }
  h+='<div class="row"><button class="btn help sm" id="hint" type="button"'+(st.h>=2?' disabled':'')+'>'+(st.h===0?'Give me a hint':(st.h>=2?'No more hints':'Another hint'))+'</button>'+
     '<button class="btn two sm" id="model" type="button"'+(canModel?'':' disabled')+'>Show a model</button></div>';
  h+='<div class="hint" aria-live="polite">'+hints+'</div>';
  if(st.m){
    h+='<div class="model">'+esc(r.model)+'</div>';
    if(r.type==='write'&&norm(st.t)){
      h+=fbHtml(r.ok(st.t),r.ok(st.t)?'Your answer does the same job. Simple word check, not a grade.':'Compare your words with the model. Different words are fine if they do the same job.');
    }
    if(r.type==='say'){h+='<label class="opt"><input type="checkbox" id="cmp"'+(st.cmp?' checked':'')+'><span>I compared my answer with the model.</span></label>';}
    h+='<fieldset style="margin-top:10px"><legend>How did it go?</legend><div class="opts">'+SELF.map(function(o){return '<label class="opt"><input type="radio" name="self" value="'+o[0]+'"'+(st.s===o[0]?' checked':'')+'><span>'+esc(o[1])+'</span></label>';}).join('')+'</div></fieldset>';
  }
  return h;
}
function view2(){
  var idx=ROWS.map(function(r){return r.id;}).indexOf(S.row);
  var rail=ROWS.map(function(r){
    var a=rowAttempted(r.id);
    return '<li><button type="button" data-row="'+r.id+'"'+(S.row===r.id?' aria-current="true"':'')+'>'+esc(r.label)+'<span class="tag">'+(a?'Attempted':'Not yet')+'</span></button></li>';
  }).join('');
  var nextRow=ROWS[idx+1];
  return '<h2 id="h" tabindex="-1">Recall a phrase</h2><p>Use your memory first. Hints are optional. Try at least one.</p>'+
   '<div class="work"><ul class="rail" aria-label="Recall cues">'+rail+'</ul><div>'+rowView(ROWS[idx])+
   '<div class="row">'+(nextRow?'<button class="btn two" id="nextrow" type="button">Next cue</button>':'')+
   '<button class="btn" id="go2" type="button"'+(recallAny()?'':' disabled')+'>Check the detail</button></div>'+
   '<p class="status">'+(recallAny()?'You can continue when you are ready.':'Try one cue to continue.')+'</p></div></div>'+
   '<div class="row"><button class="btn two" id="back" type="button">Back</button></div>';
}

    '<button class="btn two sm" id="repshow" type="button">Show the repair</button></div>'+
    '<div class="hint" aria-live="polite">'+hint+'</div>';

      '<div class="row"><button class="btn" id="reCheck" type="button"'+(norm(S.reT)?'':' disabled')+'>Check my phrase</button></div>';

function repairMatch(t){var n=normEnd(t);return n==='i can start on monday'||n==='i can start monday';}

  var h='<h2 id="h" tabindex="-1">Try a new detail</h2><div class="chat">'+
   '<div class="bubble them">Hana: When can you start?</div></div>';

  if(S.firstShown)h+='<div class="model">Possible answer: I can start on Monday. Could you explain the working hours?</div>';
  h+='</section>';

    h+='<div class="opts">'+IMPS.map(function(o){return '<label class="opt"><input type="radio" name="imp" value="'+o[0]+'"'+(S.imp===o[0]?' checked':'')+'><span>'+esc(o[1])+'</span></label>';}).join('')+'</div>';

     '<div class="bubble them" style="margin-bottom:12px">Hana: When can you start?</div>'+
     '<label class="lbl" for="f2">Your second reply</label><textarea id="f2" maxlength="300" autocomplete="off" spellcheck="false">'+esc(S.second)+'</textarea>'+
     '<div class="row"><button class="btn two sm" id="copy1" type="button">Start from my first reply</button><button class="btn" id="f2check" type="button"'+(wc(S.second)>=1?'':' disabled')+'>Check my second reply</button></div>';
    if(S.secondChecked)h+=secondFb();
  }else h+='<p class="small">Choose what to improve first.</p>';
  h+='</section>';

function secondFb(){
  var t=S.second;
  if(normEnd(t)===normEnd(S.first))return fbHtml(false,'Your second reply is the same as your first. Change or add one thing.');
  if(wc(t)<3)return fbHtml(false,'Add a little more. Try a full sentence.');
  var n=norm(t),done=false,msg='';
  if(S.imp==='can'){done=/\bcan start\b|\bi can\b/.test(n);msg='You used “can” with a start day.';}
  if(S.imp==='ask'){done=/\?/.test(t);msg='You added a question.';}
  if(S.imp==='verb'){done=!/\bcan to\b/.test(n);msg='Your verb after “can” has no “to”.';}
  return fbHtml(true,(done?msg+' ':'')+'Your second reply is ready to compare. Simple word check, not a grade.');
}

var VIEWS={1:view1,2:view2,3:view3,4:view4,5:view5,6:view6};
function render(keepFocus){
  var max=maxScreen();if(S.screen>max)S.screen=max;
  drawSteps();
  var m=$('#main');m.innerHTML='<section class="screen on" aria-labelledby="h">'+VIEWS[S.screen]()+'</section>';
  var target=keepFocus&&focusId?document.getElementById(focusId):null;
  if(!target){target=$('#h');window.scrollTo(0,0);}
  if(target){try{target.focus({preventScroll:!!(keepFocus&&focusId)});}catch(e){target.focus();}}
  focusId='';
}
function go(n){S.screen=n;render(false);say(STEPS[n-1]);}
function rerender(id){focusId=id||'';render(true);}

/* ===== events (delegated) ===== */
var main=$('#main');
main.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var id=b.id,row=b.getAttribute('data-row');
  if(row){S.row=row;rerender('rt');return;}
  if(id==='go1'){go(2);return;}
  if(id==='back'){go(Math.max(1,S.screen-1));return;}
  if(id==='go2'){go(3);return;}
  if(id==='go3'){go(4);return;}
  if(id==='go4'){go(5);return;}
  if(id==='go5'){go(6);return;}
  var r=S.rows[S.row];
  if(id==='hint'){if(r.h<2)r.h++;rerender('hint');return;}
  if(id==='model'){r.m=1;rerender('model');say('Model shown.');return;}
  if(id==='nextrow'){var i=ROWS.map(function(x){return x.id;}).indexOf(S.row);S.row=ROWS[i+1].id;rerender('rt');return;}
  if(id==='rcheck'||id==='rshow'){S.readRev=1;if(id==='rshow')S.readHow='found';rerender('rd');say('The email is shown with the answer highlighted.');return;}
  if(id==='rephint'){S.repH=1;rerender('rep');return;}
  if(id==='repcheck'){S.repChecked=1;rerender('rep');return;}
  if(id==='repshow'){S.repShown=1;rerender('rec');return;}
  if(id==='reCheck'){S.reChecked=1;rerender('reCheck');return;}
  if(id==='f1show'){S.firstShown=1;rerender('f1show');return;}
  if(id==='copy1'){if(S.second.trim()){say('Your second reply already has text. Change it or add to it.');$('#f2').focus();return;}S.second=S.first;rerender('f2');return;}
  if(id==='f2check'){S.secondChecked=1;rerender('f2check');return;}
  if(id==='again'){tryAgain();return;}
  if(id==='done'){doneClick();return;}
});
main.addEventListener('input',function(e){
  var t=e.target,id=t.id,r=S.rows[S.row];
  if(id==='rt'){r.t=t.value;var mb=$('#model'),g=$('#go2');if(mb)mb.disabled=!(norm(r.t)||r.h>0);if(g)g.disabled=!recallAny();}
  else if(id==='rd'){S.readT=t.value;var c=$('#rcheck');if(c)c.disabled=!norm(S.readT);}
  else if(id==='rep'){S.repT=t.value;}
  else if(id==='rec'){S.reT=t.value;var cb=$('#reCheck');if(cb)cb.disabled=!norm(S.reT);}
  else if(id==='f1'){var was=wc(S.first)>=2;S.first=t.value;var sb=$('#f1show');if(sb)sb.disabled=!(wc(S.first)>=2);}
  else if(id==='f2'){S.second=t.value;S.secondChecked=0;var k=$('#f2check');if(k)k.disabled=!(wc(S.second)>=1);var g5=$('#go5');if(g5)g5.disabled=true;}
});
main.addEventListener('change',function(e){
  var t=e.target,r=S.rows[S.row];
  if(t.name==='goal'){S.goal=t.value;rerender('go1');}
  else if(t.id==='said'){r.said=t.checked?1:0;rerender('said');}
  else if(t.id==='cmp'){r.cmp=t.checked?1:0;}
  else if(t.name==='self'){r.s=t.value;}
  else if(t.name==='how'){S.readHow=t.value;}
  else if(t.name==='imp'){S.imp=t.value;rerender('f2');}
  else if(t.name==='clear'){S.clear=$$('input[name="clear"]:checked').map(function(x){return x.value;});}
  else if(t.name==='next'){S.next=t.value;}
});
main.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type==='text'){
    e.preventDefault();
    if(e.target.id==='rd'&&norm(S.readT)){S.readRev=1;rerender('rd');}
    else if(e.target.id==='rep'){S.repChecked=1;rerender('rep');}
    else if(e.target.id==='rec'&&norm(S.reT)){S.reChecked=1;rerender('reCheck');}
  }
});

function tryAgain(){
  S=fresh();doneNote='';
  render(false);say('The review is ready to start again.');
}

/* ===== LMS (optional SCORM 1.2 / 2004) ===== */
var lms={api:null,ver:null,ready:false,tried:false};
function findApi(name){
  var w=window,d=0;
  while(w&&d<12){
    try{if(w[name])return w[name];}catch(e){}
    try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
    d++;
  }
  try{if(window.opener&&window.opener[name])return window.opener[name];}catch(e){}
  return null;
}
function lmsConnect(){
  if(lms.ready||lms.tried)return lms.ready;
  lms.tried=true;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{a=findApi('API');if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}}
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{return String((lms.ver==='2004'?lms.api.GetValue(k):lms.api.LMSGetValue(k))||'');}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004'?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v));return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004'?lms.api.Commit(''):lms.api.LMSCommit(''));return r===true||r==='true';}catch(e){return false;}}
function lmsDone(){
  var k=lms.ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status',v=lmsGet(k);
  return v==='completed'||v==='passed';
}
/* returns true (confirmed or local-only) or false (commit failed, can retry) */
function commitCompletion(){
  if(!lmsConnect())return true; // no bridge: local completion, no error
  if(lmsDone())return true;
  var k=lms.ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status';
  var ok=lmsSet(k,'completed');
  if(lms.ver==='2004')lmsSet('cmi.exit','');else lmsSet('cmi.core.exit','');
  ok=lmsCommit()&&ok;
  return ok&&lmsDone();
}
function doneClick(){
  if(!criteria())return;
  if(completionSent){showDone();return;}
  if(completionInFlight)return;
  completionInFlight=true;
  var ok=false;
  try{ok=commitCompletion();}catch(e){ok=false;}
  completionInFlight=false;
  if(ok){
    completionSent=true;doneNote='';
    try{if(CONFIG.moodleOrigin&&window.parent&&window.parent!==window)window.parent.postMessage({type:'pazapa-activity-completed',activity:CONFIG.activity},CONFIG.moodleOrigin);}catch(e){}
    showDone();
  }else{
    doneNote='This did not save. Press Done to try again.';
    var n=$('#doneNote');if(n)n.textContent=doneNote;
    say(doneNote);
  }
}
function showDone(){
  var f=$('#finalbox'),d=$('#done');
  if(f)f.hidden=false;
  if(d)d.textContent='Done ✓';
  say('Your review is finished.');
}
window.addEventListener('pagehide',function(){
  if(lms.ready){try{lmsCommit();if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}catch(e){}}
});

/* ===== start ===== */
if(lmsConnect()&&lmsDone())completionSent=true; // restore confirmed completion if available
render(false);
window.__pazapaTest={state:function(){return S;},sent:function(){return completionSent;}};
})();
</script>
