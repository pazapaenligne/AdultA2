*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--sand);color:var(--ink);
  font-family:"Segoe UI","DejaVu Sans",system-ui,-apple-system,Arial,sans-serif;

.progress{margin:10px 0 14px}

.progress .bar{height:8px;background:#dde7ea;border-radius:8px;margin-top:6px;overflow:hidden}
.progress .bar span{display:block;height:100%;background:var(--teal);border-radius:8px;transition:width .3s}
main{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.card.soft{background:var(--cyan-soft);border-color:#a9d9e4}
.card.warm{background:var(--yellow-soft);border-color:#ecd08a}

.two{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}

.bubble .who{display:block;font-size:.85rem;font-weight:700;color:var(--teal-dark);margin-bottom:2px}

/* buttons */
button{font:inherit;cursor:pointer}

function say(msg){
  var el = document.getElementById('live');
  el.textContent = '';
  setTimeout(function(){ el.textContent = msg; }, 40);
}
function fb(kind, title, body, id){
  return '<div class="fb '+kind+'"'+(id?' id="'+id+'" tabindex="-1"':'')+'><strong>'+esc(title)+'</strong>'+body+'</div>';
}
function msgHtml(m, id){
  if(!m) return '';
  return fb(m.t, m.title, '<span>'+esc(m.s)+'</span>', id);
}
function pretty(s){ return esc(s).replace(/'/g,'’'); }

/* ------------------------------------------------------------------
   Rendering
   ------------------------------------------------------------------ */
var app = document.getElementById('app');

function render(focusSel){
  var v = state.view;
  var pct = Math.round(((v+1)/VIEWS.length)*100);
  document.getElementById('progress').innerHTML =
    '<div class="label">Step '+(v+1)+' of '+VIEWS.length+'</div>'+
    '<div class="bar" aria-hidden="true"><span style="width:'+pct+'%"></span></div>';
  var html = '';
  html += '<h2 class="view-title" id="viewTitle" tabindex="-1">'+esc(VIEWS[v].title)+'</h2>';
  html += [viewScene, viewNotice, viewBuild, viewAdapt, viewRepair, viewUse][v]();
  app.innerHTML = html;
  bindDrag();
  if(focusSel){
    var el = document.querySelector(focusSel);
    if(el){ el.focus({preventScroll:false}); }
  }
}

function go(n){
  state.view = Math.max(0, Math.min(VIEWS.length-1, n));
  render('#viewTitle');
  window.scrollTo(0,0);
  say('Step '+(state.view+1)+' of '+VIEWS.length+': '+VIEWS[state.view].title);
}

function navBar(backLabel, nextLabel, canNext, helpText){
  var h = '<div class="nav"><div class="group">';
  if(state.view>0) h += '<button type="button" class="btn" data-act="back">'+esc(backLabel||'Back')+'</button>';
  h += '</div><div class="group">';
  if(nextLabel) h += '<button type="button" class="btn primary" data-act="next"'+(canNext?'':' disabled')+'>'+esc(nextLabel)+'</button>';
  h += '</div></div>';
  if(!canNext && helpText) h += '<p class="help">'+esc(helpText)+'</p>';
  return h;
}

/* ---- View 3: build ---- */
function itemCard(k){
  var it = state.items[k], d = KEYS.items[k];
  var locked = it.status==='correct';
  var bank = d.scramble.filter(function(id){ return it.placed.indexOf(id)===-1; });
  var h = '<div class="item'+(locked?' done':'')+'" data-item="'+k+'"><h3>'+esc(d.title)+'</h3>';
  h += '<p class="muted" style="margin:0">Tap a part to add it to the line. Tap a part in the line to take it out. You can also drag.</p>';
  h += '<div class="rail" data-rail="'+k+'" role="group" aria-label="Your sentence line">';
  if(!it.placed.length) h += '<span class="ph">Your sentence will appear here.</span>';
  it.placed.forEach(function(id, pos){
    h += '<button type="button" class="chunk placed" data-act="unplace" data-item="'+k+'" data-id="'+id+'"'+(locked?' disabled':' draggable="true"')+
         ' aria-label="Part '+(pos+1)+': '+esc(d.chunks[id])+'. Press to take it out.">'+esc(d.chunks[id])+'</button>';
  });
  h += '</div>';
  h += '<div class="bank" role="group" aria-label="Parts to use">';
  bank.forEach(function(id){
    h += '<button type="button" class="chunk" data-act="place" data-item="'+k+'" data-id="'+id+'"'+(locked?' disabled':' draggable="true"')+
         ' aria-label="Add: '+esc(d.chunks[id])+'">'+esc(d.chunks[id])+'</button>';
  });
  if(!bank.length) h += '<span class="muted">All parts are in the line.</span>';
  h += '</div>';
  h += '<div class="row-actions">';
  if(!locked){
    h += '<button type="button" class="btn small primary" data-act="check" data-item="'+k+'">Check my sentence</button>';
    h += '<button type="button" class="btn small" data-act="clear" data-item="'+k+'">'+(it.revealed?'Try again with the model hidden':'Clear the line')+'</button>';
    if(it.tries>=2 && !it.revealed) h += '<button type="button" class="btn small" data-act="reveal" data-item="'+k+'">Show the model</button>';
  }
  h += '</div>';
  h += msgHtml(it.msg, 'itemFb'+k);
  if(it.first && (it.status==='correct' || it.revealed)) h += '<p class="muted" style="margin:8px 0 0">Your first try: “'+esc(it.first)+'”</p>';
  h += '</div>';
  return h;
}

/* ---- View 6: independent use ---- */
function completionHtml(){
  var c = ui.completion, m = ui.completionMsg;
  if(c==='saving') return fb('info','Saving...','Please wait a moment.','doneFb');
  if(c==='saved') return fb('good','Activity complete.','Your completion has been recorded. You can go back and look at your work, or try again.','doneFb');
  if(c==='local') return fb('good','Activity complete.','Completed on this page. No learning platform is connected here, so nothing was sent.','doneFb');
  if(c==='failed') return fb('try','We could not save your completion.', (m||'Please check your connection and press Done to try again.'),'doneFb');
  if(c==='notready') return fb('info','Almost there.','Write your reply and press “Check my reply” first. Then press Done.','doneFb');
  return '';
}

/* ------------------------------------------------------------------
   Drag and drop (optional; every action also works by tap/keyboard)
   ------------------------------------------------------------------ */
var dragData = null;
function bindDrag(){
  var chunks = app.querySelectorAll('.chunk[draggable="true"]');
  Array.prototype.forEach.call(chunks, function(c){
    c.addEventListener('dragstart', function(e){
      dragData = { item:c.getAttribute('data-item'), id:Number(c.getAttribute('data-id')) };
      try{ e.dataTransfer.setData('text/plain', String(dragData.id)); e.dataTransfer.effectAllowed='move'; }catch(x){}
    });
  });
  var rails = app.querySelectorAll('.rail');
  Array.prototype.forEach.call(rails, function(r){
    r.addEventListener('dragover', function(e){ e.preventDefault(); r.classList.add('over'); });
    r.addEventListener('dragleave', function(){ r.classList.remove('over'); });
    r.addEventListener('drop', function(e){
      e.preventDefault(); r.classList.remove('over');
      var k = r.getAttribute('data-rail');
      if(!dragData || dragData.item!==k) return;
      var it = state.items[k];
      if(it.status==='correct') return;
      var idx = it.placed.indexOf(dragData.id);
      if(idx>-1) it.placed.splice(idx,1);
      it.placed.push(dragData.id);
      dragData = null;
      render('[data-rail="'+k+'"] .chunk:last-child');
    });
  });
}

/* ------------------------------------------------------------------
   Actions
   ------------------------------------------------------------------ */
function itemCheck(k){
  var it = state.items[k], d = KEYS.items[k];
  if(it.status==='correct') return;
  if(it.placed.length < d.chunks.length){
    it.msg = { t:'info', title:'Add every part first.', s:'Put all the parts in the line, then check your sentence.' };
    render('#itemFb'+k); say('Add every part to the line first.'); return;
  }
  var s = it.placed.map(function(i){ return d.chunks[i]; }).join(' ');
  it.tries++;
  if(!it.first) it.first = s;
  if(d.accept.indexOf(norm(s))>-1){
    it.status = 'correct';
    it.msg = { t:'good', title:'That works.', s:'Your sentence matches the intended message: “'+s+'”' };
    render('#itemFb'+k); say('Correct. '+s);
  } else {
    var extra = it.tries>=2 ? ' You can ask to see the model.' : ' Change at least one part and check again.';
    it.msg = { t:'try', title:'Not quite yet.', s:'This order does not give the intended message. Hint: '+d.hint+extra };
    render('#itemFb'+k); say('Not quite yet. '+d.hint);
  }
}

function adaptCheck(){
  var a = state.adapt;
  var raw = a.text.trim();
  var n = norm(raw);
  if(!a.first && raw) a.first = raw;
  var isAvail = /^(i'm|i am) available( .+)?$/.test(n);
  var isCan = /^i can start( .+)?$/.test(n);
  a.submitted = false; a.revised = '';
  if(!n){
    a.msg = { t:'info', title:'Write a sentence first.', s:'Choose a time above or type your own, for example: I’m available in two weeks.' };
  } else if(/\bcan to\b/.test(n)){
    a.tries++;
    a.msg = { t:'try', title:'One small change.', s:'After can, use the action word straight away: I can start...' };
  } else if(!isAvail && !isCan){
    a.tries++;
    a.msg = { t:'try', title:'Keep the pattern.', s:'Start with “I’m available...” (or “I can start...”) and change only the time.' };
  } else if((isAvail && n.replace(/^(i'm|i am) available/,'').trim()==='') || (isCan && n.replace(/^i can start/,'').trim()==='')){
    a.tries++;
    a.msg = { t:'try', title:'Add a time.', s:'Say when. For example: in two weeks, on Friday, from 16 November.' };
  } else if(n===norm(KEYS.adaptOriginal)){
    a.tries++;
    a.msg = { t:'try', title:'Make it different.', s:'This is the same as the original. Change the time and check again.' };
  } else {
    a.tries++;
    a.submitted = true; a.revised = raw.replace(/\s+/g,' ').replace(/'/g,'’');
    a.msg = { t:'good', title:'Good. Same pattern, new detail.', s:'Compare your version with the original below.' };
  }
  render('#adaptFb');
  say(a.msg.title+' '+a.msg.s);
}

function repairCheck(){
  var r = state.repair;
  var raw = r.text.trim();
  var n = norm(raw);
  if(!raw){
    r.msg = { t:'info', title:'Write the sentence.', s:'Edit the draft, or tap a word and remove it.' };
    render('#repairFb'); return;
  }
  r.tries++;
  if(!r.first) r.first = raw;
  var canTo = /\bcan to\b/.test(n);
  var meaning = /\bcan start\b/.test(n) && /monday/.test(n);
  if(!canTo && meaning){
    r.status = 'fixed';
    r.msg = { t:'good', title:'Repaired.', s:'You took out the extra word. “'+raw+'”' };
    render('#repairFb'); say('Repaired. Well done.');
  } else if(canTo){
    r.msg = { t:'try', title:'Nearly. One word is still extra.', s:'Look at the words after can. Does you need the extra word before the action? Change it and check again.' };
    render('#repairFb'); say('Nearly. One word is still extra.');
  } else {
    r.msg = { t:'try', title:'Keep the meaning.', s:'Mariam can start on Monday. Keep those ideas and fix only the extra word.' };
    render('#repairFb'); say('Keep the meaning. Fix only the extra word.');
  }
}

function hiddenCheck(){
  var hd = state.repair.hidden;
  var n = norm(hd.text);
  if(!n){ hd.msg = { t:'info', title:'Write a sentence.', s:'Say you can start on a day you like.' }; render('#hiddenFb'); return; }
  if(/\bcan to\b/.test(n)){
    hd.msg = { t:'try', title:'One small change.', s:'After can, use the action word straight away.' };
  } else if(/^i can start( on| in| from| next)? .+/.test(n) || /^i can start$/.test(n)===false && /\bcan start\b/.test(n) && n.split(' ').length>=4){
    hd.done = true;
    hd.msg = { t:'good', title:'Well done.', s:'You made the sentence without the model.' };
  } else {
    hd.msg = { t:'try', title:'Try the pattern again.', s:'Write: I can start on (a day).' };
  }
  render('#hiddenFb'); say(hd.msg.title+' '+hd.msg.s);
}

function useCheck(){
  var u = state.use;
  var t = u.text.trim();
  if(t.split(/\s+/).filter(Boolean).length < 2){
    u.msg = { t:'info', title:'Write a little more.', s:'Write one or two sentences to answer Hana, then check your reply.' };
    render('#useFb'); say('Write one or two sentences first.'); return;
  }
  u.msg = null;
  u.attempted = true; u.first = t; u.improved = t;
  render('#doneBtn');
  say('Reply saved. Here is a worked model and a self-check. Done is now available.');
}

function sendFb(){
  var u = state.use;
  if(!CONFIG.feedbackEndpoint || u.fb.state==='pending') return;
  u.fb = { state:'pending', text:'' };
  render();
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 12000);
  fetch(CONFIG.feedbackEndpoint, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ activity:CONFIG.activityId, cue:KEYS.cue, text:u.first }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    clearTimeout(timer);
    if(!res.ok) throw new Error('http');
    return res.json();
  }).then(function(data){
    if(data && typeof data.feedback==='string' && data.feedback.length && data.feedback.length<2000){
      state.use.fb = { state:'ok', text:data.feedback };
    } else { state.use.fb = { state:'uncertain', text:'' }; }
    render();
  }).catch(function(){
    clearTimeout(timer);
    state.use.fb = { state:'failed', text:'' }; render();
  });
}

/* ------------------------------------------------------------------
   Completion (SCORM / Pazapa bridge)
   ------------------------------------------------------------------ */
function findScorm(){
  var w = window, i = 0;
  while(w && i < 10){
    try{
      if(w.API_1484_11) return { v:'2004', api:w.API_1484_11 };
      if(w.API) return { v:'1.2', api:w.API };
    }catch(e){}
    try{ if(w === w.parent) break; w = w.parent; }catch(e2){ break; }
    i++;
  }
  try{
    if(window.opener){
      if(window.opener.API_1484_11) return { v:'2004', api:window.opener.API_1484_11 };
      if(window.opener.API) return { v:'1.2', api:window.opener.API };
    }
  }catch(e3){}
  return null;
}
function getBridge(){
  return window.PazapaBridge || window.pazapaBridge || null;
}
function hostAvailable(){
  var b = getBridge();
  return !!((b && typeof b.complete === 'function') || findScorm());
}
function commitCompletion(){
  return new Promise(function(resolve, reject){
    try{
      var b = getBridge();
      if(b && typeof b.complete === 'function'){
        Promise.resolve(b.complete({ activity:CONFIG.activityId, status:'completed' })).then(function(r){
          if(r === false || (r && r.ok === false)) reject(new Error('bridge')); else resolve('bridge');
        }, reject);
        return;
      }
      var s = findScorm();
      if(!s){ resolve('local'); return; }
      var a = s.api;
      if(s.v === '2004'){
        try{ a.Initialize(''); }catch(e){}
        if(String(a.SetValue('cmi.completion_status','completed')) === 'false') throw new Error('set');
        if(String(a.Commit('')) === 'false') throw new Error('commit');
      } else {
        try{ a.LMSInitialize(''); }catch(e){}
        if(String(a.LMSSetValue('cmi.core.lesson_status','completed')) === 'false') throw new Error('set');
        if(String(a.LMSCommit('')) === 'false') throw new Error('commit');
      }
      resolve('scorm');
    }catch(err){ reject(err); }
  });
}
function restoreCompletion(){
  try{
    var b = getBridge();
    if(b && typeof b.isComplete === 'function' && b.isComplete() === true){ completionSent = true; return; }
    var s = findScorm();
    if(s){
      var st = s.v === '2004' ? s.api.GetValue('cmi.completion_status') : s.api.LMSGetValue('cmi.core.lesson_status');
      if(st === 'completed' || st === 'passed') completionSent = true;
    }
  }catch(e){}
}
function finish(){
  var u = state.use;
  if(!u.attempted){
    ui.completion = 'notready'; ui.completionMsg = '';
    refreshDone('#doneFb'); say('Write your reply and check it first. Then press Done.'); return;
  }
  if(completionSent){
    ui.completion = 'saved'; refreshDone('#doneFb'); say('Your completion is already recorded.'); return;
  }
  if(completionInFlight) return;
  if(!hostAvailable()){
    ui.completion = 'local'; refreshDone('#doneFb'); say('Activity complete. Completed on this page.'); return;
  }
  completionInFlight = true;
  ui.completion = 'saving'; refreshDone('#doneFb'); say('Saving your completion.');
  commitCompletion().then(function(mode){
    completionInFlight = false;
    if(mode === 'local'){ ui.completion = 'local'; }
    else { completionSent = true; ui.completion = 'saved'; }
    refreshDone('#doneFb'); say('Activity complete.');
  }).catch(function(){
    completionInFlight = false;
    ui.completion = 'failed';
    ui.completionMsg = 'Please check your connection and press Done to try again.';
    refreshDone('#doneFb'); say('We could not save your completion. Press Done to try again.');
  });
}
function refreshDone(focusSel){
  var box = document.getElementById('doneMsg');
  if(box){ box.innerHTML = completionHtml(); }
  if(focusSel){ var el = document.querySelector(focusSel); if(el) el.focus(); }
}

function retry(){
  state = freshState();
  ui = freshUi();
  render('#viewTitle');
  window.scrollTo(0,0);
  say('The activity has restarted from the beginning.');
}

/* ------------------------------------------------------------------
   Events
   ------------------------------------------------------------------ */
app.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t || t.tagName==='INPUT') return;
  if(t.disabled) return;
  var act = t.getAttribute('data-act');
  var k = t.getAttribute('data-item');
  switch(act){
    case 'next': go(state.view+1); break;
    case 'back': go(state.view-1); break;
    case 'retr':
      state.retrieval.choice = t.getAttribute('data-v'); state.retrieval.tries++;
      render('#retrFb'); say(state.retrieval.choice===KEYS.retrieval.correct ? 'Yes. That phrase talks about work you have done.' : 'Not quite yet. Try another phrase.');
      break;
    case 'notice':
      state.notice.choice = t.getAttribute('data-v');
      render('#noticeFb'); say(state.notice.choice==='anchor' ? 'Message 2 fits.' : 'Look again. Message 1 has one extra word.');
      break;
    case 'cmp':
      state.compare.choice = t.getAttribute('data-v');
      render('#cmpFb'); say(state.compare.choice===KEYS.compare.correct ? 'Yes. Question 2 names a place.' : 'Look again.');
      break;
    case 'place': {
      var it = state.items[k]; var id = Number(t.getAttribute('data-id'));
      if(it.status!=='correct' && it.placed.indexOf(id)===-1){ it.placed.push(id); it.msg = null; }
      render('[data-rail="'+k+'"] .chunk:last-child');
      break; }
    case 'unplace': {
      var it2 = state.items[k]; var id2 = Number(t.getAttribute('data-id'));
      var ix = it2.placed.indexOf(id2);
      if(it2.status!=='correct' && ix>-1){ it2.placed.splice(ix,1); it2.msg = null; }
      render('.item[data-item="'+k+'"] .bank .chunk');
      break; }
    case 'check': itemCheck(k); break;
    case 'clear': {
      var it3 = state.items[k]; it3.placed = []; it3.msg = null;
      if(it3.revealed){ it3.msg = { t:'info', title:'Model hidden.', s:'Build the sentence again from memory.' }; }
      render('.item[data-item="'+k+'"] .bank .chunk'); break; }
    case 'reveal': {
      var it4 = state.items[k], d = KEYS.items[k];
      it4.revealed = true; it4.status = 'open';
      it4.placed = d.chunks.map(function(_,i){ return i; });
      it4.msg = { t:'info', title:'Here is the model.', s:'“'+d.model+'” Press “Try again with the model hidden” to build it yourself.' };
      render('#itemFb'+k); say('The model is shown.'); break; }
    case 'chip': {
      state.adapt.text = 'I’m available '+t.getAttribute('data-v')+'.';
      render('#adaptInput'); break; }
    case 'adaptCheck': adaptCheck(); break;
    case 'tok': {
      var i = Number(t.getAttribute('data-i'));
      state.repair.selected = (state.repair.selected===i) ? null : i;
      render('.tokens .tok[data-i="'+i+'"]'); break; }
    case 'rmTok': {
      var r = state.repair;
      if(r.selected!==null){
        var ws = r.text.split(/\s+/).filter(Boolean);
        ws.splice(r.selected,1);
        r.text = ws.join(' '); r.selected = null;
      }
      render('#repairInput'); break; }
    case 'resetDraft':
      state.repair.text = KEYS.draft; state.repair.selected = null; state.repair.msg = null;
      render('#repairInput'); break;
    case 'repairCheck': repairCheck(); break;
    case 'repairReveal': {
      var rr = state.repair;
      rr.revealed = true; rr.status = 'fixed'; if(!rr.first) rr.first = rr.text;
      rr.text = KEYS.repair;
      rr.msg = { t:'info', title:'Here is the answer.', s:'“'+KEYS.repair+'” Now try again with the model hidden.' };
      render('#repairFb'); say('The answer is shown.'); break; }
    case 'hideStart':
      state.repair.hidden.started = true; render('#hiddenInput'); break;
    case 'hiddenCheck': hiddenCheck(); break;
    case 'phrase': {
      var p = KEYS.phraseBank[Number(t.getAttribute('data-i'))];
      var u = state.use;
      u.text = (u.text ? u.text.replace(/\s+$/,'')+' ' : '') + p.replace(/\.\.\.$/,'');
      render('#useInput');
      var ta = document.getElementById('useInput');
      if(ta){ ta.setSelectionRange(ta.value.length, ta.value.length); }
      break; }
    case 'useCheck': useCheck(); break;
    case 'saveImprove': {
      var uu = state.use; var txt = (uu.improved||'').trim();
      if(!txt){ say('Write your improved reply first.'); break; }
      uu.saved = txt; uu.improvedSaved = true;
      render('#improveInput'); say('Improved reply saved. Your first reply is still shown.'); break; }
    case 'sendFb': sendFb(); break;
    case 'finish': finish(); break;
    case 'retry': retry(); break;
  }
});

app.addEventListener('input', function(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(!f) return;
  var v = e.target.value;
  if(f==='adapt') state.adapt.text = v;
  else if(f==='repair'){ state.repair.text = v; state.repair.selected = null; }
  else if(f==='hidden') state.repair.hidden.text = v;
  else if(f==='use') state.use.text = v;
  else if(f==='improve') state.use.improved = v;
});
app.addEventListener('change', function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute('data-act')==='chk'){
    state.use.checks[Number(t.getAttribute('data-i'))] = t.checked;
    say(t.checked ? 'Marked.' : 'Unmarked.');
  }
});
app.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.tagName==='INPUT' && e.target.type==='text'){
    var f = e.target.getAttribute('data-field');
    e.preventDefault();
    if(f==='adapt') adaptCheck();
    else if(f==='repair') repairCheck();
    else if(f==='hidden') hiddenCheck();
  }
});

/* ------------------------------------------------------------------
   Start
   ------------------------------------------------------------------ */
restoreCompletion();
state = freshState();
ui = freshUi();
render();
})();
</script>
