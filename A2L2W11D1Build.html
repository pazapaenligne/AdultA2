<style>
:root{
  --blue:#36BBD6; --blue-tint:#D7F1F7; --blue-soft:#EAF8FB;
  --green:#C9D646; --green-tint:#F0F4C8;
  --yellow:#FCC104; --yellow-tint:#FFF2CC;
  --ink:#2E2E2D; --grey:#EBEBEB; --white:#fff; --muted:#5A5A58;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:#FAF8F3;color:var(--ink);font-family:"Open Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:1.0625rem;line-height:1.55}
h1,h2,h3{font-family:"Filson Soft","Open Sans","Segoe UI",system-ui,Arial,sans-serif;font-weight:800;line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4rem 0 .8rem}
.app{max-width:960px;margin:0 auto;padding:0 16px 40px}
.topbar{height:10px;background:var(--blue)}
header.head{padding:18px 0 8px}
.crumb{color:var(--muted);font-size:.9rem;margin:0}
.progress{display:flex;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.progress li{flex:1;height:8px;border-radius:4px;background:var(--grey)}
.progress li.on{background:var(--blue)}
.progress-label{font-size:.9rem;color:var(--muted);margin:6px 0 0}
main{outline:none}
.panel{background:#fff;border:1px solid var(--grey);border-radius:16px;padding:20px;margin:14px 0}
.panel.tint{background:var(--blue-soft);border-color:var(--blue-tint)}
.panel.warm{background:var(--yellow-tint);border-color:#F6DE92}
.row{display:grid;gap:16px}
.two{grid-template-columns:1fr 1fr}
.split{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
@media (max-width:700px){.two,.split{grid-template-columns:1fr}}
figure{margin:0}
figure img{display:block;width:100%;height:auto;object-fit:contain;border-radius:12px;background:var(--blue-soft)}
figcaption{font-size:.9rem;color:var(--muted);margin-top:6px}
.label{display:inline-block;font-weight:700;font-size:.9rem;color:var(--ink);background:var(--blue-tint);border-radius:999px;padding:2px 12px;margin-bottom:6px}
.bubble{border-radius:14px;padding:10px 14px;margin:8px 0;max-width:92%}
.bubble .who{display:block;font-weight:700;font-size:.9rem}
.bubble.m{background:var(--green-tint)}
.bubble.h{background:var(--blue-tint);margin-left:auto}
.clause{border-left:6px solid var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px 14px}
.clause strong{display:block}
button,.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--blue);border:2px solid var(--blue);border-radius:12px;padding:10px 18px;min-height:48px;cursor:pointer}
button:hover{filter:brightness(.96)}
button.alt{background:#fff;border-color:var(--blue)}
button.chunk{background:var(--blue-tint);border:2px solid var(--blue);font-weight:600;min-height:48px}
button.chunk[aria-pressed="true"]{background:var(--green-tint);border-color:var(--green)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
input[type=text],textarea{font:inherit;color:var(--ink);width:100%;padding:10px 12px;border:2px solid #9a9a98;border-radius:10px;background:#fff;min-height:48px}
textarea{min-height:110px;resize:vertical}
label{font-weight:600;display:block;margin-bottom:4px}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400}
.check input{width:24px;height:24px;margin-top:2px;flex:none}
.rail{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--blue);border-radius:12px;background:#fff;align-items:center}
.rail .hint-empty{color:var(--muted);font-size:.95rem}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.timeline{display:flex;align-items:flex-start;gap:0;margin:6px 0 14px;padding:0;list-style:none}
.timeline li{flex:1;text-align:center;position:relative;padding-top:22px;font-size:.9rem;font-weight:600}
.timeline li::before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--blue-tint)}
.timeline li::after{content:"";position:absolute;top:0;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--blue)}
.timeline li.here::after{background:var(--yellow);border-color:var(--ink)}
.timeline li small{display:block;font-weight:400;color:var(--muted)}
.item{border-top:1px solid var(--grey);padding-top:14px;margin-top:14px}
.item:first-of-type{border-top:0;margin-top:0;padding-top:0}
.fb{display:flex;gap:10px;align-items:flex-start;margin-top:10px;min-height:1.5em}
.dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:6px;border:2px solid var(--ink)}
.dot.ok{background:var(--green)} .dot.try{background:var(--yellow)}
mark{background:var(--yellow);color:var(--ink);padding:0 4px;border-radius:4px;font-weight:700}
mark.good{background:var(--green)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.cmp{grid-template-columns:1fr}}
.cmp>div{border:2px solid var(--grey);border-radius:12px;padding:12px;background:#fff}
.cmp h3{font-size:.95rem;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--blue);font-weight:600;margin:8px 0}
.opt[aria-pressed="true"]{background:var(--blue-tint)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pic{padding:8px;background:#fff;border:2px solid var(--blue);border-radius:12px;text-align:center}
.pic[aria-pressed="true"]{background:var(--blue-tint);border-color:var(--ink)}
.pic img{display:block;width:100%;height:auto;object-fit:contain;border-radius:8px;margin-bottom:6px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.words button{background:#fff;border:2px solid var(--grey);font-weight:600;padding:6px 12px;min-height:44px}
.words button.sel{border-color:var(--ink);background:var(--yellow-tint)}
.small{font-size:.92rem;color:var(--muted)}
.note{font-size:.95rem;color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.summary li{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var SCREENS = ["scene","recall","notice","build","adapt","repair","use","finish"];
var state, completionInFlight = false, completionSent = false;

function shuffle(a){ var b=a.slice(),i,j,t; for(i=b.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function scrambleNot(chunks){ var s,n=0; do{ s=shuffle(chunks); n++; }while(s.join("|")===chunks.join("|") && n<20); return s; }

function freshBuild(){
  var o={};
  CONTENT.build.forEach(function(it){
    o[it.id]={ pool:scrambleNot(it.chunks), placed:[], tries:0, last:"", ok:false, shown:false, fb:null };
  });
  return o;
}
function freshState(keep){
  var recallItem = CONTENT.recall[Math.floor(Math.random()*CONTENT.recall.length)];
  return {
    screen: keep ? keep.screen : 0,
    recallItem: recallItem, recall:{ text:"", checked:false, said:null },
    notice:{ pick:null },
    build: freshBuild(),
    adapt:{ choice:null, custom:"", order:shuffle(CONTENT.adapt.map(function(a){return a.id;})), done:false, sentence:"", orig:CONTENT.models.leave },
    repair:{ text:CONTENT.draft, first:"", tries:0, hint:false, ok:false, shown:false, fb:null,
             retry:{ text:"", tries:0, ok:false, fb:null, open:false } },
    use:{ topics:[], unclear:null, text:"", first:"", attempted:false, show:false, improved:"", checks:[false,false,false] },
    finished:false
  };
}

/* --------------------------------------------------------------- UTILITIES */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g," ").trim().replace(/[.?!]+$/,"").trim(); }
function say(msg){ var l=document.getElementById("live"); l.textContent=""; setTimeout(function(){ l.textContent=msg; },30); }
function fb(kind,msg){ return '<div class="fb"><span class="dot '+(kind==="ok"?"ok":"try")+'" aria-hidden="true"></span><p style="margin:0"><strong>'+(kind==="ok"?"Yes. ":"Not yet. ")+'</strong>'+esc(msg)+'</p></div>'; }
function fbRaw(kind,html){ return '<div class="fb"><span class="dot '+(kind==="ok"?"ok":"try")+'" aria-hidden="true"></span><p style="margin:0">'+html+'</p></div>'; }

/* ------------------------------------------------------------------- AUDIO */
var currentAudio=null;
function playAudio(key){
  var src=CONFIG.AUDIO_FILES[key]; if(!src) return;
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  currentAudio=new Audio(src); currentAudio.play().catch(function(){});
}
function listenHtml(key){
  if(CONFIG.AUDIO_FILES[key]) return '<button type="button" class="alt" data-act="listen" data-key="'+key+'">Listen</button>';
  return '<span class="note">Audio is not available yet. Read the phrase below.</span>';
}

R.recall = function(){
  var r=state.recall, it=state.recallItem;
  var h='<section class="panel warm"><h2>Warm-up: remember a phrase</h2>'+
    '<p>'+esc(it.cue)+'</p>'+
    '<label for="recallText">Type the phrase from memory</label>'+
    '<input type="text" id="recallText" data-fid="recallText" autocomplete="off" value="'+esc(r.text)+'"'+(r.checked?' readonly':'')+'>';
  if(!r.checked){
    h+='<div class="actions"><button type="button" data-act="recallCheck">Check my phrase</button></div>';
  } else {
    h+='<div class="cmp" style="margin-top:12px"><div><h3>My phrase</h3><p style="margin:0">'+esc(r.text||"(empty)")+'</p></div>'+
       '<div><h3>Model ('+esc(it.src)+')</h3><p style="margin:0"><strong>'+esc(it.answer)+'</strong></p></div></div>'+
       '<p>Compare the two. Did you remember it?</p>'+
       '<div class="actions"><button type="button" class="'+(r.said==="yes"?"":"alt")+'" data-act="recallSay" data-v="yes" aria-pressed="'+(r.said==="yes")+'">I remembered it</button>'+
       '<button type="button" class="'+(r.said==="no"?"":"alt")+'" data-act="recallSay" data-v="no" aria-pressed="'+(r.said==="no")+'">I need more practice</button></div>';
    if(r.said){ h+=fbRaw("ok", r.said==="yes"?"Good. Keep that phrase ready for work.":"That is fine. Read the model aloud once, then carry on."); }

  h+='<div class="actions"><button type="button" data-act="next"'+(r.checked&&r.said?'':' disabled')+'>Notice the change</button></div>';

};

  if(answered){

function render(opts){
  opts=opts||{};
  var main=document.getElementById("main");
  var activeId=document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-fid");
  var caret=null; try{ caret=document.activeElement.selectionStart; }catch(e){}
  main.innerHTML=R[SCREENS[state.screen]]();
  var bar=document.getElementById("progress");
  bar.innerHTML=SCREENS.map(function(_,i){ return '<li'+(i<=state.screen?' class="on"':'')+'></li>'; }).join("");
  document.getElementById("progressLabel").textContent="Part "+(state.screen+1)+" of "+SCREENS.length;
  if(opts.focusTop){ main.focus({preventScroll:false}); window.scrollTo(0,0); }
  else if(activeId){
    var el=main.querySelector('[data-fid="'+activeId+'"]');
    if(el){ el.focus(); try{ if(caret!==null) el.setSelectionRange(caret,caret); }catch(e){} }
  } else if(opts.focusSel){
    var f=main.querySelector(opts.focusSel); if(f) f.focus();
  }
}

/* ------------------------------------------------------------------ CHECKS */
function isRepairOk(t){
  var n=norm(t);
  if(/\bdoes i\b/.test(n)) return false;
  if(n===norm(CONTENT.repair)) return true;
  return /^how many (leave )?days( of (annual |sick )?leave)? do i (have|get)$/.test(n);
}
function isRetryOk(t){
  var n=norm(t);
  if(/\bdoes i\b|\bdo i has\b/.test(n)) return false;
  return /^how many [a-z ]+ do i (have|get)$/.test(n) || /^(how many days (of [a-z ]+ )?do i (get|have))$/.test(n);
}

/* -------------------------------------------------------------- COMPLETION */
function findApi(){
  var w=window, n=0;
  try{
    while(w && n<12){
      if(w.PazapaBridge && typeof w.PazapaBridge.complete==="function") return {t:"pazapa",api:w.PazapaBridge};
      if(w.API && typeof w.API.LMSSetValue==="function") return {t:"s12",api:w.API};
      if(w.API_1484_11 && typeof w.API_1484_11.SetValue==="function") return {t:"s2004",api:w.API_1484_11};
      if(w.parent===w) break; w=w.parent; n++;
    }
  }catch(e){}
  try{ if(window.opener && window.opener.API) return {t:"s12",api:window.opener.API}; }catch(e){}
  return null;
}
function commitCompletion(){
  return new Promise(function(resolve){
    var f=findApi();
    if(!f){ resolve(true); return; }                       /* no LMS: local completion */
    try{
      if(f.t==="pazapa"){
        Promise.resolve(f.api.complete({id:CONFIG.ACTIVITY_ID})).then(function(r){ resolve(r!==false); },function(){ resolve(false); });
      } else if(f.t==="s12"){
        var a=f.api; a.LMSInitialize("");
        a.LMSSetValue("cmi.core.lesson_status","completed");
        resolve(String(a.LMSCommit(""))==="true");
      } else {
        var b=f.api; b.Initialize("");
        b.SetValue("cmi.completion_status","completed");
        resolve(String(b.Commit(""))==="true");
      }
    }catch(e){ resolve(false); }
  });
}
A.done=function(){
  state.finished=true;                                    /* local completed state is always shown */
  render({focusSel:'#doneBtn'}); say("Well done. You finished.");
  if(completionSent || completionInFlight) return;
  completionInFlight=true;
  commitCompletion().then(function(ok){ completionSent=!!ok; completionInFlight=false; });
};

  var act=el.getAttribute("data-act");
  if(act==="useCheckbox") return;
  if(A[act]) A[act](el);
});
document.addEventListener("change",function(e){
  var el=e.target.closest('[data-act="useCheckbox"]'); if(el) A.useCheckbox(el);
});
document.addEventListener("input",function(e){
  var id=e.target.getAttribute && e.target.getAttribute("data-fid"); if(!id) return;
  var v=e.target.value;
  if(id==="recallText") state.recall.text=v;
  if(id==="repairText") state.repair.text=v;
  if(id==="retryText") state.repair.retry.text=v;
  if(id==="useText") state.use.text=v;
  if(id==="useImproved") state.use.improved=v;
  if(id==="adaptCustom"){ state.adapt.custom=v; var s=document.getElementById("adaptSlot"); if(s) s.textContent=adaptTopic()||"…"; }
});

/* -------------------------------------------------------------------- INIT */
state=freshState(); state.repairPickIndex=null;
render();
})();
</script>
</body>
</html>
