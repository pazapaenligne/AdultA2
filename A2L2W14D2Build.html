<!DOCTYPE html>
<!--
  PAZAPA ADULT ENGLISH A2 | WEEK 14 | LESSON 2 | STEP 4 - BUILD USEFUL ENGLISH
  Activity ID: A2-W14-L2-S4        Title: Calling for help

  SOURCE NOTES (for editors)
  ---------------------------------------------------------------
  ANSWER KEYS (also in the BUILDS / REPAIR / RECALL constants in the script):
   - Recall (screen 1): "I was driving to work when a car hit us."  (W14 L1)
   - Notice (screen 2): "She is near the entrance."  is the fitting message.
   - Compare (screen 3): the second sentence gives the place.
   - Build A: "I need an ambulance."
   - Build B: "There's been an accident on the highway near the mall."
     Authored alternatives: none. To allow one, add a normalised string to the
     item's `targets` array in BUILDS (lower case, no final punctuation).
   - Adapt (screen 4): any map place or a typed place; the structure stays the same.
   - Repair (screen 5): "She is near the entrance."  Other natural versions that
     keep the meaning (by / beside / next to / opposite / at the entrance) are accepted.
     The draft error is "at near".
   - Reply (screen 6): open response. Never marked by exact string. Self-check only.
     Worked model: "I'm near the main entrance, beside the blue sign."

  CONFIGURABLE ASSETS
   - Images are embedded from the Pazapa W14 L2 workbook (IMG object in the script).
     Replace a data URI with a URL to change an image.
   - All phrases are written text.

  OPTIONAL FEEDBACK INTEGRATION
   - None is configured. The open reply uses a checklist and model comparison only.
     If a feedback service is added later, send text only after an explicit learner action.

  COMPLETION BEHAVIOUR
   - Done is enabled on the final screen after: a build attempt, a repair, and a reply
     with the model revealed.
   - commitCompletion() uses, in order: window.PazapaCompletion.complete(), SCORM 1.2 API,
     SCORM 2004 API. completionInFlight / completionSent guard repeat commits.
     completionSent is set only after a confirmed commit. A failed commit can be retried.
   - With no bridge, Done shows a local completed state without error.
     No score is sent and no navigation is forced.
-->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calling for help — Step 4: Build Useful English</title>
<style>
  :root{
    --blue:#36BBD6; --blue-tint:#D7F1F7;
    --green:#C9D646; --green-tint:#F4F7DA;
    --yellow:#FCC104; --yellow-tint:#FEF3CD;
    --red:#E6352B; --grey:#EBEBEB; --dark:#2E2E2D; --white:#FFFFFF;
    --focus-ring:3px solid #2E2E2D; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--dark);background:var(--white);max-width:100%;overflow-x:hidden;}
  h1,h2,h3{font-weight:800;margin:0 0 8px 0;line-height:1.25;}
  p{line-height:1.5;margin:0 0 10px 0;}
  .app{max-width:800px;margin:0 auto;padding:18px 18px 40px 18px;overflow-x:hidden;}
  .brand-logo{display:block;width:132px;height:auto;margin:0 0 14px 0;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:10px 0 4px 0;border-bottom:4px solid var(--blue);margin-bottom:18px;}
  .top-bar .eyebrow{font-size:13px;font-weight:700;overflow-wrap:break-word;}
  .top-bar h1{font-size:20px;margin:2px 0 0 0;overflow-wrap:break-word;}
  .progress-wrap{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;flex:1 1 150px;}
  .progress-track{flex:1 1 60px;min-width:0;height:10px;background:var(--grey);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);width:14%;transition:width .3s ease;}
  .progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
  button,.tile,.map-block,.choice{touch-action:manipulation;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .goal-box{background:var(--blue-tint);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
  .goal-box .label{font-size:13px;font-weight:700;margin-bottom:4px;}
  .goal-box .goal-text{font-size:18px;font-weight:800;}
  .card{border:1px solid var(--grey);border-radius:var(--radius);padding:18px;margin-bottom:16px;background:var(--white);}
  .card h3{font-size:16px;}
  .two-col{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .two-col .col{flex:1 1 260px;min-width:0;}
  .illustration{width:100%;max-width:300px;border-radius:var(--radius);display:block;margin:0 auto 12px auto;height:auto;}
  .illustration.wide{max-width:360px;}

  /* Screen 1: dialogue scene */
  .scene{display:flex;flex-direction:column;gap:12px;}
  .bubble-row{display:flex;gap:10px;align-items:flex-end;}
  .bubble-row.right{flex-direction:row-reverse;}
  .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--grey);}
  .bubble{padding:12px 16px;border-radius:16px;font-weight:700;font-size:16px;max-width:calc(100% - 70px);overflow-wrap:break-word;}
  .bubble .who{display:block;font-size:12px;font-weight:800;opacity:.65;margin-bottom:2px;}
  .bubble.op{background:var(--blue-tint);border-bottom-left-radius:4px;}
  .bubble.cl{background:var(--green-tint);border-bottom-right-radius:4px;}
  .bubble mark{background:var(--yellow);color:var(--dark);padding:0 3px;border-radius:4px;}

  /* Screen 2: compare panels */
  .compare{display:flex;gap:14px;flex-wrap:wrap;}
  .panel{flex:1 1 230px;min-width:0;border:2px solid var(--grey);border-radius:var(--radius);padding:14px;background:var(--white);}
  .panel.picked-ok{border-color:var(--green);background:var(--green-tint);}
  .panel.picked-no{border-color:var(--yellow);background:var(--yellow-tint);}
  .panel .tag{font-size:12px;font-weight:800;opacity:.65;margin-bottom:6px;}
  .panel .msg{font-size:19px;font-weight:800;margin-bottom:12px;overflow-wrap:break-word;}
  .chg{background:var(--yellow);padding:0 4px;border-radius:4px;text-decoration:line-through;text-decoration-thickness:2px;}
  .keep{background:var(--green);padding:0 4px;border-radius:4px;}
  .explain{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-weight:700;}

  /* Screen 3: sentence rail */
  .rail-label{font-size:13px;font-weight:700;margin:6px 0;}
  .tile-bank,.answer-strip{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:12px;border-radius:12px;}
  .tile-bank{background:var(--grey);}
  .answer-strip{background:var(--blue-tint);border:2px dashed var(--blue);}
  .tile{font-size:17px;font-weight:700;padding:12px 18px;min-height:48px;border-radius:10px;border:2px solid var(--blue);background:var(--white);color:var(--dark);cursor:pointer;font-family:inherit;}
  .tile:hover{background:var(--blue-tint);}
  .tile.placed{background:var(--blue);color:var(--white);}
  .side-img{width:96px;height:64px;object-fit:cover;border-radius:10px;flex:0 0 auto;}
  .item-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
  .item-head h3{margin:0;}

  /* Screen 4: map */
  .map{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px 0;}
  .map-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .map-block{font-family:inherit;font-size:15px;font-weight:800;min-height:56px;padding:8px 6px;border-radius:10px;border:2px solid var(--blue);background:var(--blue);color:var(--white);cursor:pointer;overflow-wrap:break-word;}
  .map-block small{display:block;font-weight:600;font-size:12px;opacity:.95;}
  .map-block.row2{background:var(--green);border-color:var(--green);color:var(--dark);}
  .map-block[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--white);outline:3px solid var(--yellow);}
  .road{background:var(--dark);color:var(--white);text-align:center;font-weight:800;padding:12px;border-radius:10px;letter-spacing:.06em;}
  .sentence-preview{font-size:19px;font-weight:800;padding:14px 16px;background:var(--blue-tint);border-radius:10px;margin:10px 0;overflow-wrap:break-word;}
  .sbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}
  .sbs .panel{flex:1 1 220px;}

  /* Screen 5: message draft */
  .phone{border:2px solid var(--dark);border-radius:20px;padding:14px;background:#fafafa;max-width:520px;}
  .phone .from{font-size:12px;font-weight:800;opacity:.7;margin-bottom:6px;}
  .draft-text{width:100%;font-family:inherit;font-size:18px;font-weight:700;padding:12px;border-radius:12px;border:2px solid var(--blue);min-height:80px;resize:vertical;color:var(--dark);background:var(--white);}
  .draft-text:focus-visible,input[type=text]:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .word-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--grey);border-radius:12px;}
  .word-btn{font-family:inherit;font-size:18px;font-weight:700;min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--blue);background:var(--white);cursor:pointer;color:var(--dark);}
  .word-btn[aria-pressed="true"]{background:var(--yellow-tint);border-color:var(--yellow);text-decoration:line-through;}
  .route-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .route-row button[aria-pressed="true"]{background:var(--blue);color:var(--white);border-color:var(--blue);}
  .before-after{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
  .before-after .panel{flex:1 1 220px;}

  /* Screen 6: reply workspace */
  .cue-card{background:var(--blue-tint);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
  .cue-card .cue{font-size:19px;font-weight:800;}
  .reply-box{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--blue);min-height:110px;resize:vertical;color:var(--dark);}
  .reply-box:focus-visible{outline:var(--focus-ring);outline-offset:2px;}
  .reply-box[readonly]{background:var(--grey);border-color:var(--grey);}
  .phrase-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px 0;}
  .checklist{list-style:none;padding:0;margin:10px 0;}
  .checklist li{margin-bottom:8px;}
  .checklist label{display:flex;gap:10px;align-items:flex-start;font-weight:600;line-height:1.4;cursor:pointer;min-height:44px;padding:6px 0;}
  .checklist input{width:24px;height:24px;margin-top:2px;flex:0 0 auto;}
  .model-box{background:var(--green-tint);border-radius:var(--radius);padding:14px 16px;margin:12px 0;font-weight:700;}
  .note-small{font-size:13px;opacity:.8;}

  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;min-height:44px;min-width:44px;padding:10px 22px;border:2px solid var(--dark);background:var(--white);color:var(--dark);}
  button:focus-visible{outline:var(--focus-ring);outline-offset:3px;}
  button.primary{background:var(--dark);color:var(--white);}
  button.primary:disabled{background:var(--grey);color:#6a6a6a;border-color:var(--grey);cursor:not-allowed;}
  button.ghost{border-color:var(--grey);}
  button.choice{border-color:var(--blue);text-align:left;border-radius:12px;}
  button.choice:hover{background:var(--blue-tint);}
  button.choice[aria-pressed="true"].ok{background:var(--green);border-color:var(--green);}
  button.choice[aria-pressed="true"].no{background:var(--yellow-tint);border-color:var(--yellow);}
  .choice-list{display:flex;flex-direction:column;gap:8px;}
  .choice-list button{width:100%;padding:12px 16px;}
  .feedback{margin-top:12px;font-weight:700;min-height:24px;font-size:15px;}
  .symbol-ok,.symbol-no{font-weight:800;margin-right:6px;}
  input[type=text]{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--blue);width:100%;max-width:360px;min-height:44px;}
  label.field{display:block;font-weight:700;font-size:14px;margin:12px 0 4px 0;}
  footer.nav-bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;}
  footer.nav-bar .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
  .confirm-panel{background:var(--yellow-tint);border-radius:var(--radius);padding:16px 18px;margin-top:14px;}
  .confirm-panel p{font-weight:700;font-size:15px;}
  .recap{background:var(--blue-tint);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .recap dt{font-size:12px;font-weight:800;opacity:.7;margin-top:10px;}
  .recap dd{margin:2px 0 0 0;font-weight:700;overflow-wrap:break-word;}
</style>
</head>

var BUILDS = {
  A: { title: "Build the call: the service", chunks: ["I", "need", "an ambulance"], order: [2, 0, 1],

};

var PLACES = {
  mall:    { label: "Garden Mall", sub: "Shopping building", phrase: "Garden Mall", row: 1 },

};
var PLACE_ORDER = ["mall", "clinic", "park", "petrol", "library", "school"];
var ORIGINAL = "There's been an accident on the highway near the mall.";

/* Repair: accepted natural versions keep the same meaning. */
var REPAIR_RX = /^(she is|she's) (near|by|beside|next to|opposite|at) the entrance$/;

var CUE = "Which entrance are you near?";
var REPLY_MODEL = "I'm near the main entrance, beside the blue sign.";

  "My reply answers the question.",

];

/* ===== Helpers ===== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){
  return String(s).replace(/[‘’]/g,"'").toLowerCase().replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
}
function words(s){ var t = String(s).trim(); return t ? t.split(/\s+/) : []; }
function symbol(ok){ return '<span class="' + (ok ? "symbol-ok" : "symbol-no") + '" aria-hidden="true">' + (ok ? "✓" : "✗") + "</span>"; }

/* ===== State ===== */
function fresh(){
  return {
    v: 1, screen: 1,
    recall: null, noticePick: null, cmpPick: null,
    bA: [], bB: [], aTries: 0, bTries: 0, aHint: false, bHint: false, aShow: false, bShow: false,
    landmark: null, custom: "",
    repairRoute: "edit", repairText: DRAFT, removed: [], repairFinal: "", repairTries: 0, repairShow: false,
    retryOpen: false, retryText: "", retryOk: false,
    reply1: "", reply2: "", modelShown: false, checks: [false, false, false],
    completed: false
  };
}
var S = fresh();
var FB = {};              /* transient feedback messages */
var completionInFlight = false;
var completionSent = false;
var focusHeading = false;

/* ===== Derived checks ===== */
function joinBuild(id){ var b = BUILDS[id], o = S["b" + id]; return o.map(function(i){ return b.chunks[i]; }).join(" "); }
function buildOk(id){ var o = S["b" + id]; return o.length === BUILDS[id].chunks.length && BUILDS[id].targets.indexOf(norm(joinBuild(id))) !== -1; }
function repairAccept(text){ var n = norm(text); return n.indexOf("at near") === -1 && REPAIR_RX.test(n); }
function adaptSentence(){
  if(S.landmark === "custom"){
    var c = S.custom.trim().replace(/^near\s+/i, "");
    if(/^[A-Za-z][A-Za-z' -]{2,38}$/.test(c)) return "There's been an accident on the highway near " + c + ".";
    return null;
  }
  if(S.landmark && PLACES[S.landmark]) return "There's been an accident on the highway near " + PLACES[S.landmark].phrase + ".";
  return null;
}
function attempted(){ return words(S.reply1).length >= 3; }
function gate(n){
  switch(n){
    case 1: return S.recall === RECALL.correct;
    case 2: return S.noticePick === 1;
    case 3: return S.cmpPick === 1 && buildOk("A") && buildOk("B");
    case 4: return adaptSentence() !== null;
    case 5: return !!S.repairFinal && repairAccept(S.repairFinal);
    case 6: return attempted() && S.modelShown;
    default: return false;
  }
}
function allDone(){ for(var i = 1; i <= 6; i++){ if(!gate(i)) return false; } return true; }
function maxReachable(){ var m = 1; for(var i = 1; i <= 6; i++){ if(gate(i)) m = i + 1; else break; } return m; }

/* ===== Persistence (local, validated) ===== */
function save(){ try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
function clearSaved(){ try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){} }
function intOrNull(v, max){ return (typeof v === "number" && v >= 0 && v < max && Math.floor(v) === v) ? v : null; }
function cleanOrder(arr, len){
  if(!Array.isArray(arr)) return [];
  var seen = {}, out = [];
  arr.forEach(function(i){ if(typeof i === "number" && i >= 0 && i < len && !seen[i]){ seen[i] = true; out.push(i); } });
  return out;
}
function str(v, max){ return typeof v === "string" ? v.slice(0, max) : ""; }
function load(){
  var raw = null;
  try{ var t = window.localStorage.getItem(STORAGE_KEY); if(t) raw = JSON.parse(t); }catch(e){ raw = null; }
  var out = fresh();
  if(!raw || typeof raw !== "object" || raw.v !== 1) return out;
  out.recall = intOrNull(raw.recall, 3);
  out.noticePick = intOrNull(raw.noticePick, 2);
  out.cmpPick = intOrNull(raw.cmpPick, 2);
  out.bA = cleanOrder(raw.bA, BUILDS.A.chunks.length);
  out.bB = cleanOrder(raw.bB, BUILDS.B.chunks.length);
  out.aTries = Math.min(9, Math.max(0, raw.aTries | 0)); out.bTries = Math.min(9, Math.max(0, raw.bTries | 0));
  out.aShow = raw.aShow === true; out.bShow = raw.bShow === true;
  out.landmark = (raw.landmark === "custom" || PLACES[raw.landmark]) ? raw.landmark : null;
  out.custom = str(raw.custom, 40);
  out.repairRoute = raw.repairRoute === "tap" ? "tap" : "edit";
  out.repairText = str(raw.repairText, 200) || DRAFT;
  out.removed = cleanOrder(raw.removed, 6);
  out.repairFinal = repairAccept(str(raw.repairFinal, 200)) ? str(raw.repairFinal, 200) : "";
  out.repairTries = Math.min(9, Math.max(0, raw.repairTries | 0));
  out.retryOpen = raw.retryOpen === true;
  out.retryText = str(raw.retryText, 200);
  out.retryOk = raw.retryOk === true && repairAccept(out.retryText);
  out.reply1 = str(raw.reply1, 600); out.reply2 = str(raw.reply2, 600);
  out.modelShown = raw.modelShown === true && words(out.reply1).length >= 3;
  out.checks = Array.isArray(raw.checks) ? [raw.checks[0] === true, raw.checks[1] === true, raw.checks[2] === true] : [false, false, false];
  var prev = S; S = out;
  out.completed = raw.completed === true && allDone();
  var req = (typeof raw.screen === "number" && raw.screen >= 1 && raw.screen <= TOTAL) ? Math.floor(raw.screen) : 1;
  out.screen = out.completed ? Math.min(req, TOTAL) : Math.min(req, Math.min(maxReachable(), 6));
  S = prev;
  return out;
}

/* ===== Completion bridge (silent) ===== */
function findScorm(){
  var w = window, n = 0;
  while(w && n < 10){
    try{
      if(w.API_1484_11) return { v: "2004", api: w.API_1484_11 };
      if(w.API) return { v: "1.2", api: w.API };
    }catch(e){}
    if(w === w.parent) break;
    try{ w = w.parent; }catch(e){ break; }
    n++;
  }
  try{
    if(window.opener){
      if(window.opener.API_1484_11) return { v: "2004", api: window.opener.API_1484_11 };
      if(window.opener.API) return { v: "1.2", api: window.opener.API };
    }
  }catch(e){}
  return null;
}
function commitCompletion(){
  /* Resolves true when committed (or when running without any bridge), false on failure. */
  return new Promise(function(resolve){
    try{
      if(window.PazapaCompletion && typeof window.PazapaCompletion.complete === "function"){
        var r = window.PazapaCompletion.complete({ activityId: ACTIVITY_ID });
        if(r && typeof r.then === "function"){ r.then(function(x){ resolve(x !== false); }, function(){ resolve(false); }); }
        else resolve(r !== false);
        return;
      }
      var sc = findScorm();
      if(!sc){ resolve(true); return; }
      var a = sc.api, ok;
      if(sc.v === "2004"){
        a.Initialize("");
        ok = String(a.SetValue("cmi.completion_status", "completed")) === "true";
        ok = ok && String(a.Commit("")) === "true";
      } else {
        a.LMSInitialize("");
        ok = String(a.LMSSetValue("cmi.core.lesson_status", "completed")) === "true";
        ok = ok && String(a.LMSCommit("")) === "true";
      }
      resolve(ok);
    }catch(e){ resolve(false); }
  });
}
function readConfirmedCompletion(){
  try{
    if(window.PazapaCompletion && window.PazapaCompletion.isComplete === true) return true;
    var sc = findScorm();
    if(!sc) return false;
    if(sc.v === "2004") return String(sc.api.GetValue("cmi.completion_status")) === "completed";
    var s = String(sc.api.LMSGetValue("cmi.core.lesson_status"));
    return s === "completed" || s === "passed";
  }catch(e){ return false; }
}

}

var SCREENS = [screen1, screen2, screen3, screen4, screen5, screen6, screen7];

function render(){
  var active = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute("data-k") : null;
  var selStart = null, selEnd = null;
  try{ if(document.activeElement && typeof document.activeElement.selectionStart === "number"){ selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } }catch(e){}
  stage.innerHTML = SCREENS[S.screen - 1]();
  var pct = (S.screen / TOTAL) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = "Screen " + S.screen + " of " + TOTAL;
  var pw = document.getElementById("progressWrap");
  pw.setAttribute("aria-valuenow", String(S.screen));
  pw.setAttribute("aria-valuetext", "Screen " + S.screen + " of " + TOTAL);
  if(focusHeading){
    var h = stage.querySelector("h2");
    if(h){ h.focus(); announce("Screen " + S.screen + " of " + TOTAL + ". " + h.textContent); }
    focusHeading = false;
  } else if(active){
    var el = stage.querySelector('[data-k="' + active + '"]');
    if(el && !el.disabled){
      el.focus();
      try{ if(selStart !== null && typeof el.setSelectionRange === "function") el.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }
}
function go(n){
  if(n < 1 || n > TOTAL) return;
  S.screen = n; focusHeading = true; save(); render(); window.scrollTo(0, 0);
}

/* ===== Actions ===== */
var ACTIONS = {
  back: function(){ go(S.screen - 1); },
  next: function(){ if(gate(S.screen)) go(S.screen + 1); },
  recall: function(p){
    S.recall = +p;
    if(S.recall === RECALL.correct) setFB("recall", true, "Yes. That sentence retells the accident from Lesson 1.");
    else setFB("recall", false, "Not this one. Think about the accident on the way to work.");
    save(); render();
  },
  notice: function(p){
    S.noticePick = +p;
    if(S.noticePick === 1) setFB("notice", true, "Yes. Message 2 is clear.");
    else setFB("notice", false, "Not quite. Look at the little words before entrance. One word is not needed.");
    save(); render();
  },
  cmp: function(p){
    S.cmpPick = +p;
    if(S.cmpPick === 1) setFB("cmp", true, "Yes. Sentence 2 gives the place. Now build both sentences.");
    else setFB("cmp", false, "Look again. Which sentence has the highway and a landmark?");
    save(); render();
  },
  place: function(p){ var a = p.split("|"); S["b" + a[0]].push(+a[1]); delete FB["build" + a[0]]; save(); render(); },
  unplace: function(p){ var a = p.split("|"), o = S["b" + a[0]], k = o.indexOf(+a[1]); if(k !== -1) o.splice(k, 1); delete FB["build" + a[0]]; save(); render(); },
  reset: function(p){ S["b" + p] = []; delete FB["build" + p]; save(); render(); },
  hint: function(p){ if(p === "A") S.aHint = !S.aHint; else S.bHint = !S.bHint; render(); },
  checkBuild: function(p){
    var b = BUILDS[p], placed = S["b" + p];
    if(placed.length < b.chunks.length){ setFB("build" + p, false, "Place every part first, then check."); render(); return; }
    if(buildOk(p)){ setFB("build" + p, true, "Well done. That is the correct sentence."); }
    else {
      S[p === "A" ? "aTries" : "bTries"]++;
      setFB("build" + p, false, "Not yet. Read your sentence. Does it say the same as the model idea? Try a different order, or use the hint.");
    }
    save(); render();
  },
  showModel: function(p){ S[p === "A" ? "aShow" : "bShow"] = true; save(); render(); },
  place4: function(p){ S.landmark = p; S.custom = ""; save(); render(); },
  route: function(p){ S.repairRoute = p; delete FB.repair; save(); render(); },
  toggleWord: function(p){
    var i = +p, k = S.removed.indexOf(i);
    if(k === -1) S.removed.push(i); else S.removed.splice(k, 1);
    delete FB.repair; save(); render();
  },
  resetRepair: function(){ S.repairText = DRAFT; S.removed = []; delete FB.repair; save(); render(); },
  checkRepair: function(){
    var text;
    if(S.repairRoute === "edit") text = S.repairText;
    else text = ["She", "is", "at", "near", "the", "entrance."].filter(function(w, i){ return S.removed.indexOf(i) === -1; }).join(" ");
    if(repairAccept(text)){
      S.repairFinal = text.trim();
      setFB("repair", true, "Well done. For this message, one place word is enough.");
    } else {
      S.repairTries++;
      var n = norm(text);
      if(n === norm(DRAFT)) setFB("repair", false, "That is still the draft. Look at the words before entrance.");
      else if(n.indexOf("at near") !== -1 || n.indexOf("near at") !== -1) setFB("repair", false, "Close. Only one place word is needed before the entrance.");
      else setFB("repair", false, "Not yet. Keep the meaning: she is close to the entrance. Read it aloud and try again.");
    }
    save(); render();
  },
  showRepair: function(){ S.repairShow = true; save(); render(); },
  openRetry: function(){ S.retryOpen = true; save(); render(); },
  checkRetry: function(){
    if(repairAccept(S.retryText)){ S.retryOk = true; setFB("retry", true, "Well done. You repaired it without the hint."); }
    else setFB("retry", false, "Not yet. Remember: she is close to the entrance. Use one place word.");
    save(); render();
  },
  addPhrase: function(p){
    var phrases = ["I'm near the ", "beside the ", "opposite the ", "on the left / right "];
    S.reply1 = (S.reply1 ? S.reply1.replace(/\s*$/, " ") : "") + phrases[+p];
    save(); render();
  },
  checkReply: function(){
    if(!attempted()){ setFB("reply", false, "Write a short reply first. Use at least three words."); render(); return; }
    FB.replyChecked = true;
    setFB("reply", true, "Thank you. Now use the self-check, then compare with the model.");
    save(); render();
  },
  tick: function(p){ S.checks[+p] = !S.checks[+p]; save(); render(); },
  showReplyModel: function(){ if(attempted()){ S.modelShown = true; S.reply2 = S.reply2 || S.reply1; save(); render(); } },
  improve: function(){ go(6); },
  tryAgain: function(){
    var panel = document.getElementById("tryAgainConfirm");
    if(panel){ panel.style.display = "block"; var y = stage.querySelector('[data-k="tryYes"]'); if(y) y.focus(); }
  },
  tryAgainNo: function(){
    var panel = document.getElementById("tryAgainConfirm");
    if(panel) panel.style.display = "none";
    var b = stage.querySelector('[data-k="tryAgain"]'); if(b) b.focus();
  },
  tryAgainYes: function(){
    S = fresh(); FB = {}; clearSaved(); focusHeading = true; render(); window.scrollTo(0, 0);
    announce("Activity restarted. Screen 1 of " + TOTAL + ".");
  },
  done: function(){ fireCompletion(); }
};

function fireCompletion(){
  if(!allDone()) return;
  if(S.completed) return;
  if(completionSent){ S.completed = true; FB.completion = "Well done! You have completed this activity."; save(); render(); return; }
  if(completionInFlight) return;
  completionInFlight = true;
  var btn = document.getElementById("btn-done");
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  commitCompletion().then(function(ok){
    completionInFlight = false;
    if(ok){
      completionSent = true;
      S.completed = true;
      FB.completion = "Well done! You have completed this activity.";
      save(); render();
      announce("Activity completed.");
    } else {
      FB.completion = "Your completion could not be saved. Please press Done to try again.";
      render(); announce(FB.completion);
    }
  });
}

stage.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!b || b.disabled) return;
  if(b.tagName === "INPUT") return;
  var a = b.getAttribute("data-act");
  if(ACTIONS[a]) ACTIONS[a](b.getAttribute("data-p"));
});
stage.addEventListener("change", function(e){
  var t = e.target;
  if(t && t.tagName === "INPUT" && t.type === "checkbox" && t.getAttribute("data-act") === "tick"){ ACTIONS.tick(t.getAttribute("data-p")); }
});
stage.addEventListener("input", function(e){
  var t = e.target, f = t && t.getAttribute ? t.getAttribute("data-in") : null;
  if(!f) return;
  S[f] = t.value;
  if(f === "custom"){ S.landmark = t.value.trim() ? "custom" : null; var nb = document.getElementById("btn-next-live"); }
  save();
  if(f === "custom"){ render(); }
  if(f === "reply1"){ /* keep typing smooth; gate is evaluated on Check */ }
});

/* ===== Boot ===== */
S = load();
if(!S.completed && readConfirmedCompletion() && allDone()){ S.completed = true; completionSent = true; }
if(S.completed) completionSent = completionSent || false;
render();

if(typeof module !== "undefined"){ module.exports = { repairAccept: repairAccept, norm: norm }; }
})();
</script>
</body>
