<style>
  :root{
    --blue:#36BBD6; --blue-tint:#E4F5F9; --blue-deep:#1C7F96;
    --green:#C9D646; --green-tint:#F4F7DA;
    --yellow:#FCC104; --yellow-tint:#FEF3CD;
    --red:#C0352B; --grey:#EBEBEB; --dark:#2E2E2D; --white:#FFFFFF;
    --warm:#FFF9EF;
    --focus:3px solid #2E2E2D; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--dark);background:var(--white);max-width:100%;overflow-x:hidden;}
  h1,h2,h3{font-weight:800;margin:0 0 8px;line-height:1.25;}
  h2{font-size:22px;} h3{font-size:16px;}
  p{line-height:1.5;margin:0 0 10px;}
  .app{max-width:820px;margin:0 auto;padding:16px 18px 40px;}
  .brand-logo{display:block;width:130px;height:auto;margin:0 0 12px;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:8px 0 6px;border-bottom:4px solid var(--blue);margin-bottom:18px;}
  .eyebrow{font-size:13px;font-weight:700;overflow-wrap:break-word;}
  .top-bar h1{font-size:20px;margin:2px 0 0;}
  .progress-wrap{display:flex;align-items:center;gap:10px;flex:1 1 160px;min-width:0;}
  .progress-track{flex:1 1 60px;min-width:0;height:10px;background:var(--grey);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue-deep);transition:width .3s ease;}
  .progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .screen{display:none;} .screen.active{display:block;}
  button,input,textarea{font-family:inherit;}
  button{font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;min-height:44px;min-width:44px;padding:10px 22px;border:2px solid var(--dark);background:var(--white);color:var(--dark);touch-action:manipulation;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:var(--focus);outline-offset:3px;}
  button.primary{background:var(--dark);color:#fff;}
  button.primary:disabled{background:var(--grey);color:#6b6b6b;border-color:var(--grey);cursor:not-allowed;}
  button.ghost{border-color:#9a9a9a;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .nav-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--grey);}
  .nav-bar .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
  .card{border:1px solid #d9d9d9;border-radius:var(--radius);padding:16px;margin-bottom:14px;background:var(--white);}
  .feedback{margin-top:12px;font-weight:700;min-height:24px;font-size:15px;overflow-wrap:break-word;}
  .feedback .mark{font-weight:800;margin-right:6px;}
  .hintbox{background:var(--yellow-tint);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15px;}
  .hidden{display:none!important;}
  .goal-box{background:var(--blue-tint);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .goal-box .label{font-size:13px;font-weight:700;margin-bottom:4px;}
  .goal-box .goal-text{font-size:17px;font-weight:800;}

  /* ---- Composition 1: listing document + chat (screen 1) ---- */
  .scene{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media(max-width:640px){.scene{grid-template-columns:1fr;}}
  .listing{background:var(--warm);border:2px solid #ead9b3;border-radius:var(--radius);overflow:hidden;}
  .listing img{display:block;width:100%;height:auto;}
  .listing .body{padding:12px 14px;}
  .listing .name{font-weight:800;color:var(--blue-deep);letter-spacing:.02em;font-size:15px;}
  .listing ul{margin:6px 0 0;padding-left:18px;line-height:1.55;font-size:15px;}
  .chat{display:flex;flex-direction:column;gap:10px;}
  .bubble{padding:12px 16px;border-radius:16px;max-width:92%;font-size:16px;font-weight:600;line-height:1.45;}
  .bubble .who{display:block;font-size:12px;font-weight:800;opacity:.7;margin-bottom:2px;}
  .bubble.agent{background:var(--blue-tint);align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble.you{background:var(--green-tint);align-self:flex-end;border-bottom-right-radius:4px;}
  .retrieve{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:16px;}
  .opt-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .opt-list button,.opt{text-align:left;border-color:var(--blue);}
  button.correct{background:var(--green);border-color:var(--green);}
  button.wrong{background:var(--yellow-tint);border-color:var(--yellow);}
  button.sel{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* ---- Composition 2: side-by-side contrast / spotlight (screen 2) ---- */
  .versus{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.versus{grid-template-columns:1fr;}}
  .vs-card{border:3px solid var(--grey);border-radius:var(--radius);padding:16px;text-align:center;background:#fff;}
  .vs-card .sent{font-size:19px;font-weight:800;line-height:1.35;margin:8px 0 12px;}
  .vs-card button{width:100%;}
  .vs-card.picked-right{border-color:var(--green);background:var(--green-tint);}
  .vs-card.picked-wrong{border-color:var(--yellow);background:var(--yellow-tint);}
  .strike{text-decoration:line-through;text-decoration-thickness:3px;color:var(--red);}
  .mark-good{background:var(--green);padding:0 4px;border-radius:4px;}
  .explain{background:var(--blue-tint);border-radius:var(--radius);padding:14px 18px;margin-top:14px;font-weight:600;}
  .pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-weight:700;font-size:17px;}
  .pair .arrow{color:var(--blue-deep);font-weight:800;}

  /* ---- Composition 3: sentence rail (screen 3) ---- */
  .rail-wrap{background:var(--blue-tint);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .rail{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:12px;border-radius:12px;background:#fff;border:3px dashed var(--blue);align-items:center;}
  .rail .placeholder{color:#5a5a5a;font-size:14px;}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--grey);min-height:60px;}
  .chunk{font-size:17px;padding:10px 16px;border-radius:12px;border:2px solid var(--blue);background:#fff;cursor:grab;}
  .chunk.placed{background:var(--blue);color:#fff;}
  .chunk.dragging{opacity:.5;}
  .item-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .item-tabs button{border-radius:12px;}
  .item-tabs button[aria-selected="true"]{background:var(--dark);color:#fff;}
  .timeline-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:10px;}
  .badge{display:inline-block;background:var(--yellow);color:var(--dark);font-weight:800;border-radius:8px;padding:2px 10px;font-size:13px;}

  /* ---- Composition 4: fact table + sentence composer (screen 4) ---- */
  table.facts{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:15px;}
  table.facts th,table.facts td{border:1px solid #d9d9d9;padding:8px 10px;text-align:left;}
  table.facts th{background:var(--blue-tint);}
  .homes-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .homes-imgs figure{margin:0;text-align:center;font-size:13px;font-weight:700;}
  .homes-imgs img{width:100%;height:auto;border-radius:10px;display:block;}
  @media(max-width:520px){.homes-imgs{grid-template-columns:1fr;} .homes-imgs img{max-width:260px;margin:0 auto;}}
  .composer{background:var(--warm);border:2px solid #ead9b3;border-radius:var(--radius);padding:16px;}
  .composer .line{font-size:20px;font-weight:800;margin:6px 0 14px;line-height:1.4;}
  .choice-group{margin:10px 0;}
  .choice-group .lab{font-size:14px;font-weight:800;margin-bottom:6px;display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips button{border-color:var(--blue);}
  .sidebyside{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  @media(max-width:560px){.sidebyside{grid-template-columns:1fr;}}
  .sidebyside div{border-radius:12px;padding:12px;background:var(--grey);font-weight:700;}
  .sidebyside div.new{background:var(--green-tint);}
  .sidebyside small{display:block;font-size:12px;opacity:.75;margin-bottom:4px;}

  /* ---- Composition 5: editable draft message (screen 5) ---- */
  .draft{background:#fff;border:2px solid #cfcfcf;border-radius:var(--radius);overflow:hidden;}
  .draft .head{background:var(--dark);color:#fff;padding:8px 14px;font-size:14px;font-weight:700;}
  .draft .msg{padding:14px;}
  .draft .msg input[type=text],textarea{width:100%;font-size:18px;padding:12px;border:2px solid #9a9a9a;border-radius:10px;}
  textarea{min-height:140px;resize:vertical;line-height:1.5;}
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  @media(max-width:560px){.ba{grid-template-columns:1fr;}}
  .ba div{border-radius:12px;padding:12px;font-weight:700;}
  .ba .before{background:var(--yellow-tint);} .ba .after{background:var(--green-tint);}
  .ba small{display:block;font-size:12px;opacity:.75;margin-bottom:4px;}

  /* ---- Composition 6: reply workspace (screen 6) ---- */
  .workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media(max-width:700px){.workspace{grid-template-columns:1fr;}}
  .apt-card{border:2px solid #ead9b3;background:var(--warm);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .apt-card h3{color:var(--blue-deep);}
  .apt-card ul{margin:4px 0 0;padding-left:18px;line-height:1.55;font-size:15px;}
  .phrase-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .phrase-bank button{border-color:var(--green);font-size:14px;padding:6px 14px;min-height:40px;}
  .selfcheck label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.4;cursor:pointer;}
  .selfcheck input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;}
  .model{background:var(--green-tint);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px;}
  .first-version{background:var(--grey);border-radius:12px;padding:12px 14px;margin-top:10px;white-space:pre-wrap;overflow-wrap:break-word;}
  .photo{display:block;width:100%;max-width:380px;height:auto;border-radius:var(--radius);margin:0 auto 12px;}

  .confirm-panel{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 16px;margin-top:14px;}
  .confirm-panel p{font-weight:700;}
  .recap{background:var(--blue-tint);border-radius:var(--radius);padding:16px 18px;margin:10px 0 14px;}
  .recap p{margin:0 0 6px;font-weight:700;}
</style>
</head>

function $(sel,root){return (root||document).querySelector(sel);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s||"").toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();}
function announce(msg){var a=$("#srAnnounce");a.textContent="";setTimeout(function(){a.textContent=msg;},30);}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function navBar(backTo,nextLabel,nextEnabled,onNext){
  var bar=el("div","nav-bar");

  bar.appendChild(right);

      });

      rail.appendChild(b);
    });
    st.order.filter(function(ci){return st.placed.indexOf(ci)===-1;}).forEach(function(ci){
      var b=el("button","chunk",esc(it.chunks[ci]));b.type="button";

  });

       '<div class="btn-row"><button type="button" class="primary" id="sendReply">I have written my reply</button></div>'+
       '<div class="feedback" id="rFb" role="status"></div><div id="afterReply"></div></div></div>';
  var ta=$("#replyIn",sec);ta.value=y.submitted?y.first:"";
  var pb=$(".phrase-bank",sec);
  ["I'd choose Apartment ... because ...","It is ... than ...","It is cheaper / quieter / nearer."].forEach(function(p){
    var b=el("button","",esc(p));b.type="button";
    b.addEventListener("click",function(){ta.value=(ta.value?ta.value+" ":"")+p;ta.focus();});
    pb.appendChild(b);
  });
  var nb=navBar(5,"Finish",y.submitted,function(){go(7);});
  sec.appendChild(nb);sec._nb=nb;
  function drawAfter(){
    var host=$("#afterReply",sec);
    host.innerHTML='<div class="first-version"><strong>My first reply</strong><br>'+esc(y.first)+'</div>'+
      '<div class="model" id="modelBox"><small style="display:block;font-weight:600">Example reply (not the only correct answer)</small>'+esc(DATA.model)+'</div>'+
      '<div class="card selfcheck" style="margin-top:12px"><h3>Self-check</h3><p style="font-size:14px">This is your own check. The system has not marked your grammar.</p>'+
        '<label><input type="checkbox" data-i="0"> My reply fits the question (I chose a home).</label>'+
        '<label><input type="checkbox" data-i="1"> I gave two differences between the homes.</label>'+
        '<label><input type="checkbox" data-i="2"> I explained my choice with because.</label></div>'+
      '<div class="card"><h3>Improve one part</h3><label for="improveIn" class="sr-only">Improved reply</label><textarea id="improveIn" style="min-height:90px"></textarea></div>';
    var boxes=host.querySelectorAll("input[type=checkbox]");
    Array.prototype.forEach.call(boxes,function(c,i){c.checked=!!y.checks[i];c.addEventListener("change",function(){y.checks[i]=c.checked;});});
    var imp=$("#improveIn",host);imp.value=y.improved||y.first;imp.addEventListener("input",function(){y.improved=imp.value;});
  }
  if(y.submitted)drawAfter();
  $("#sendReply",sec).addEventListener("click",function(){
    var txt=ta.value.trim();
    if(txt.split(/\s+/).filter(Boolean).length<3){setFeedback($("#rFb",sec),false,"Write at least one short sentence first.");return;}
    if(!y.submitted){y.first=txt;y.submitted=true;y.improved=txt;drawAfter();ta.readOnly=true;}
    setFeedback($("#rFb",sec),true,"Reply saved. Compare it with the example and the self-check, then improve one part.");
    enableNext(nb,true);
  });
  if(y.submitted)ta.readOnly=true;
};

/* ================= SCREEN 7 – Finish ================= */
renderers[7]=function(sec){
  var y=S.reply;
  sec.innerHTML='<h2>You built a short reply about homes</h2>'+
   '<img class="photo" src="'+IMG.pair+'" alt="Two women in hijabs looking at a home listing in a bright apartment.">'+
   '<div class="recap"><p>The compound is quieter but further from work.</p><p>This apartment is nearer the metro.</p><p>This apartment is quieter.</p></div>'+
   '<div class="card"><h3>My reply</h3><div class="first-version" style="margin-top:0">'+esc(y.improved||y.first)+'</div></div>'+
   '<p id="doneNote" role="status" style="font-weight:700"></p>'+
   '<div class="confirm-panel hidden" id="confirm"><p>Start this activity over? Your answers will be cleared.</p><div class="btn-row"><button class="primary" id="yesReset" type="button">Yes, start over</button><button class="ghost" id="noReset" type="button">Cancel</button></div></div>';
  var bar=el("div","nav-bar");
  var left=el("div");var back=el("button","ghost","Back");back.type="button";back.addEventListener("click",function(){go(6);});left.appendChild(back);
  var improveBtn=el("button","ghost","Improve my reply");improveBtn.type="button";improveBtn.addEventListener("click",function(){go(6);});left.appendChild(document.createTextNode(" "));left.appendChild(improveBtn);
  var right=el("div","right");
  var tryBtn=el("button","ghost","Try again");tryBtn.type="button";
  var done=el("button","primary","Done");done.type="button";
  right.appendChild(tryBtn);right.appendChild(done);
  bar.appendChild(left);bar.appendChild(right);sec.appendChild(bar);
  function criteriaMet(){
    var b=S.build.items.every(function(x){return x.done||x.shown||x.tries>0;});
    var r=S.repair.done||S.repair.shown||S.repair.attempted;
    return b&&r&&S.reply.submitted;
  }
  function paintDone(){
    if(completionSent){done.textContent="Done ✓";done.disabled=true;$("#doneNote",sec).textContent="Well done. You have completed this activity.";}
    else{done.textContent="Done";done.disabled=!criteriaMet();}
  }
  paintDone();
  done.addEventListener("click",function(){
    if(completionInFlight||completionSent||!criteriaMet())return;
    completionInFlight=true;done.disabled=true;
    commitCompletion(function(ok){
      completionInFlight=false;
      if(ok){completionSent=true;paintDone();announce("Activity completed.");}
      else{done.disabled=false;$("#doneNote",sec).textContent="Your work was not saved this time. Press Done to try again.";}
    });
  });
  tryBtn.addEventListener("click",function(){$("#confirm",sec).classList.remove("hidden");$("#yesReset",sec).focus();});
  $("#noReset",sec).addEventListener("click",function(){$("#confirm",sec).classList.add("hidden");tryBtn.focus();});
  $("#yesReset",sec).addEventListener("click",function(){
    S=freshState();completionSent=false;completionInFlight=false;go(1);
  });
};

/* ================= COMPLETION (quiet, optional host bridge) =================
   If a host API (SCORM 1.2 / 2004) is found it is used; otherwise completion is
   local only. No score is invented. Callback(ok) is called with true only after a
   confirmed successful commit. */
function findAPI(win){
  var n=0;
  while(win&&n<8){
    try{ if(win.API_1484_11)return {v:"2004",api:win.API_1484_11}; if(win.API)return {v:"1.2",api:win.API}; }catch(e){}
    if(win===win.parent)break; win=win.parent; n++;
  }
  return null;
}
function commitCompletion(cb){
  var found=null;
  try{found=findAPI(window);}catch(e){found=null;}
  if(!found){cb(true);return;} // local completed state, no error
  try{
    var a=found.api,ok;
    if(found.v==="2004"){
      a.SetValue("cmi.completion_status","completed");
      ok=(String(a.Commit(""))==="true");
    } else {
      a.LMSSetValue("cmi.core.lesson_status","completed");
      ok=(String(a.LMSCommit(""))==="true");
    }
    cb(!!ok);
  } catch(e){ cb(false); }
}

go(1);
})();
</script>
