:root{
  --blue:#36BBD6; --green:#C9D646; --yellow:#FCC104; --red:#E6352B;
  --grey-l:#EBEBEB; --grey-d:#2E2E2D;
  --blue-t1:#EAF8FB; --blue-t2:#D7F1F7; --blue-t3:#AEE4EF;
  --green-t1:#F6F8DF; --green-t2:#EAF0AD;
  --yellow-t1:#FFF7DA; --yellow-t2:#FEE9A0;
  --cream:#FEFAF2; --white:#FFFFFF;
  --radius:18px;
  --head:'Filson Soft','Filson Soft Black','Nunito','Trebuchet MS',system-ui,sans-serif;
  --body:'Open Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--grey-d);font-family:var(--body);font-size:1.0625rem;line-height:1.55}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.2;margin:0 0 .5em;text-transform:none}
h1{font-size:1.7rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0 0 .8em}
img{max-width:100%;height:auto;display:block}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grey-d);outline-offset:3px;box-shadow:0 0 0 6px var(--white)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + progress */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px}
.eyebrow{font-weight:700;font-size:.95rem;color:var(--grey-d);background:var(--blue-t2);padding:3px 12px;border-radius:99px}
.lesson{font-family:var(--head);font-weight:800;font-size:1.05rem}
.progress{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.progress li{padding:6px 14px;border-radius:99px;background:var(--grey-l);font-size:.92rem;font-weight:600}
.progress li[aria-current="step"]{background:var(--blue);color:var(--grey-d);font-weight:700}
.progress li.done{background:var(--green-t2)}

/* buttons */
.btn{min-height:48px;min-width:48px;padding:10px 22px;border-radius:99px;border:2px solid var(--grey-d);background:var(--white);font-weight:700;cursor:pointer}
.btn:hover{background:var(--grey-l)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--grey-d)}
.btn.primary:hover{background:#2AA9C4;border-color:#2AA9C4}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;padding:6px 16px;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}

/* status line: plain dot + words, yellow only for "look again" */
.status{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:10px 14px;border-radius:12px;font-weight:600;min-height:0}
.status:empty{display:none}
.status .dot{flex:0 0 14px;height:14px;width:14px;border-radius:50%;margin-top:6px}
.status.look{background:var(--yellow-t1)} .status.look .dot{background:var(--yellow)}
.status.good{background:var(--green-t1)} .status.good .dot{background:var(--green)}
.status.info{background:var(--blue-t1)} .status.info .dot{background:var(--blue)}

section.stage{animation:fade .25s ease}
@media (prefers-reduced-motion:reduce){section.stage{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
[hidden]{display:none!important}

/* ---- Composition 1: opening scene ---- */
.scene{display:grid;grid-template-columns:1fr;gap:16px;background:#FEFAF2;border-radius:var(--radius);overflow:hidden;border:2px solid var(--grey-l)}
.scene .copy{padding:22px 22px 8px}
.scene .art{background:#FEFAF2}
.scene .art img{width:100%}
@media(min-width:820px){
  .scene{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center}
  .scene .copy{padding:30px 10px 30px 32px}
}
.docchip{display:inline-block;background:var(--yellow-t2);border-radius:10px;padding:4px 12px;font-weight:700;margin-bottom:12px}
.guess{border:0;padding:0;margin:14px 0 0}
.guess legend{font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chip span{display:inline-block;min-height:48px;padding:11px 18px;border-radius:99px;border:2px solid var(--grey-d);background:var(--white);font-weight:600}
.chip input:checked+span{background:var(--blue-t2);border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.chip input:focus-visible+span{outline:3px solid var(--grey-d);outline-offset:3px}

/* ---- Composition 2: document + question ---- */
.read-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.read-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.slip{position:relative;background:var(--white);border:2px solid var(--grey-d);border-radius:14px;padding:18px 20px 20px 34px;box-shadow:6px 6px 0 var(--blue-t3)}
.slip::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;border-left:3px dotted var(--blue)}
.slip .label{font-family:var(--head);font-weight:800;font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slip .label small{font-family:var(--body);font-weight:600;background:var(--grey-l);border-radius:8px;padding:2px 10px}
.slip .text{font-size:1.15rem;line-height:1.8;margin:0}
.slipart{display:none}
@media(min-width:900px){.slipart{display:block;margin-top:16px;border-radius:14px;overflow:hidden;border:2px solid var(--grey-l)}}
.qpanel{background:var(--blue-t1);border-radius:var(--radius);padding:18px 20px;border:2px solid var(--blue-t2)}
.qbig{font-family:var(--head);font-weight:800;font-size:1.25rem;margin-bottom:10px}
textarea,.note input{width:100%;border:2px solid var(--grey-d);border-radius:12px;background:var(--white);padding:10px 12px;min-height:48px}
textarea{min-height:96px;resize:vertical}
label.lab{display:block;font-weight:700;margin-bottom:6px}
.model{background:var(--white);border-left:6px solid var(--green);border-radius:10px;padding:12px 16px;margin-top:12px}
.model strong{display:block;margin-bottom:4px}
.selfcheck{display:flex;gap:10px;align-items:flex-start;margin-top:12px;min-height:48px}
.selfcheck input{width:24px;height:24px;margin-top:3px;flex:0 0 24px}
.gloss{margin-top:14px;border:2px dashed var(--blue);border-radius:12px;background:var(--white)}
.gloss summary{cursor:pointer;padding:10px 14px;font-weight:700;min-height:48px;display:flex;align-items:center}
.gloss dl{margin:0;padding:0 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.gloss dt{font-weight:700}.gloss dd{margin:0}

/* ---- Composition 3: message thread ---- */
.thread-grid{display:grid;grid-template-columns:1fr;gap:20px}

.slipcol{order:0}
.slipcol .slip{padding-left:34px}
.sent{display:inline;background:none;border:0;border-radius:6px;padding:2px 3px;margin:0;font:inherit;line-height:inherit;color:inherit;text-align:left;cursor:pointer;border-bottom:2px dotted var(--blue);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:var(--blue-t1)}
.sent[aria-pressed="true"]{background:var(--blue-t2);border-bottom:4px solid var(--blue);font-weight:700}
.sent.ok{background:var(--green-t2);border-bottom:4px solid var(--green);font-weight:700}
.sent[disabled]{cursor:default;color:inherit}
.sent[disabled]:not(.ok){opacity:.85}
.hint-line{font-size:.92rem;margin:10px 0 0;font-weight:600}
.msg{max-width:92%;margin:0 0 12px}
.msg .who{font-size:.85rem;font-weight:700;margin:0 0 2px 6px}
.bubble{padding:11px 15px;border-radius:18px;background:var(--grey-l)}
.msg.hana .bubble{background:var(--green-t2);border-bottom-left-radius:4px}
.msg.asst .bubble{background:var(--blue-t2);border-bottom-left-radius:4px}
.msg.you{margin-left:auto}
.msg.you .who{text-align:right;margin-right:6px}
.msg.you .bubble{background:var(--white);border:2px solid var(--blue);border-bottom-right-radius:4px}
.qcard{border:2px solid var(--grey-l);border-radius:var(--radius);background:var(--white);padding:14px 16px;margin:0 0 20px}
.qcard.locked{opacity:.5}
.stepname{font-weight:700;font-size:.9rem;background:var(--grey-l);display:inline-block;border-radius:8px;padding:2px 10px;margin-bottom:8px}
.choices{display:grid;gap:8px;margin:10px 0 0}
.choice{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--grey-d);background:var(--white);font-weight:600;cursor:pointer;text-align:left;width:100%}
.choice:hover{background:var(--grey-l)}
.choice[aria-pressed="true"]{background:var(--blue-t2);border-color:var(--blue)}
.choice[disabled]{cursor:default;opacity:.8}
.choice.right{background:var(--green-t2);border-color:var(--green)}
.note{background:var(--yellow-t1);border:2px dashed var(--yellow);border-radius:12px;padding:12px 14px;margin-top:10px}
.note .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note .row label{font-weight:700}
.note input{max-width:260px}
.evidence{font-size:.95rem;margin-top:8px;padding:8px 12px;background:var(--green-t1);border-radius:10px}

/* ---- Composition 4: reply workspace ---- */
.work{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.work{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.pad{background:var(--white);border:2px solid var(--grey-d);border-radius:var(--radius);overflow:hidden}
.pad .bar{background:var(--grey-d);color:var(--white);font-family:var(--head);font-weight:800;padding:10px 16px}
.pad .body{padding:16px}
.situation{background:var(--yellow-t1);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:14px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.mini{background:var(--cream);border:2px solid var(--grey-l);border-radius:var(--radius);padding:14px 16px}
.mini .text{margin:0}
.mini h3{font-size:1rem}
.deskart{border-radius:14px;overflow:hidden;margin-bottom:14px;border:2px solid var(--grey-l);background:#FDF6ED}

/* ---- Closing ---- */
.strip{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0}
@media(min-width:700px){.strip{grid-template-columns:repeat(3,1fr)}}
.stepcard{background:var(--white);border:2px solid var(--grey-l);border-radius:var(--radius);overflow:hidden}
.stepcard figcaption{padding:10px 14px 14px;font-weight:700}
.stepcard figcaption span{display:block;font-weight:600;font-size:.9rem;color:var(--grey-d);opacity:.85}
.stepcard img{width:100%}
.summary{background:var(--green-t1);border-radius:var(--radius);padding:16px 20px;border:2px solid var(--green-t2)}
.mine{background:var(--white);border:2px solid var(--blue-t2);border-radius:12px;padding:10px 14px;margin-top:10px}
details.again{margin-top:14px}
details.again summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700}
</style>

var AUDIO_FILES = {};   // none supplied: no audio control is shown

var SENTENCES = [
  {id:'s1', t:'Appointment: Wednesday, 9:30.'},
  {id:'s2', t:'Ticket: 32.'},
  {id:'s3', t:'Please check in at the front desk first.'},
  {id:'s4', t:'Then wait near counter four.'},
  {id:'s5', t:'When your number appears, go to the counter.'},
  {id:'s6', t:'After the appointment, ask reception where to find your result message.'},
  {id:'s7', t:'This is a fictional practice slip; real appointment instructions may differ.'}
];
function sentText(id){ for(var i=0;i<SENTENCES.length;i++) if(SENTENCES[i].id===id) return SENTENCES[i].t; return ''; }

var PURPOSE_MODEL = 'It tells the reader what to do at an appointment: check in, wait for the number, go to the counter, and ask about the result message.';

var QS = [
  {id:'time', ask:'What time is the appointment?', evidence:['s1'], evHint:'Look for the sentence with the time.',
   type:'choice', options:['9:30','9:00','10:30'], key:'9:30', answerText:'9:30',
   wrong:{def:'The slip gives a different time. Read the sentence you selected again.'}},
  {id:'counter', ask:'Which counter should she wait near?', evidence:['s4'], evHint:'Look for the sentence about waiting.',
   type:'note', answerText:'Counter four', noteLabel:'Wait near:'},
  {id:'result', ask:'Where should she ask about the result message?', evidence:['s6'], evHint:'Look for the sentence about the result message.',
   type:'choice', options:['Reception','Counter four','The ticket machine'], key:'Reception', answerText:'Reception',
   wrong:{'Counter four':'Counter four is where she waits. The last sentence tells you where to ask.',
          'The ticket machine':'The slip does not mention a ticket machine. Read the last sentence.',
          def:'Read the last sentence again.'}}
];

var GLOSS = [
  ['ticket number','the number that shows your turn'],
  ['counter','a desk where staff help people'],
  ['result','what you find out after a test']
];

var STAGES = [
  {key:'preview', name:'Preview'},
  {key:'read',    name:'Read'},
  {key:'details', name:'Find the details'},
  {key:'action',  name:'Choose an action'},
  {key:'finish',  name:'Finish'}
];

/* ----------------------------------------------------------------- STATE */
var state, completionInFlight=false, completionSent=false;
function freshState(){
  return {
    stage:0, guess:null,
    purpose:{shown:false, text:'', checked:false, self:false},
    q:QS.map(function(){return {ev:null, evOk:false, ans:null, tries:0, done:false, revealed:false, text:''};}),
    action:{text:'', tries:0, shown:false, ok:false, hint:'', self:[false,false,false]},
    shuffled:{}
  };
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function reshuffle(){ state.shuffled={}; QS.forEach(function(q){ if(q.type==='choice') state.shuffled[q.id]=shuffle(q.options); }); }
state=freshState(); reshuffle();

/* --------------------------------------------------------------- HELPERS */
var main=document.getElementById('main'), live=document.getElementById('live'), prog=document.getElementById('progress');
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function announce(msg){ live.textContent=''; setTimeout(function(){live.textContent=msg;},30); }
function status(kind,msg){ return msg?'<div class="status '+kind+'"><span class="dot" aria-hidden="true"></span><span>'+esc(msg)+'</span></div>':''; }
function norm(s){ return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim(); }
function words(s){ var m=norm(s).match(/[a-z0-9:'.]+/g); return m?m.length:0; }

function slipHTML(opts){
  opts=opts||{};
  var h='';
  SENTENCES.forEach(function(s,i){
    var sp=(i>0?' ':'');
    if(opts.interactive){
      var q=activeQ(), cls='sent', pressed=false, dis=false;
      var okIds=resolvedEvidence();
      if(okIds.indexOf(s.id)>-1){cls+=' ok';dis=true;}
      else if(q!==null && state.q[q].ev===s.id){pressed=true;}
      if(q===null) dis=true;
      else if(state.q[q].evOk) dis=true;
      h+=sp+'<button type="button" class="'+cls+'" data-act="sent" data-id="'+s.id+'" aria-pressed="'+(pressed?'true':'false')+'"'+(dis?' disabled':'')+'>'+esc(s.t)+'</button>';
    } else {
      h+=sp+esc(s.t);
    }
  });
  return h;
}
function slipCard(opts){
  return '<div class="slip"><div class="label"><span>Practice appointment slip</span><small>Practice slip</small></div>'
   +'<p class="text">'+slipHTML(opts)+'</p></div>';
}
function glossHTML(){
  var h='<details class="gloss"><summary>Word help</summary><dl>';
  GLOSS.forEach(function(g){ h+='<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'; });
  return h+'</dl></details>';
}
function resolvedEvidence(){
  var ids=[]; QS.forEach(function(q,i){ if(state.q[i].evOk) ids=ids.concat(q.evidence); }); return ids;
}
function activeQ(){ // index of first unresolved question, or null
  for(var i=0;i<QS.length;i++) if(!state.q[i].done) return i;
  return null;
}
function detailsComplete(){ return state.q.every(function(x){return x.done;}); }
function img(key,alt){ return '<img src="'+IMG[key]+'" alt="'+esc(alt)+'">'; }

/* --------------------------------------------------------------- RENDER */
function renderProgress(){
  prog.innerHTML='';
  STAGES.forEach(function(s,i){
    var li=document.createElement('li'); li.textContent=s.name;
    if(i===state.stage) li.setAttribute('aria-current','step'); else if(i<state.stage) li.className='done';
    prog.appendChild(li);
  });
}
function render(focusHeading){
  renderProgress();
  var fn=[stagePreview,stageRead,stageDetails,stageAction,stageFinish][state.stage];
  main.innerHTML='<section class="stage" aria-labelledby="h">'+fn()+'</section>';
  if(focusHeading){ var h=document.getElementById('h'); if(h){h.setAttribute('tabindex','-1'); h.focus({preventScroll:false}); } }
}

/* ---- Stage 1: opening scene ---- */
function stagePreview(){
  var opts=['At a medical centre','At a bank','At a school','At a shop'];
  var chips=opts.map(function(o,i){
    return '<label class="chip"><input type="radio" name="guess" value="'+esc(o)+'" data-act="guess"'+(state.guess===o?' checked':'')+'><span>'+esc(o)+'</span></label>';
  }).join('');
  return '<div class="scene"><div class="copy">'
   +'<span class="docchip">Practice appointment slip</span>'
   +'<h2 id="h">Before you read</h2>'
   +'<p class="qbig">What is this text mainly helping the reader understand or do?</p>'
   +'<fieldset class="guess"><legend>Where would you see this kind of text?</legend><div class="chips">'+chips+'</div></fieldset>'
   +'<div id="guessmsg" aria-live="polite">'+(state.guess?status('info','Good idea. Read the slip to find out.'):'')+'</div>'
   +'<div class="actions"><button type="button" class="btn primary" data-act="go" data-to="1">Read the slip</button></div>'
   +'</div><div class="art">'+img('journey','Illustration: a woman moves through a centre. She checks in, has a test, gives fingerprints and has a photo taken.')+'</div></div>';
}

/* ---- Stage 2: read for purpose ---- */
function stageRead(){
  var p=state.purpose;
  var q='';
  if(!p.shown){
    q='<div class="qpanel"><h3>What is this slip for?</h3><p>Read the slip first. Read it again if you need to.</p>'
     +'<button type="button" class="btn primary" data-act="showq">Show the question</button></div>';
  } else {
    q='<div class="qpanel"><p class="qbig" id="pq">What is this text mainly helping the reader understand or do?</p>'
     +'<label class="lab" for="purp">Write your idea in one short sentence.</label>'
     +'<textarea id="purp" data-act="purp-in" aria-describedby="pq">'+esc(p.text)+'</textarea>'
     +'<div class="actions" style="margin-top:12px"><button type="button" class="btn primary small" data-act="purp-check">Check my idea</button></div>'
     +'<div id="pst">'+(p.hint?status('look',p.hint):'')+'</div>'
     +(p.checked
        ?'<div class="model"><strong>A model idea</strong>'+esc(PURPOSE_MODEL)+'</div>'
         +'<label class="selfcheck"><input type="checkbox" data-act="purp-self"'+(p.self?' checked':'')+'><span>My idea is close to the model.</span></label>'
         +status('info','There is no one right sentence. Your idea can use different words.')
        :'')
     +'</div>';
  }
  return '<h2 id="h">Read the slip</h2>'
   +'<div class="read-grid"><div>'+slipCard({})
   +'<div class="actions" style="margin-top:12px"><button type="button" class="btn small" data-act="readtext">Read the text</button></div>'
   +glossHTML()
   +'<div class="slipart">'+img('ticket','Illustration: a woman holds a small ticket.')+'</div></div>'
   +'<div>'+q+'</div></div>'
   +'<div class="actions"><button type="button" class="btn" data-act="reset-purpose">Try again</button>'
   +'<button type="button" class="btn primary" data-act="go" data-to="2"'+(p.checked?'':' disabled')+'>Find the details</button></div>';
}

/* ---- Stage 3: message thread + evidence ---- */
function stageDetails(){
  var ai=activeQ();
  var thread='';
  thread+='<div class="msg hana"><p class="who">Hana</p><div class="bubble">Hello! I have my slip. Can you help me read it?</div></div>';
  thread+='<div class="msg asst"><p class="who">Assistant</p><div class="bubble">Yes. For each question, tap the sentence in the slip that helps. Then answer.</div></div>';
  QS.forEach(function(q,i){
    var s=state.q[i];
    var visible=(i===0)||state.q[i-1].done;
    if(!visible){ return; }
    thread+='<div class="qcard" id="q'+i+'"><span class="stepname">'+(i===0?'Select the evidence, then choose':i===1?'Select the evidence, then write a note':'Select the evidence, then choose an answer')+'</span>'
      +'<div class="msg hana" style="max-width:100%"><p class="who">Hana</p><div class="bubble">'+esc(q.ask)+'</div></div>';
    if(s.done){
      thread+='<div class="msg you"><p class="who">You</p><div class="bubble">'+esc(s.revealed?q.answerText:(q.type==='choice'?s.ans:s.text))+'</div></div>'
        +'<div class="evidence"><strong>'+(s.revealed?'The answer is '+esc(q.answerText)+'.':'That matches the slip.')+'</strong> The slip says: &ldquo;'+esc(sentText(q.evidence[0]))+'&rdquo;</div>';
    } else {
      // evidence step
      if(!s.evOk){
        thread+='<p class="hint-line">Step 1. Tap the sentence in the slip that helps you answer.</p>'
          +'<div id="evst">'+(s.evHint?status('look',s.evHint):'')+'</div>';
      } else {
        thread+='<div class="status good"><span class="dot" aria-hidden="true"></span><span>Evidence found: &ldquo;'+esc(sentText(q.evidence[0]))+'&rdquo;</span></div>'
          +'<p class="hint-line">Step 2. Now answer.</p>'+answerControls(i);
      }
    }
    thread+='</div>';
  });
  var all=detailsComplete();
  var slip='<div class="slipcol"><h3>The slip</h3>'+slipCard({interactive:true})+glossHTML()+'</div>';
  return '<h2 id="h">Find the details</h2>'
   +'<div class="thread-grid">'+slip+'<div class="thread" aria-label="Message thread">'+thread+'</div></div>'
   +'<div class="actions"><button type="button" class="btn" data-act="reset-details">Try again</button>'
   +'<button type="button" class="btn primary" data-act="go" data-to="3"'+(all?'':' disabled')+'>Choose an action</button></div>';
}
function answerControls(i){
  var q=QS[i], s=state.q[i], h='';
  if(q.type==='choice'){
    h+='<div class="choices" role="group" aria-label="Choose an answer">';
    state.shuffled[q.id].forEach(function(o){
      h+='<button type="button" class="choice" data-act="choose" data-q="'+i+'" data-v="'+esc(o)+'" aria-pressed="'+(s.ans===o?'true':'false')+'">'+esc(o)+'</button>';
    });
    h+='</div>';
  } else {
    h+='<div class="note"><div class="row"><label for="note'+i+'">'+esc(q.noteLabel)+'</label>'
      +'<input id="note'+i+'" type="text" autocomplete="off" data-act="note-in" data-q="'+i+'" value="'+esc(s.text)+'">'
      +'<button type="button" class="btn small primary" data-act="note-check" data-q="'+i+'">Check my note</button></div></div>';
  }
  h+='<div id="ast'+i+'">'+(s.hint?status('look',s.hint):'')+'</div>';
  return h;
}

/* ---- Stage 4: action workspace ---- */
function stageAction(){
  var a=state.action;
  var starters=['First, ...','Then, ...','Please ask: ...'].map(function(t){
    return '<button type="button" class="btn small" data-act="starter" data-t="'+esc(t.replace(' ...',' '))+'">'+esc(t)+'</button>';
  }).join('');
  var result='';
  if(a.shown){
    result='<div class="model"><strong>A model sentence</strong>First, check in at the front desk. Then wait near counter four. After that, ask reception about your result message.<br>To check one detail: &ldquo;Is my ticket number 32?&rdquo;</div>'
      +'<fieldset style="border:0;padding:0;margin:12px 0 0"><legend style="font-weight:700">Check your sentence</legend>'
      +['I used a detail from the slip.','My detail matches the slip.','My sentence helps Hana do something.'].map(function(t,i){
        return '<label class="selfcheck"><input type="checkbox" data-act="act-self" data-i="'+i+'"'+(a.self[i]?' checked':'')+'><span>'+esc(t)+'</span></label>';
      }).join('')+'</fieldset>';
  }
  return '<h2 id="h">Choose an action</h2>'
   +'<div class="work"><div class="pad"><div class="bar">Your reply to Hana</div><div class="body">'
   +'<div class="situation">Explain three appointment steps to Hana and check one detail with the assistant.</div>'
   +'<label class="lab" for="act">Write one short sentence for Hana. Use one detail from the slip.</label>'
   +'<div class="starters" aria-label="Optional sentence starters">'+starters+'</div>'
   +'<textarea id="act" data-act="act-in">'+esc(a.text)+'</textarea>'
   +'<div class="actions" style="margin-top:12px"><button type="button" class="btn primary small" data-act="act-check">Check my sentence</button></div>'
   +'<div id="actst">'+(a.hint?status('look',a.hint):(a.ok?status('good','Your sentence uses a detail from the slip.'):''))+'</div>'
   +result
   +'</div></div>'
   +'<div><div class="deskart">'+img('desk','Illustration: a woman gives a small card to a reception assistant at a desk.')+'</div>'
   +'<div class="mini"><h3>The slip</h3><p class="text">'+slipHTML({})+'</p></div>'+glossHTML()+'</div></div>'
   +'<div class="actions"><button type="button" class="btn" data-act="reset-action">Try again</button>'
   +'<button type="button" class="btn primary" data-act="go" data-to="4"'+(a.shown?'':' disabled')+'>Finish reading</button></div>';
}

/* ---- Stage 5: close ---- */
function stageFinish(){
  var a=state.action;
  var doneBtnDisabled=completionSent||completionInFlight;
  return '<h2 id="h">You read the slip and chose an action</h2>'
   +'<div class="summary"><p style="margin:0">You found what the slip is for, three useful details, and one next step for Hana.</p></div>'
   +'<div class="strip">'
   +'<figure class="stepcard" style="margin:0">'+img('counter','Illustration: a woman gives a card to an assistant at a front desk.')+'<figcaption><span>First</span>Check in at the front desk.</figcaption></figure>'
   +'<figure class="stepcard" style="margin:0">'+img('queue','Illustration: four women wait in a line.')+'<figcaption><span>Then</span>Wait near counter four.</figcaption></figure>'
   +'<figure class="stepcard" style="margin:0">'+img('result','Illustration: an envelope with a medical letter next to a calendar.')+'<figcaption><span>After the appointment</span>Ask reception about your result message.</figcaption></figure>'
   +'</div>'
   +(a.text?'<div class="mine"><strong>Your sentence for Hana</strong><p style="margin:4px 0 0">'+esc(a.text)+'</p></div>':'')
   +'<details class="again"><summary>Read the slip again</summary>'+slipCard({})+'</details>'
   +'<p style="margin-top:16px">Next, use these details in the Communication Mission.</p>'
   +'<div id="donest">'+(completionSent?status('good','You finished this reading.'):'')+'</div>'
   +'<div class="actions"><button type="button" class="btn" data-act="reset-all">Try again</button>'
   +'<button type="button" class="btn primary" data-act="done"'+(doneBtnDisabled?' disabled':'')+'>Done</button></div>';
}

/* ---------------------------------------------------------------- LOGIC */
function setHTML(id,html){ var e=document.getElementById(id); if(e) e.innerHTML=html; }

function evaluateAction(text){
  var t=norm(text), accurate=[], bad=[];
  if(/\b9[:.]30\b|nine thirty|half past nine/.test(t)) accurate.push('time');
  if(/(ticket|number)[^.]*\b(32|thirty[- ]two)\b/.test(t)) accurate.push('ticket');
  if(/front desk|check[ -]?in|checked in/.test(t)) accurate.push('desk');
  if(/counter (four|4)\b/.test(t)) accurate.push('counter');
  if(/reception/.test(t)) accurate.push('reception');
  if(/result message/.test(t)) accurate.push('result');
  if(/wednesday/.test(t)) accurate.push('day');
  if(/\bwait/.test(t)) accurate.push('wait');
  var m, re=/\b(\d{1,2})[:.](\d{2})\b/g;
  while((m=re.exec(t))){ if(!(m[1]==='9'&&m[2]==='30')) bad.push({k:'time',msg:'Check the time. Look at the first sentence in the slip.'}); }
  re=/counter\s+(\d+|one|two|three|five|six|seven|eight|nine|ten)\b/g;
  while((m=re.exec(t))){ if(m[1]!=='4'&&m[1]!=='four') bad.push({k:'counter',msg:'Check the counter. Look at the sentence that begins “Then wait”.'}); }
  re=/ticket(?:\s+number)?\s*(?:is|:)?\s*(\d+)/g;
  while((m=re.exec(t))){ if(m[1]!=='32') bad.push({k:'ticket',msg:'Check the ticket number. Look at the second line of the slip.'}); }
  if(/\b(monday|tuesday|thursday|friday|saturday|sunday)\b/.test(t)) bad.push({k:'day',msg:'Check the day. Look at the first sentence in the slip.'});
  if(/\b(insurance|pay|paid|payment|fee|fees|free|approved|permission|visa)\b/.test(t)) bad.push({k:'ns',msg:'The slip does not say that. Use only what the slip says.'});
  return {accurate:accurate, bad:bad};
}
function parseCounterNote(t){
  var n=norm(t).replace(/[.!]/g,'');
  if(/^((near|at) )?(counter )?(four|4)$/.test(n)) return 'ok';
  if(/(\b\d+\b|one|two|three|five|six|seven|eight|nine|ten)/.test(n) && !/(four|4)/.test(n)) return 'other';
  return 'no';
}

document.addEventListener('input',function(e){
  var t=e.target, a=t.getAttribute&&t.getAttribute('data-act');
  if(a==='purp-in') state.purpose.text=t.value;
  else if(a==='act-in') state.action.text=t.value;
  else if(a==='note-in') state.q[+t.getAttribute('data-q')].text=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target, a=t.getAttribute&&t.getAttribute('data-act');
  if(a==='guess'){ state.guess=t.value; setHTML('guessmsg',status('info','Good idea. Read the slip to find out.')); announce('Good idea. Read the slip to find out.'); }
  else if(a==='purp-self') state.purpose.self=t.checked;
  else if(a==='act-self') state.action.self[+t.getAttribute('data-i')]=t.checked;
});
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el||el.disabled) return;
  var a=el.getAttribute('data-act');
  switch(a){
    case 'go': state.stage=+el.getAttribute('data-to'); render(true); window.scrollTo(0,0); break;
    case 'showq': state.purpose.shown=true; render(false); var p=document.getElementById('purp'); if(p) p.focus(); break;
    case 'readtext': var sl=document.querySelector('.slip'); if(sl){ sl.setAttribute('tabindex','-1'); sl.focus(); } break;
    case 'purp-check':
      var pt=document.getElementById('purp'); state.purpose.text=pt?pt.value:state.purpose.text;
      if(words(state.purpose.text)<2){ state.purpose.hint='Write a short idea first.'; state.purpose.checked=false; render(false); var p2=document.getElementById('purp'); if(p2)p2.focus(); announce(state.purpose.hint); }
      else { state.purpose.hint=''; state.purpose.checked=true; render(false); announce('Here is a model idea. Compare it with your idea.'); var pst=document.querySelector('.model'); if(pst){pst.setAttribute('tabindex','-1');pst.focus();} }
      break;
    case 'reset-purpose': state.purpose={shown:false,text:'',checked:false,self:false,hint:''}; render(false); announce('This screen was reset.'); break;
    case 'sent': pickEvidence(el.getAttribute('data-id')); break;
    case 'choose': answerChoice(+el.getAttribute('data-q'), el.getAttribute('data-v')); break;
    case 'note-check': answerNote(+el.getAttribute('data-q')); break;
    case 'reset-details':
      state.q=QS.map(function(){return {ev:null,evOk:false,ans:null,tries:0,done:false,revealed:false,text:'',hint:'',evHint:''};});
      reshuffle(); render(false); announce('This screen was reset.'); break;
    case 'starter':
      var ta=document.getElementById('act'); if(ta){ ta.value=(ta.value?ta.value+' ':'')+el.getAttribute('data-t'); state.action.text=ta.value; ta.focus(); } break;
    case 'act-check': checkAction(); break;
    case 'reset-action': state.action={text:'',tries:0,shown:false,ok:false,hint:'',self:[false,false,false]}; render(false); announce('This screen was reset.'); break;
    case 'reset-all': state=freshState(); reshuffle(); render(true); window.scrollTo(0,0); announce('The activity was reset.'); break;
    case 'done': finish(); break;
  }
});

function pickEvidence(id){
  var i=activeQ(); if(i===null) return;
  var q=QS[i], s=state.q[i];
  s.ev=id;
  if(q.evidence.indexOf(id)>-1){ s.evOk=true; s.evHint=''; render(false); announce('Evidence found. Now answer.'); focusQ(i); }
  else { s.evHint='That sentence does not answer this question. '+q.evHint; render(false); announce(s.evHint); }
}
function focusQ(i){ var c=document.getElementById('q'+i); if(c){ var f=c.querySelector('.choice,input[type=text]'); if(f) f.focus(); } }
function resolve(i,revealed){ var s=state.q[i]; s.done=true; s.revealed=revealed; s.hint=''; render(false);
  announce(revealed?'The answer is '+QS[i].answerText+'.':'Correct. That matches the slip.');
  var n=document.getElementById('q'+(i+1)); if(n){ n.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
function answerChoice(i,v){
  var q=QS[i], s=state.q[i]; s.ans=v; s.tries++;
  if(v===q.key){ resolve(i,false); return; }
  if(s.tries>=2){ resolve(i,true); return; }
  s.hint=(q.wrong[v]||q.wrong.def); render(false); announce(s.hint);
  var c=document.getElementById('q'+i); if(c){ var f=c.querySelector('.choice'); if(f) f.focus(); }
}
function answerNote(i){
  var s=state.q[i], inp=document.getElementById('note'+i); if(inp) s.text=inp.value;
  if(!norm(s.text)){ s.hint='Write the counter in your note first.'; render(false); announce(s.hint); var n0=document.getElementById('note'+i); if(n0)n0.focus(); return; }
  s.tries++;
  var r=parseCounterNote(s.text);
  if(r==='ok'){ s.text='Counter four'; resolve(i,false); return; }
  if(s.tries>=2){ resolve(i,true); return; }
  s.hint=(r==='other'?'The slip names a different counter. Read the sentence you selected again.':'Check your note. The sentence you selected names the counter.');
  render(false); announce(s.hint); var n=document.getElementById('note'+i); if(n) n.focus();
}
function checkAction(){
  var a=state.action, ta=document.getElementById('act'); if(ta) a.text=ta.value;
  if(words(a.text)<3){ a.hint='Write one short sentence first.'; a.ok=false; render(false); announce(a.hint); var t0=document.getElementById('act'); if(t0)t0.focus(); return; }
  a.tries++;
  var r=evaluateAction(a.text);
  if(r.bad.length){ a.hint=r.bad[0].msg; a.ok=false; }
  else if(!r.accurate.length){ a.hint='Add one detail from the slip: a time, a counter, a place or a ticket number.'; a.ok=false; }
  else { a.hint=''; a.ok=true; }
  if(a.ok || a.tries>=2){ a.shown=true; }
  render(false);
  announce(a.ok?'Your sentence uses a detail from the slip. A model sentence is shown.':(a.shown?a.hint+' A model sentence is shown.':a.hint));
  var t1=document.getElementById('act'); if(t1&&!a.shown) t1.focus();
}

/* --------------------------------------------------- COMPLETION (silent) */
function findAPI(win){
  var tries=0;
  while(win && tries<12){
    try{
      if(win.API_1484_11) return {api:win.API_1484_11, v:'2004'};
      if(win.API) return {api:win.API, v:'1.2'};
    }catch(err){}
    if(win.parent===win) break; win=win.parent; tries++;
  }
  try{ if(window.opener&&!window.opener.closed){ var o=window.opener; if(o.API_1484_11) return {api:o.API_1484_11,v:'2004'}; if(o.API) return {api:o.API,v:'1.2'}; } }catch(err){}
  return null;
}
var bridge=null, bridgeInit=false;
function initBridge(){
  if(bridgeInit) return; bridgeInit=true;
  bridge=findAPI(window);
  if(!bridge) return;
  try{
    var ok=(bridge.v==='2004')?bridge.api.Initialize(''):bridge.api.LMSInitialize('');
    var st=(bridge.v==='2004')?bridge.api.GetValue('cmi.completion_status'):bridge.api.LMSGetValue('cmi.core.lesson_status');
    if(st==='completed'||st==='passed'){ completionSent=true; }
  }catch(err){}
}
function commitCompletion(){
  // returns true only after a confirmed commit; with no bridge, local completion is fine
  if(window.PazapaBridge && typeof window.PazapaBridge.complete==='function'){
    try{ return window.PazapaBridge.complete('A2-W03-L2-S5')!==false; }catch(err){ return false; }
  }
  if(!bridge) return true;
  try{
    var a=bridge.api, good;
    if(bridge.v==='2004'){ a.SetValue('cmi.completion_status','completed'); good=a.Commit(''); }
    else { a.LMSSetValue('cmi.core.lesson_status','completed'); good=a.LMSCommit(''); }
    return (good===true||good==='true');
  }catch(err){ return false; }
}
function finish(){
  if(completionInFlight||completionSent) return;
  var ready=state.purpose.checked && detailsComplete() && state.action.shown;
  if(!ready) return;
  completionInFlight=true;
  var ok=commitCompletion();
  completionInFlight=false;
  if(ok) completionSent=true;
  // Always show a plain local completion line. No LMS or save message is shown.
  setHTML('donest',status('good','You finished this reading.'));
  var d=document.querySelector('[data-act="done"]'); if(d && completionSent) d.disabled=true;
  announce('You finished this reading.');
}
initBridge();
window.addEventListener('beforeunload',function(){
  try{ if(bridge){ if(bridge.v==='2004') bridge.api.Terminate(''); else bridge.api.LMSFinish(''); } }catch(err){}
});

render(false);
})();
</script>
