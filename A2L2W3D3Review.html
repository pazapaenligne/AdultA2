<!--
  Week 3, Lesson 3 | Collecting my ID card | activity id A2-W03-L3-S7
  Pazapa English Programme for Adults | A2 | Step 7: Review, Improve and Retry
  Navigation is forward-only (Carry on). Every part has its own Try again; the last screen has Try again beside Done.
  Closed-item answers are accepted case-insensitively, ignoring extra spaces and final punctuation; open answers are never
  marked wrong - a yellow dot only invites a comparison with the model. Nothing is scored or graded and no percentage is created.
  Prior Step 6 attempts: not supplied, so none are restored (a fresh first take is invited).
  Model audio: none supplied. Missing audio is shown as a written-model route, never as a listening test.
  Feedback endpoint: none configured. Nothing is sent anywhere.
  Microphone (optional): recording uses getUserMedia/MediaRecorder only after the learner presses Record, stays in memory
  and is never stored. Needs HTTPS and an iframe allow="microphone" with a compatible Permissions-Policy.
  Completion: Done is enabled only on the last screen after the recall attempt, a checked or repaired point and a retry.
  It writes completed status to a SCORM 1.2/2004 API if one is found (no score), marks "sent" only after a confirmed
  commit, allows another try after a failed commit, and works without an LMS.
  KEYS - recall (accept patterns): W01L3 "born"; W03L1 "have/need to" + "medical"; W03L2 "here" + "medical"; W03L3 "message|text" + "ready".
  Reading: Where is the collection desk? -> West Service Centre (evidence highlighted after the attempt).
  Repair: "First you needs to check the message." -> "First you need to check the message." (also "You need to check the message first.")
  Communication cue: What do I need to collect my card? Model: I need the collection message and my application receipt.
  Transfer: new fictional case (East Service Centre); the original message is never changed.
  Images: taken from the lesson PPT (scene + four panels cut from one sheet).
-->

</script>
<script>
(function(){
'use strict';
var C=window.PZ_CONTENT, IMAGES=window.PZ_IMAGES||{}, CONFIG=C.config;

/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,attrs,text){var e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(function(k){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});}if(text!==undefined&&text!==null)e.textContent=text;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function say(msg){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=msg;},30);}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normEnd(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function words(s){var m=norm(s).match(/[\p{L}\p{N}']+/gu);return m?m.length:0;}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n):s;}
function btn(text,cls,fn){var b=el('button',{type:'button',class:'btn'+(cls?' '+cls:'')},text);if(fn)b.addEventListener('click',fn);return b;}

/* ===== state ===== */
var state, blocks={}, recorders=[];
function fresh(){return {s:1,b:{},ord:{}};}
state=fresh();
function bs(id){return state.b[id]||(state.b[id]={});}
C.screens.forEach(function(sc){sc.blocks.forEach(function(b){blocks[b.id]=b;});});

/* ===== pure completion rules (no grades, no scores) ===== */
function attemptOk(s,b){return !!(s.sp||words(s.t||'')>=(b.min||2));}
function replySecond(s){return !!((words(s.second||'')>=3&&normEnd(s.second)!==normEnd(s.first||''))||(s.sp2&&s.saved));}
function blockDone(b){
  var s=state.b[b.id]||{};
  switch(b.type){
    case 'task': return attemptOk(s,b)&&(!b.evidence||!!s.self);
    case 'repair': return words(s.b||'')>=3;
    case 'reply': return !!(s.saved&&s.imp&&replySecond(s));
    case 'pick': return !!s.v;
    default: return true;
  }
}
function screenDone(i){
  var sc=C.screens[i];
  return (sc.need||[]).every(function(g){
    var n=0;g.ids.forEach(function(id){if(blockDone(blocks[id]))n++;});
    return n>=(g.min||g.ids.length);
  });
}
function allDone(){for(var i=0;i<C.screens.length;i++){if(!screenDone(i))return false;}return true;}
function maxScreen(){for(var i=0;i<C.screens.length;i++){if(!screenDone(i))return i+1;}return C.screens.length;}

/* ===== evidence with <mark> ===== */
function markText(parent,str){
  var parts=String(str).split(/(\{\{.*?\}\})/);
  parts.forEach(function(p){
    var m=/^\{\{(.*)\}\}$/.exec(p);
    if(m){parent.appendChild(el('mark',null,m[1]));}else if(p){parent.appendChild(document.createTextNode(p));}
  });
}
function feedback(box,ok,msg){
  box.textContent='';box.className='fb '+(ok?'ok':'try');
  if(ok)box.appendChild(el('span',{class:'tick','aria-hidden':'true'},'✓'));
  else box.appendChild(el('span',{class:'dot','aria-hidden':'true'}));
  box.appendChild(document.createTextNode(msg));
}

/* ===== recorder (in memory only) ===== */
function makeRecorder(root){
  var stream=null,mr=null,chunks=[],url=null,audio=null,mode='idle',ended=false;
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  var st=el('p',{class:'status',role:'status','aria-live':'polite'});
  var bRec=btn('Record','small');
  var bStop=btn('Stop','two small');
  var bPlay=btn('Hear my recording','two small');
  var bAgain=btn('Record again','two small');
  var bDel=btn('Delete recording','two small');
  var rowd=el('div',{class:'row'});
  [bRec,bStop,bPlay,bAgain,bDel].forEach(function(b){rowd.appendChild(b);});
  var box=el('div',{class:'rec'});
  box.appendChild(rowd);box.appendChild(st);root.appendChild(box);
  function ui(){
    bRec.disabled=!supported||mode==='recording'||mode==='ready';
    bStop.disabled=mode!=='recording';
    bPlay.disabled=mode!=='ready';bAgain.disabled=mode!=='ready';bDel.disabled=mode!=='ready';
  }
  function releaseStream(){if(stream){stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});stream=null;}}
  function dropUrl(){if(url){try{URL.revokeObjectURL(url);}catch(e){}url=null;}if(audio){try{audio.pause();}catch(e){}audio=null;}}
  function msg(t){st.textContent=t;}
  if(!supported)msg('Recording is not available in this browser. Say your answer aloud and tick the box, or write it.');
  else msg('Optional. Press Record when you are ready.');
  ui();
  function fail(e){
    releaseStream();mode='idle';ui();
    var n=e&&e.name;
    if(n==='NotAllowedError'||n==='SecurityError'||n==='PermissionDeniedError')msg('The microphone is blocked. Allow it in your browser, or write your answer.');
    else if(n==='NotFoundError'||n==='DevicesNotFoundError'||n==='OverconstrainedError')msg('No microphone was found. Write your answer instead.');
    else if(n==='NotReadableError')msg('Another app is using the microphone. Close it, or write your answer.');
    else msg('Recording did not work this time. Try again or write your answer.');
  }
  bRec.addEventListener('click',function(){
    if(!supported||mode==='recording')return;
    dropUrl();chunks=[];
    var p;
    try{p=navigator.mediaDevices.getUserMedia({audio:true});}catch(e){fail(e);return;}
    p.then(function(s){
      if(ended){s.getTracks().forEach(function(t){t.stop();});return;}
      stream=s;
      try{
        var types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'],mt='';
        if(window.MediaRecorder.isTypeSupported){types.some(function(t){if(MediaRecorder.isTypeSupported(t)){mt=t;return true;}return false;});}
        mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
      }catch(e){fail(e);return;}
      mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data);};
      mr.onerror=function(ev){fail(ev&&ev.error);};
      mr.onstop=function(){
        releaseStream();
        if(ended){chunks=[];return;}
        var blob=new Blob(chunks,{type:(mr&&mr.mimeType)||'audio/webm'});
        chunks=[];
        if(!blob.size){mode='idle';ui();msg('The recording was empty. Press Record and speak again.');say('The recording was empty.');return;}
        url=URL.createObjectURL(blob);audio=new Audio(url);
        mode='ready';ui();msg('Recording stopped. You can hear it now.');say('Recording stopped. Hear my recording is ready.');
      };
      mr.start();mode='recording';ui();msg('Recording now. Press Stop when you finish.');say('Recording started.');
    }).catch(fail);
  });
  bStop.addEventListener('click',function(){if(mr&&mr.state==='recording'){try{mr.stop();}catch(e){fail(e);}}});
  bPlay.addEventListener('click',function(){
    if(!audio)return;
    audio.currentTime=0;
    var pr=audio.play();
    if(pr&&pr.catch)pr.catch(function(){msg('Your browser could not play the recording. Record again.');});
    msg('Playing your recording.');
    audio.onended=function(){msg('Finished.');};
  });
  bAgain.addEventListener('click',function(){dropUrl();mode='idle';ui();msg('Ready. Press Record when you are ready.');say('Ready to record again.');});
  bDel.addEventListener('click',function(){dropUrl();mode='idle';ui();msg('Recording deleted.');say('Recording deleted.');});
  var api={
    cancel:function(){
      try{if(mr&&mr.state==='recording'){mr.onstop=null;mr.stop();}}catch(e){}
      releaseStream();chunks=[];
      var was=mode;dropUrl();mode='idle';ui();
      if(was==='recording')msg('Recording stopped because you left this part.');
      else if(was==='ready')msg(supported?'Optional. Press Record when you are ready.':'Recording is not available in this browser.');
    },
    destroy:function(){ended=true;api.cancel();}
  };
  recorders.push(api);
  return api;
}
function stopRecorders(){recorders.forEach(function(r){r.destroy();});recorders=[];}
window.addEventListener('pagehide',function(){stopRecorders();});

/* ===== block builders ===== */
var refreshGate=function(){};

function buildText(b){var d=el('div',{class:'note'});if(b.html){b.html.forEach(function(p){d.appendChild(el('p',null,p));});}return d;}

function buildTask(b){
  var s=bs(b.id);
  var root=el('fieldset',{class:'task '+(b.cls||'')});
  root.appendChild(el('legend',null,b.cue));
  if(b.sub)root.appendChild(el('p',{class:'small'},b.sub));
  var inId='in_'+b.id;
  var ta=b.one?el('input',{type:'text',id:inId,autocomplete:'off',spellcheck:'false','aria-label':b.cue}):el('textarea',{id:inId,rows:'2','aria-label':b.cue});
  if(b.ph)ta.setAttribute('placeholder',b.ph);
  ta.value=s.t||'';
  root.appendChild(ta);
  var chk=null;
  if(!b.noSay){
    var lab=el('label',{class:'chk'});chk=el('input',{type:'checkbox'});chk.checked=!!s.sp;
    lab.appendChild(chk);lab.appendChild(el('span',null,b.sayLabel||'I said my answer aloud instead.'));root.appendChild(lab);
  }
  var row=el('div',{class:'row'});
  var bHint=b.hints&&b.hints.length?btn('Give me a hint','help small'):null;
  var bModel=btn(b.evidence?'Show the source':'Show a model','two small');
  if(bHint)row.appendChild(bHint);row.appendChild(bModel);root.appendChild(row);
  var hintBox=el('div',{class:'hint'});hintBox.setAttribute('aria-live','polite');
  var modelBox=el('div',{class:'model'});modelBox.hidden=true;
  var fb=el('div',{class:'fb',role:'status'});
  var evBox=el('div',{class:'evidence'});evBox.hidden=true;
  var selfRow=el('div',{class:'row selfrow'});selfRow.hidden=true;
  var bSelf1=btn('I remembered it','two small'),bSelf2=btn('I found it again','two small');
  selfRow.appendChild(el('span',{class:'small'},'How did you get it?'));selfRow.appendChild(bSelf1);selfRow.appendChild(bSelf2);
  [hintBox,modelBox,fb].forEach(function(x){root.appendChild(x);});if(b.evidence){root.appendChild(evBox);root.appendChild(selfRow);}
  function upd(){
    var ok=attemptOk(s,b);
    bModel.disabled=!ok;
    if(bHint){
      var lv=s.h||0;
      bHint.disabled=lv>=b.hints.length;
      bHint.textContent=lv>=b.hints.length?'No more hints':'Give me a hint';
    }
    hintBox.textContent='';
    for(var i=0;i<(s.h||0);i++){hintBox.appendChild(el('p',null,b.hints[i]));}
    if(s.shown){
      if(b.evidence){
        evBox.hidden=false;evBox.textContent='';
        evBox.appendChild(el('p',{class:'small'},b.evidenceLabel||'Source'));
        var q=el('p',{class:'srcline'});markText(q,b.evidence);evBox.appendChild(q);
        selfRow.hidden=false;
        bSelf1.setAttribute('aria-pressed',s.self==='r'?'true':'false');
        bSelf2.setAttribute('aria-pressed',s.self==='f'?'true':'false');
        bSelf1.className='btn small '+(s.self==='r'?'':'two');bSelf2.className='btn small '+(s.self==='f'?'':'two');
        modelBox.hidden=false;modelBox.textContent='Answer: '+b.model;
      }else{
        modelBox.hidden=false;modelBox.textContent='';
        modelBox.appendChild(el('span',{class:'small'},'Model'));
        modelBox.appendChild(el('p',null,b.model));
        if(b.alt)modelBox.appendChild(el('p',{class:'small'},b.alt));
      }
      var good=true,t=norm(s.t||'');
      (b.accept||[]).forEach(function(rx){if(!new RegExp(rx,'i').test(t))good=false;});
      if(s.sp&&!s.t)feedback(fb,true,'Compare what you said with the model.');
      else if(!b.accept)feedback(fb,true,'Compare your words with the model.');
      else if(good)feedback(fb,true,b.okMsg||'Yes. Your answer works.');
      else feedback(fb,false,b.tryMsg||'Compare your words with the model. Other familiar words can work too.');
    }else{modelBox.hidden=true;evBox.hidden=true;selfRow.hidden=true;fb.textContent='';fb.className='fb';}
  }
  ta.addEventListener('input',function(){s.t=clip(ta.value,600);upd();refreshGate();});
  if(chk)chk.addEventListener('change',function(){s.sp=chk.checked;upd();refreshGate();});
  if(bHint)bHint.addEventListener('click',function(){s.h=Math.min((s.h||0)+1,b.hints.length);upd();say('Hint '+s.h+' shown.');});
  bModel.addEventListener('click',function(){if(bModel.disabled)return;s.shown=true;upd();say(b.evidence?'The source is shown.':'The model is shown.');refreshGate();});
  bSelf1.addEventListener('click',function(){s.self='r';upd();refreshGate();});
  bSelf2.addEventListener('click',function(){s.self='f';upd();refreshGate();});
  upd();
  return root;
}

function buildSay(b){
  var s=bs(b.id);
  var root=el('fieldset',{class:'task say'});
  root.appendChild(el('legend',null,b.cue));
  if(b.sub)root.appendChild(el('p',{class:'small'},b.sub));
  var ul=el('ul',{class:'phr'});b.phrases.forEach(function(p){ul.appendChild(el('li',null,p));});root.appendChild(ul);
  var lab=el('label',{class:'chk'});var chk=el('input',{type:'checkbox'});chk.checked=!!s.sp;
  lab.appendChild(chk);lab.appendChild(el('span',null,'I said it aloud and compared it with the model.'));root.appendChild(lab);
  chk.addEventListener('change',function(){s.sp=chk.checked;});
  var rec=el('div');root.appendChild(rec);makeRecorder(rec);
  return root;
}

function buildRepair(b){
  var s=bs(b.id);
  var root=el('fieldset',{class:'task repair'});
  root.appendChild(el('legend',null,b.cue));
  var dr=el('p',{class:'draft'});dr.appendChild(el('span',{class:'small'},'Draft: '));dr.appendChild(el('q',null,b.draft));root.appendChild(dr);
  var la=el('label',{class:'lbl',for:'ra_'+b.id},'Write the sentence correctly.');root.appendChild(la);
  var ia=el('input',{type:'text',id:'ra_'+b.id,autocomplete:'off',spellcheck:'false'});ia.value=s.a||'';root.appendChild(ia);
  var row=el('div',{class:'row'});
  var bHint=btn('Give me a hint','help small'),bCheck=btn('Check my repair','small'),bShow=btn('Show the repair','two small');
  row.appendChild(bHint);row.appendChild(bCheck);row.appendChild(bShow);root.appendChild(row);
  var hintBox=el('div',{class:'hint'});hintBox.setAttribute('aria-live','polite');
  var fb=el('div',{class:'fb',role:'status'});
  var modelBox=el('div',{class:'model'});modelBox.hidden=true;
  var bHide=btn('Hide the repair','two small');
  var retype=el('div',{class:'retype'});retype.hidden=true;
  retype.appendChild(el('label',{class:'lbl',for:'rb_'+b.id},'Now write it again. Do not look.'));
  var ib=el('input',{type:'text',id:'rb_'+b.id,autocomplete:'off',spellcheck:'false'});ib.value=s.b||'';retype.appendChild(ib);
  var fb2=el('div',{class:'fb',role:'status'});retype.appendChild(fb2);
  [hintBox,fb,modelBox,retype].forEach(function(x){root.appendChild(x);});
  function good(t){return b.accept.indexOf(normEnd(t))>=0;}
  function upd(){
    var hasA=words(s.a||'')>=1;
    bCheck.disabled=!hasA;bShow.disabled=!hasA;
    bHint.disabled=(s.h||0)>=b.hints.length;
    bHint.textContent=(s.h||0)>=b.hints.length?'No more hints':'Give me a hint';
    hintBox.textContent='';for(var i=0;i<(s.h||0);i++)hintBox.appendChild(el('p',null,b.hints[i]));
    if(s.checked){
      if(good(s.a))feedback(fb,true,'Yes. That is a good repair.');
      else feedback(fb,false,'Not yet the same as the model. Use a hint, or show the repair.');
    }else{fb.textContent='';fb.className='fb';}
    var showing=s.sh&&!s.hid;
    modelBox.hidden=!showing;
    if(showing){modelBox.textContent='';modelBox.appendChild(el('span',{class:'small'},'Repair'));modelBox.appendChild(el('p',null,b.model));modelBox.appendChild(bHide);}
    var canRetype=(s.checked&&good(s.a))||(s.sh&&s.hid);
    retype.hidden=!canRetype;
    if(s.b&&canRetype){
      if(good(s.b))feedback(fb2,true,'Yes. You wrote it from memory.');
      else if(words(s.b)>=3)feedback(fb2,false,'Close. Look at the repair once more, then write it again.');
      else{fb2.textContent='';fb2.className='fb';}
    }else{fb2.textContent='';fb2.className='fb';}
  }
  ia.addEventListener('input',function(){s.a=clip(ia.value,300);s.checked=false;upd();});
  ib.addEventListener('input',function(){s.b=clip(ib.value,300);upd();refreshGate();});
  bHint.addEventListener('click',function(){s.h=Math.min((s.h||0)+1,b.hints.length);upd();say('Hint shown.');});
  bCheck.addEventListener('click',function(){s.checked=true;upd();say(good(s.a)?'That is a good repair.':'Not yet the same as the model.');});
  bShow.addEventListener('click',function(){s.sh=true;s.hid=false;upd();say('The repair is shown.');});
  bHide.addEventListener('click',function(){s.hid=true;upd();say('The repair is hidden. Write it again.');var r=$('#rb_'+b.id);if(r)r.focus();});
  upd();
  return root;
}

function secondValidNow(s){return replySecond(s);}
function buildReply(b){
  var s=bs(b.id);
  if(!s.ord)s.ord=shuffle(b.improve.map(function(o){return o.id;}));
  var root=el('div',{class:'studio'});
  /* A: first reply */
  var A=el('fieldset',{class:'task'});
  A.appendChild(el('legend',null,b.legend1||'First reply'));
  A.appendChild(el('p',{class:'speech'},b.cue));
  var t1=el('textarea',{rows:'3','aria-label':'My first reply'});t1.value=s.first||'';
  A.appendChild(t1);
  var l1=el('label',{class:'chk'});var c1=el('input',{type:'checkbox'});c1.checked=!!s.sp1;
  l1.appendChild(c1);l1.appendChild(el('span',null,'I said my first reply aloud.'));A.appendChild(l1);
  var r1=el('div');A.appendChild(r1);makeRecorder(r1);
  var rowA=el('div',{class:'row'});var bSave=btn('Keep my first reply','small'),bEdit=btn('Change my first reply','two small');
  rowA.appendChild(bSave);rowA.appendChild(bEdit);A.appendChild(rowA);
  root.appendChild(A);
  /* B: choose improvement */
  var B=el('fieldset',{class:'task green'});B.hidden=true;
  B.appendChild(el('legend',null,'Choose one thing to improve'));
  var opts=el('div',{class:'opts'});B.appendChild(opts);
  var exBox=el('div',{class:'hint'});exBox.setAttribute('aria-live','polite');B.appendChild(exBox);
  var bModel=btn('Show an example reply','two small');var modelBox=el('div',{class:'model'});modelBox.hidden=true;
  B.appendChild(bModel);B.appendChild(modelBox);
  root.appendChild(B);
  /* C: second reply */
  var Cc=el('fieldset',{class:'task yellow'});Cc.hidden=true;
  Cc.appendChild(el('legend',null,'Second reply'));
  Cc.appendChild(el('p',{class:'small'},'Say or write your reply again. Make the one change you chose.'));
  var t2=el('textarea',{rows:'3','aria-label':'My second reply'});t2.value=s.second||'';Cc.appendChild(t2);
  var l2=el('label',{class:'chk'});var c2=el('input',{type:'checkbox'});c2.checked=!!s.sp2;
  l2.appendChild(c2);l2.appendChild(el('span',null,'I said my second reply aloud.'));Cc.appendChild(l2);
  var r2=el('div');Cc.appendChild(r2);makeRecorder(r2);
  var bUse=btn('Start with the example','two small');Cc.appendChild(bUse);
  var fb=el('div',{class:'fb',role:'status'});Cc.appendChild(fb);
  root.appendChild(Cc);
  /* D: compare */
  var D=el('div',{class:'cmp'});D.hidden=true;root.appendChild(D);
  var E=el('div',{class:'task'});E.hidden=true;
  E.appendChild(el('label',{class:'lbl',for:'cl_'+b.id},'What is clearer now? (optional)'));
  var tc=el('textarea',{id:'cl_'+b.id,rows:'2'});tc.value=s.clear||'';E.appendChild(tc);root.appendChild(E);
  function validFirst(){return words(t1.value)>=3||c1.checked;}
  function upd(){
    bSave.disabled=s.saved||!validFirst();
    bEdit.hidden=!s.saved;bSave.hidden=!!s.saved;
    t1.readOnly=!!s.saved;
    B.hidden=!s.saved;
    opts.textContent='';
    s.ord.forEach(function(id){
      var o=b.improve.filter(function(x){return x.id===id;})[0];
      var lab=el('label',{class:'opt'});var r=el('input',{type:'radio',name:'imp_'+b.id,value:id});r.checked=(s.imp===id);
      r.addEventListener('change',function(){s.imp=id;upd();refreshGate();say('You chose: '+o.t);});
      lab.appendChild(r);lab.appendChild(el('span',null,o.t));opts.appendChild(lab);
    });
    var cur=b.improve.filter(function(x){return x.id===s.imp;})[0];
    exBox.textContent='';if(cur){exBox.appendChild(el('p',null,'Example: '+cur.ex));}
    bModel.hidden=!s.imp;modelBox.hidden=!s.showModel;
    if(s.showModel){modelBox.textContent='';modelBox.appendChild(el('span',{class:'small'},'Example reply'));modelBox.appendChild(el('p',null,b.model));if(b.alt)modelBox.appendChild(el('p',{class:'small'},b.alt));}
    Cc.hidden=!(s.saved&&s.imp);
    if(s.saved&&s.imp){
      if(words(s.second||'')>=3&&normEnd(s.second)===normEnd(s.first||''))feedback(fb,false,'This is the same as your first reply. Change one thing.');
      else if(replySecond(s))feedback(fb,true,'Your second reply is ready to compare.');
      else{fb.textContent='';fb.className='fb';}
    }
    D.hidden=E.hidden=!(s.saved&&s.imp&&replySecond(s));
    if(!D.hidden){
      D.textContent='';
      var k1=el('div',{class:'card'});k1.appendChild(el('h3',null,'First reply'));k1.appendChild(el('p',null,s.first||(s.sp1?'(You said it aloud.)':'')));
      var k2=el('div',{class:'card two'});k2.appendChild(el('h3',null,'Second reply'));k2.appendChild(el('p',null,s.second||(s.sp2?'(You said it aloud.)':'')));
      D.appendChild(k1);D.appendChild(k2);
    }
  }
  t1.addEventListener('input',function(){if(!s.saved){s.first=clip(t1.value,600);bSave.disabled=!validFirst();}});
  c1.addEventListener('change',function(){s.sp1=c1.checked;bSave.disabled=s.saved||!validFirst();});
  bSave.addEventListener('click',function(){if(bSave.disabled)return;s.first=clip(t1.value,600);s.saved=true;upd();refreshGate();say('First reply kept. Now choose one thing to improve.');});
  bEdit.addEventListener('click',function(){s.saved=false;s.imp='';s.showModel=false;upd();refreshGate();t1.focus();});
  bModel.addEventListener('click',function(){s.showModel=true;upd();say('An example reply is shown.');});
  t2.addEventListener('input',function(){s.second=clip(t2.value,600);upd();refreshGate();});
  c2.addEventListener('change',function(){s.sp2=c2.checked;upd();refreshGate();});
  bUse.addEventListener('click',function(){t2.value=b.model;s.second=b.model;upd();refreshGate();t2.focus();});
  tc.addEventListener('input',function(){s.clear=clip(tc.value,300);});
  upd();
  return root;
}

function buildPick(b){
  var s=bs(b.id);
  if(!s.ord)s.ord=shuffle(b.options.map(function(o){return o.id;}));
  var root=el('fieldset',{class:'task green'});
  root.appendChild(el('legend',null,b.cue));
  var opts=el('div',{class:'opts'});root.appendChild(opts);
  s.ord.forEach(function(id){
    var o=b.options.filter(function(x){return x.id===id;})[0];
    var lab=el('label',{class:'opt'});var r=el('input',{type:'radio',name:'pk_'+b.id,value:id});r.checked=(s.v===id);
    r.addEventListener('change',function(){s.v=id;refreshGate();say('You chose: '+o.t);});
    lab.appendChild(r);lab.appendChild(el('span',null,o.t));opts.appendChild(lab);
  });
  return root;
}

var BUILD={text:buildText,task:buildTask,say:buildSay,repair:buildRepair,reply:buildReply,pick:buildPick};

/* ===== screens ===== */
var stage=$('#stage'),doneBtn=null;
var completionInFlight=false,completionSent=false;

function drawRail(n){
  var ol=$('#rail');ol.textContent='';
  C.screens.forEach(function(sc,i){
    var li=el('li');
    var st=(i+1<n)?'done':(i+1===n?'now':'next');
    li.className=st;
    if(i+1===n)li.setAttribute('aria-current','step');
    li.appendChild(el('span',{class:'num'},String(i+1)));
    li.appendChild(el('span',{class:'nm'},sc.nav));
    ol.appendChild(li);
  });
}

function show(n){
  stopRecorders();
  n=Math.max(1,Math.min(n,C.screens.length));
  state.s=n;
  var sc=C.screens[n-1];
  stage.textContent='';
  var wrap=el('section',{class:'screen s'+n+(n%2===0?' flip':''),'aria-labelledby':'h'+n});
  var main=el('div',{class:'content'});
  var aside=C.aside?C.aside(n,sc,IMAGES):null;
  if(sc.hero&&C.hero){wrap.appendChild(C.hero(sc,IMAGES));wrap.classList.add('hasHero');}
  var h=el('h2',{id:'h'+n,tabindex:'-1'},sc.title);
  main.appendChild(h);
  if(sc.intro)main.appendChild(el('p',{class:'lead'},sc.intro));
  sc.blocks.forEach(function(b){main.appendChild(BUILD[b.type](b));});
  var last=(n===C.screens.length);
  var nav=el('div',{class:'row navrow'});
  if(!last){
    var again=btn('Try again','two',function(){resetScreen(n);});
    var next=btn('Carry on: '+C.screens[n].nav.toLowerCase(),'',function(){if(next.disabled)return;show(n+1);});
    nav.appendChild(again);nav.appendChild(next);
    refreshGate=function(){next.disabled=!screenDone(n-1);};
  }else{
    var againAll=btn('Try again','two',function(){resetAll();});
    doneBtn=btn(completionSent?'Done ✓':'Done','',function(){finish();});
    nav.appendChild(againAll);nav.appendChild(doneBtn);
    refreshGate=function(){doneBtn.disabled=completionSent||!allDone();};
  }
  main.appendChild(nav);
  if(aside)wrap.appendChild(aside);
  wrap.appendChild(main);
  stage.appendChild(wrap);
  drawRail(n);
  refreshGate();
  h.focus({preventScroll:false});
  try{window.scrollTo(0,0);}catch(e){}
}

function resetScreen(n){
  var sc=C.screens[n-1];
  sc.blocks.forEach(function(b){delete state.b[b.id];});
  show(n);
  say('This part is ready to try again.');
}
function resetAll(){
  state=fresh();
  show(1);
  say('The review is ready to start again.');
}

/* ===== LMS (SCORM 1.2 and 2004) - optional bridge ===== */
var lms={api:null,ver:null,ready:false,tries:0};
function findApi(name){
  var wins=[window];try{if(window.opener)wins.push(window.opener);}catch(e){}
  for(var k=0;k<wins.length;k++){
    var w=wins[k],d=0;
    while(w&&d<12){
      try{if(w[name])return w[name];}catch(e){}
      try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
      d++;
    }
  }
  return null;
}
function lmsConnect(){
  if(lms.ready||lms.tries>6)return lms.ready;
  lms.tries++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{a=findApi('API');if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}}
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsGet(k){try{var v=(lms.ver==='2004')?lms.api.GetValue(k):lms.api.LMSGetValue(k);return String(v==null?'':v);}catch(e){return '';}}
function lmsSet(k,v){try{var r=(lms.ver==='2004')?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=(lms.ver==='2004')?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsCompleted(){
  if(!lms.ready)return false;
  if(lms.ver==='2004'){var c=lmsGet('cmi.completion_status'),s=lmsGet('cmi.success_status');return c==='completed'||s==='passed';}
  var v=lmsGet('cmi.core.lesson_status');return v==='completed'||v==='passed';
}
/* completion: sent only on the learner's Done click, only after the participation criteria,
   marked as sent only after a confirmed successful commit; failures can be retried.
   No score is written. */
function finish(){
  if(completionSent||completionInFlight||!allDone())return;
  completionInFlight=true;
  var ok=true;
  try{
    if(lmsConnect()){
      if(!lmsCompleted()){
        var s1=lms.ver==='2004'?(lmsSet('cmi.completion_status','completed')&&lmsSet('cmi.exit','')):(lmsSet('cmi.core.lesson_status','completed')&&lmsSet('cmi.core.exit',''));
        var c=lmsCommit();
        ok=!!(s1&&c);
      }
    }
  }catch(e){ok=false;}
  if(ok){
    completionSent=true;
    try{if(CONFIG.moodleOrigin&&window.parent&&window.parent!==window){window.parent.postMessage({type:'pazapa-activity-completed',activity:CONFIG.activityId},CONFIG.moodleOrigin);}}catch(e){}
    if(doneBtn){doneBtn.textContent='Done ✓';doneBtn.disabled=true;}
  }
  completionInFlight=false;
}
window.addEventListener('pagehide',function(){try{if(lms.ready&&lms.ver==='2004')lms.api.Terminate('');else if(lms.ready)lms.api.LMSFinish('');}catch(e){}});

/* ===== start ===== */
(function init(){
  document.title=C.config.title;
  if(lmsConnect()&&lmsCompleted())completionSent=true;
  show(1);
})();
})();

</script>
