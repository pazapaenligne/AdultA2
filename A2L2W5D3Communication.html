      } catch(e){ return false; }
    }

    function ensureSCORMConnection(){
      if (initialized) return true;
      return initializeSCORM();
    }

    /* Bounded background re-detection: used when no API is present on
       initial load. Stops after MAX_REDETECT_ATTEMPTS so it never runs
       forever. Calls onReconnect() once, the first time it succeeds. */
    function scheduleSCORMRedetection(onReconnect){
      if (initialized || terminated || redetectTimer) return;
      if (redetectAttempts >= MAX_REDETECT_ATTEMPTS) return;
      redetectTimer = window.setTimeout(function(){
        redetectTimer = null;
        redetectAttempts++;
        if (ensureSCORMConnection()) {
          if (typeof onReconnect === "function") {
            try { onReconnect(); } catch(e){}
          }
        } else {
          scheduleSCORMRedetection(onReconnect);
        }
      }, REDETECT_INTERVAL_MS);
    }

    function apiGetValue(key){
      if (!initialized || terminated || !api) return "";
      try {
        return (version === "1.2") ? api.LMSGetValue(key) : api.GetValue(key);
      } catch(e){ return ""; }
    }

    function apiSetValue(key, val){
      if (!initialized || terminated || !api) return false;
      try {
        var r = (version === "1.2") ? api.LMSSetValue(key, val) : api.SetValue(key, val);
        return isSuccess(r);
      } catch(e){ return false; }
    }

    function apiCommit(){
      if (!initialized || terminated || !api) return false;
      try {
        var r = (version === "1.2") ? api.LMSCommit("") : api.Commit("");
        return isSuccess(r);
      } catch(e){ return false; }
    }

    function apiTerminate(){
      if (!initialized || !api || terminated) return false;
      try {
        var r = (version === "1.2") ? api.LMSFinish("") : api.Terminate("");
        if (isSuccess(r)) { terminated = true; return true; }
        return false;
      } catch(e){ return false; }
    }

    /* Reads current LMS completion so we never downgrade an existing
       completed/passed attempt. */
    function readExistingCompletion(){
      if (!initialized) return { completed:false, passed:false, status:"" };
      if (version === "1.2") {
        var status12 = apiGetValue("cmi.core.lesson_status");
        var completed12 = (status12 === "completed" || status12 === "passed");
        return { completed: completed12, passed: (status12 === "passed"), status: status12 };
      }
      var completionStatus = apiGetValue("cmi.completion_status");
      var successStatus = apiGetValue("cmi.success_status");
      var completed2004 = (completionStatus === "completed") || (successStatus === "passed");
      return { completed: completed2004, passed: (successStatus === "passed"), status: completionStatus };
    }

    function writeIncompleteStatus(){
      if (version === "1.2") return apiSetValue("cmi.core.lesson_status", "incomplete");
      return apiSetValue("cmi.completion_status", "incomplete");
    }

    function writeCompletedStatus(){
      if (version === "1.2") {
        return apiSetValue("cmi.core.lesson_status", "completed");
      }
      var a = apiSetValue("cmi.completion_status", "completed");
      var b = apiSetValue("cmi.success_status", "passed");
      return a && b;
    }

    return {
      findAPI: findAPI,
      locateAPI: locateAPI,
      initializeSCORM: initializeSCORM,
      ensureSCORMConnection: ensureSCORMConnection,
      scheduleSCORMRedetection: scheduleSCORMRedetection,
      apiGetValue: apiGetValue,
      apiSetValue: apiSetValue,

  function utf8ByteLength(str){
    try { return new TextEncoder().encode(str).length; } catch(e){ return str.length; }

  ========================================================= */
  function freshState(){

      spoken: { a1:false, fu:false, a2:false },

  /* -------- persistence -------- */
  function buildPersistPayload(){
    return {
      v: STATE_SCHEMA_VERSION, screen: state.screen, situation: state.situation, route: state.route,
      texts: state.texts, spoken: state.spoken, ratings: state.ratings, challenge: state.challenge,
      improve: state.improve, completed: state.completed
    };
  }
  function trimForSuspendData(payload){
    var json = JSON.stringify(payload);
    if (utf8ByteLength(json) <= SUSPEND_DATA_BYTE_LIMIT_12) return json;
    var t = JSON.parse(json);
    var keys = ["a2","a1","fu"], i = 0;
    while (utf8ByteLength(JSON.stringify(t)) > SUSPEND_DATA_BYTE_LIMIT_12 && i < 200) {
      var longest = keys.reduce(function(a,b){ return t.texts[a].length >= t.texts[b].length ? a : b; });
      if (!t.texts[longest].length) break;
      t.texts[longest] = t.texts[longest].slice(0, Math.max(0, t.texts[longest].length - 40));
      i++;
    }
    return JSON.stringify(t);
  }
  function saveProgress(){
    if (exitHandled) return { success:false, viaLocal:false };
    var payload = buildPersistPayload();
    if (scormReady && SCORM.isAvailable()) {
      var json = (SCORM.getVersion() === "1.2") ? trimForSuspendData(payload) : JSON.stringify(payload);
      var setOk = SCORM.apiSetValue("cmi.suspend_data", json);
      var commitOk = setOk && SCORM.apiCommit();
      if (setOk && commitOk) return { success:true, viaLocal:false };
    }

  }
  function str(v, max){ return (typeof v === "string") ? v.slice(0, max) : ""; }
  function sanitiseRestoredPayload(raw){
    var out = freshState();
    if (!raw || typeof raw !== "object") return out;
    if (raw.situation === "home" || raw.situation === "later") out.situation = raw.situation;
    if (ROUTES[raw.route]) out.route = raw.route;
    if (raw.texts && typeof raw.texts === "object") {
      out.texts.a1 = str(raw.texts.a1, 1200); out.texts.fu = str(raw.texts.fu, 1200); out.texts.a2 = str(raw.texts.a2, 1200);
    }
    if (raw.spoken && typeof raw.spoken === "object") {
      out.spoken.a1 = raw.spoken.a1 === true; out.spoken.fu = raw.spoken.fu === true; out.spoken.a2 = raw.spoken.a2 === true;
    }
    if (raw.ratings && typeof raw.ratings === "object") {
      CRITERIA.forEach(function(c){ var r = raw.ratings[c.id]; if (RATINGS[r]) out.ratings[c.id] = r; });
    }
    if (raw.challenge && typeof raw.challenge === "object") {
      WEEKLY_MOVES.forEach(function(m){ out.challenge[m.id] = raw.challenge[m.id] === true; });
    }
    if (CRITERIA.some(function(c){ return c.id === raw.improve; })) out.improve = raw.improve;
    var s = parseInt(raw.screen, 10);
    if (s >= 1 && s <= TOTAL_SCREENS) out.screen = s;
    if (raw.completed === true) out.completed = true;
    return out;
  }

  /* -------- LMS status -------- */
  function sendIncompleteIfNeeded(){
    if (!scormReady || !SCORM.isAvailable()) return false;
    if (lmsCompletionConfirmed || state.completed) return true;
    if (incompleteSent) return true;
    var ok = SCORM.writeIncompleteStatus();
    if (ok && SCORM.apiCommit()) { incompleteSent = true; return true; }
    return false;
  }

  function criteriaMet(){
    return slotDone("a1") && slotDone("fu") && slotDone("a2") &&
      CRITERIA.every(function(c){ return !!state.ratings[c.id]; }) && !!state.improve;
  }

  function completeActivity(){
    if (completionInProgress) return { success:false, reason:"in-progress" };
    if (!criteriaMet()) return { success:false, reason:"criteria" };
    completionInProgress = true;
    try {
      SCORM.ensureSCORMConnection();
      scormReady = SCORM.isAvailable();
      saveProgress();
      if (!scormReady) {
        state.completed = true;
        saveLocal(buildPersistPayload());
        return { success:true, reason:"local-only" };
      }
      if (lmsCompletionConfirmed) {
        state.completed = true; completionSent = true;
        return { success:true, reason:"already-completed" };
      }
      var writeOk = SCORM.writeCompletedStatus();
      var commitOk = writeOk && SCORM.apiCommit();
      if (!writeOk || !commitOk) return { success:false, reason:"write-failed" };
      var rb = SCORM.readExistingCompletion();
      if (!rb.completed) return { success:false, reason:"readback-failed" };
      state.completed = true; completionSent = true; lmsCompletionConfirmed = true;
      saveProgress();
      return { success:true, reason:"confirmed" };
    } finally {
      completionInProgress = false;
    }
  }

  function terminateSCORM(){
    if (exitHandled) return;
    stopAllRecording(true);

  }

      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);

    (kids || []).forEach(function(c){

  function stopAllRecording(discard){
    if (!recorder) return;

  function startRecording(key, host){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof window.MediaRecorder === "undefined") {
      setStatus(host, "Recording is not available on this device. Choose Speak, then check or Type.", true);

      var chunks = [], mr;

      catch(e){

        setStatus(host, "Recording is not available on this device. Choose Speak, then check or Type.", true);
        return;
      }
      var rec = { key:key, mr:mr, stream:stream, timer:null };
      recorder = rec;
      mr.ondataavailable = function(ev){ if (ev.data && ev.data.size) chunks.push(ev.data); };

      h("tbody", {}, [
        h("tr", {}, [h("th", { scope:"row", text:"Villa" }), h("td", { text:"60,000 AED" }), h("td", { text:"3,000 AED" }), h("td", { text:"Included" })]),
        h("tr", { class:"mine" }, [h("th", { scope:"row", text:"Apartment" }), h("td", { text:"48,000 AED" }), h("td", { text:"2,400 AED" }), h("td", { text:"300 AED a month extra" })]),
        h("tr", {}, [h("th", { scope:"row", text:"Studio" }), h("td", { text:"42,000 AED" }), h("td", { text:"2,100 AED" }), h("td", { text:"Included" })])
      ])
    ]);

    var phraseItems = WEEKLY_MOVES.map(function(m){
      return h("li", {}, [h("span", { class:"from", text:m.from }), m.phrase]);
    });
    var modelItems = COURSE_MODELS.slice(1).map(function(p){ return h("li", {}, [p]); });

    return h("section", { class:"screen" }, [
      h("h2", { text:"Get ready" }),
      h("p", { class:"lead", text:"Mariam chose the apartment. Now she writes to Hana." }),
      h("div", { class:"split" }, [
        h("div", {}, [
          picture("present", "A woman in a hijab presents a house, a contract and an AC to two women."),
          h("h3", { text:"The three homes", style:"margin-top:1rem" }),
          table,
          h("p", { style:"margin-top:.75rem" }, [h("strong", { text:"Contract: " }), "Report AC and plumbing problems to building maintenance."])
        ]),
        h("div", { class:"panel" }, [
          h("h3", { text:"Your task" }),
          h("p", {}, [h("strong", { text:"Purpose: " }), "tell Hana the AC isn't working."]),
          h("p", { text:"Two facts you can use:" }),
          h("ul", { class:"clean" }, [h("li", { text:"Apartment 204. Reference M16." }), h("li", { text:"Hana's visit: tomorrow between ten and twelve." })]),
          h("p", {}, [h("strong", { text:"Check yourself on: " }), "Purpose, Detail, Interaction, Close."])
        ])
      ]),
      h("div", { class:"panel green", style:"margin:1.25rem 0" }, [
        h("h3", { text:"Phrase bank (optional)" }),
        h("p", { text:"This week's three moves. Use them if they fit." }),
        h("ul", { class:"phrase-list" }, phraseItems),
        h("div", { class:"photo-note" }, [
          picture("sink", "A woman in a hijab takes a photo of a leaking sink with a tablet."),
          h("div", {}, [h("p", { text:"More models from this lesson:" }), h("ul", { class:"phrase-list" }, modelItems)])
        ])
      ]),
      sitFs,
      actionRow([nextBtn("Carry on", function(){ goTo(5); })])
    ]);
  };

  /* 5 — First attempt */
  BUILDERS[5] = function(){
    var nb = nextBtn("Carry on", function(){ goTo(6); });
    var note = h("p", { class:"gate-note" });
    gateFn = function(){
      var ok = slotDone("a1");
      nb.disabled = !ok;
      note.textContent = ok ? "" : "Say or write your answer to carry on.";
    };
    var scr = h("section", { class:"screen" }, [
      h("h2", { text:"Your first reply to Hana" }),
      h("div", { class:"panel", style:"margin-bottom:1rem" }, [
        h("p", {}, [h("strong", { text:"Your situation: " }), SITUATIONS[state.situation].fact]),
        h("p", { style:"margin:0" }, ["Reply to Hana in three to five short sentences. Say who you are, what the problem is, and one useful detail."])
      ]),
      buildSlot("a1", "First attempt"),
      actionRow([nb]), note
    ]);
    gateFn();
    return scr;
  };

  /* 6 — Follow-up */
  BUILDERS[6] = function(){
    var status = h("p", { class:"status", role:"status" });
    var hintBox = h("div", {});
    function paintHint(){
      while (hintBox.firstChild) hintBox.removeChild(hintBox.firstChild);
      if (revealed.hint) hintBox.appendChild(h("p", { class:"panel green" }, ["Start with: ", h("strong", { text:"If the time is unsuitable, I'll …" })]));
    }
    var nb = nextBtn("Carry on", function(){ goTo(7); });
    var note = h("p", { class:"gate-note" });
    gateFn = function(){
      var ok = slotDone("fu");
      nb.disabled = !ok;
      note.textContent = ok ? "" : "Answer Hana to carry on.";
    };
    var scr = h("section", { class:"screen" }, [
      h("h2", { text:"Hana asks one more question" }),
      h("div", { class:"chat" }, [
        h("div", { class:"bubble them key" }, [h("span", { class:"who", text:"Hana" }), ANCHOR_TURN])
      ]),
      h("div", { class:"rec-row" }, [
        h("button", { class:"btn small", type:"button", onclick:function(){
          playAudio("hanaQuestion", status);
          if (!AUDIO.hanaQuestion) announce(ANCHOR_TURN);
        } }, ["Please repeat"]),
        h("button", { class:"btn small", type:"button", onclick:function(){ revealed.hint = true; paintHint(); announce("Hint shown."); } }, ["Show a start"])
      ]),
      status, hintBox,
      h("details", { class:"panel plain", style:"margin-bottom:1rem" }, [
        h("summary", { style:"min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700", text:"Your first reply" }),
        h("p", { text: state.texts.a1 ? state.texts.a1 : (state.route === "type" ? "(no text)" : "You answered by speaking.") })
      ]),
      buildSlot("fu", "Your answer to Hana"),
      actionRow([nb]), note
    ]);
    paintHint(); gateFn();
    return scr;
  };

  function replayBlock(key){
    var parts = [];
    if (state.texts[key]) parts.push(h("p", { text:state.texts[key] }));
    if (recs[key]) parts.push(h("audio", { controls:true, src:recs[key].url, "aria-label":"Play recording" }));
    if (!parts.length) parts.push(h("p", { text: state.spoken[key] ? "You answered by speaking." : "(no answer yet)" }));
    return parts;
  }

  /* 7 — Review */
  BUILDERS[7] = function(){
    var nb = nextBtn("Carry on", function(){ goTo(8); });
    var note = h("p", { class:"gate-note" });
    gateFn = function(){
      var ok = CRITERIA.every(function(c){ return !!state.ratings[c.id]; });
      nb.disabled = !ok;
      note.textContent = ok ? "" : "Answer the four questions to carry on.";
    };
    var sampleBox = h("div", {});
    function paintSample(){
      while (sampleBox.firstChild) sampleBox.removeChild(sampleBox.firstChild);
      if (revealed.sample) {
        sampleBox.appendChild(h("div", { class:"sample" }, [
          h("h3", { text:"One possible answer" }),
          h("p", { text:sampleFirst(state.situation) + "\n" + ANCHOR_TURN + "\n" + sampleFollow(state.situation) }),
          h("p", { style:"margin:0", text:"Your answer can be different. Use your own meaning." })
        ]));
      } else {
        sampleBox.appendChild(h("button", { class:"btn", type:"button", onclick:function(){ revealed.sample = true; paintSample(); announce("Possible answer shown."); } }, ["See a possible answer"]));
      }
    }

    var crit = h("div", { class:"criteria" });
    CRITERIA.forEach(function(c){
      var fs = h("fieldset", { class:"criterion" }, [h("legend", { text:c.name + ": " + c.q })]);
      var seg = h("div", { class:"seg three" });
      Object.keys(RATINGS).forEach(function(r){
        var id = nextId("rate");
        var input = h("input", { type:"radio", name:"rate-" + c.id, id:id, value:r });
        input.checked = state.ratings[c.id] === r;
        input.addEventListener("change", function(){ state.ratings[c.id] = r; saveProgress(); gateFn(); });
        seg.appendChild(h("label", { class:"choice", for:id }, [input, h("span", { text:RATINGS[r] })]));
      });
      fs.appendChild(seg); crit.appendChild(fs);
    });

    var chal = h("fieldset", { class:"panel green" }, [h("legend", { text:"This week's three moves. Tick the ones you used." })]);
    WEEKLY_MOVES.forEach(function(m){
      var id = nextId("mv");
      var input = h("input", { type:"checkbox", id:id });
      input.checked = state.challenge[m.id];
      input.addEventListener("change", function(){ state.challenge[m.id] = input.checked; saveProgress(); });
      chal.appendChild(h("label", { class:"choice", for:id }, [input, h("span", {}, [h("strong", { text:m.from + ": " }), m.phrase])]));
    });

    var scr = h("section", { class:"screen" }, [
      h("h2", { text:"Check your answers" }),
      h("div", { class:"compare" }, [
        h("div", { class:"cmp-card" }, [h("h3", { text:"Your first reply" })].concat(replayBlock("a1"))),
        h("div", { class:"cmp-card" }, [h("h3", { text:"Your answer to Hana" })].concat(replayBlock("fu")))
      ]),
      h("p", { text:"This is your own check. Be honest." }),
      crit, chal, sampleBox,
      actionRow([nb]), note
    ]);
    paintSample(); gateFn();
    return scr;
  };

  /* 8 — Improve and retry */
  BUILDERS[8] = function(){
    var cmpHost = h("div", {});
    var tipHost = h("div", { "aria-live":"polite" });
    var nb = h("button", { class:"btn primary", type:"button", onclick:function(){ finishMission(nb, note); } }, ["Finish the Communication Mission"]);
    var note = h("p", { class:"gate-note", role:"status" });
    function paintTip(){
      while (tipHost.firstChild) tipHost.removeChild(tipHost.firstChild);
      var c = CRITERIA.filter(function(x){ return x.id === state.improve; })[0];
      if (!c) return;
      tipHost.appendChild(h("div", { class:"panel green" }, [
        h("p", {}, [h("strong", { text:c.name + ": " }), c.tip]),
        h("p", { text:"Borrow a phrase. Keep your own meaning." }),
        h("div", { class:"chips", style:"margin-bottom:0" }, c.chips.map(function(ph){
          return h("button", { class:"chip", type:"button", onclick:function(){
            var cur = state.texts.a2;
            state.texts.a2 = (cur && !/\s$/.test(cur) ? cur + " " : cur) + ph;
            saveProgress();
            var ta = main.querySelector('.slot[data-key="a2"] textarea');
            if (ta) { ta.value = state.texts.a2; ta.focus(); }
            paintCompare(); gateFn();
            announce("Phrase added.");
          } }, [ph]);
        }))
      ]));
    }
    function paintCompare(){
      while (cmpHost.firstChild) cmpHost.removeChild(cmpHost.firstChild);
      if (!slotDone("a2")) return;
      cmpHost.appendChild(h("div", { class:"compare" }, [
        h("div", { class:"cmp-card" }, [h("h3", { text:"First reply" })].concat(replayBlock("a1"))),
        h("div", { class:"cmp-card new" }, [h("h3", { text:"Improved reply" })].concat(replayBlock("a2")))
      ]));
    }
    gateFn = function(){
      var ok = !!state.improve && slotDone("a2");
      nb.disabled = !ok;
      note.textContent = ok ? "" : (state.improve ? "Make your improved reply to finish." : "Choose one thing to improve.");
      paintCompare();
    };

    var fs = h("fieldset", {}, [h("legend", { text:"Choose one thing to improve" })]);
    CRITERIA.forEach(function(c){
      var id = nextId("imp");
      var input = h("input", { type:"radio", name:"improve", id:id, value:c.id });
      input.checked = state.improve === c.id;
      input.addEventListener("change", function(){ state.improve = c.id; saveProgress(); paintTip(); gateFn(); });
      var rating = state.ratings[c.id] ? " (" + RATINGS[state.ratings[c.id]] + ")" : "";
      fs.appendChild(h("label", { class:"choice", for:id }, [input, h("span", {}, [h("strong", { text:c.name }), rating + " · " + c.q])]));
    });

    var clear = h("button", { class:"btn", type:"button", onclick:function(){
      stopAllRecording(true); revokeRec("a2");
      state.texts.a2 = ""; state.spoken.a2 = false; saveProgress();
      var host = main.querySelector('.slot[data-key="a2"]'); if (host) renderSlot(host);
      gateFn(); announce("Your improved reply is clear. Try again.");
    } }, ["Clear and try again"]);

    var scr = h("section", { class:"screen" }, [
      h("h2", { text:"Make it better" }),
      h("p", { text:"Your first reply stays. Make a second reply and compare." }),
      fs, tipHost,
      buildSlot("a2", "Improved reply"),
      cmpHost,
      actionRow([nb, clear]), note
    ]);
    paintTip(); gateFn();
    return scr;
  };

  function finishMission(btn, note){
    if (completionInProgress) return;
    btn.disabled = true;
    var res = completeActivity();
    if (res.success) {
      goTo(9);
    } else {
      btn.disabled = false;
      note.textContent = res.reason === "criteria" ? "Complete each part to finish." : "That did not finish. Please press the button again.";
      announce(note.textContent);
    }
  }

  /* 9 — Finished: Done + Try again side by side */
  BUILDERS[9] = function(){
    var confirm = h("p", { class:"done-note", role:"status" });
    var doneBtn = h("button", { class:"btn primary", type:"button", onclick:function(){
      if (doneClicked) return;
      doneClicked = true; doneBtn.disabled = true;
      confirm.textContent = "Finished.";
      announce("Finished.");
      terminateSCORM();
    } }, ["Done"]);
    if (doneClicked) { doneBtn.disabled = true; confirm.textContent = "Finished."; }
    var again = h("button", { class:"btn", type:"button", onclick:function(){ resetActivity(); } }, ["Try again"]);
    var improved = CRITERIA.filter(function(c){ return c.id === state.improve; })[0];
    return h("section", { class:"screen" }, [
      h("h2", { text:"Communication Mission complete" }),
      h("div", { class:"hero" }, [
        picture("fix", "A tap with running water, a wrench and a green tick."),
        h("div", {}, [
          h("p", { class:"lead", text:"You replied to Hana and answered her question: " + ANCHOR_TURN }),
          improved ? h("p", { text:"You chose to improve: " + improved.name + "." }) : null,
          h("p", { text:"Next time, use If … , I'll … to say what you will do." })
        ])
      ]),
      h("div", { class:"actions" }, [doneBtn, again]),
      confirm
    ]);
  };

  /* =========================================================
     Navigation
  ========================================================= */
  function goTo(n){
    stopAllRecording(true);
    state.screen = n;
    showScreen(n);
    if (n < 9) sendIncompleteIfNeeded();
  }

  function showScreen(n){
    stopAllRecording(true);
    gateFn = null;
    while (main.firstChild) main.removeChild(main.firstChild);
    var scr = BUILDERS[n]();
    main.appendChild(scr);
    var heading = scr.querySelector("h2");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus({ preventScroll:true }); announce(heading.textContent); }
    try { window.scrollTo(0, 0); } catch(e){}
    document.getElementById("progress-text").textContent = n + " of " + TOTAL_SCREENS;
    document.getElementById("progress-fill").style.width = Math.round(n / TOTAL_SCREENS * 100) + "%";
    saveProgress();
  }

  function resetActivity(){
    stopAllRecording(true);
    Object.keys(recs).forEach(revokeRec);
    var keepCompleted = lmsCompletionConfirmed;
    state = freshState();
    revealed = { sample:false, hint:false };
    viewWord = "ac";
    doneClicked = false;
    completionSent = keepCompleted;   /* never downgrade an existing completion */
    saveProgress();
    showScreen(1);
  }

  function afterReconnect(){
    scormReady = SCORM.isAvailable();
    if (!scormReady) return;
    var existing = SCORM.readExistingCompletion();
    if (existing.completed) { lmsCompletionConfirmed = true; completionSent = true; }
    else if (state.screen > 1 || state.completed) { sendIncompleteIfNeeded(); }
    if (state.completed && !lmsCompletionConfirmed) {
      var w = SCORM.writeCompletedStatus();
      if (w && SCORM.apiCommit() && SCORM.readExistingCompletion().completed) { lmsCompletionConfirmed = true; completionSent = true; }
    }
    saveProgress();
  }

  function init(){
    scormReady = SCORM.initializeSCORM();
    var raw = null;
    if (scormReady) {
      var existing = SCORM.readExistingCompletion();
      if (existing.completed) { lmsCompletionConfirmed = true; completionSent = true; }
      var suspend = SCORM.apiGetValue("cmi.suspend_data");
      if (suspend) { try { raw = JSON.parse(suspend); } catch(e){ raw = null; } }
      if (!raw) raw = loadLocal();
    } else {
      raw = loadLocal();
      SCORM.scheduleSCORMRedetection(afterReconnect);
    }
    state = sanitiseRestoredPayload(raw);
    if (lmsCompletionConfirmed) state.completed = true;
    /* spoken/typed answers restore; recordings never do, so an unrecorded slot
       on the record route returns the learner to the answer screen */
    var start = state.screen;
    if (!state.completed) {
      if (start === 9) start = 8;
      if (start > 5 && !slotDone("a1")) start = 5;
      if (start > 6 && !slotDone("fu")) start = 6;
      if (start > 8 && !slotDone("a2")) start = 8;
    }
    state.screen = start;
    showScreen(start);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  window.addEventListener("pagehide", function(){ terminateSCORM(); });
  window.addEventListener("beforeunload", function(){ if (!exitHandled) terminateSCORM(); });
})();
</script>
</body>
</html>
