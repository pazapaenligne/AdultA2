<style>
:root{
  --blue:#36BBD6; --blue-tint:#E6F6FA; --blue-mid:#B9E6F0;
  --green:#C9D646; --green-tint:#F4F7D9;
  --yellow:#FCC104; --yellow-tint:#FFF3C4;
  --grey:#EBEBEB; --ink:#2E2E2D; --ink-soft:#5a5a58; --white:#fff;
  --radius:16px;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:#FAF9F6;color:var(--ink);font-family:"Open Sans","Segoe UI",Arial,sans-serif;font-size:1.0625rem;line-height:1.55;overflow-wrap:anywhere}
h1,h2,h3{font-family:"Filson Soft","Open Sans","Segoe UI",Arial,sans-serif;font-weight:800;line-height:1.2;margin:0}
.topband{height:12px;background:var(--blue)}
.app{max-width:980px;margin:0 auto;padding:16px 16px 48px}
.head{padding:8px 0 4px}
.kicker{margin:0;color:var(--ink-soft);font-size:.95rem;font-weight:600}
h1{font-size:1.75rem;margin-top:2px}
.sub{margin:2px 0 10px;color:var(--ink-soft)}
.dots{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0}
.dots li{width:34px;height:8px;border-radius:8px;background:var(--grey)}
.dots li.done{background:var(--blue-mid)}
.dots li[aria-current="step"]{background:var(--blue)}
.partlabel{margin:8px 0 0;font-size:.9rem;color:var(--ink-soft)}
.screen{margin-top:14px}
.screen>h2{font-size:1.5rem;margin-bottom:6px}
.screen>h2:focus{outline:none}
.lead{margin:0 0 14px;color:var(--ink-soft)}
.card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px var(--grey)}
.muted{color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--blue);background:var(--blue);color:var(--ink);font-weight:700}
.btn.ghost{background:var(--white)}
.btn[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center}

/* status (yellow dot for retry, green tick for correct; never red) */
.status{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--grey)}
.status.ok{background:var(--green-tint)}
.status.try{background:var(--yellow-tint)}
.status .dot{flex:0 0 14px;height:14px;margin-top:6px;border-radius:50%;background:var(--yellow)}
.status.ok .dot{background:var(--green)}
.status p{margin:0}

/* 1 scene */
.scene{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
figure{margin:0}
.art img{display:block;width:100%;height:auto;border-radius:14px;background:var(--blue-tint)}
.art figcaption{margin-top:8px;font-size:.95rem;color:var(--ink-soft)}
.doc{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:0 0 0 1px var(--grey)}
.doc-label{margin:0;font-weight:800;color:var(--ink-soft);font-size:.9rem}
.doc-detail{margin:4px 0 14px;font-weight:600}
.bubble{background:var(--blue-tint);border-radius:18px 18px 18px 4px;padding:12px 16px}
.bubble .who{margin:0;font-weight:800;font-size:.9rem}
.bubble .say{margin:2px 0 0;font-size:1.2rem;font-weight:700}
.audio-note{margin:12px 0 0;font-size:.9rem;color:var(--ink-soft)}

/* 2 compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:block;width:100%;text-align:left;min-height:84px;padding:16px;border-radius:var(--radius);border:2px solid var(--grey);background:var(--white);color:var(--ink);font-size:1.15rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.diff .col{background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:0 0 0 1px var(--grey)}
.diff .tag{margin:0 0 4px;font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.diff .line{margin:0;font-size:1.1rem;font-weight:600}
mark{background:var(--green);color:var(--ink);padding:0 5px;border-radius:6px;font-weight:800;text-decoration:underline}
.explain{margin:12px 0 0;font-weight:600}

/* 3 build rail */
.item{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:0 0 0 1px var(--grey);margin-bottom:16px}
.item h3{font-size:1.15rem;margin-bottom:8px}
.lbl{margin:10px 0 6px;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.bank,.rail{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:10px;border-radius:14px}
.bank{background:var(--grey)}
.rail{background:var(--blue-tint);border:2px dashed var(--blue);align-items:center}
.chip{min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--blue);background:var(--white);color:var(--ink);font-weight:700;font-size:1.05rem}
.rail .chip{background:var(--white)}
.hole{color:var(--ink-soft)}
.read{margin:10px 0 0;font-size:1.1rem;font-weight:700;min-height:1.6em}
.help{margin:8px 0 0;font-size:.9rem;color:var(--ink-soft)}
.thumb{display:block;max-width:240px;width:100%;height:auto;border-radius:12px;margin:0 0 12px}

/* 4 composer */
.composer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.group{margin:0 0 14px;padding:0;border:0}
.group legend{font-weight:700;margin-bottom:6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:46px;padding:8px 16px;border-radius:999px;border:2px solid var(--grey);background:var(--white);color:var(--ink);font-weight:600}
.pick[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint);font-weight:800}
label.field{display:block;font-weight:700;margin:8px 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:2px solid #b9b9b6;border-radius:12px;background:var(--white);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.orig{background:var(--grey);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.orig b{display:block;font-size:.85rem;color:var(--ink-soft)}

/* 5 repair */
.draftcard{background:var(--white);border-radius:var(--radius);box-shadow:0 0 0 1px var(--grey);overflow:hidden}
.draftcard .bar{background:var(--grey);padding:8px 16px;font-weight:700;font-size:.9rem}
.draftcard .body{padding:16px}
.toks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tok{padding:4px 10px;background:var(--grey);border-radius:8px;font-weight:600}
.gap{min-width:44px;min-height:44px;border-radius:50%;border:2px dashed var(--blue);background:var(--white);color:var(--ink);font-weight:800}
.gapopts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ba .col{background:var(--white);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--grey)}
.ba .tag{margin:0;font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.ba .line{margin:2px 0 0;font-weight:600}

/* 6 chat */
.chat{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:start}
.chat .art img{max-width:100%}
.thread{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 16px;border-radius:18px}
.msg .who{margin:0;font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.msg p.t{margin:2px 0 0}
.msg.them{background:var(--blue-tint);border-bottom-left-radius:4px}
.msg.you{align-self:flex-end;background:var(--white);box-shadow:0 0 0 1px var(--grey);width:92%}
.msg.model{background:var(--green-tint);border-bottom-left-radius:4px}
.checks{list-style:none;margin:8px 0 0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.checks input{width:24px;height:24px;margin-top:2px;flex:0 0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.two .col{background:var(--grey);border-radius:12px;padding:10px 14px}
.two .tag{margin:0;font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.two .t{margin:2px 0 0;white-space:pre-wrap}

/* 7 week board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.note{background:var(--yellow-tint);border-radius:14px;padding:12px 14px}
.note.l2{background:var(--green-tint)}
.note.l3{background:var(--blue-tint)}
.note h3{font-size:.95rem;margin-bottom:4px}
.note p{margin:0 0 8px;font-weight:600}
.note .pick{min-height:44px;font-size:.95rem}
.pc{list-style:none;margin:8px 0 0;padding:0}
.pc li{padding:4px 0}
.pc .mk{display:inline-block;min-width:92px;font-weight:800}

/* 8 finish */
.sum{list-style:none;margin:10px 0 0;padding:0}
.sum li{padding:8px 0;border-top:1px solid var(--grey)}
.sum b{display:block;font-size:.85rem;color:var(--ink-soft)}
.fin-done{background:var(--green-tint);border-radius:14px;padding:12px 16px;margin-top:14px;font-weight:700}

@media (max-width:700px){
  .scene,.pair,.diff,.composer,.chat,.ba,.two,.board{grid-template-columns:1fr}
  .msg,.msg.you{max-width:100%;width:100%}
  h1{font-size:1.45rem}
  .btn{width:100%}
  .actions{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();}
function words(s){return String(s||'').trim().split(/\s+/).filter(Boolean);}
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}
function shuffleNot(ids){var b,tries=0;do{b=shuffle(ids);tries++;}while(tries<20&&b.join()===ids.join());return b;}
var live=document.getElementById('live');
function say(m){live.textContent='';setTimeout(function(){live.textContent=m;},30);}
function status(st){if(!st)return '';return '<div class="status '+st.t+'"><span class="dot" aria-hidden="true"></span><p>'+esc(st.m)+'</p></div>';}
function btn(act,label,cls,extra){return '<button type="button" class="btn '+(cls||'')+'" data-act="'+act+'" '+(extra||'')+'>'+esc(label)+'</button>';}

/* ---------- completion (bridge / SCORM / local) ---------- */
function findScorm(){
  var w=window,n=0;
  while(w&&n<12){
    try{ if(w.API_1484_11) return {v:'2004',api:w.API_1484_11}; if(w.API) return {v:'1.2',api:w.API}; }catch(e){}
    try{ if(w.parent&&w.parent!==w){w=w.parent;} else if(w.opener&&n<6){w=w.opener;} else break; }catch(e){break;}
    n++;
  }
  return null;
}
function bridge(){return window.PazapaBridge||window.pazapaBridge||null;}
function restoreCompletion(){
  try{
    var s=findScorm(); if(!s) return;
    var st=(s.v==='2004')?(s.api.Initialize(''),s.api.GetValue('cmi.completion_status')):(s.api.LMSInitialize(''),s.api.LMSGetValue('cmi.core.lesson_status'));
    if(st==='completed'||st==='passed') completionSent=true;
  }catch(e){}
}
function commitCompletion(){
  return new Promise(function(resolve){
    try{
      var br=bridge();
      if(br&&typeof br.complete==='function'){
        Promise.resolve(br.complete({activity:CONFIG.activityId})).then(function(r){resolve(r===false?false:true);},function(){resolve(false);});
        return;
      }
      var s=findScorm();
      if(!s){resolve('local');return;}
      if(s.v==='2004'){
        s.api.Initialize('');
        s.api.SetValue('cmi.completion_status','completed');
        resolve(String(s.api.Commit(''))==='true');
      }else{
        s.api.LMSInitialize('');
        s.api.LMSSetValue('cmi.core.lesson_status','completed');
        resolve(String(s.api.LMSCommit(''))==='true');
      }
    }catch(e){resolve(false);}
  });
}
function participationMet(){
  return (S.build.A.attempts+S.build.B.attempts>0) && S.repair.attempts>0 && S.use.checked && S.week.checked;
}

  var h='<div class="composer"><div>'+

    '<p class="orig"><b>Original</b>My salary was late this month.</p>'+
    '<fieldset class="group"><legend>What was late?</legend><div class="chips">';
  THINGS.forEach(function(t){h+='<button type="button" class="pick" data-act="thing" data-v="'+esc(t)+'" aria-pressed="'+(a.thing===t?'true':'false')+'">'+esc(t)+'</button>';});
  h+='</div></fieldset><fieldset class="group"><legend>When?</legend><div class="chips">';
  TIMES.forEach(function(t){h+='<button type="button" class="pick" data-act="time" data-v="'+esc(t)+'" aria-pressed="'+(a.time===t?'true':'false')+'">'+esc(t)+'</button>';});
  h+='</div></fieldset>'+
    '<label class="field" for="adaptText">Read your sentence. You can edit it.</label>'+
    '<input type="text" id="adaptText" data-field="adapt.text" value="'+esc(a.text)+'" autocomplete="off">'+
    '<div class="actions">'+btn('adaptcheck','Use my sentence')+'</div>'+status(a.status);
  if(a.solved){
    h+='<div class="ba"><div class="col"><p class="tag">Original</p><p class="line">My salary was late this month.</p></div>'+
       '<div class="col"><p class="tag">Your sentence</p><p class="line">'+esc(a.text.trim())+'</p></div></div>';
  }
  h+='</div></div><div class="actions">'+btn('again','Try again','ghost')+btn('next','Repair the message')+'</div>'+gateHTML();
  return h;
}

function gapHTML(){
  var r=S.repair, ws=words(r.text), h='';
  ws.forEach(function(w,i){
    h+='<span class="tok">'+esc(w)+'</span><button type="button" class="gap" data-act="gap" data-i="'+i+'" aria-expanded="'+(r.gap===i?'true':'false')+'" aria-label="Add a word after '+esc(w)+'">+</button>';
  });
  return h;
}
function sRepair(){
  var r=S.repair;
  var h='<p class="lead">This is Mariam’s draft to HR. One small word is missing.</p>'+
    '<div class="draftcard"><div class="bar">Draft message</div><div class="body">'+
    '<label class="field" for="repText">Edit the sentence</label>'+
    '<input type="text" id="repText" data-field="repair.text" value="'+esc(r.text)+'" autocomplete="off">'+
    '<p class="help">Or tap + where a word is missing.</p>'+
    '<div class="toks" id="gaprow">'+gapHTML()+'</div>';
  if(r.gap>=0){
    h+='<div class="gapopts" role="group" aria-label="Choose a word">';
    r.gapOpts.forEach(function(w){h+='<button type="button" class="pick" data-act="gapword" data-v="'+w+'">'+w+'</button>';});
    h+='</div>';
  }
  h+='<div class="actions">'+btn('repcheck','Check my repair');
  if(r.wrong>=2&&!r.solved&&!r.model) h+=btn('repmodel','Show the model','ghost');
  h+='</div>'+status(r.status)+'</div></div>';
  if(r.solved||r.model){
    if(!r.retryOpen||r.retrySolved){
      h+='<div class="ba"><div class="col"><p class="tag">Before</p><p class="line">I need explain a misunderstanding.</p></div>'+
         '<div class="col"><p class="tag">After</p><p class="line">I need <mark>to</mark> explain a misunderstanding.</p></div></div>'+
         '<p class="explain">Use <b>to</b> between <b>need</b> and <b>explain</b>.</p>';
    }else{
      h+='<p class="help">The model is hidden for this try.</p>';
    }
    if(!r.retryOpen){
      h+='<div class="actions">'+btn('retryopen','Try it without the model','ghost')+'</div>';
    }else{
      h+='<div class="draftcard" style="margin-top:12px"><div class="bar">Without the model</div><div class="body">'+
         '<label class="field" for="retryText">Write the repaired sentence</label>'+
         '<input type="text" id="retryText" data-field="repair.retryText" value="'+esc(r.retryText)+'" autocomplete="off">'+
         '<div class="actions">'+btn('retrycheck','Check my sentence')+'</div>'+status(r.retryStatus)+'</div></div>';
    }
  }
  h+='<div class="actions">'+btn('again','Try again','ghost')+btn('next','Write my reply')+'</div>'+gateHTML();
  return h;
}

function sUse(){
  var u=S.use;
  var h='<div class="chat"><figure class="art"><img src="'+IMG.ovt+'" alt="A woman works at a laptop in the evening. A clock is on the wall."></figure>'+
    '<div class="thread">'+
    '<div class="msg them"><p class="who">Hana</p><p class="t"><b>What seems to be the problem?</b></p></div>'+
    '<div class="msg you"><p class="who">You</p>'+
    '<label class="field" for="useText">Write one or two sentences.</label>'+
    '<textarea id="useText" data-field="use.text" '+(u.checked?'readonly':'')+'>'+esc(u.text)+'</textarea>';
  if(!u.checked){
    h+='<div class="chips" role="group" aria-label="Sentence starters" style="margin-top:8px">'+
       '<button type="button" class="pick" data-act="starter" data-t="There was a misunderstanding about my ">There was a misunderstanding about my …</button>'+
       '<button type="button" class="pick" data-act="starter" data-t="… are missing from my payslip. ">… are missing from my payslip.</button>'+
       '<button type="button" class="pick" data-act="starter" data-t="Could we …?">Could we …?</button></div>'+
       '<div class="actions">'+btn('usecheck','Check my reply')+'</div>'+status(u.status);
  }
  h+='</div>';
  if(u.checked){
    h+='<div class="msg model"><p class="who">Possible response</p><p class="t">'+esc(USE_MODEL)+'</p>'+
       '<p class="help">This is an example. Your reply can be different.</p></div>'+
       '<div class="msg you"><p class="who">Self-check (not marked by the system)</p><ul class="checks">';
    ['My message fits the problem.','I tried the pattern: There was… / My … was… / Could we…?','I included a key detail: a day, a time or an amount.'].forEach(function(t,i){
      h+='<li><input type="checkbox" id="uc'+i+'" data-act="usecheckbox" data-i="'+i+'" '+(u.checks[i]?'checked':'')+'><label for="uc'+i+'">'+esc(t)+'</label></li>';
    });
    h+='</ul>'+
       '<label class="field" for="useSecond">Improve one part. Your first reply stays here.</label>'+
       '<textarea id="useSecond" data-field="use.secondText">'+esc(u.secondText||u.first)+'</textarea>'+
       '<div class="actions">'+btn('usesecond','Save my second version','ghost')+'</div>';
    if(u.secondSaved){
      h+='<div class="two"><div class="col"><p class="tag">First reply</p><p class="t">'+esc(u.first)+'</p></div>'+
         '<div class="col"><p class="tag">Second reply</p><p class="t">'+esc(u.second)+'</p></div></div>';
    }
    h+='</div>';
  }
  h+='</div></div><div class="actions">'+btn('again','Try again','ghost')+btn('next','Put the week together')+'</div>'+gateHTML();
  return h;
}

function sWeek(){
  var w=S.week;
  var h='<p class="lead">Write a short message to your manager. Use one phrase from each lesson.</p><div class="board">';
  WEEK.forEach(function(p,i){
    h+='<div class="note '+p.cls+'"><h3>'+p.lesson+'</h3><p>'+esc(p.text)+'</p>'+
       '<button type="button" class="pick" data-act="wk" data-i="'+i+'">Add to my message</button></div>';
  });
  h+='</div><label class="field" for="weekText">My message</label>'+
     '<textarea id="weekText" data-field="week.text">'+esc(w.text)+'</textarea>'+
     '<div class="actions">'+btn('weekcheck','Check my message')+'</div>'+status(w.status);
  if(w.checked){
    h+='<p class="lbl">Phrase check (self-check, not marked by the system)</p><ul class="pc">';
    WEEK.forEach(function(p){
      var used=norm(w.text).indexOf(norm(p.text))>=0;
      h+='<li><span class="mk">'+(used?'Included':'Not yet')+'</span> '+p.lesson+': '+esc(p.text)+'</li>';
    });
    h+='</ul><div class="msg model" style="margin-top:12px;max-width:100%"><p class="who">Possible message</p><p class="t">'+esc(WEEK_MODEL)+'</p>'+
       '<p class="help">This is an example. Your message can be different.</p></div>';
  }
  h+='<div class="actions">'+btn('again','Try again','ghost')+btn('next','Finish')+'</div>'+gateHTML();
  return h;
}

function sFinish(){
  var done=completionSent||completedLocal;
  var items=[];
  ['A','B'].forEach(function(k){
    var st=S.build[k]; if(st.solved||st.model) items.push(['Built',BUILD[k].chunks.join(' ')+'.']);
  });
  if(S.adapt.solved) items.push(['Changed a detail',S.adapt.text.trim()]);
  if(S.repair.solved||S.repair.model) items.push(['Repaired',S.repair.solved?S.repair.text.trim():NOTICE.repair]);
  if(S.use.first) items.push(['My reply',S.use.second||S.use.first]);
  if(S.week.text.trim()) items.push(['My week message',S.week.text.trim()]);
  var h='<p class="lead">You built, changed and repaired useful sentences for a work problem.</p>'+
    '<div class="card"><h3>Your sentences</h3><ul class="sum">';
  items.forEach(function(it){h+='<li><b>'+esc(it[0])+'</b>'+esc(it[1])+'</li>';});
  if(!items.length) h+='<li>No sentences yet.</li>';
  h+='</ul></div>';
  if(done) h+='<p class="fin-done" tabindex="-1" id="findone">Well done. This activity is complete.</p>';
  h+='<div class="actions">'+btn('again','Try again','ghost')+btn('done','Done','',done?'aria-pressed="true"':'')+'</div>'+
     '<div id="donestatus">'+(S.gate?status({t:'try',m:S.gate}):'')+'</div>';
  return h;
}

function gateHTML(){return '<div id="gate">'+(S.gate?status({t:'try',m:S.gate}):'')+'</div>';}

var SCREENS=[sScene,sNotice,sBuild,sAdapt,sRepair,sUse,sWeek,sFinish];

/* ---------- render ---------- */
var stage=document.getElementById('stage');
function render(focusHeading){
  var i=S.screen;
  stage.innerHTML='<section class="screen" aria-labelledby="h2"><h2 id="h2" tabindex="-1">'+esc(TITLES[i])+'</h2>'+SCREENS[i]()+'</section>';
  var d=document.getElementById('dots'),h='';
  for(var k=0;k<TOTAL;k++){h+='<li class="'+(k<i?'done':'')+'" '+(k===i?'aria-current="step"':'')+'></li>';}
  d.innerHTML=h;
  document.getElementById('partlabel').textContent=i<TOTAL?('Part '+(i+1)+' of '+TOTAL):'Finished';
  if(focusHeading){document.getElementById('h2').focus();window.scrollTo(0,0);}
  else if(focusKey){var el=stage.querySelector('[data-fk="'+focusKey+'"]')||document.getElementById(focusKey);if(el)el.focus();}
  focusKey=null;
}
function go(i){S.screen=i;S.gate='';render(true);}

function canAdvance(i){
  if(i===2) return S.build.A.attempts+S.build.B.attempts>0||S.build.A.model||S.build.B.model;
  if(i===3) return S.adapt.attempts>0;
  if(i===4) return S.repair.attempts>0;
  if(i===5) return S.use.checked;
  if(i===6) return S.week.checked;
  return true;
}
var GATE_MSG={2:'Check one sentence first. Then carry on.',3:'Use your sentence first. Then carry on.',4:'Check your repair first. Then carry on.',5:'Write and check your reply first. Then carry on.',6:'Write and check your message first. Then carry on.'};

/* ---------- actions ---------- */
function moveChip(k,id,dir){
  var p=S.build[k].placed,i=p.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=p.length)return;
  p.splice(i,1);p.splice(j,0,id);
  focusKey='rail-'+k+'-'+id;render();
}
function checkBuild(k){
  var d=BUILD[k],st=S.build[k];
  if(st.placed.length<d.chunks.length){st.status={t:'try',m:'Use all the pieces first.'};say(st.status.m);render();return;}
  var sentence=st.placed.map(function(id){return d.chunks[id];}).join(' ');
  st.attempts++;
  if(d.accept.indexOf(norm(sentence))>=0){
    st.solved=true;st.status={t:'ok',m:'Yes. This message works: '+sentence+'.'};
  }else{
    st.wrong++;st.status={t:'try',m:'Not yet. '+d.hint};
  }
  say(st.status.m);render();
}
function checkRepairText(t){
  var n=norm(t);
  if(!n) return {ok:false,m:'Write the sentence first.',empty:true};
  if(/\bneed explain\b/.test(n)) return {ok:false,m:'Not yet. Add a small word between need and explain.'};
  if(/\b(need to|would like to|d like to|want to) explain\b/.test(n)){
    if(n===norm(NOTICE.repair)) return {ok:true,m:'Yes. You added to: I need to explain.'};
    return {ok:true,m:'Yes. This works too. The key change is to: need to explain.'};
  }
  return {ok:false,m:'Not yet. Keep the same message: you need to explain a misunderstanding.'};
}
function adaptValid(t){
  var s=t.trim();
  if(!s) return 'Write or choose a sentence first.';
  if(!/^(my|our)\s+.+\s(was|were)\s+late\b/i.test(s)) return 'Keep the pattern: My … was late …';
  if(words(s).length>12) return 'Keep it short: one clear sentence.';
  if(norm(s)===norm('My salary was late this month')) return 'Change one detail: what was late, or when.';
  return '';
}
function composeAdapt(){
  var a=S.adapt;
  if(a.thing&&a.time) a.text=a.thing+' was late '+a.time+'.';
  else if(a.thing) a.text=a.thing+' was late this month.';
  else if(a.time) a.text='My salary was late '+a.time+'.';
}

function act(name,el){
  var k=el.getAttribute('data-k'),id=el.getAttribute('data-id');
  switch(name){
    case 'next':
      if(!canAdvance(S.screen)){S.gate=GATE_MSG[S.screen]||'';say(S.gate);var g=document.getElementById('gate');if(g)g.innerHTML=status({t:'try',m:S.gate});return;}
      go(S.screen+1);return;
    case 'again': resetScreen();return;
    case 'pick':
      var i=parseInt(el.getAttribute('data-i'),10),n=S.notice;
      n.picks.push(i);
      if(i===1){n.solved=true;n.status={t:'ok',m:'Yes. This message fits.'};}
      else{n.status={t:'try',m:'Not yet. Look at the small word before explain.'};}
      say(n.status.m);focusKey='opt'+i;render();return;
    case 'add':
      S.build[k].placed.push(parseInt(id,10));S.build[k].status=null;focusKey='rail-'+k+'-'+id;render();return;
    case 'rm':
      S.build[k].placed=S.build[k].placed.filter(function(x){return x!==parseInt(id,10);});S.build[k].status=null;focusKey='bank-'+k+'-'+id;render();return;
    case 'check': checkBuild(k);return;
    case 'model':
      S.build[k].placed=BUILD[k].chunks.map(function(_,i){return i;});S.build[k].model=true;
      S.build[k].status={t:'ok',m:'Here is the model. Use Try again to build it yourself.'};say(S.build[k].status.m);render();return;
    case 'thing': S.adapt.thing=el.getAttribute('data-v');composeAdapt();S.adapt.status=null;focusKey=null;render();return;
    case 'time': S.adapt.time=el.getAttribute('data-v');composeAdapt();S.adapt.status=null;render();return;
    case 'adaptcheck':
      var err=adaptValid(S.adapt.text);S.adapt.attempts++;
      if(err){S.adapt.status={t:'try',m:err};S.adapt.solved=false;}
      else{S.adapt.solved=true;S.adapt.status={t:'ok',m:'Yes. Same pattern, new detail.'};}
      say(S.adapt.status.m);render();return;
    case 'gap':
      var gi=parseInt(el.getAttribute('data-i'),10);S.repair.gap=(S.repair.gap===gi)?-1:gi;focusKey='repText';render();
      if(S.repair.gap>=0){var f=stage.querySelector('[data-act="gapword"]');if(f)f.focus();}
      return;
    case 'gapword':
      var ws=words(S.repair.text);ws.splice(S.repair.gap+1,0,el.getAttribute('data-v'));
      S.repair.text=ws.join(' ');S.repair.gap=-1;focusKey='repText';render();return;
    case 'repcheck':
      var r=S.repair,res=checkRepairText(r.text);
      if(res.empty){r.status={t:'try',m:res.m};say(res.m);render();return;}
      r.attempts++;if(!r.first)r.first=r.text.trim();
      if(res.ok){r.solved=true;r.status={t:'ok',m:res.m};}else{r.wrong++;r.status={t:'try',m:res.m};}
      say(res.m);render();return;
    case 'repmodel':
      S.repair.text=NOTICE.repair;S.repair.model=true;S.repair.attempts=Math.max(S.repair.attempts,1);
      S.repair.status={t:'ok',m:'Here is the model: I need to explain a misunderstanding.'};say(S.repair.status.m);render();return;
    case 'retryopen': S.repair.retryOpen=true;S.repair.retryText='';S.repair.retryStatus=null;focusKey='retryText';render();return;
    case 'retrycheck':
      var rr=checkRepairText(S.repair.retryText);
      if(rr.empty){S.repair.retryStatus={t:'try',m:rr.m};}
      else if(rr.ok){S.repair.retrySolved=true;S.repair.retryStatus={t:'ok',m:'Yes. You rebuilt it without the model.'};}
      else{S.repair.retryStatus={t:'try',m:'Not yet. Think about the small word after need.'};}
      say(S.repair.retryStatus.m);render();return;
    case 'starter':
      var u=S.use;u.text=(u.text&&!/\s$/.test(u.text)?u.text+' ':u.text)+el.getAttribute('data-t');focusKey='useText';render();return;
    case 'usecheck':
      var tx=S.use.text.trim();
      if(words(tx).length<3){S.use.status={t:'try',m:'Write one or two sentences first.'};say(S.use.status.m);render();return;}
      S.use.checked=true;S.use.first=tx;S.use.secondText=tx;S.use.status=null;say('Your reply is saved. Compare it with the possible response.');render();return;
    case 'usecheckbox': S.use.checks[parseInt(el.getAttribute('data-i'),10)]=!!el.checked;return;
    case 'usesecond':
      S.use.second=S.use.secondText.trim();S.use.secondSaved=!!S.use.second;
      if(S.use.secondSaved)say('Second version saved.');render();return;
    case 'wk':
      var p=WEEK[parseInt(el.getAttribute('data-i'),10)].text,w=S.week;
      w.text=(w.text&&!/\s$/.test(w.text)?w.text+' ':w.text)+p;w.checked=false;focusKey='weekText';render();return;
    case 'weekcheck':
      if(words(S.week.text).length<6){S.week.status={t:'try',m:'Write a short message first.'};say(S.week.status.m);render();return;}
      S.week.checked=true;S.week.status=null;say('Phrase check is ready.');render();return;
    case 'done': doDone();return;
  }
}

function resetScreen(){
  var f=fresh(),i=S.screen;
  if(i===1) S.notice=f.notice;
  else if(i===2) S.build=f.build;
  else if(i===3) S.adapt=f.adapt;
  else if(i===4) S.repair=f.repair;
  else if(i===5) S.use=f.use;
  else if(i===6) S.week=f.week;
  else if(i===7){S=f;S.screen=0;render(true);say('Starting again.');return;}
  S.gate='';render(true);say('This part is reset.');
}

function doDone(){
  if(completionSent||completedLocal){render();var fd=document.getElementById('findone');if(fd)fd.focus();return;}
  if(completionInFlight)return;
  if(!participationMet()){S.gate='Please finish the sentence, repair and message parts first.';render();return;}
  completionInFlight=true;
  var b=stage.querySelector('[data-act="done"]');if(b){b.disabled=true;b.setAttribute('aria-busy','true');}
  commitCompletion().then(function(r){
    completionInFlight=false;S.gate='';
    if(r==='local'){completedLocal=true;}
    else if(r===true){completionSent=true;}
    else{S.gate='Please press Done again.';}
    render();
    if(r){var fd=document.getElementById('findone');if(fd)fd.focus();say('Well done. This activity is complete.');}
  });
}

/* ---------- events ---------- */
stage.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||!stage.contains(t))return;
  if(t.getAttribute('data-act')==='usecheckbox')return; // handled on change
  act(t.getAttribute('data-act'),t);
});
stage.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-act')==='usecheckbox')act('usecheckbox',t);
});
stage.addEventListener('input',function(e){
  var t=e.target,f=t&&t.getAttribute&&t.getAttribute('data-field');
  if(!f)return;
  var p=f.split('.');S[p[0]][p[1]]=t.value;
  if(f==='repair.text'){var g=document.getElementById('gaprow');if(g){S.repair.gap=-1;g.innerHTML=gapHTML();}}
  if(f==='adapt.text'){S.adapt.status=null;}
});
stage.addEventListener('keydown',function(e){
  var t=e.target.closest&&e.target.closest('.rail .chip');
  if(!t)return;
  var k=t.getAttribute('data-k'),id=parseInt(t.getAttribute('data-id'),10);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();moveChip(k,id,-1);}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();moveChip(k,id,1);}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();act('rm',t);}
});
/* drag and drop (optional extra; tap and keyboard always work) */
var dragData=null;
stage.addEventListener('dragstart',function(e){
  var t=e.target.closest&&e.target.closest('.chip');if(!t)return;
  dragData={k:t.getAttribute('data-k'),id:parseInt(t.getAttribute('data-id'),10),from:t.closest('.rail')?'rail':'bank'};
  try{e.dataTransfer.setData('text/plain',String(dragData.id));e.dataTransfer.effectAllowed='move';}catch(x){}
});
stage.addEventListener('dragover',function(e){if(dragData&&e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault();});
stage.addEventListener('drop',function(e){
  if(!dragData)return;
  var z=e.target.closest&&e.target.closest('[data-drop]');if(!z||z.getAttribute('data-k')!==dragData.k){dragData=null;return;}
  e.preventDefault();
  var st=S.build[dragData.k],id=dragData.id,to=z.getAttribute('data-drop');
  st.placed=st.placed.filter(function(x){return x!==id;});
  if(to==='rail'){
    var over=e.target.closest('.chip'),pos=st.placed.length;
    if(over&&over.closest('.rail')){var oid=parseInt(over.getAttribute('data-id'),10),oi=st.placed.indexOf(oid);if(oi>=0)pos=oi;}
    st.placed.splice(pos,0,id);
  }
  st.status=null;dragData=null;render();
});
stage.addEventListener('dragend',function(){dragData=null;});

/* ---------- start ---------- */
restoreCompletion();
render(false);
})();
</script>
</body>
</html>
