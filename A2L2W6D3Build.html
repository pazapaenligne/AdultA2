  - Completion: see the COMPLETION section. If a SCORM-style API is found it is used silently on Done; otherwise

-->
<style>
  :root{
    --blue:#36BBD6; --blue-tint:#D7F1F7;
    --green:#C9D646; --green-tint:#F4F7DA;
    --yellow:#FCC104; --yellow-tint:#FEF3CD;
    --red:#E6352B; --grey:#EBEBEB; --dark:#2E2E2D; --white:#FFFFFF;
    --focus: 3px solid #2E2E2D; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--white);color:var(--dark);
    font-family:"Open Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;max-width:100%;overflow-x:hidden;}
  h1,h2,h3{font-family:"Filson Soft","Open Sans","Segoe UI",Arial,sans-serif;font-weight:800;margin:0 0 8px;line-height:1.25;text-transform:none;}
  h2{font-size:22px;} h3{font-size:16px;}
  p{line-height:1.5;margin:0 0 10px;}
  .app{max-width:840px;margin:0 auto;padding:16px 16px 40px;}
  .brand-logo{display:block;width:132px;height:auto;margin:0 0 12px;}
  .top-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--blue);padding-bottom:8px;margin-bottom:18px;}
  .eyebrow{font-size:13px;font-weight:700;}
  .top-bar h1{font-size:20px;margin:2px 0 0;overflow-wrap:break-word;}
  .progress-wrap{display:flex;align-items:center;gap:10px;flex:1 1 170px;min-width:0;}
  .progress-track{flex:1 1 60px;height:10px;background:var(--grey);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);width:12.5%;transition:width .3s ease;}
  .progress-label{font-size:12px;font-weight:700;white-space:nowrap;}
  .screen{display:none;} .screen.active{display:block;}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .card{border:1px solid var(--grey);border-radius:var(--radius);padding:16px;margin-bottom:14px;background:var(--white);}
  .tint-blue{background:var(--blue-tint);border-color:var(--blue-tint);}
  .tint-yellow{background:var(--yellow-tint);border-color:var(--yellow-tint);}
  .tint-green{background:var(--green-tint);border-color:var(--green-tint);}
  .goal{background:var(--blue-tint);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .goal .label{font-size:13px;font-weight:700;margin-bottom:4px;}
  .goal .txt{font-size:18px;font-weight:800;}
  img.pic{display:block;max-width:100%;height:auto;object-fit:contain;border-radius:12px;background:#FFF7E6;}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .row>.col{flex:1 1 260px;min-width:0;}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .nav-bar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:10px;}
  button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:999px;min-height:44px;min-width:44px;
    padding:10px 22px;border:2px solid var(--dark);background:var(--white);color:var(--dark);touch-action:manipulation;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:var(--focus);outline-offset:3px;}
  button.primary{background:var(--blue);border-color:var(--blue);color:var(--dark);}
  button.primary:disabled{background:var(--grey);border-color:var(--grey);color:#6b6b6b;cursor:not-allowed;}
  button.ghost{border-color:var(--grey);}
  button.ghost:hover{background:var(--grey);}
  button:disabled{cursor:not-allowed;}
  .feedback{margin-top:10px;font-weight:700;min-height:24px;font-size:15px;}
  .feedback.ok{background:var(--green-tint);border-left:6px solid var(--green);padding:8px 12px;border-radius:8px;}
  .feedback.retry{background:var(--yellow-tint);border-left:6px solid var(--yellow);padding:8px 12px;border-radius:8px;}
  .feedback .sym{margin-right:6px;font-weight:800;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:6px;}
  .dot.ok{background:var(--green);}
  /* chunks and rails */
  .rail{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:10px;align-items:center;}
  .rail.target{background:var(--blue-tint);border:2px dashed var(--blue);}
  .rail.bank{background:var(--grey);}
  .chunk{font-size:16px;font-weight:700;padding:10px 16px;min-height:44px;border-radius:10px;border:2px solid var(--blue);background:var(--white);}
  .chunk.placed{background:var(--blue);}
  .choice{display:block;width:100%;text-align:left;border-radius:12px;border:2px solid var(--blue);padding:12px 16px;font-weight:600;font-size:16px;margin-bottom:8px;}
  .choice[aria-pressed="true"]{background:var(--blue-tint);}
  .choice.right{background:var(--green-tint);border-color:var(--green);}
  .choice.wrong{background:var(--yellow-tint);border-color:var(--yellow);}
  .pill{display:inline-block;border-radius:999px;border:2px solid var(--blue);padding:8px 16px;margin:0 6px 8px 0;font-weight:700;background:var(--white);cursor:pointer;min-height:44px;font-size:15px;}
  .pill[aria-pressed="true"]{background:var(--blue);}
  /* chat */
  .chat{display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:92%;padding:12px 16px;border-radius:14px;font-size:16px;font-weight:600;}
  .bubble .who{display:block;font-size:12px;font-weight:800;opacity:.7;margin-bottom:2px;}
  .bubble.c{background:var(--blue-tint);align-self:flex-start;}
  .bubble.a{background:var(--green-tint);align-self:flex-end;}
  mark{background:var(--yellow);padding:1px 4px;border-radius:4px;color:var(--dark);font-weight:800;}
  /* compare */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){.compare{grid-template-columns:1fr;}}
  .pane{border-radius:12px;padding:14px;border:2px solid var(--grey);}
  .pane .tag{font-size:12px;font-weight:800;opacity:.7;margin-bottom:4px;display:block;}
  .pattern{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .pattern span{padding:8px 12px;border-radius:10px;font-weight:700;}
  .pattern .p1{background:var(--blue-tint);} .pattern .p2{background:var(--green-tint);}
  /* facts */
  table.facts{width:100%;border-collapse:collapse;font-size:15px;}
  table.facts th,table.facts td{text-align:left;padding:8px;border-bottom:1px solid var(--grey);}
  table.facts th{font-size:13px;opacity:.75;}
  /* composer */
  .composer{border:2px solid var(--grey);border-radius:12px;background:var(--white);}
  .composer .bar{background:var(--grey);padding:8px 12px;font-size:13px;font-weight:800;border-radius:10px 10px 0 0;}
  .composer .body{padding:14px;font-size:19px;font-weight:700;min-height:70px;overflow-wrap:break-word;}
  input[type=text],textarea{width:100%;font-family:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--dark);border-radius:10px;background:var(--white);color:var(--dark);}
  textarea{min-height:110px;resize:vertical;}
  label.lbl{display:block;font-weight:700;margin:8px 0 4px;}
  .check{display:flex;gap:10px;align-items:flex-start;margin:6px 0;min-height:44px;}
  .check input{width:24px;height:24px;margin-top:6px;flex:none;}
  .baf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
  @media (max-width:560px){.baf{grid-template-columns:1fr;}}
  /* timeline */
  .timeline{display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--blue);padding-left:14px;}
  .tl-item{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .tl-item img{width:150px;max-width:100%;} .tl-item .tx{flex:1 1 200px;}
  .tl-step{font-weight:800;color:var(--dark);background:var(--yellow);display:inline-block;border-radius:999px;padding:2px 12px;margin-bottom:4px;}
  .confirm-panel{background:var(--yellow-tint);border-radius:var(--radius);padding:14px 18px;margin-top:12px;}
  .confirm-panel p{font-weight:700;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

function el(tag,attrs){
  var e=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!==null && v!==undefined) e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){

function fresh(){
  return {
    screen:1,
    callShown:false,
    notice:{picked:null,attempts:0,done:false,shown:null,order:shuffle([0,1])},
    bA:{order:[],attempts:0,done:false,bank:shuffle(CONTENT.buildA.chunks.map(function(_,i){return i;}))},
    bB:{order:[],attempts:0,done:false,bank:shuffle(CONTENT.buildB.chunks.map(function(_,i){return i;}))},
    bR:{picked:null,attempts:0,done:false,order:shuffle([0,1,2])},
    bF:{text:"",attempts:0,done:false,last:null},
    adapt:{customer:null,action:null,time:null,attempts:0,done:false,order:shuffle([0,1,2]),actOrder:shuffle([0,1,2])},
    repair:{route:"text",text:CONTENT.repairDraft,picked:null,attempts:0,done:false,model:false,nh:{open:false,text:"",attempts:0,done:false},opts:shuffle([0,1,2])},

S=fresh();

/* ===================== NAVIGATION ===================== */
var stage=document.getElementById("stage");
function go(n){
  if(n<1||n>TOTAL) return;
  S.screen=n; render(true);
  document.getElementById("pfill").style.width=(n/TOTAL*100)+"%";
  document.getElementById("plabel").textContent="Screen "+n+" of "+TOTAL;
  var pw=document.querySelector(".progress-wrap");
  pw.setAttribute("aria-valuenow",String(n)); pw.setAttribute("aria-valuetext","Screen "+n+" of "+TOTAL);
}
function render(focusHeading){
  stage.innerHTML="";
  var fn=[null,s1,s2,s3,s4,s5,s6,s7,s8][S.screen];
  var sec=el("section",{class:"screen active","aria-labelledby":"hd"});
  fn(sec);
  stage.appendChild(sec);
  var h=sec.querySelector("h2");
  if(h){ h.id="hd"; h.setAttribute("tabindex","-1"); if(focusHeading){ h.focus(); announce("Screen "+S.screen+" of "+TOTAL+". "+h.textContent); } }
}
function rerender(focusSel){
  var y=window.scrollY; render(false); window.scrollTo(0,y);
  if(focusSel){ var f=stage.querySelector(focusSel); if(f) f.focus(); }
}
function nav(parts){ /* parts: [{label, primary, disabled, fn}] */
  var bar=el("div",{class:"nav-bar"});
  parts.forEach(function(p){
    bar.appendChild(el("button",{type:"button",class:p.primary?"primary":"ghost",disabled:!!p.disabled,onclick:p.fn,id:p.id||null},p.label));
  });
  return bar;
}

/* ===================== SCREEN 3: build (sentence rail + information panel) ===================== */
function chunkRail(sec,key,item,label,hintText){
  var st=S[key];
  var card=el("div",{class:"card"});
  card.appendChild(el("h3",{},el("span",{class:"dot"+(st.done?" ok":"")}),label));
  var target=el("div",{class:"rail target","aria-label":"Your sentence, in order"});
  st.order.forEach(function(i,pos){
    target.appendChild(el("button",{type:"button",class:"chunk placed","aria-label":"Remove: "+item.chunks[i],disabled:st.done,onclick:function(){
      st.order.splice(pos,1); rerender("#"+key+"-first");
    }},item.chunks[i]));
  });
  if(!st.order.length) target.appendChild(el("span",{style:"opacity:.7"},"Tap the chunks below, in order."));
  var bank=el("div",{class:"rail bank","aria-label":"Chunks not yet placed",style:"margin-top:8px;"});
  var first=true;
  st.bank.filter(function(i){return st.order.indexOf(i)===-1;}).forEach(function(i){
    bank.appendChild(el("button",{type:"button",class:"chunk","aria-label":"Add: "+item.chunks[i],id:first?(key+"-first"):null,disabled:st.done,onclick:function(){
      st.order.push(i); rerender("#"+key+"-first");
    }},item.chunks[i]));
    first=false;
  });
  card.appendChild(target); card.appendChild(bank);
  var msg=null;
  if(st.done) msg=fb("ok","Well done. "+item.accept[0]);
  else if(st.lastWrong){
    msg=fb("retry", st.attempts>=2 ? "Not yet. Here is the model: "+item.accept[0]+" Try to build it." : "Not yet. "+hintText);
  }
  if(msg) card.appendChild(msg);
  card.appendChild(el("div",{class:"btn-row"},
    el("button",{type:"button",class:"primary",disabled:st.done||st.order.length!==item.chunks.length,onclick:function(){
      var sentence=st.order.map(function(i){return item.chunks[i];}).join(" ");
      var ok=normKey(item.accept).indexOf(norm(sentence))!==-1; /* checks the whole sentence, not the click order alone */
      st.attempts++;
      if(ok){st.done=true;st.lastWrong=false;announce("Correct.");} else {st.lastWrong=true; st.order=[]; }
      rerender();
    }},"Check"),
    el("button",{type:"button",class:"ghost",disabled:st.done,onclick:function(){st.order=[];st.lastWrong=false;rerender("#"+key+"-first");}},"Reset")));
  sec.appendChild(card);
}

      bank.appendChild(el("button",{type:"button",class:"pill",onclick:function(){P.text=(P.text?P.text.replace(/\s*$/," "):"")+s[0];rerender("#rep");var t=document.getElementById("rep");t.focus();t.setSelectionRange(t.value.length,t.value.length);}},"If there is a fee, I'll ..."));

  } else {
    left.appendChild(el("div",{class:"pane tint-yellow"},el("span",{class:"tag"},"My first reply"),P.first));

    left.appendChild(cmp);
    var sc=el("div",{class:"card"});
    sc.appendChild(el("h3",{},"Self-check"));
    sc.appendChild(el("p",{style:"font-size:13px;"},"You decide. The activity does not mark your sentence."));
    ["My reply fits the cue: I say what I will do.","I tried the pattern: If ..., I'll ...","I included a useful detail."].forEach(function(t,i){
      var id="sc"+i, cb=el("input",{type:"checkbox",id:id}); cb.checked=P.checks[i]; cb.addEventListener("change",function(){P.checks[i]=cb.checked;});

  row.appendChild(left); row.appendChild(right); sec.appendChild(row);

}

/* ===================== SCREEN 8: finish ===================== */
/* COMPLETION: Done is enabled because the learner has built (screen 3), repaired (screen 5) and written a reply (screens 6 and 7).
   On Done, a SCORM 1.2 / 2004 API is looked for in this window and its parents. If found, completion is committed silently.
   completionInFlight blocks double clicks; completionSent is set only after a confirmed commit; a failed commit can be retried.
   Without an API the activity simply shows a local finished state. No score is sent and no navigation is forced. */
var completionInFlight=false, completionSent=false;
function findAPI(){
  var w=window, n=0;
  while(w && n<10){
    try{
      if(w.API_1484_11) return {v:"2004",api:w.API_1484_11};
      if(w.API) return {v:"1.2",api:w.API};
    }catch(e){}
    if(w.parent===w) break; w=w.parent; n++;
  }
  return null;
}
function commitCompletion(){
  var f=findAPI(); if(!f) return true; /* local only */
  try{
    if(f.v==="2004"){
      f.api.Initialize(""); /* may already be initialised: result ignored */
      var a=String(f.api.SetValue("cmi.completion_status","completed"));
      var c=String(f.api.Commit(""));
      return a==="true" && c==="true";
    } else {
      f.api.LMSInitialize("");
      var a2=String(f.api.LMSSetValue("cmi.core.lesson_status","completed"));
      var c2=String(f.api.LMSCommit(""));
      return a2==="true" && c2==="true";
    }
  }catch(e){ return false; }
}
function s8(sec){
  sec.appendChild(el("h2",{},"Finish"));
  var row=el("div",{class:"row"});
  var l=el("div",{class:"col"}); l.appendChild(pic("pair"));
  var r=el("div",{class:"col"});
  var rc=el("div",{class:"card tint-blue"});
  rc.appendChild(el("h3",{},"Useful sentences from this activity"));
  [CONTENT.buildA.accept[0],CONTENT.buildB.accept[0],"If I cancel now, will I get a refund?",(S.repair.final||CONTENT.repairModel)].forEach(function(t){
    rc.appendChild(el("p",{style:"font-weight:700;"},"• "+t));
  });
  r.appendChild(rc);
  row.appendChild(l); row.appendChild(r); sec.appendChild(row);
  sec.appendChild(el("p",{style:"font-weight:700;font-size:18px;"},"You built, changed and repaired useful sentences for a service change."));
  sec.appendChild(el("p",{},"Next, you will use this language in the Communication Mission."));
  var note=el("p",{id:"fnote",class:"feedback",role:"status"},S.finished?"Well done! You have finished this activity.":"");
  sec.appendChild(note);
  var ready=!!(S.bA.done&&S.bB.done&&S.repair.attempts>0&&S.reply.submitted&&S.week.submitted);
  var done=el("button",{type:"button",class:"primary",id:"done",disabled:S.finished||!ready,onclick:function(){
    if(S.finished||completionInFlight) return;
    completionInFlight=true; done.disabled=true;
    var ok=completionSent?true:commitCompletion();
    completionInFlight=false;
    if(ok){ completionSent=true; S.finished=true; announce("Well done. You have finished this activity."); rerender("#again"); }
    else { done.disabled=false; note.textContent="Press Done to finish."; note.className="feedback retry"; }
  }},S.finished?"Done ✓":"Done");
  var again=el("button",{type:"button",class:"ghost",id:"again",onclick:function(){
    document.getElementById("confirm").style.display="block"; document.getElementById("yes").focus();
  }},"Try again");
  sec.appendChild(el("div",{class:"btn-row"},done,again));
  var panel=el("div",{class:"confirm-panel",id:"confirm",style:"display:none;",role:"group","aria-label":"Start over"},
    el("p",{},"Start this activity over? Your answers will be cleared."),
    el("div",{class:"btn-row",style:"margin-top:0;"},
      el("button",{type:"button",class:"primary",id:"yes",onclick:function(){
        S=fresh(); go(1);
      }},"Yes, start over"),
      el("button",{type:"button",class:"ghost",onclick:function(){document.getElementById("confirm").style.display="none";again.focus();}},"Cancel")));
  sec.appendChild(panel);
}
