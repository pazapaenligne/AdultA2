<!--
  Pazapa Adult English | A2 | Week 6, Lesson 1 | Step 7: Review, Improve and Retry
  Activity id: A2-W06-L1-S7  |  Lesson: "A SIM card and home internet"

  ROUTE: Recall a phrase > Check the detail > Repair one point > Compare my replies > Try a new detail > Finish review.
  Learners can move Back and forward freely; nothing advances automatically; attempts are kept while the page is open.

  CONTENT KEYS (all checks are simple and forgiving; open replies are never auto-marked)
  - Recall bank (model phrases, hidden until the learner asks):
      W04 L1  I'd like to open a salary account.
      W05 L3  If the AC breaks, who should I call?
      W06 L1  I'd like a prepaid SIM to start.
  - Reading recall: "When is the installation window?"  Key: Saturday, 10:00 to 12:00.
      Accepted: the day (Saturday) plus the two times (10 and 12, or ten and twelve), any order, with or without ":00".
      Evidence shown only after an attempt: the booking notice below (highlighted answer).
  - Written route for listening (no audio is supplied, so this is NOT a listening test):
      "She is home after five, so she books Sunday at 5:30 p.m."  Key: 5:30 p.m.
  - Repair: draft "How long does installation takes?"  Key: "How long does installation take?"
      Accepted alternatives: "How long does the installation take?" / "How long does it take?"
      (surrounding spaces, capitals and final punctuation are ignored).
  - Retry cue: "What would you like to know?"  Example (shown after the first attempt):
      "When is the installation? How long does it take?"  This is an example, not an exact-match answer.
  - Transfer (new fictional case): prepaid plan length.  Model: "How long does the prepaid plan last?"
      Accepted: "How long does it last?", "How long does my prepaid SIM last?", "How long is the prepaid plan?"

  OPTIONAL AUDIO: set MODEL_AUDIO below to verified audio URLs with transcripts to enable playback. Empty = clear unavailable state.
  OPTIONAL FEEDBACK SERVICE: none is configured. Self-check only; no scores, no automatic ticks, no AI analysis.
  COMPLETION: Done is enabled on the last screen after (1) a recall attempt, (2) a checked detail or a repaired point,
  and (3) a second reply or a transfer attempt. No microphone, score or confidence rating is needed.
  If a Pazapa bridge (window.PazapaBridge.complete) or a SCORM 1.2 / 2004 API is present it is used; otherwise completion is local.
-->
<style>
:root{
  --pazapa-blue:#36BBD6;
  --pazapa-blue-dark:#1B7E92;
  --pazapa-green:#C9D646;
  --pazapa-yellow:#FCC104;
  --pazapa-red:#E6352B;
  --pazapa-grey-light:#EBEBEB;
  --pazapa-grey-dark:#2E2E2D;
  --blue-20:#D7F1F7;
  --green-20:#F4F7DA;
  --yellow-20:#FEF3CD;
  --line:#6B6B6A;
  --heading-font:"Filson Soft","Open Sans",Arial,sans-serif;
  --body-font:"Open Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--pazapa-grey-dark);font-family:var(--body-font);font-size:1.0625rem;line-height:1.55;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
img{max-width:100%;height:auto;display:block}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--pazapa-grey-dark);color:#fff;padding:12px 16px;z-index:10;border-radius:6px}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:2px;box-shadow:0 0 0 6px #fff}
[hidden]{display:none!important}

/* header and route */
.top{border-top:8px solid var(--pazapa-blue);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,48px)}
.top img{width:130px}
.title{margin:0;font-family:var(--heading-font);font-weight:800;font-size:1.05rem;text-align:left}
@media (min-width:700px){.title{text-align:right}}
.title small{display:block;font-family:var(--body-font);font-weight:400;font-size:.9rem}
.route{border-top:2px solid var(--pazapa-grey-light);border-bottom:2px solid var(--pazapa-grey-light);padding:8px clamp(16px,4vw,48px);background:#fff}
.route ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.route button{min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center}
.route button:hover{background:var(--pazapa-grey-light)}
.route button[aria-current="step"]{background:var(--pazapa-yellow);border:3px solid var(--pazapa-grey-dark);padding:7px 13px}
.route .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:3px;background:var(--pazapa-grey-dark);color:#fff;font-size:.85rem}
.route .done .n{background:var(--pazapa-blue-dark)}
main{max-width:1100px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 64px}
.screen{display:none}
.screen.on{display:block}
h1,h2,h3{font-family:var(--heading-font);font-weight:800;line-height:1.2;margin:0 0 12px}
h2{font-size:clamp(1.55rem,4vw,2.1rem)}
h3{font-size:1.15rem}
h2:focus{outline:none}
h2:focus-visible{outline:3px solid var(--pazapa-grey-dark);outline-offset:4px}
p{margin:0 0 12px}
.lead{font-size:1.12rem}
.small{font-size:.95rem}

/* shared controls */
.btn{min-height:52px;min-width:52px;padding:12px 22px;border-radius:6px;border:3px solid var(--pazapa-blue-dark);background:var(--pazapa-blue-dark);color:#fff;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{background:#166B7C;border-color:#166B7C}
.btn.two{background:#fff;color:var(--pazapa-grey-dark);border-color:var(--pazapa-grey-dark)}
.btn.two:hover{background:var(--pazapa-grey-light)}
.btn.help{background:var(--pazapa-yellow);border-color:var(--pazapa-grey-dark);color:var(--pazapa-grey-dark)}
.btn.help:hover{background:#E8B200}
.btn.small{min-height:48px;padding:8px 16px;font-size:.95rem}
.btn[disabled]{background:var(--pazapa-grey-light);border-color:#8C8C8B;color:#595958;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.status{margin:10px 0 0;font-size:.95rem}
label.lbl{font-weight:600;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:110px;resize:vertical}
textarea[readonly]{background:var(--pazapa-grey-light)}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:8px 0;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-blue-dark)}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--pazapa-blue-dark)}
.opt:has(input:checked){background:var(--blue-20);border-color:var(--pazapa-blue-dark);border-width:3px;padding:9px 13px}
.opt.off{opacity:.6;cursor:not-allowed}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;padding:0;margin-bottom:6px}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:.98rem}
.fb:empty{display:none}
.fb.ok{background:var(--green-20);border:2px solid var(--pazapa-green)}
.fb.try{background:var(--yellow-20);border:2px solid var(--pazapa-yellow)}
.fb .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pazapa-yellow);border:2px solid var(--pazapa-grey-dark);margin-right:8px;vertical-align:-1px}
.fb .tick{font-weight:800;margin-right:6px}
.hint{background:var(--yellow-20);border:2px solid var(--pazapa-yellow);border-radius:6px;padding:8px 12px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0 0 4px}.hint p:last-child{margin:0}
.model{background:var(--green-20);border-left:8px solid var(--pazapa-green);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0 0;font-weight:600}
.navrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:32px;padding-top:16px;border-top:2px solid var(--pazapa-grey-light)}

/* 1. Recall: scene band + conversation timeline */
.sceneband{display:grid;gap:18px;background:var(--blue-20);border-radius:6px;padding:18px;margin:0 0 24px}
@media (min-width:760px){.sceneband{grid-template-columns:minmax(220px,.8fr) 1.2fr;align-items:center;padding:24px}}
.sceneband img{max-height:230px;margin:0 auto;object-fit:contain}
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:5px solid var(--pazapa-blue)}
.timeline>li{position:relative;padding:0 0 26px 22px}
.timeline>li::before{content:"";position:absolute;left:-35px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--pazapa-blue-dark)}
.cuetext{font-size:1.1rem;font-weight:600;background:var(--yellow-20);border-radius:6px;padding:10px 14px}

/* 2. Check: document + side tasks */
.docgrid{display:grid;gap:22px}
@media (min-width:860px){.docgrid{grid-template-columns:1fr 1fr;align-items:start}}
.paper{background:#fff;border:2px solid var(--pazapa-grey-dark);border-radius:6px;padding:0;overflow:hidden}
.paper header{background:var(--pazapa-grey-dark);color:#fff;padding:8px 14px;font-weight:700;font-size:.95rem}
.paper .body{padding:16px;min-height:150px}
.paper .hidden-note{color:#595958;font-style:italic}
mark{background:var(--pazapa-yellow);color:var(--pazapa-grey-dark);padding:1px 4px;border-radius:3px;font-weight:700;text-decoration:underline}
.strip{display:grid;gap:18px;margin-top:26px;padding-top:20px;border-top:3px dashed var(--pazapa-grey-light)}
@media (min-width:860px){.strip{grid-template-columns:1fr 1fr}}
.side{background:var(--green-20);border-radius:6px;padding:16px}
.side.alt{background:var(--blue-20)}

/* 3. Repair: before/after editor */
.editor{border:3px solid var(--pazapa-grey-dark);border-radius:8px;overflow:hidden}
.editor .bar{background:var(--pazapa-grey-dark);color:#fff;padding:8px 14px;font-weight:700}
.editor .panes{display:grid}
@media (min-width:860px){.editor .panes{grid-template-columns:1fr 1fr}.editor .pane+.pane{border-left:3px solid var(--pazapa-grey-light)}}
.editor .pane{padding:16px}
.editor .pane.after{background:var(--green-20)}
.draftline{font-size:1.2rem;font-weight:700;padding:10px 14px;background:var(--yellow-20);border-radius:6px;margin:0 0 10px;text-decoration:line-through;text-decoration-color:var(--pazapa-red)}
.imgcap{display:grid;gap:12px;align-items:center;margin:0 0 20px}
@media (min-width:700px){.imgcap{grid-template-columns:170px 1fr}}

/* 4. Retry studio: numbered rail */
.studio{counter-reset:st}
.studio .stage{position:relative;padding:0 0 28px 62px}
.studio .stage::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;background:var(--pazapa-blue-dark);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--heading-font)}
.studio .stage::after{content:"";position:absolute;left:20px;top:46px;bottom:4px;width:3px;background:var(--pazapa-grey-light)}
.studio .stage:last-child::after{display:none}
.cmp{display:grid;gap:14px;margin:0 0 16px}
@media (min-width:700px){.cmp{grid-template-columns:1fr 1fr}}
.card{border:2px solid var(--pazapa-grey-dark);border-radius:6px;padding:14px 16px;background:#fff}
.card.two{background:var(--green-20)}
.card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.bank{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.bank li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--green-20);padding:8px 12px;border-radius:6px}
.bank li span{flex:1 1 200px;font-weight:600}

/* 5. Transfer: one centred case */
.case{max-width:720px;margin:0 auto;text-align:left}
.case .band{background:var(--yellow-20);border-top:8px solid var(--pazapa-yellow);border-radius:6px;padding:20px;display:grid;gap:14px}
@media (min-width:700px){.case .band{grid-template-columns:200px 1fr;align-items:center}}
.tag{display:inline-block;background:var(--pazapa-grey-dark);color:#fff;padding:3px 10px;border-radius:4px;font-weight:700;font-size:.85rem;margin-bottom:8px}
.case .ask{margin-top:20px}
.case .ask input[type=text]{font-size:1.15rem}

/* 6. Finish */
.big{background:var(--pazapa-green);border-radius:6px;padding:18px 20px;margin:0 0 20px;display:grid;gap:14px}
@media (min-width:700px){.big{grid-template-columns:1fr 220px;align-items:center}}
.big h2{margin:0 0 6px}.big p{margin:0;font-size:1.12rem}
.did{list-style:none;padding:0;margin:0 0 16px}
.did li{display:flex;gap:10px;padding:4px 0}
.did .m{width:26px;height:26px;border:2px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.did li.y .m{background:var(--pazapa-blue-dark);border-color:var(--pazapa-blue-dark);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.opt:has(input:checked){outline:3px solid Highlight}}
</style>

<body>
<a class="skip" href="#main">Skip to the activity</a>
<header class="top">
  <img id="logo" alt="Pazapa">
  <p class="title">A SIM card and home internet<small>Review, improve and retry</small></p>
</header>
<nav class="route" aria-label="Review route"><ol id="routeList"></ol></nav>
<main id="main"></main>
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<template id="tpl">

<!-- 1. RECALL A PHRASE -->
<section class="screen" id="s1" aria-labelledby="h1">
  <div class="sceneband">
    <img data-img="install" alt="A woman in a green hijab sets up a router on a wooden table.">
    <div>
      <h2 id="h1" tabindex="-1">Recall a phrase</h2>
      <p class="lead">Sara has moved into a new apartment and needs a SIM and home internet.</p>
      <p>Try first. Then ask for a hint if you need one. Needing a hint is normal.</p>
      <fieldset>
        <legend>Look at the picture. What is today’s situation?</legend>
        <div class="opts" id="sceneOpts"></div>
        <p class="fb" id="sceneFb" aria-live="polite"></p>
      </fieldset>
    </div>
  </div>
  <p class="lead">What would you say in each situation?</p>
  <ol class="timeline" id="recallList"></ol>
  <div class="navrow"><span></span><button class="btn" type="button" data-go="1">Next: Check the detail</button></div>
</section>

<!-- 2. CHECK THE DETAIL -->
<section class="screen" id="s2" aria-labelledby="h2">
  <h2 id="h2" tabindex="-1">Check the detail</h2>
  <p>Remember first. Then look at the notice to check.</p>
  <div class="docgrid">
    <div class="paper">
      <header>Installation notice</header>
      <div class="body">
        <img data-img="router" alt="A black wifi router with signal waves." style="max-width:200px;margin:0 0 12px">
        <div id="notice"><p class="hidden-note">The notice is hidden. Try to remember first.</p></div>
      </div>
    </div>
    <div>
      <label class="lbl" for="readIn">When is the installation window?</label>
      <input type="text" id="readIn" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row">
        <button class="btn" type="button" id="readCheck">Check my answer</button>
        <button class="btn help small" type="button" id="readHint">Give me a hint</button>
        <button class="btn two small" type="button" id="readShow">Show the notice</button>
      </div>
      <div class="hint" id="readHints" aria-live="polite"></div>
      <p class="fb" id="readFb" aria-live="polite"></p>
      <fieldset id="howSet" hidden>
        <legend>After checking, which sentence is true for you?</legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="how" value="remembered"><span>I remembered it.</span></label>
          <label class="opt"><input type="radio" name="how" value="found"><span>I found it again in the notice.</span></label>
        </div>
      </fieldset>
    </div>
  </div>
  <div class="strip">
    <div class="side alt">
      <h3>Listening: written route</h3>
      <p class="small">No audio is available in this activity, so this is reading practice. It does not test listening.</p>
      <fieldset>
        <legend>Sara books a visit. What time does she book?</legend>
        <div class="opts" id="wrOpts"></div>
      </fieldset>
      <div class="row"><button class="btn two small" type="button" id="wrShow">Read the line</button></div>
      <p class="fb" id="wrFb" aria-live="polite"></p>
      <div class="model" id="wrLine" hidden>Sara asks, ‘When can you install it?’ She is home after five, so she books Sunday at 5:30 p.m.</div>
      <div id="audioBox"></div>
    </div>
    <div class="side">
      <h3>Say one phrase</h3>
      <p class="small">Say this phrase aloud: what would you say at a phone shop if you pay before you use the service?</p>
      <div class="row"><button class="btn two small" type="button" id="pronShow">Show the model</button></div>
      <div class="model" id="pronModel" hidden>I’d like a prepaid SIM to start.</div>
      <p class="small" id="pronNote" hidden>Compare your sentence with the model. This is a self-check. It is not scored.</p>
      <label class="chk"><input type="checkbox" id="pronDone"><span>I said it aloud and compared it with the model.</span></label>
    </div>
  </div>
  <div class="navrow"><button class="btn two" type="button" data-go="0">Back</button><button class="btn" type="button" data-go="2">Next: Repair one point</button></div>
</section>

<!-- 3. REPAIR ONE POINT -->
<section class="screen" id="s3" aria-labelledby="h3">
  <div class="imgcap">
    <img data-img="contract" alt="A paper document with a pen.">
    <div>
      <h2 id="h3" tabindex="-1">Repair one point</h2>
      <p class="lead">A friend wrote this question about the installation. One word needs to change.</p>
    </div>
  </div>
  <div class="editor">
    <div class="bar">Message to repair</div>
    <div class="panes">
      <div class="pane before">
        <h3>Before</h3>
        <p class="draftline">How long does installation takes?</p>
        <label class="lbl" for="repIn">Write the repaired question</label>
        <input type="text" id="repIn" autocomplete="off" autocapitalize="off" spellcheck="false" value="How long does installation takes?">
        <div class="row">
          <button class="btn" type="button" id="repCheck">Check my repair</button>
          <button class="btn help small" type="button" id="repHint">Give me a hint</button>
          <button class="btn two small" type="button" id="repShow">Show a model</button>
        </div>
        <div class="hint" id="repHints" aria-live="polite"></div>
        <p class="fb" id="repFb" aria-live="polite"></p>
      </div>
      <div class="pane after">
        <h3>After</h3>
        <div id="repModelBox" hidden>
          <p class="model" id="repModel">How long does installation take?</p>
          <div class="row"><button class="btn two small" type="button" id="repHide">Hide the model and try it myself</button></div>
        </div>
        <div id="rep2" hidden>
          <label class="lbl" for="rep2In">Write the corrected question again. The model is hidden.</label>
          <input type="text" id="rep2In" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="row">
            <button class="btn" type="button" id="rep2Check">Check it</button>
            <button class="btn two small" type="button" id="rep2Peek">Look at the model again</button>
          </div>
          <p class="fb" id="rep2Fb" aria-live="polite"></p>
        </div>
        <p class="small" id="repWait">Try the repair first. Your corrected question will appear here.</p>
      </div>
    </div>
  </div>
  <div class="navrow"><button class="btn two" type="button" data-go="1">Back</button><button class="btn" type="button" data-go="3">Next: Compare my replies</button></div>
</section>

<!-- 4. COMPARE MY REPLIES -->
<section class="screen" id="s4" aria-labelledby="h4">
  <h2 id="h4" tabindex="-1">Compare my replies</h2>
  <div class="studio">
    <div class="stage">
      <h3>First reply</h3>
      <img data-img="support" alt="A woman in a teal hijab talks on the phone at a laptop." style="max-width:260px;margin:0 0 12px">
      <p class="cuetext">You are booking home internet. The agent asks: “What would you like to know?”</p>
      <label class="lbl" for="firstIn">Write one to three sentences (fictional details are fine)</label>
      <textarea id="firstIn" maxlength="300" autocomplete="off" spellcheck="false"></textarea>
      <label class="chk"><input type="checkbox" id="said1"><span>I said my first reply aloud.</span></label>
      <div class="row"><button class="btn" type="button" id="keepFirst" disabled>Keep my first reply</button></div>
      <p class="status" id="firstNote">Write or say your first reply to continue.</p>
    </div>
    <div class="stage" id="improveStage" hidden>
      <h3>Improve one part</h3>
      <fieldset>
        <legend>Choose one thing to improve</legend>
        <div class="opts" id="impOpts"></div>
      </fieldset>
      <p class="small" id="impEx"></p>
      <details>
        <summary style="min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700">Show an example reply</summary>
        <p class="model">When is the installation? How long does it take?</p>
        <p class="small">This is only an example. Use your own ideas.</p>
      </details>
    </div>
    <div class="stage" id="secondStage" hidden>
      <h3>Second reply</h3>
      <label class="lbl" for="secondIn">Write your improved reply</label>
      <textarea id="secondIn" maxlength="300" autocomplete="off" spellcheck="false"></textarea>
      <div class="row"><button class="btn two small" type="button" id="copyFirst">Start from my first reply</button></div>

/* ===== helpers ===== */
function $(id){return document.getElementById(id);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(tag,attrs,text){var e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});}if(text!==undefined)e.textContent=text;return e;}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’ʼ`´]/g,"'").toLowerCase().replace(/\s+/g,' ').trim();}
function normQ(s){return norm(s).replace(/[.!?,;:\s]+$/,'');}
function words(s){var m=norm(s).match(/[\p{L}\p{N}']+/gu);return m?m.length:0;}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n):s;}
function say(msg){var l=$('live');l.textContent='';setTimeout(function(){l.textContent=msg;},30);}
function setFb(node,ok,text){
  node.textContent='';node.className='fb';
  if(!text)return;
  node.className='fb '+(ok?'ok':'try');
  node.appendChild(ok?el('span',{'class':'tick','aria-hidden':'true'},'✓'):el('span',{'class':'dot','aria-hidden':'true'}));
  node.appendChild(document.createTextNode(text));
}
function showHints(box,btn,level,list){
  box.textContent='';
  for(var i=0;i<level;i++){box.appendChild(el('p',null,'Hint '+(i+1)+': '+list[i]));}
  if(level>=list.length){btn.disabled=true;btn.textContent='No more hints';}
  else{btn.disabled=false;btn.textContent=level===0?'Give me a hint':'Another hint';}
}

];
var TRANS_HINTS=['You want the length of time. Start with: How long…','How long does the prepaid plan ____?'];
var NEXT=[
  {id:'say',t:'Say the corrected phrase tomorrow: How long does installation take?'},
  {id:'reread',t:'Reread the installation notice and find the day and time.'},
  {id:'reply',t:'Practise the short reply once more: When is the installation? How long does it take?'}
];

/* ===== state ===== */
function fresh(){return{
  scene:'',
  recall:RECALL.map(function(){return{text:'',said:false,hint:0,shown:false,self:''};}),
  read:{text:'',hint:0,shown:false,tried:false,how:''},
  wr:{pick:'',shown:false},
  pron:false,
  rep:{text:'How long does installation takes?',tried:false,hint:0,shown:false,ok1:false,s2:'',s2tried:false,ok2:false},
  first:{text:'',said:false,locked:false},
  imp:'',second:'',said2:false,refl:[],
  trans:{text:'',said:false,hint:0,shown:false,tried:false,ok:false},
  next:'',
  step:0
};}
var S=fresh();
var completionInFlight=false, completionSent=false;

/* ===== derived checks ===== */
function recallAttempt(){return S.recall.some(function(r){return words(r.text)>=2||r.said;});}
function readOk(t){
  var n=norm(t);
  var day=/saturday/.test(n);
  var t10=/\b10\b|\bten\b/.test(n), t12=/\b12\b|\btwelve\b/.test(n);
  return {day:day,time:t10&&t12,partial:day||t10||t12};
}
function readChecked(){return S.read.tried&&S.read.shown;}
function repOk(t){return REP_KEY.indexOf(normQ(t))>=0;}
function repaired(){return S.rep.ok1||S.rep.ok2||(S.rep.shown&&S.rep.s2tried&&words(S.rep.s2)>=4);}
function secondValid(){
  if(!S.first.locked)return false;
  if(S.said2)return true;
  return words(S.second)>=3&&normQ(S.second)!==normQ(S.first.text);
}
function transValid(){return S.trans.tried&&(words(S.trans.text)>=3||S.trans.said);}
function transOk(t){
  var n=normQ(t);
  return /^how long (does (the |my |a )?(prepaid )?(plan|sim|data plan|it) last|is (the |my )?(prepaid )?(plan|sim|data plan))$/.test(n);
}
function criteria(){return{recall:recallAttempt(),checked:readChecked()||repaired(),retry:secondValid()||transValid()};}
function allDone(){var c=criteria();return c.recall&&c.checked&&c.retry;}

/* ===== route ===== */
function stepDone(i){
  if(i===0)return recallAttempt();
  if(i===1)return readChecked();
  if(i===2)return repaired();
  if(i===3)return secondValid();
  if(i===4)return transValid();
  if(i===5)return completionSent;
  return false;
}
function drawRoute(){
  var ol=$('routeList');ol.textContent='';
  STEPS.forEach(function(label,i){
    var li=el('li');
    var b=el('button',{type:'button'});
    if(stepDone(i))b.className='done';
    if(i===S.step)b.setAttribute('aria-current','step');
    var n=el('span',{'class':'n','aria-hidden':'true'},stepDone(i)?'✓':String(i+1));
    b.appendChild(n);
    b.appendChild(document.createTextNode(label));
    if(stepDone(i)){b.appendChild(el('span',{'class':'sr-only'},' (done)'));}
    b.addEventListener('click',function(){go(i);});
    li.appendChild(b);ol.appendChild(li);
  });
}
function go(i){
  S.step=i;
  $$('.screen').forEach(function(s){s.classList.remove('on');});
  var sc=$('s'+(i+1));sc.classList.add('on');
  drawRoute();
  if(i===5)updateFinish();
  window.scrollTo(0,0);
  var h=sc.querySelector('h2');
  if(h){try{h.focus({preventScroll:true});}catch(e){h.focus();}}
}
function refresh(){drawRoute();if(S.step===5)updateFinish();}

/* ===== build ===== */
function build(){
  $('main').innerHTML=$('tpl').innerHTML;
  $$('img[data-img]').forEach(function(i){i.src=IMG[i.getAttribute('data-img')];});
  $$('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(+b.getAttribute('data-go'));});});
  wireScene();wireRecall();wireRead();wireWritten();wirePron();wireRepair();wireRetry();wireTrans();wireFinish();
  go(S.step||0);
}

/* 1 */
function wireScene(){
  var box=$('sceneOpts');
  SCENES.forEach(function(sc,i){
    var lb=el('label',{'class':'opt'});
    var inp=el('input',{type:'radio',name:'scene',value:String(i)});
    inp.addEventListener('change',function(){S.scene=String(i);setFb($('sceneFb'),!!sc.ok,sc.fb);});
    lb.appendChild(inp);lb.appendChild(el('span',null,sc.t));box.appendChild(lb);
  });
}
function wireRecall(){
  var ol=$('recallList');
  RECALL.forEach(function(r,i){
    var li=el('li');
    li.appendChild(el('h3',null,r.label));
    li.appendChild(el('p',{'class':'cuetext'},r.cue));
    li.appendChild(el('label',{'class':'lbl','for':'rin'+i},'Your reply'));
    var inp=el('input',{type:'text',id:'rin'+i,autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
    inp.addEventListener('input',function(){S.recall[i].text=inp.value;refresh();});
    li.appendChild(inp);
    var chk=el('label',{'class':'chk'});
    var cb=el('input',{type:'checkbox',id:'rsay'+i});
    cb.addEventListener('change',function(){S.recall[i].said=cb.checked;refresh();});
    chk.appendChild(cb);chk.appendChild(el('span',null,'I said it aloud instead.'));
    li.appendChild(chk);
    var row=el('div',{'class':'row'});
    var hb=el('button',{'class':'btn help small',type:'button'},'Give me a hint');
    var mb=el('button',{'class':'btn two small',type:'button'},'Show a model');
    row.appendChild(hb);row.appendChild(mb);li.appendChild(row);
    var hbox=el('div',{'class':'hint','aria-live':'polite'});li.appendChild(hbox);
    var model=el('div',{'class':'model'},'Model: '+r.model);model.hidden=true;li.appendChild(model);
    var self=el('fieldset');self.hidden=true;
    self.appendChild(el('legend',null,'Compare. Which sentence is true for you?'));
    var opts=el('div',{'class':'opts'});
    [['ok','I remembered it.'],['hint','I needed the hint.'],['practise','I need to practise this phrase.']].forEach(function(p){
      var lb=el('label',{'class':'opt'});
      var rd=el('input',{type:'radio',name:'self'+i,value:p[0]});
      rd.addEventListener('change',function(){S.recall[i].self=p[0];});
      lb.appendChild(rd);lb.appendChild(el('span',null,p[1]));opts.appendChild(lb);
    });
    self.appendChild(opts);li.appendChild(self);
    hb.addEventListener('click',function(){
      if(S.recall[i].hint<r.hints.length)S.recall[i].hint++;
      showHints(hbox,hb,S.recall[i].hint,r.hints);
    });
    mb.addEventListener('click',function(){
      S.recall[i].shown=true;model.hidden=false;self.hidden=false;mb.disabled=true;
      say('Model shown. Compare it with your reply.');
    });
    ol.appendChild(li);
  });
}

/* 2 */
function renderNotice(){
  var n=$('notice');n.textContent='';
  var p=el('p');
  p.appendChild(document.createTextNode('Installation booking: '));
  p.appendChild(el('mark',null,'Saturday, 10:00 to 12:00'));
  p.appendChild(document.createTextNode('. The technician will bring a router. Please have someone at home during the appointment window. If you need to change the time, contact the sample service desk by Friday. Booking reference: NET24. This practice notice does not promise a real installation time.'));
  n.appendChild(p);
}
function wireRead(){
  var inp=$('readIn');
  inp.addEventListener('input',function(){S.read.text=inp.value;setFb($('readFb'),false,'');});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('readCheck').click();}});
  $('readCheck').addEventListener('click',function(){
    var t=inp.value.trim();
    if(!t){setFb($('readFb'),false,'Type what you remember first. A guess is fine.');return;}
    S.read.tried=true;
    var r=readOk(t);
    if(r.day&&r.time)setFb($('readFb'),true,'Yes. The installation window is Saturday, 10:00 to 12:00. Open the notice to check the evidence.');
    else if(r.partial)setFb($('readFb'),false,'Good start. Check the day and the time range. You can ask for a hint or open the notice.');
    else setFb($('readFb'),false,'Not yet. Ask for a hint, or open the notice to find the answer.');
    refresh();
  });
  $('readHint').addEventListener('click',function(){
    if(S.read.hint<READ_HINTS.length)S.read.hint++;
    showHints($('readHints'),$('readHint'),S.read.hint,READ_HINTS);
  });
  $('readShow').addEventListener('click',function(){
    S.read.shown=true;renderNotice();$('howSet').hidden=false;
    if(!S.read.tried&&inp.value.trim())S.read.tried=true;
    if(!S.read.tried)setFb($('readFb'),false,'The notice is open. Now say the answer in your own words, then press Check my answer.');
    say('The notice is open. The answer is highlighted.');
    refresh();
  });
  $$('input[name="how"]').forEach(function(r){r.addEventListener('change',function(){S.read.how=r.value;});});
}
function wireWritten(){
  var box=$('wrOpts');
  WR_OPTS.forEach(function(t){
    var lb=el('label',{'class':'opt'});
    var inp=el('input',{type:'radio',name:'wr',value:t});
    inp.addEventListener('change',function(){
      S.wr.pick=t;
      if(t==='5:30 p.m.')setFb($('wrFb'),true,'Yes. Sara books Sunday at 5:30 p.m.');
      else setFb($('wrFb'),false,'Not quite. Read the line to find the time.');
    });
    lb.appendChild(inp);lb.appendChild(el('span',null,t));box.appendChild(lb);
  });
  $('wrShow').addEventListener('click',function(){S.wr.shown=true;$('wrLine').hidden=false;});
  var ab=$('audioBox');
  if(MODEL_AUDIO&&MODEL_AUDIO.url){
    var a=el('audio',{controls:'controls',preload:'none'});a.src=MODEL_AUDIO.url;ab.appendChild(a);
    if(MODEL_AUDIO.transcript)ab.appendChild(el('p',{'class':'small'},'Transcript: '+MODEL_AUDIO.transcript));
  }
}
function wirePron(){
  $('pronShow').addEventListener('click',function(){$('pronModel').hidden=false;$('pronNote').hidden=false;$('pronShow').disabled=true;});
  $('pronDone').addEventListener('change',function(){S.pron=this.checked;});
}

/* 3 */
function wireRepair(){
  var inp=$('repIn');
  inp.addEventListener('input',function(){S.rep.text=inp.value;});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('repCheck').click();}});
  function openAfter(){$('rep2').hidden=false;$('repWait').hidden=true;}
  $('repCheck').addEventListener('click',function(){
    var t=inp.value.trim();
    S.rep.tried=true;
    if(normQ(t)===normQ('How long does installation takes')){setFb($('repFb'),false,'This is still the first message. Change one word. Ask for a hint if you like.');return;}
    if(repOk(t)){
      S.rep.ok1=true;setFb($('repFb'),true,'Yes. You repaired the question.');openAfter();
      say('Repair correct. Now write it again.');
    }else{
      setFb($('repFb'),false,'Not yet. Ask for a hint, or show a model.');
    }
    refresh();
  });
  $('repHint').addEventListener('click',function(){
    if(S.rep.hint<REP_HINTS.length)S.rep.hint++;
    showHints($('repHints'),$('repHint'),S.rep.hint,REP_HINTS);
  });
  $('repShow').addEventListener('click',function(){
    S.rep.shown=true;S.rep.tried=true;
    $('repModel').textContent='How long does installation take?';
    $('repModelBox').hidden=false;$('repHide').hidden=false;openAfter();
    say('Model shown.');
  });
  $('repHide').addEventListener('click',function(){
    $('repModelBox').hidden=true;$('rep2In').focus();say('Model hidden. Try it yourself.');
  });
  $('rep2Peek').addEventListener('click',function(){
    $('repModel').textContent='How long does installation take?';
    $('repModelBox').hidden=false;$('repHide').hidden=false;
  });
  var i2=$('rep2In');
  i2.addEventListener('input',function(){S.rep.s2=i2.value;});
  i2.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('rep2Check').click();}});
  $('rep2Check').addEventListener('click',function(){
    var t=i2.value.trim();
    if(!t){setFb($('rep2Fb'),false,'Write the question again from memory.');return;}
    S.rep.s2tried=true;
    if(repOk(t)){S.rep.ok2=true;setFb($('rep2Fb'),true,'Yes. That is the corrected question.');}
    else setFb($('rep2Fb'),false,'Almost there. Compare it with the model and try once more. You can keep going when you are ready.');
    refresh();
  });
}

/* 4 */
function wireRetry(){
  var f=$('firstIn');
  function upd(){
    S.first.text=clip(f.value.trim(),300);S.first.said=$('said1').checked;
    var ok=words(f.value)>=3||S.first.said;
    $('keepFirst').disabled=S.first.locked||!ok;
    $('firstNote').textContent=S.first.locked?'Your first reply is kept. You cannot change it.':(ok?'You can keep your first reply.':'Write or say your first reply to continue.');
  }
  f.addEventListener('input',upd);$('said1').addEventListener('change',upd);
  $('keepFirst').addEventListener('click',function(){
    upd();
    if(!(words(f.value)>=3||S.first.said))return;
    S.first.locked=true;f.readOnly=true;$('said1').disabled=true;
    $('keepFirst').disabled=true;
    $('improveStage').hidden=false;$('secondStage').hidden=false;
    upd();say('First reply kept. Now choose one thing to improve.');
    renderCompare();refresh();
  });
  var box=$('impOpts');
  IMPROVE.forEach(function(it){
    var lb=el('label',{'class':'opt'});
    var inp=el('input',{type:'radio',name:'imp',value:it.id});
    inp.addEventListener('change',function(){S.imp=it.id;$('impEx').textContent=it.ex;renderBank();});
    lb.appendChild(inp);lb.appendChild(el('span',null,it.t));box.appendChild(lb);
  });
  var s2=$('secondIn');
  s2.addEventListener('input',function(){S.second=clip(s2.value,300);updSecond();});
  $('said2').addEventListener('change',function(){S.said2=this.checked;updSecond();});
  $('copyFirst').addEventListener('click',function(){
    if(s2.value.trim()){say('Your second reply already has text. Change it or add to it.');s2.focus();return;}
    if(!S.first.text){say('Your first reply was spoken, so there is no text to copy.');return;}
    s2.value=S.first.text;S.second=s2.value;updSecond();s2.focus();
  });
  var rb=$('reflOpts');
  REFL.forEach(function(r){
    var lb=el('label',{'class':'opt'});
    var inp=el('input',{type:'checkbox',name:'refl',value:r.id});
    inp.addEventListener('change',function(){S.refl=$$('input[name="refl"]:checked').map(function(x){return x.value;});});
    lb.appendChild(inp);lb.appendChild(el('span',null,r.t));rb.appendChild(lb);
  });
}
function renderBank(){
  var b=$('bank4');b.textContent='';
  var it=IMPROVE.filter(function(x){return x.id===S.imp;})[0];
  if(!it)return;
  b.appendChild(el('p',{'class':'small',style:'margin-top:12px'},'Useful phrases. Press Add to put one at the end of your second reply.'));
  var ul=el('ul',{'class':'bank'});
  it.bank.forEach(function(ph){
    var li=el('li');li.appendChild(el('span',null,ph));
    var bt=el('button',{'class':'btn two small',type:'button','aria-label':'Add: '+ph},'Add');
    bt.addEventListener('click',function(){
      var ta=$('secondIn');var cur=ta.value.replace(/\s+$/,'');
      ta.value=clip((cur?cur+' ':'')+ph,300);S.second=ta.value;updSecond();ta.focus();
    });
    li.appendChild(bt);ul.appendChild(li);
  });
  b.appendChild(ul);
}
function updSecond(){
  var fb=$('secondFb'),t=S.second;
  if(S.said2&&!t.trim()){setFb(fb,true,'You practised your second reply aloud. You can compare now.');}
  else if(!t.trim())setFb(fb,false,'');
  else if(normQ(t)===normQ(S.first.text))setFb(fb,false,'Your second reply is the same as your first. Change or add one thing.');
  else if(words(t)<3)setFb(fb,false,'Add a little more. Try a full sentence.');
  else setFb(fb,true,'Your second reply is ready to compare.');
  var ok=secondValid();
  $('compareStage').hidden=!ok;
  if(ok)renderCompare();
  refresh();
}
function renderCompare(){
  $('cmp1').textContent=S.first.text||(S.first.said?'You said your first reply aloud. It is not saved here.':'');
  $('cmp2').textContent=S.second||(S.said2?'You said your second reply aloud. It is not saved here.':'');
}

/* 5 */
function wireTrans(){
  var inp=$('transIn');
  inp.addEventListener('input',function(){S.trans.text=inp.value;setFb($('transFb'),false,'');});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('transCheck').click();}});
  $('saidT').addEventListener('change',function(){S.trans.said=this.checked;if(this.checked)S.trans.tried=true;refresh();});
  $('transCheck').addEventListener('click',function(){
    var t=inp.value.trim();
    if(!t){setFb($('transFb'),false,'Write your question first. A guess is fine.');return;}
    S.trans.tried=true;
    if(transOk(t)){S.trans.ok=true;setFb($('transFb'),true,'Yes. That question asks for the length of the plan.');}
    else{setFb($('transFb'),false,'This may still work, but it does not match the situation. Compare it with a model.');}
    refresh();
  });
  $('transHint').addEventListener('click',function(){
    if(S.trans.hint<TRANS_HINTS.length)S.trans.hint++;
    showHints($('transHints'),$('transHint'),S.trans.hint,TRANS_HINTS);
  });
  $('transShow').addEventListener('click',function(){
    S.trans.shown=true;$('transModel').hidden=false;
    if(!S.trans.tried&&inp.value.trim())S.trans.tried=true;
    refresh();say('Model shown.');
  });
}

/* 6 */
function wireFinish(){
  var box=$('nextOpts');
  NEXT.forEach(function(n){
    var lb=el('label',{'class':'opt'});
    var inp=el('input',{type:'radio',name:'next',value:n.id});
    if(S.next===n.id)inp.checked=true;
    inp.addEventListener('change',function(){S.next=n.id;});
    lb.appendChild(inp);lb.appendChild(el('span',null,n.t));box.appendChild(lb);
  });
  $('btnDone').addEventListener('click',finishNow);
  $('btnAgain').addEventListener('click',function(){
    S=fresh();build();say('The review is ready to try again.');
  });
}
function updateFinish(){
  var c=criteria();
  var ul=$('didList');ul.textContent='';
  [[c.recall,'I tried to recall useful phrases.'],[c.checked,'I checked a detail or repaired one point.'],[c.retry,'I wrote a second reply or tried a new detail.']].forEach(function(r){
    var li=el('li');if(r[0])li.className='y';
    li.appendChild(el('span',{'class':'m','aria-hidden':'true'},r[0]?'✓':''));
    li.appendChild(el('span',null,(r[0]?'Done: ':'Still to do: ')+r[1]));
    ul.appendChild(li);
  });
  var btn=$('btnDone');
  if(completionSent){btn.textContent='Done ✓';btn.disabled=true;$('doneNote').textContent='';return;}
  btn.disabled=!allDone()||completionInFlight;
  $('doneNote').textContent=allDone()?'You can finish your review.':'Go back to a step above to finish the tasks that are still open.';
}

/* ===== completion ===== */
var lms={api:null,ver:null,ready:false,tried:0};
function findApi(name){
  var w=window,d=0;
  while(w&&d<12){
    try{if(w[name])return w[name];}catch(e){}
    try{if(w.parent&&w.parent!==w)w=w.parent;else break;}catch(e){break;}
    d++;
  }
  try{if(window.opener&&window.opener[name])return window.opener[name];}catch(e){}
  return null;
}
function lmsConnect(){
  if(lms.ready)return true;
  if(lms.tried>4)return false;
  lms.tried++;
  try{
    var a=findApi('API_1484_11');
    if(a){var ok=a.Initialize('');if(ok===true||ok==='true'){lms.api=a;lms.ver='2004';lms.ready=true;}}
    else{
      a=findApi('API');
      if(a){var ok2=a.LMSInitialize('');if(ok2===true||ok2==='true'){lms.api=a;lms.ver='1.2';lms.ready=true;}}
    }
  }catch(e){lms.ready=false;}
  return lms.ready;
}
function lmsFound(){try{return !!(findApi('API_1484_11')||findApi('API'));}catch(e){return false;}}
function lmsGet(k){try{return String(lms.ver==='2004'?lms.api.GetValue(k):lms.api.LMSGetValue(k)||'');}catch(e){return '';}}
function lmsSet(k,v){try{var r=lms.ver==='2004'?lms.api.SetValue(k,v):lms.api.LMSSetValue(k,v);return r===true||r==='true';}catch(e){return false;}}
function lmsCommit(){try{var r=lms.ver==='2004'?lms.api.Commit(''):lms.api.LMSCommit('');return r===true||r==='true';}catch(e){return false;}}
function lmsStatus(){
  if(!lms.ready)return '';
  if(lms.ver==='2004'){var c=lmsGet('cmi.completion_status'),s=lmsGet('cmi.success_status');return(c==='completed'||s==='passed')?'completed':c;}
  var v=lmsGet('cmi.core.lesson_status');return(v==='completed'||v==='passed')?'completed':v;
}
function commit(){
  /* Returns a Promise<boolean>: true only after a confirmed successful commit. */
  try{
    if(window.PazapaBridge&&typeof window.PazapaBridge.complete==='function'){
      return Promise.resolve(window.PazapaBridge.complete({activity:CONFIG.activityId})).then(function(v){return v!==false;},function(){return false;});
    }
  }catch(e){return Promise.resolve(false);}
  if(lmsFound()){
    if(!lmsConnect())return Promise.resolve(false);
    if(lmsStatus()==='completed')return Promise.resolve(true);
    if(lms.ver==='2004'){lmsSet('cmi.completion_status','completed');lmsSet('cmi.progress_measure','1');}
    else lmsSet('cmi.core.lesson_status','completed');
    var ok=lmsCommit();
    return Promise.resolve(ok&&lmsStatus()==='completed');
  }
  return Promise.resolve(true); /* no LMS: local completion */
}
function finishNow(){
  if(completionSent||completionInFlight||!allDone())return;
  completionInFlight=true;$('btnDone').disabled=true;
  commit().then(function(ok){
    completionInFlight=false;
    if(ok){completionSent=true;updateFinish();drawRoute();say('Your review is finished.');}
    else{updateFinish();$('doneNote').textContent='Please press Done again.';say('Please press Done again.');}
  });
}
window.addEventListener('pagehide',function(){
  try{if(lms.ready){if(lms.ver==='2004')lms.api.Terminate('');else lms.api.LMSFinish('');}}catch(e){}
});

/* ===== start ===== */
$('logo').src=IMG.logo;
try{if(lmsFound()&&lmsConnect()&&lmsStatus()==='completed')completionSent=true;
    else if(lms.ready){lmsSet(lms.ver==='2004'?'cmi.completion_status':'cmi.core.lesson_status','incomplete');}}catch(e){}
build();
})();
</script>
